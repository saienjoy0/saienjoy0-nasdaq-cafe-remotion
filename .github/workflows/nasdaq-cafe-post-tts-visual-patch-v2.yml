name: Nasdaq Cafe Post-TTS Visual Diversity Patch V2

on:
  push:
    branches: [main]
    paths:
      - "visual-diversity-patch-v2-requests/*.json"

permissions:
  contents: write

concurrency:
  group: nasdaq-cafe-post-tts-visual-patch-v2
  cancel-in-progress: false

jobs:
  patch-validate-measure:
    name: Patch, validate, and measure visual diversity
    if: github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      SPEC_TTS_CACHE_ONLY: "1"
      EXPECTED_TTS_INPUT_SHA256: "04f608cd8172ea5031ec86792e849749e17a301ccbc9b65da405d823529273dd"
      TTS_CACHE_COMPATIBILITY_SHA256: "d35fe5c048bfcf6c07652c434e6773e4bde7d59dc2b875689709d5b6819ce9c4"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Resolve exactly one repair request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only "$BEFORE_SHA" "$TRIGGER_SHA" -- 'visual-diversity-patch-v2-requests/*.json')
          test "${#CHANGED[@]}" = 1 || { echo "::error::Exactly one V2 repair request must change"; exit 1; }
          python3 - "${CHANGED[0]}" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          value=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          required={'contractVersion','episodeDate','failedPreviewRunId','expectedRenderSpecSha256','expectedEpisodePackageSha256','confirmation'}
          if set(value)!=required: raise SystemExit(f'request fields mismatch: {sorted(value)}')
          if value['contractVersion']!='2.0.0': raise SystemExit('contractVersion must be 2.0.0')
          if value['confirmation']!='PATCH_VISUAL_DIVERSITY_ONLY': raise SystemExit('bad confirmation')
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', str(value['episodeDate'])): raise SystemExit('bad episodeDate')
          if not isinstance(value['failedPreviewRunId'],int) or value['failedPreviewRunId']<=0: raise SystemExit('bad failedPreviewRunId')
          for key in ('expectedRenderSpecSha256','expectedEpisodePackageSha256'):
              if not re.fullmatch(r'[0-9a-f]{64}', str(value[key])): raise SystemExit(f'bad {key}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"episode_date={value['episodeDate']}\n")
              out.write(f"failed_run_id={value['failedPreviewRunId']}\n")
              out.write(f"render_sha={value['expectedRenderSpecSha256']}\n")
              out.write(f"package_sha={value['expectedEpisodePackageSha256']}\n")
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply only three measured Visual Grammar changes
        id: patch
        shell: bash
        env:
          EPISODE_DATE: ${{ steps.request.outputs.episode_date }}
          EXPECTED_RENDER_SHA: ${{ steps.request.outputs.render_sha }}
          EXPECTED_PACKAGE_SHA: ${{ steps.request.outputs.package_sha }}
          FAILED_RUN_ID: ${{ steps.request.outputs.failed_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "preview-status/${EPISODE_DATE}"
          python3 <<'PY'
          import copy, hashlib, json, os
          from pathlib import Path

          date=os.environ['EPISODE_DATE']
          spec_path=Path(f'render-specs/{date}/render_spec.json')
          package_path=Path(f'episode-packages/{date}/episode_package_{date}.md')
          ready_path=Path(f'render-specs/{date}/production_ready.json')
          report_path=Path(f'preview-status/{date}/post_tts_visual_diversity_patch_v2.json')

          def sha(data: bytes): return hashlib.sha256(data).hexdigest()
          old_spec_bytes=spec_path.read_bytes(); old_package_bytes=package_path.read_bytes()
          if sha(old_spec_bytes)!=os.environ['EXPECTED_RENDER_SHA']: raise SystemExit('render_spec SHA drift; refusing repair')
          if sha(old_package_bytes)!=os.environ['EXPECTED_PACKAGE_SHA']: raise SystemExit('episode_package SHA drift; refusing repair')
          old=json.loads(old_spec_bytes.decode('utf-8')); spec=copy.deepcopy(old)

          changes={
              'vb-01-02': {'expected':('hero-number','evidence','default'), 'new':('analogy-steps','analogy','default')},
              'vb-04-02': {'expected':('text-focus','bridge-text','default'), 'new':('evidence-boundary','evidence','confirmed-vs-unconfirmed')},
              'vb-08-02': {'expected':('verification-checklist','verification','default'), 'new':('evidence-boundary','evidence','confirmed-vs-unconfirmed')},
          }
          def gid(beat):
              if isinstance(beat.get('visualGrammarId'),str): return beat['visualGrammarId']
              vg=beat.get('visualGrammar'); return vg.get('grammarId') if isinstance(vg,dict) else None
          def patch_render(value, strict=True):
              applied=[]
              for scene in value['scenes']:
                  for beat in scene.get('visualBeats',[]):
                      bid=beat.get('beatId') or beat.get('visualBeatId')
                      if bid not in changes: continue
                      before=(beat.get('visualTemplate'),gid(beat),beat.get('templateConfig',{}).get('variant'))
                      if strict and before!=changes[bid]['expected']: raise SystemExit(f'{bid} pre-repair drift: {before!r}')
                      template,grammar,variant=changes[bid]['new']
                      beat['visualTemplate']=template
                      beat['templateConfig']['variant']=variant
                      if 'templateVariant' in beat: beat['templateVariant']=variant
                      if 'visualGrammarId' in beat: beat['visualGrammarId']=grammar
                      if isinstance(beat.get('visualGrammar'),dict): beat['visualGrammar']['grammarId']=grammar
                      applied.append((bid,before,(template,grammar,variant)))
              if {x[0] for x in applied}!=set(changes): raise SystemExit(f'target beat mismatch: {applied!r}')
              return applied
          applied=patch_render(spec,True)

          # Hard boundary: no editorial, spoken/caption text, facts, object references, source IDs, or event cues may change.
          for key in ('editorial','publishing','review','pronunciations','voiceProfileId','sources','corrections'):
              if old.get(key)!=spec.get(key): raise SystemExit(f'forbidden root mutation: {key}')
          for a,b in zip(old['scenes'],spec['scenes']):
              for key in ('headline','narrationChunks','cards','numbers','nodes','arrows','supportingTexts','uncertainty','evidenceSourceIds','assetPlacements','visualEvents'):
                  if a.get(key)!=b.get(key): raise SystemExit(f'forbidden scene mutation: {a["sceneId"]}.{key}')
              old_beats={x.get('beatId'):x for x in a.get('visualBeats',[])}
              new_beats={x.get('beatId'):x for x in b.get('visualBeats',[])}
              for bid in old_beats:
                  if bid not in changes and old_beats[bid]!=new_beats[bid]: raise SystemExit(f'unrelated beat changed: {bid}')
                  if bid in changes:
                      for key in old_beats[bid]:
                          if key in ('visualTemplate','visualGrammarId','visualGrammar','templateVariant','templateConfig'): continue
                          if old_beats[bid].get(key)!=new_beats[bid].get(key): raise SystemExit(f'forbidden beat mutation: {bid}.{key}')
                      old_cfg=old_beats[bid].get('templateConfig',{}); new_cfg=new_beats[bid].get('templateConfig',{})
                      for key in old_cfg:
                          if key!='variant' and old_cfg.get(key)!=new_cfg.get(key): raise SystemExit(f'forbidden templateConfig mutation: {bid}.{key}')

          def tts_identity(value):
              blocks=[]
              for block_id,first,last in (('scenes-01-04',1,4),('scenes-05-09',5,9)):
                  speech=[]
                  for scene in value['scenes']:
                      n=scene.get('sceneNumber')
                      if isinstance(n,int) and first<=n<=last: speech.extend(c['speechText'] for c in scene['narrationChunks'])
                  blocks.append({'id':block_id,'speechText':speech})
              payload={'synthesisVersion':'gemini-two-block-v1','model':'gemini-3.1-flash-tts-preview','voice':'Charon','voiceProfileId':value.get('voiceProfileId'),'pronunciations':value.get('pronunciations'),'blocks':blocks}
              return hashlib.sha256(json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          old_tts=tts_identity(old); new_tts=tts_identity(spec)
          if old_tts!=new_tts or new_tts!=os.environ['EXPECTED_TTS_INPUT_SHA256']: raise SystemExit('TTS identity changed')

          spec_text=json.dumps(spec,ensure_ascii=False,indent=2,sort_keys=True)+'\n'
          spec_path.write_text(spec_text,encoding='utf-8'); new_spec_sha=sha(spec_text.encode())

          md=old_package_bytes.decode('utf-8')
          summary_pairs=(
              ('- Scene 1｜寝ている間に何が起きた？｜opening-contradiction → hero-number','- Scene 1｜寝ている間に何が起きた？｜opening-contradiction → analogy-steps'),
              ('- Scene 8｜どこまで言える？｜verification-matrix → verification-checklist','- Scene 8｜どこまで言える？｜verification-matrix → evidence-boundary'),
          )
          for before,after in summary_pairs:
              if md.count(before)!=1: raise SystemExit(f'package summary marker drift: {before}')
              md=md.replace(before,after,1)

          def human_block(text,marker,pairs):
              start=text.index(marker); end=text.find('<!--VISUAL_BEAT:',start+len(marker))
              if end<0: end=text.find('### 完成ナレーション',start)
              block=text[start:end]
              for before,after in pairs:
                  if before not in block: raise SystemExit(f'{marker}: missing {before}')
                  block=block.replace(before,after,1)
              return text[:start]+block+text[end:]
          md=human_block(md,'<!--VISUAL_BEAT:scene-01:vb-01-02-->',(
              ('  - Visual Grammar：evidence / continuation','  - Visual Grammar：analogy / continuation'),
              ('  - Visual Template ID：hero-number','  - Visual Template ID：analogy-steps'),
          ))
          md=human_block(md,'<!--VISUAL_BEAT:scene-04:vb-04-02-->',(
              ('  - Visual Grammar：bridge-text / continuation','  - Visual Grammar：evidence / continuation'),
              ('  - Visual Template ID：text-focus','  - Visual Template ID：evidence-boundary'),
              ('  - Template Variant：default','  - Template Variant：confirmed-vs-unconfirmed'),
          ))
          md=human_block(md,'<!--VISUAL_BEAT:scene-08:vb-08-02-->',(
              ('  - Visual Grammar：verification / continuation','  - Visual Grammar：evidence / continuation'),
              ('  - Visual Template ID：verification-checklist','  - Visual Template ID：evidence-boundary'),
              ('  - Template Variant：default','  - Template Variant：confirmed-vs-unconfirmed'),
          ))

          final_marker='<!--BEGIN_FINAL_PRODUCTION_SOURCE-->'; m=md.index(final_marker); pre=md[:m]; post=md[m:]
          annex=(
              ('"visualBeatId": "vb-01-02",\n          "visualGrammar": {\n            "contractVersion": "1.0.0",\n            "grammarId": "evidence",','"visualBeatId": "vb-01-02",\n          "visualGrammar": {\n            "contractVersion": "1.0.0",\n            "grammarId": "analogy",'),
              ('"visualBeatId": "vb-04-02",\n          "visualGrammar": {\n            "contractVersion": "1.0.0",\n            "grammarId": "bridge-text",','"visualBeatId": "vb-04-02",\n          "visualGrammar": {\n            "contractVersion": "1.0.0",\n            "grammarId": "evidence",'),
              ('"visualBeatId": "vb-08-02",\n          "visualGrammar": {\n            "contractVersion": "1.0.0",\n            "grammarId": "verification",','"visualBeatId": "vb-08-02",\n          "visualGrammar": {\n            "contractVersion": "1.0.0",\n            "grammarId": "evidence",'),
          )
          for before,after in annex:
              if pre.count(before)!=1: raise SystemExit(f'grammar annex drift for marker: {before[:40]}')
              pre=pre.replace(before,after,1)
          md=pre+post

          m=md.index(final_marker); js=md.index('```json',m)+len('```json'); je=md.index('```',js)
          source=json.loads(md[js:je].strip()); nested=source.get('render_spec')
          if not isinstance(nested,dict): raise SystemExit('FINAL_PRODUCTION_SOURCE.render_spec missing')
          patch_render(nested,False)
          md=md[:js]+'\n'+json.dumps(source,ensure_ascii=False,indent=2)+'\n'+md[je:]
          package_path.write_text(md,encoding='utf-8'); new_package_sha=sha(md.encode())

          if ready_path.exists(): ready_path.unlink()
          report={'contractVersion':'2.0.0','status':'patched-awaiting-validator','episodeDate':date,'failedPreviewRunId':int(os.environ['FAILED_RUN_ID']),'changedBeatIds':list(changes),'changedFields':['visualGrammarId/visualGrammar.grammarId','visualTemplate','templateConfig.variant/templateVariant'],'narrationChanged':False,'captionChanged':False,'editorialChanged':False,'numbersChanged':False,'sourcesChanged':False,'objectIdsChanged':False,'visualEventsChanged':False,'ttsIdentityChanged':False,'ttsInputSha256':new_tts,'oldRenderSpecSha256':os.environ['EXPECTED_RENDER_SHA'],'newRenderSpecSha256':new_spec_sha,'oldEpisodePackageSha256':os.environ['EXPECTED_PACKAGE_SHA'],'newEpisodePackageSha256':new_package_sha,'applied':applied}
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'new_render_sha={new_spec_sha}\nnew_package_sha={new_package_sha}\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Run formal render-spec validator
        run: npm run episode:spec:validate -- "render-specs/${{ steps.request.outputs.episode_date }}/render_spec.json"

      - name: Run static visual regressions
        run: |
          npm run test:visual-variety
          npm run test:visual-templates
          npm run test:visual-validator

      - name: Restore exact partial two-block TTS cache from failed Preview
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: Linux-spec-tts-block-v2-${{ env.TTS_CACHE_COMPATIBILITY_SHA256 }}-${{ env.EXPECTED_TTS_INPUT_SHA256 }}-partial-31384465729-1
          fail-on-cache-miss: true

      - name: Compile cache-only and require measured Visual Grammar PASS
        shell: bash
        env:
          EPISODE_DATE: ${{ steps.request.outputs.episode_date }}
          SPEC_PATH: render-specs/${{ steps.request.outputs.episode_date }}/render_spec.json
        run: |
          set -euo pipefail
          npm run episode:spec:compile -- "$SPEC_PATH"
          test "$(jq -r '.visualGrammarTiming.status' "build/${EPISODE_DATE}/technical_report.json")" = "PASS"
          test "$(jq -r '.visualGrammarTiming.unresolvedStateCount' "build/${EPISODE_DATE}/technical_report.json")" = "0"
          REPORT="$(jq -r '.visualGrammarTiming.path' "build/${EPISODE_DATE}/technical_report.json")"
          test -s "$REPORT"
          cp "$REPORT" "preview-status/${EPISODE_DATE}/visual_grammar_timing_after_patch_v2.json"

      - name: Recreate production readiness from validated bytes
        run: npm run episode:spec:ready -- "${{ steps.request.outputs.episode_date }}" --consistency-pass

      - name: Finalize repair receipt
        shell: bash
        env:
          EPISODE_DATE: ${{ steps.request.outputs.episode_date }}
          EXPECTED_NEW_RENDER_SHA: ${{ steps.patch.outputs.new_render_sha }}
          EXPECTED_NEW_PACKAGE_SHA: ${{ steps.patch.outputs.new_package_sha }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,os
          from pathlib import Path
          d=os.environ['EPISODE_DATE']; r=Path(f'render-specs/{d}/production_ready.json'); p=Path(f'preview-status/{d}/post_tts_visual_diversity_patch_v2.json')
          ready=json.loads(r.read_text()); report=json.loads(p.read_text())
          if ready.get('renderSpecSha256')!=os.environ['EXPECTED_NEW_RENDER_SHA']: raise SystemExit('ready render SHA mismatch')
          if ready.get('episodePackageSha256')!=os.environ['EXPECTED_NEW_PACKAGE_SHA']: raise SystemExit('ready package SHA mismatch')
          if ready.get('validatorStatus')!='pass' or ready.get('consistencyStatus')!='pass' or ready.get('unresolvedStateCount')!=0: raise SystemExit('readiness not PASS')
          report.update({'status':'validated-measured-pass','formalValidator':'pass','measuredVisualGrammar':'pass','productionReady':'pass'})
          p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Commit only validated visual repair and audit files
        shell: bash
        env:
          EPISODE_DATE: ${{ steps.request.outputs.episode_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "render-specs/${EPISODE_DATE}/render_spec.json" \
            "render-specs/${EPISODE_DATE}/production_ready.json" \
            "episode-packages/${EPISODE_DATE}/episode_package_${EPISODE_DATE}.md" \
            "preview-status/${EPISODE_DATE}/post_tts_visual_diversity_patch_v2.json" \
            "preview-status/${EPISODE_DATE}/visual_grammar_timing_after_patch_v2.json"
          git diff --cached --quiet && { echo "::error::no validated repair changes"; exit 1; }
          git commit -m "fix: measured visual diversity for ${EPISODE_DATE} preview"
          git pull --rebase origin main
          git push origin HEAD:main
