name: One-time Scene 4 Japanese Preview Dispatcher

on:
  push:
    branches:
      - fix/visual-rhythm-2026-08-06
    paths:
      - preview-requests/scene4-japanese-new-tts.json

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EPISODE_DATE: "2026-08-06"
      TARGET_REF: fix/visual-rhythm-2026-08-06
      TARGET_WORKFLOW: nasdaq-cafe-preview.yml

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/visual-rhythm-2026-08-06
          fetch-depth: 0

      - name: Verify input and dispatch formal Preview workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SPEC_PATH="render-specs/${EPISODE_DATE}/render_spec.json"
          test -s "$SPEC_PATH"
          SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          HEAD_SHA="$(git rev-parse HEAD)"

          REQUEST_BODY="$(jq -n \
            --arg ref "$TARGET_REF" \
            --arg episode_date "$EPISODE_DATE" \
            --arg spec_sha "$SPEC_SHA" \
            '{
              ref: $ref,
              inputs: {
                episode_date: $episode_date,
                expected_spec_sha256: $spec_sha,
                confirmation: "PREVIEW"
              }
            }')"

          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            --input - <<<"$REQUEST_BODY" >/tmp/dispatch-response.json || {
              cat /tmp/dispatch-response.json || true
              exit 1
            }

          RUN_ID=""
          for attempt in 1 2 3 4 5 6; do
            sleep 3
            RUN_ID="$(gh run list \
              --workflow "$TARGET_WORKFLOW" \
              --branch "$TARGET_REF" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -n 1)"
            if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              break
            fi
          done

          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::formal Preview was dispatched but run id could not be resolved"
            exit 1
          fi

          mkdir -p preview-status/2026-08-06
          jq -n \
            --argjson runId "$RUN_ID" \
            --arg headSha "$HEAD_SHA" \
            --arg specSha "$SPEC_SHA" \
            '{runId:$runId,headSha:$headSha,specSha256:$specSha,status:"formal-preview-dispatched"}' \
            > preview-status/2026-08-06/scene4_japanese_new_tts_run.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-status/2026-08-06/scene4_japanese_new_tts_run.json
          git commit -m "Record formal Scene 4 Japanese Preview dispatch" || true
          git push origin HEAD:fix/visual-rhythm-2026-08-06

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "spec_sha=$SPEC_SHA" >> "$GITHUB_OUTPUT"
