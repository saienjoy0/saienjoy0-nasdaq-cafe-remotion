name: Report v3.1 Runs Once

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - .github/workflows/report-v31-runs-once.yml

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Report recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(gh run list --repo "$REPO" --branch feature/visual-story-engine-v2 --limit 12 --json databaseId,name,status,conclusion,headSha,event,createdAt --jq '.[] | [.databaseId,.name,.event,.status,(.conclusion // "-"),.headSha,.createdAt] | @tsv')"
          {
            echo '### Visual Story v3.1 workflow status'
            echo '```text'
            echo "$RUNS"
            echo '```'
          } > /tmp/body.md
          gh pr comment 26 --repo "$REPO" --body-file /tmp/body.md
