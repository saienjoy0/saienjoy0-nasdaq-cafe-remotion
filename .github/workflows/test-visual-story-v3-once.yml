name: Test Visual Story Engine v3 Once

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - .github/workflows/test-visual-story-v3-once.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-story-engine-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run v3 verification and save report
        run: |
          set +e
          mkdir -p build docs
          {
            echo '=== TYPECHECK ==='
            npm run typecheck
            echo '=== SHOT CONTRACT ==='
            npm run test:shot-story
            echo '=== VISUAL STORY ==='
            npm run test:visual-story
            echo '=== PUBLIC SCREEN ==='
            npm run test:public-screen
            echo '=== RENDER SPEC ==='
            npm run test:spec
            echo '=== BUNDLE ==='
            rm -rf dist/remotion
            npm run build
          } > build/v3-test-full.log 2>&1
          status=$?
          {
            echo '# Visual Story Engine v3 Test Result'
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Exit status: $status"
            echo
            echo '```text'
            tail -n 400 build/v3-test-full.log
            echo '```'
          } > docs/visual-story-v3-test-result.md
          rm .github/workflows/test-visual-story-v3-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/visual-story-v3-test-result.md .github/workflows/test-visual-story-v3-once.yml
          git commit -m "Record Visual Story Engine v3 test result"
          git push origin HEAD:feature/visual-story-engine-v2
          exit "$status"
