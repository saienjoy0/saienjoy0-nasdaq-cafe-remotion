name: Nasdaq Cafe Final

on:
  workflow_call:
    inputs:
      episode_date:
        required: true
        type: string
      expected_spec_sha256:
        required: true
        type: string
      approval_artifact_name:
        required: true
        type: string
      confirmation:
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nasdaq-cafe-final-${{ inputs.episode_date }}
  cancel-in-progress: false

jobs:
  render-final:
    name: Render cache-only final
    if: >-
      github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' &&
      github.workflow == 'Nasdaq Cafe Final Request'
    runs-on: [self-hosted, linux, x64, nasdaq-cafe-codespace]
    timeout-minutes: 120

    env:
      CI: "true"
      EPISODE_DATE: ${{ inputs.episode_date }}
      EXPECTED_SPEC_SHA256: ${{ inputs.expected_spec_sha256 }}
      SPEC_TTS_CACHE_ONLY: "1"
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon

    steps:
      - name: Checkout immutable Final request commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Restore validated Final approval sidecar
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.approval_artifact_name }}
          path: .

      - name: Require validated lineage receipt
        shell: bash
        run: |
          set -euo pipefail
          SIDECAR="final-render-authorizations/${EPISODE_DATE}.json"
          RECEIPT=".final-lineage/final_approval_lineage.json"
          test -s "$SIDECAR"
          test -s "$RECEIPT"
          python3 - "$SIDECAR" "$RECEIPT" "$EPISODE_DATE" "$EXPECTED_SPEC_SHA256" <<'PY'
          import json, pathlib, sys
          sidecar=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          receipt=json.loads(pathlib.Path(sys.argv[2]).read_text(encoding='utf-8'))
          date=sys.argv[3]
          spec_sha=sys.argv[4].lower()
          if receipt.get('status') != 'PASS': raise SystemExit('Final lineage receipt must PASS')
          if receipt.get('episodeDate') != date: raise SystemExit('Final lineage receipt episode mismatch')
          if receipt.get('renderSpecSha256') != spec_sha: raise SystemExit('Final lineage receipt render_spec SHA mismatch')
          if sidecar.get('contractVersion') != '1.0.0': raise SystemExit('Final authorization sidecar contractVersion mismatch')
          if sidecar.get('episodeDate') != date: raise SystemExit('Final authorization sidecar episode mismatch')
          if sidecar.get('expectedSpecSha256') != spec_sha: raise SystemExit('Final authorization sidecar render_spec SHA mismatch')
          if sidecar.get('previewRunId') != receipt.get('previewRunId'): raise SystemExit('Final authorization sidecar Preview run mismatch')
          if sidecar.get('approvedPreviewSha256') != receipt.get('approvedPreviewSha256'): raise SystemExit('Final authorization sidecar Preview SHA mismatch')
          if sidecar.get('plotAuthorizationCommit') != receipt.get('plotAuthorizationCommit'): raise SystemExit('Final authorization sidecar Plot commit mismatch')
          if sidecar.get('plotAuthorizationSha256') != receipt.get('plotAuthorizationSha256'): raise SystemExit('Final authorization sidecar Plot authorization SHA mismatch')
          PY

      - name: Verify explicit Final request and immutable spec
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "FINAL" ]] || { echo "::error::confirmation must be exactly FINAL"; exit 1; }
          [[ "$EPISODE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::episode_date must match YYYY-MM-DD"; exit 1; }
          SPEC_PATH="render-specs/${EPISODE_DATE}/render_spec.json"
          test -s "$SPEC_PATH"
          EXPECTED="$(printf '%s' "$EXPECTED_SPEC_SHA256" | tr '[:upper:]' '[:lower:]')"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::expected_spec_sha256 must be SHA-256"; exit 1; }
          ACTUAL="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "::error::render_spec SHA mismatch expected=$EXPECTED actual=$ACTUAL"; exit 1; }
          TTS_INPUT_SHA="$(python3 - "$SPEC_PATH" <<'PY'
          import hashlib, json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          blocks = []
          for block_id, first_scene, last_scene in (("scenes-01-04", 1, 4), ("scenes-05-09", 5, 9)):
              speech = [chunk["speechText"] for scene in value["scenes"] if first_scene <= scene["sceneNumber"] <= last_scene for chunk in scene["narrationChunks"]]
              if not speech:
                  raise SystemExit(f"TTS block {block_id} has no speechText")
              blocks.append({"id": block_id, "speechText": speech})
          payload = {"synthesisVersion": "gemini-two-block-v1", "model": "gemini-3.1-flash-tts-preview", "voice": "Charon", "voiceProfileId": value.get("voiceProfileId"), "pronunciations": value.get("pronunciations"), "blocks": blocks}
          print(hashlib.sha256(json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode()).hexdigest())
          PY
          )"
          echo "spec_path=$SPEC_PATH" >> "$GITHUB_OUTPUT"
          echo "spec_sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "tts_input_sha=$TTS_INPUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify persistent Codespace tools
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ensure-remotion-browser-deps.sh
          test "$(nproc)" -ge 4
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Set up Node.js cache
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Restore exact production TTS cache
        id: tts_cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ steps.preflight.outputs.tts_input_sha }}

      - name: Restore approved exported TTS cache
        if: steps.tts_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/restore_exported_tts_cache.py --root . --tts-input-sha "${{ steps.preflight.outputs.tts_input_sha }}"

      - name: Require cached narration and forbid synthesis
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(find .cache/spec-tts-blocks -type f -name audio.wav | wc -l | tr -d ' ')"
          [[ "$COUNT" -ge 2 ]] || { echo "::error::Exact two-block TTS cache is incomplete"; exit 1; }
          while IFS= read -r audio; do ffmpeg -nostdin -v error -i "$audio" -f null -; done < <(find .cache/spec-tts-blocks -type f -name audio.wav -print)

      - name: Validate Final contracts
        run: |
          npm run typecheck
          npm run test:gemini-tts
          npm run episode:spec:validate -- "${{ steps.preflight.outputs.spec_path }}"
          npm run test:runtime-stability

      - name: Render full-resolution Final
        timeout-minutes: 90
        run: npm run episode:spec:final -- "${{ steps.preflight.outputs.spec_path }}"

      - name: Decode and inspect Final MP4
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          MP4="renders/final/${EPISODE_DATE}_nasdaq-cafe-spec.mp4"
          REPORT="build/${EPISODE_DATE}/technical_report.json"
          DATA="build/${EPISODE_DATE}/render_data.production.json"
          INSPECTION="build/${EPISODE_DATE}/final_inspection.json"
          test -s "$MP4"; test -s "$REPORT"; test -s "$DATA"
          ffmpeg -nostdin -v error -i "$MP4" -f null -
          ffprobe -v error -show_streams -show_format -of json "$MP4" > /tmp/final-probe.json
          python3 - "$MP4" "$REPORT" "$DATA" /tmp/final-probe.json "$INSPECTION" "${{ steps.preflight.outputs.spec_sha }}" <<'PY'
          import hashlib, json, pathlib, sys
          from datetime import datetime, timezone
          mp4, report_path, data_path, probe_path, inspection_path, expected_sha = sys.argv[1:]
          report = json.load(open(report_path, encoding="utf-8")); data = json.load(open(data_path, encoding="utf-8")); probe = json.load(open(probe_path, encoding="utf-8"))
          if report.get("status") != "final-generated" or report.get("inputSpecSha256") != expected_sha: raise SystemExit("technical report identity mismatch")
          video = next((s for s in probe.get("streams", []) if s.get("codec_type") == "video"), None); audio = next((s for s in probe.get("streams", []) if s.get("codec_type") == "audio"), None)
          if video is None or audio is None: raise SystemExit("Final MP4 must contain video and audio")
          episode = data["episode"]
          if video.get("codec_name") != "h264" or int(video.get("width", 0)) != int(episode["width"]) or int(video.get("height", 0)) != int(episode["height"]): raise SystemExit("Final video contract mismatch")
          if audio.get("codec_name") != "aac" or int(audio.get("sample_rate", 0)) != 48000 or int(audio.get("channels", 0)) != 2: raise SystemExit("Final audio contract mismatch")
          expected_seconds = data["timeline"]["totalDurationInFrames"] / episode["fps"]; actual_seconds = float(probe.get("format", {}).get("duration", 0))
          if abs(actual_seconds - expected_seconds) > 0.20: raise SystemExit(f"Final duration mismatch: expected={expected_seconds} actual={actual_seconds}")
          payload = pathlib.Path(mp4).read_bytes(); inspection = {"status": "valid", "inspectedAt": datetime.now(timezone.utc).isoformat(), "episodeDate": episode["id"], "renderSpecSha256": expected_sha, "path": mp4, "sha256": hashlib.sha256(payload).hexdigest(), "bytes": len(payload), "width": int(video["width"]), "height": int(video["height"]), "durationSeconds": actual_seconds, "videoCodec": video["codec_name"], "audioCodec": audio["codec_name"], "audioSampleRate": int(audio["sample_rate"]), "audioChannels": int(audio["channels"]), "fullDecode": "pass"}
          pathlib.Path(inspection_path).write_text(json.dumps(inspection, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload Final delivery artifact
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-final-${{ inputs.episode_date }}-${{ github.run_id }}
          path: |
            renders/final/${{ inputs.episode_date }}_nasdaq-cafe-spec.mp4
            build/${{ inputs.episode_date }}/technical_report.json
            build/${{ inputs.episode_date }}/render_data.production.json
            build/${{ inputs.episode_date }}/final_inspection.json
            public/spec-audio/${{ inputs.episode_date }}/tts-block-state.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
