name: Validate Complete Renderer Adapter 2026-08-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-renderer-compat-2026-08-06-v3.yml"

permissions:
  contents: write

concurrency:
  group: apply-renderer-compat-2026-08-06-v3
  cancel-in-progress: false

jobs:
  normalize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EPISODE_DATE: "2026-08-06"
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      READY_PATH: "render-specs/2026-08-06/production_ready.json"
      PACKAGE_PATH: "episode-packages/2026-08-06/episode_package_2026-08-06.md"
      REPORT_PATH: "preview-status/2026-08-06/normalization_report.json"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize Plot payload without changing TTS identity
        run: |
          python3 scripts/normalize_nasdaq_cafe_2026_08_06.py \
            --spec "$SPEC_PATH" \
            --package "$PACKAGE_PATH" \
            --ready "$READY_PATH" \
            --report "$REPORT_PATH"

      - name: Adapt existing display objects to formal Renderer structures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from copy import deepcopy
          from pathlib import Path

          spec_path = Path(os.environ["SPEC_PATH"])
          ready_path = Path(os.environ["READY_PATH"])
          report_path = Path(os.environ["REPORT_PATH"])
          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          promoted_numbers = []
          promoted_gap_cards = []

          def canonical_sha(value):
              return hashlib.sha256(json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")).hexdigest()

          for scene in spec["scenes"]:
              cards = {card["cardId"]: card for card in scene.get("cards", [])}
              numbers = scene.setdefault("numbers", [])
              existing_ids = {item["numberId"] for item in numbers}
              for beat in scene["visualBeats"]:
                  if beat.get("visualMode") != "number-comparison":
                      continue
                  referenced_cards = [cards[item] for item in beat.get("objectIds", []) if item in cards]
                  promoted_ids = []
                  for card_index, card in enumerate(referenced_cards, start=1):
                      for line_index, line in enumerate(card["lines"], start=1):
                          number_id = f"{beat['beatId']}-number-{card_index:02d}-{line_index:02d}"
                          if number_id not in existing_ids:
                              text = line["value"].strip()
                              if " " in text:
                                  label, value = text.rsplit(" ", 1)
                              else:
                                  label, value = card["title"], text
                              numbers.append({
                                  "numberId": number_id,
                                  "label": label,
                                  "value": value,
                                  "unit": "",
                                  "comparison": None,
                                  "tone": line["tone"],
                              })
                              existing_ids.add(number_id)
                              promoted_numbers.append({
                                  "sceneId": scene["sceneId"],
                                  "beatId": beat["beatId"],
                                  "sourceCardId": card["cardId"],
                                  "sourceLine": line["value"],
                                  "numberId": number_id,
                              })
                          promoted_ids.append(number_id)
                  if len(promoted_ids) < 2:
                      raise SystemExit(f"number-comparison Beat has fewer than two promoted numbers: {beat['beatId']}")
                  beat["objectIds"] = list(dict.fromkeys([*beat["objectIds"], *promoted_ids]))

          scene4 = next(scene for scene in spec["scenes"] if scene["sceneId"] == "scene-04")
          beat1, beat2 = scene4["visualBeats"]
          source_card = next(card for card in scene4["cards"] if card["cardId"] in beat1["objectIds"])
          if len(source_card["lines"]) != 3:
              raise SystemExit("Scene 4 Expected/Actual/Gap source card must contain exactly three lines")
          roles = ("expected", "actual", "gap")
          role_cards = []
          for role, line in zip(roles, source_card["lines"], strict=True):
              card = {
                  "cardId": f"scene-04-card-{role}",
                  "role": role,
                  "title": role.capitalize(),
                  "lines": [deepcopy(line)],
              }
              role_cards.append(card)
              promoted_gap_cards.append({
                  "role": role,
                  "sourceLine": line["value"],
                  "cardId": card["cardId"],
              })
          scene4["cards"] = role_cards
          beat1["objectIds"] = [card["cardId"] for card in role_cards]
          beat2["visualMode"] = "text-focus"
          beat2["objectIds"] = []

          event_template = deepcopy(scene4["visualEvents"][0])
          events = []
          for event_id, card in zip(("event-007", "event-008", "event-019"), role_cards, strict=True):
              event = deepcopy(event_template)
              event["eventId"] = event_id
              event["atChunkId"] = beat1["startChunkId"]
              event["targetId"] = card["cardId"]
              events.append(event)
          scene4["visualEvents"] = events

          financial_pairs = []
          for scene in spec["scenes"]:
              for beat in scene["visualBeats"]:
                  trace = beat.get("financialVisualTrace")
                  if not trace:
                      continue
                  display_order = list(beat["objectIds"])
                  beat["templateConfig"]["displayOrder"] = display_order
                  trace["displayOrder"] = display_order
                  plan = {
                      "intentId": trace["intentId"],
                      "selectedPlanId": trace["selectedPlanId"],
                      "selectedPath": trace["selectedPath"],
                      "recipeId": trace["recipeId"],
                      "visualTemplate": beat["visualTemplate"],
                      "sourceIds": trace["sourceIds"],
                      "metricIds": trace["metricIds"],
                      "causalStepIds": trace["causalStepIds"],
                      "displayOrder": display_order,
                      "comparisonBasis": trace["comparisonBasis"],
                  }
                  trace["selectedPlanSha256"] = canonical_sha(plan)
                  financial_pairs.append((trace, plan))
          recipe_plan = {
              "contractVersion": "1.0.0",
              "episodeId": spec["episode"]["id"],
              "selections": [plan for _, plan in financial_pairs],
          }
          recipe_plan_sha = canonical_sha(recipe_plan)
          for trace, _ in financial_pairs:
              trace["recipePlanSha256"] = recipe_plan_sha
          if financial_pairs:
              spec["financialVisualContract"]["recipePlanSha256"] = recipe_plan_sha
              spec["financialVisualContract"]["selectionCount"] = len(financial_pairs)

          normalized_text = json.dumps(spec, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          spec_path.write_text(normalized_text, encoding="utf-8")
          spec_sha = hashlib.sha256(normalized_text.encode("utf-8")).hexdigest()

          ready = json.loads(ready_path.read_text(encoding="utf-8"))
          ready["renderSpecSha256"] = spec_sha
          normalization = dict(ready.get("rendererNormalization", {}))
          normalization.update({
              "promotedNumberObjectCount": len(promoted_numbers),
              "promotedExpectedActualGapCardCount": len(promoted_gap_cards),
              "numberTextChanged": False,
              "expectedActualGapTextChanged": False,
              "financialRecipePlanSha256": recipe_plan_sha,
          })
          ready["rendererNormalization"] = normalization
          ready_path.write_text(json.dumps(ready, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          report.update({
              "normalizedRenderSpecSha256": spec_sha,
              "promotedNumberObjectCount": len(promoted_numbers),
              "promotedNumbers": promoted_numbers,
              "promotedExpectedActualGapCardCount": len(promoted_gap_cards),
              "promotedExpectedActualGapCards": promoted_gap_cards,
              "numberTextChanged": False,
              "expectedActualGapTextChanged": False,
              "financialRecipePlanSha256": recipe_plan_sha,
          })
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({
              "renderSpecSha256": spec_sha,
              "numbers": len(promoted_numbers),
              "expectedActualGapCards": len(promoted_gap_cards),
              "financialTraces": len(financial_pairs),
          }, ensure_ascii=False))
          PY

      - name: Run formal Renderer validator
        run: npm run episode:spec:validate -- "$SPEC_PATH"

      - name: Commit formally validated Renderer input
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_PATH" "$READY_PATH" "$REPORT_PATH"
          git rm --ignore-unmatch scripts/normalize_nasdaq_cafe_2026_08_06.py
          git rm --ignore-unmatch .github/workflows/apply-renderer-compat-2026-08-06-v2.yml
          git rm --ignore-unmatch .github/workflows/apply-renderer-compat-2026-08-06-v3.yml
          git rm --ignore-unmatch .github/workflows/apply-normalized-preview-2026-08-06.yml
          git rm --ignore-unmatch .github/workflows/normalize-and-render-preview-2026-08-06.yml
          git rm --ignore-unmatch .github/workflows/normalize-financial-and-render-preview-2026-08-06.yml
          git commit -m "Store formally validated Renderer input for 2026-08-06"
          git pull --rebase origin main
          git push origin HEAD:main
