name: FVU R3 Shot Plan Bootstrap

on:
  pull_request:
    paths:
      - "scripts/generate-financial-handoff-fixture.py"
      - ".github/workflows/fvu-r3-shot-plan-bootstrap.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/fvu-r3-financial-shot-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Regenerate fixture twice
        run: |
          python3 scripts/generate-financial-handoff-fixture.py > /tmp/first.json
          cp shared-fixtures/financial-visual-2.3/render_spec.json /tmp/render.first.json
          cp shared-fixtures/financial-visual-2.3/fixture_manifest.json /tmp/manifest.first.json
          python3 scripts/generate-financial-handoff-fixture.py > /tmp/second.json
          cmp /tmp/first.json /tmp/second.json
          cmp /tmp/render.first.json shared-fixtures/financial-visual-2.3/render_spec.json
          cmp /tmp/manifest.first.json shared-fixtures/financial-visual-2.3/fixture_manifest.json
      - name: Commit regenerated fixture
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git add -- shared-fixtures/financial-visual-2.3/render_spec.json shared-fixtures/financial-visual-2.3/fixture_manifest.json
          if git diff --cached --quiet; then
            echo "Fixture already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate shared fixture with explicit financial Shots"
          git push origin "HEAD:${HEAD_REF}"
