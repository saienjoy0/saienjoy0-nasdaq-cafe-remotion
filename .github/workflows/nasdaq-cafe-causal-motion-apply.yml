name: Nasdaq Cafe Causal Motion Apply

on:
  push:
    branches:
      - main
    paths:
      - "causal-motion-requests/*.json"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "causal-motion-requests/*.json"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: nasdaq-cafe-causal-motion-apply
  cancel-in-progress: false

jobs:
  apply-causal-motion:
    name: Apply one approved causal motion request
    if: >-
      github.event_name == 'schedule' ||
      github.actor == github.repository_owner ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout audited target
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Resolve one append-only request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REQUEST_PATH=""

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            mapfile -t CHANGED < <(
              git diff --name-status "$BEFORE_SHA" "$GITHUB_SHA" -- 'causal-motion-requests/*.json'
            )
            if [[ "${#CHANGED[@]}" -ne 1 ]]; then
              echo "::error::Exactly one causal motion request must be added"
              exit 1
            fi
            IFS=$'\t' read -r STATUS REQUEST_PATH <<< "${CHANGED[0]}"
            if [[ "$STATUS" != "A" || ! "$REQUEST_PATH" =~ ^causal-motion-requests/[A-Za-z0-9._-]+\.json$ ]]; then
              echo "::error::Causal motion requests are append-only JSON files"
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            mapfile -t CHANGED < <(
              git diff --name-status "$PR_BASE_SHA" "$PR_HEAD_SHA" -- 'causal-motion-requests/*.json'
            )
            if [[ "${#CHANGED[@]}" -ne 1 ]]; then
              echo "::error::A causal motion application PR must add exactly one request"
              exit 1
            fi
            IFS=$'\t' read -r STATUS REQUEST_PATH <<< "${CHANGED[0]}"
            if [[ "$STATUS" != "A" || ! "$REQUEST_PATH" =~ ^causal-motion-requests/[A-Za-z0-9._-]+\.json$ ]]; then
              echo "::error::Causal motion application PRs are append-only"
              exit 1
            fi
          else
            REQUEST_PATH="$(python3 <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path.cwd()

          def sha256(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def blob_sha(path: pathlib.Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()

          for request_path in sorted((root / "causal-motion-requests").glob("*.json"), reverse=True):
              try:
                  request = json.loads(request_path.read_text(encoding="utf-8"))
                  episode_date = request["episodeDate"]
                  expected_spec = request["expectedSpecSha256"]
                  expected_package = request["expectedEpisodePackageBlobSha"]
              except (KeyError, TypeError, json.JSONDecodeError):
                  continue
              spec_path = root / "render-specs" / episode_date / "render_spec.json"
              package_path = root / "episode-packages" / episode_date / f"episode_package_{episode_date}.md"
              if not spec_path.is_file() or not package_path.is_file():
                  continue
              if sha256(spec_path) != expected_spec or blob_sha(package_path) != expected_package:
                  continue
              print(request_path.relative_to(root).as_posix())
              break
          PY
            )"
          fi

          if [[ -z "$REQUEST_PATH" ]]; then
            echo "No pending causal motion request matches the current immutable inputs"
            echo "has_request=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -s "$REQUEST_PATH"
          echo "has_request=true" >> "$GITHUB_OUTPUT"
          echo "request_path=$REQUEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.request.outputs.has_request == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        if: steps.request.outputs.has_request == 'true'
        run: npm ci

      - name: Test and apply the approved causal motion request
        if: steps.request.outputs.has_request == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_causal_motion_request.py scripts/test_causal_motion_request.py
          PYTHONPATH=scripts python3 scripts/test_causal_motion_request.py
          python3 scripts/apply_causal_motion_request.py "${{ steps.request.outputs.request_path }}"

      - name: Validate generated render input
        if: steps.request.outputs.has_request == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "${{ steps.request.outputs.request_path }}")"
          npm run episode:spec:validate -- "render-specs/${EPISODE_DATE}/render_spec.json"
          npm run test:visual-story
          npm run test:public-screen
          git diff --check

      - name: Restrict generated changes
        if: steps.request.outputs.has_request == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "${{ steps.request.outputs.request_path }}")"
          mapfile -t CHANGED < <(git diff --name-only)
          EXPECTED=(
            "episode-packages/${EPISODE_DATE}/episode_package_${EPISODE_DATE}.md"
            "render-specs/${EPISODE_DATE}/render_spec.json"
            "causal-motion-reports/${EPISODE_DATE}.json"
          )
          if [[ "${#CHANGED[@]}" -ne 3 ]]; then
            printf '::error::Unexpected generated change: %s\n' "${CHANGED[@]}"
            exit 1
          fi
          for expected in "${EXPECTED[@]}"; do
            printf '%s\n' "${CHANGED[@]}" | grep -Fx -- "$expected" >/dev/null || {
              echo "::error::Missing expected generated file: $expected"
              exit 1
            }
          done

      - name: Commit generated causal motion outputs
        if: steps.request.outputs.has_request == 'true'
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "${{ steps.request.outputs.request_path }}")"
          TARGET_BRANCH="main"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            TARGET_BRANCH="$PR_HEAD_REF"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "render-specs/${EPISODE_DATE}/render_spec.json" \
            "episode-packages/${EPISODE_DATE}/episode_package_${EPISODE_DATE}.md" \
            "causal-motion-reports/${EPISODE_DATE}.json"
          git commit -m "Apply causal motion for ${EPISODE_DATE}"
          git push origin HEAD:"$TARGET_BRANCH"
