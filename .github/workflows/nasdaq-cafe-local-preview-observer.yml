name: Nasdaq Cafe Local Preview Observer

on:
  push:
    branches:
      - main
    paths:
      - "local-preview-probes/*.json"

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    name: Observe exact local Preview run
    if: >-
      github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout probe
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Resolve exactly one probe
        id: probe
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(
            git diff --name-only "$BEFORE_SHA" "$TRIGGER_SHA" -- 'local-preview-probes/*.json'
          )
          if [[ "${#CHANGED[@]}" -ne 1 ]]; then
            echo "::error::Exactly one local preview probe JSON must change per push"
            exit 1
          fi
          python3 - "${CHANGED[0]}" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          required = {'contractVersion', 'episodeDate', 'rendererRef', 'expectedHeadSha'}
          if set(value) != required:
              raise SystemExit(f'probe fields mismatch: {sorted(value)}')
          if value['contractVersion'] != '1.0.0':
              raise SystemExit('contractVersion must be 1.0.0')
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', str(value['episodeDate'])):
              raise SystemExit('episodeDate must be YYYY-MM-DD')
          if not re.fullmatch(r'[A-Za-z0-9._/-]+', str(value['rendererRef'])):
              raise SystemExit('rendererRef is unsafe')
          if not re.fullmatch(r'[0-9a-f]{40}', str(value['expectedHeadSha'])):
              raise SystemExit('expectedHeadSha must be 40 lowercase hex characters')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"episode_date={value['episodeDate']}\n")
              out.write(f"renderer_ref={value['rendererRef']}\n")
              out.write(f"expected_head_sha={value['expectedHeadSha']}\n")
          PY

      - name: Query exact local Preview run
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RENDERER_REF: ${{ steps.probe.outputs.renderer_ref }}
          EXPECTED_HEAD_SHA: ${{ steps.probe.outputs.expected_head_sha }}
        run: |
          set -euo pipefail
          RESPONSE="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nasdaq-cafe-local-preview-2026-08-10.yml/runs?event=push&branch=${RENDERER_REF}&per_page=30")"
          RUN="$(jq -c --arg sha "$EXPECTED_HEAD_SHA" \
            '.workflow_runs | map(select(.head_sha == $sha)) | sort_by(.created_at) | reverse | .[0] // empty' \
            <<<"$RESPONSE")"
          if [[ -z "$RUN" ]]; then
            echo "::error::No matching local Preview run found"
            exit 1
          fi
          RUN_ID="$(jq -r '.id' <<<"$RUN")"
          STATUS="$(jq -r '.status' <<<"$RUN")"
          CONCLUSION="$(jq -r '.conclusion // "pending"' <<<"$RUN")"
          RUN_URL="$(jq -r '.html_url' <<<"$RUN")"
          CREATED_AT="$(jq -r '.created_at' <<<"$RUN")"
          UPDATED_AT="$(jq -r '.updated_at' <<<"$RUN")"
          ARTIFACT_NAMES=""
          if [[ "$STATUS" == "completed" ]]; then
            ARTIFACT_RESPONSE="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
            ARTIFACT_NAMES="$(jq -r '.artifacts[]?.name' <<<"$ARTIFACT_RESPONSE")"
          fi
          {
            echo "run_id=$RUN_ID"
            echo "status=$STATUS"
            echo "conclusion=$CONCLUSION"
            echo "run_url=$RUN_URL"
            echo "created_at=$CREATED_AT"
            echo "updated_at=$UPDATED_AT"
            echo "artifact_names<<EOF"
            printf '%s\n' "$ARTIFACT_NAMES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert local Preview observer receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_DATE: ${{ steps.probe.outputs.episode_date }}
          RENDERER_REF: ${{ steps.probe.outputs.renderer_ref }}
          EXPECTED_HEAD_SHA: ${{ steps.probe.outputs.expected_head_sha }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          RUN_STATUS: ${{ steps.run.outputs.status }}
          RUN_CONCLUSION: ${{ steps.run.outputs.conclusion }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
          CREATED_AT: ${{ steps.run.outputs.created_at }}
          UPDATED_AT: ${{ steps.run.outputs.updated_at }}
          ARTIFACT_NAMES: ${{ steps.run.outputs.artifact_names }}
        run: |
          set -euo pipefail
          TITLE="NASDAQ CAFE LOCAL PREVIEW OBSERVER ${EPISODE_DATE}"
          ARTIFACT_LINES="$(printf '%s\n' "$ARTIFACT_NAMES" | sed '/^$/d;s/^/- `/;s/$/`/')"
          if [[ -z "$ARTIFACT_LINES" ]]; then
            ARTIFACT_LINES="- none yet"
          fi
          BODY="$(cat <<EOF
          Local pinned Preview observer receipt for ChatGPT monitoring.

          - Episode date: \`${EPISODE_DATE}\`
          - Renderer ref: \`${RENDERER_REF}\`
          - Expected branch head: \`${EXPECTED_HEAD_SHA}\`
          - Workflow run ID: \`${RUN_ID}\`
          - Status: \`${RUN_STATUS}\`
          - Conclusion: \`${RUN_CONCLUSION}\`
          - Created: \`${CREATED_AT}\`
          - Updated: \`${UPDATED_AT}\`
          - Run URL: ${RUN_URL}

          Artifacts:
          ${ARTIFACT_LINES}
          EOF
          )"
          ISSUE_NUMBER="$(gh issue list \
            --state all \
            --search "${TITLE} in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)"
          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue edit "$ISSUE_NUMBER" --title "$TITLE" --body "$BODY"
            gh issue reopen "$ISSUE_NUMBER" >/dev/null 2>&1 || true
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
