name: Nasdaq Cafe Dispatch Once 2026-07-31

on:
  push:
    branches:
      - main
    paths:
      - .github/run-once/dispatch-preview-2026-07-31.trigger

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  dispatch:
    name: Verify ready package and dispatch official preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EPISODE_DATE: "2026-07-31"
      SPEC_PATH: render-specs/2026-07-31/render_spec.json
      PACKAGE_PATH: episode-packages/2026-07-31/episode_package_2026-07-31.md
      READY_PATH: render-specs/2026-07-31/production_ready.json
      EXPECTED_SPEC_SHA256: f94a16574d44611efb23e0596274db1cb5f7b2c6b2d5f663dd76042026a2524c
      EXPECTED_PACKAGE_SHA256: 6cc8f0f924b07b625fec421acab0735a27fbab6caf74a75722674ba7f4aa80b3
      TARGET_WORKFLOW: nasdaq-cafe-preview.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify production-ready package
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SPEC_PATH"
          test -s "$PACKAGE_PATH"
          test -s "$READY_PATH"
          spec_sha="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          package_sha="$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')"
          [[ "$spec_sha" == "$EXPECTED_SPEC_SHA256" ]]
          [[ "$package_sha" == "$EXPECTED_PACKAGE_SHA256" ]]
          python3 - "$READY_PATH" "$EPISODE_DATE" "$EXPECTED_SPEC_SHA256" "$EXPECTED_PACKAGE_SHA256" <<'PY'
          import json, sys
          path, date, spec_sha, package_sha = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              ready = json.load(handle)
          required = {
              "version": 1,
              "status": "ready",
              "episodeDate": date,
              "renderSpecSha256": spec_sha,
              "episodePackageSha256": package_sha,
              "validatorStatus": "pass",
              "consistencyStatus": "pass",
              "unresolvedStateCount": 0,
          }
          for key, expected in required.items():
              if ready.get(key) != expected:
                  raise SystemExit(f"production_ready.{key} mismatch")
          PY

      - name: Dispatch official preview workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$(jq -n \
            --arg ref main \
            --arg date "$EPISODE_DATE" \
            --arg sha "$EXPECTED_SPEC_SHA256" \
            '{ref:$ref,inputs:{episode_date:$date,expected_spec_sha256:$sha,confirmation:"PREVIEW"}}')"
          response="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            --input - <<<"$body")"
          run_id="$(jq -r '.workflow_run_id // empty' <<<"$response")"
          run_url="$(jq -r '.html_url // empty' <<<"$response")"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::dispatch response did not include workflow_run_id"
            echo "$response"
            exit 1
          fi
          if [[ -z "$run_url" ]]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Publish dispatched run status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg state success \
            --arg target_url "$RUN_URL" \
            --arg description "Official preview dispatched: ${RUN_ID}" \
            --arg context "nasdaq-cafe/preview-dispatch" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Publish dispatch failure status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg state failure \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "Official preview dispatch failed" \
            --arg context "nasdaq-cafe/preview-dispatch" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
