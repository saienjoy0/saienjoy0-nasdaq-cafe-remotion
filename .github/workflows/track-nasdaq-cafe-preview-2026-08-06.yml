name: Track Nasdaq Cafe Preview 2026-08-06

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/track-nasdaq-cafe-preview-2026-08-06.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: track-nasdaq-cafe-preview-2026-08-06
  cancel-in-progress: false

jobs:
  dispatch-and-track:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EPISODE_DATE: "2026-08-06"
      EXPECTED_SPEC_SHA256: "0b4d094bfc5325602d42e955a281bd16d2e358a150afa04ad9e3d765ee75a515"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Verify production-ready inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "render-specs/$EPISODE_DATE/render_spec.json"
          test -s "render-specs/$EPISODE_DATE/production_ready.json"
          test -s "episode-packages/$EPISODE_DATE/episode_package_$EPISODE_DATE.md"
          ACTUAL="$(sha256sum "render-specs/$EPISODE_DATE/render_spec.json" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED_SPEC_SHA256"

      - name: Dispatch formal preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nasdaq-cafe-preview.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f episode_date="$EPISODE_DATE" \
            -f expected_spec_sha256="$EXPECTED_SPEC_SHA256" \
            -f confirmation=PREVIEW

          for attempt in $(seq 1 20); do
            RUN_JSON="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow nasdaq-cafe-preview.yml \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId,status,conclusion,createdAt,url,headSha)"
            RUN_ID="$(jq -r '.[0].databaseId // empty' <<<"$RUN_JSON")"
            if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              printf '%s\n' "$RUN_JSON" > /tmp/preview-run-initial.json
              echo "$RUN_ID" > /tmp/preview-run-id.txt
              exit 0
            fi
            sleep 3
          done
          echo "::error::Unable to resolve dispatched preview run"
          exit 1

      - name: Wait for preview completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          RUN_ID="$(cat /tmp/preview-run-id.txt)"
          set +e
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          WATCH_EXIT=$?
          set -e
          echo "$WATCH_EXIT" > /tmp/preview-watch-exit.txt

      - name: Record preview status and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(cat /tmp/preview-run-id.txt)"
          mkdir -p "preview-status/$EPISODE_DATE"
          RUN_JSON="$(gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs)"
          ARTIFACT_JSON="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"

          jq -n \
            --arg episode_date "$EPISODE_DATE" \
            --arg expected_spec_sha256 "$EXPECTED_SPEC_SHA256" \
            --argjson workflow_run "$RUN_JSON" \
            --argjson artifacts "$ARTIFACT_JSON" \
            --arg watch_exit "$(cat /tmp/preview-watch-exit.txt)" \
            '{
              version: 1,
              episodeDate: $episode_date,
              expectedSpecSha256: $expected_spec_sha256,
              watchExitCode: ($watch_exit | tonumber),
              workflowRun: $workflow_run,
              artifacts: $artifacts.artifacts
            }' > "preview-status/$EPISODE_DATE/preview_run.json"

      - name: Commit status and remove tracker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "preview-status/$EPISODE_DATE/preview_run.json"
          git rm --ignore-unmatch ".github/workflows/track-nasdaq-cafe-preview-2026-08-06.yml"
          git commit -m "Record Nasdaq Cafe preview result for 2026-08-06"
          git push origin HEAD:main
