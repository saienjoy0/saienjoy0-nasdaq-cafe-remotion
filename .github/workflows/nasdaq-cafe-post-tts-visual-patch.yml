name: Nasdaq Cafe Post-TTS Visual Diversity Patch

on:
  push:
    branches:
      - main
    paths:
      - "visual-diversity-patch-requests/*.json"

permissions:
  contents: write

concurrency:
  group: nasdaq-cafe-post-tts-visual-patch
  cancel-in-progress: false

jobs:
  patch:
    name: Patch measured visual diversity only
    if: github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Resolve exactly one patch request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(
            git diff --name-only "$BEFORE_SHA" "$TRIGGER_SHA" -- 'visual-diversity-patch-requests/*.json'
          )
          if [[ "${#CHANGED[@]}" -ne 1 ]]; then
            echo "::error::Exactly one visual diversity patch request JSON must change"
            exit 1
          fi
          python3 - "${CHANGED[0]}" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          value=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          required={
              'contractVersion','episodeDate','failedPreviewRunId','expectedRenderSpecSha256',
              'expectedEpisodePackageSha256','confirmation'
          }
          if set(value)!=required:
              raise SystemExit(f'request fields mismatch: {sorted(value)}')
          if value['contractVersion']!='1.0.0':
              raise SystemExit('contractVersion must be 1.0.0')
          if value['confirmation']!='PATCH_VISUAL_DIVERSITY_ONLY':
              raise SystemExit('confirmation must be PATCH_VISUAL_DIVERSITY_ONLY')
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', str(value['episodeDate'])):
              raise SystemExit('episodeDate must be YYYY-MM-DD')
          if not isinstance(value['failedPreviewRunId'], int) or value['failedPreviewRunId'] <= 0:
              raise SystemExit('failedPreviewRunId must be a positive integer')
          for key in ('expectedRenderSpecSha256','expectedEpisodePackageSha256'):
              if not re.fullmatch(r'[0-9a-f]{64}', str(value[key])):
                  raise SystemExit(f'{key} must be lowercase SHA-256')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"episode_date={value['episodeDate']}\n")
              out.write(f"failed_run_id={value['failedPreviewRunId']}\n")
              out.write(f"render_sha={value['expectedRenderSpecSha256']}\n")
              out.write(f"package_sha={value['expectedEpisodePackageSha256']}\n")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply three-beat visual-only correction
        id: patch
        shell: bash
        env:
          EPISODE_DATE: ${{ steps.request.outputs.episode_date }}
          EXPECTED_RENDER_SHA: ${{ steps.request.outputs.render_sha }}
          EXPECTED_PACKAGE_SHA: ${{ steps.request.outputs.package_sha }}
          FAILED_RUN_ID: ${{ steps.request.outputs.failed_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "preview-status/${EPISODE_DATE}"
          python3 <<'PY'
          import copy
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          date=os.environ['EPISODE_DATE']
          render_path=Path(f'render-specs/{date}/render_spec.json')
          package_path=Path(f'episode-packages/{date}/episode_package_{date}.md')
          ready_path=Path(f'render-specs/{date}/production_ready.json')
          receipt_path=Path(f'preview-status/{date}/post_tts_visual_diversity_patch.json')

          def sha_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          old_render_bytes=render_path.read_bytes()
          old_package_bytes=package_path.read_bytes()
          if sha_bytes(old_render_bytes)!=os.environ['EXPECTED_RENDER_SHA']:
              raise SystemExit('render_spec SHA drift; refusing patch')
          if sha_bytes(old_package_bytes)!=os.environ['EXPECTED_PACKAGE_SHA']:
              raise SystemExit('episode_package SHA drift; refusing patch')

          old_render=json.loads(old_render_bytes.decode('utf-8'))
          render=copy.deepcopy(old_render)

          target={
              'vb-01-02': {
                  'expected': ('hero-number','evidence','default','conclusion-card','hero-number'),
                  'new': ('source-receipt','evidence','receipt','news-media','source-receipt'),
              },
              'vb-04-02': {
                  'expected': ('text-focus','bridge-text','default','text-focus','evidence-boundary'),
                  'new': ('source-receipt','evidence','receipt','news-media','source-receipt'),
              },
              'vb-08-02': {
                  'expected': ('verification-checklist','verification','default','verification-points','verification-checklist'),
                  'new': ('evidence-boundary','evidence','confirmed-vs-unconfirmed','text-focus','evidence-boundary'),
              },
          }

          def grammar_id(beat):
              if isinstance(beat.get('visualGrammarId'), str):
                  return beat['visualGrammarId']
              vg=beat.get('visualGrammar')
              return vg.get('grammarId') if isinstance(vg,dict) else None

          def patch_render(value, *, strict_expected: bool):
              found=set()
              for scene in value['scenes']:
                  for beat in scene.get('visualBeats',[]):
                      bid=beat.get('beatId') or beat.get('visualBeatId')
                      if bid not in target:
                          continue
                      found.add(bid)
                      current=(beat.get('visualTemplate'),grammar_id(beat),beat.get('templateVariant'),beat.get('visualMode'),beat.get('contentType'))
                      expected=target[bid]['expected']
                      if strict_expected and current!=expected:
                          raise SystemExit(f'{bid} pre-patch contract drift: {current!r} != {expected!r}')
                      template,grammar,variant,mode,content_type=target[bid]['new']
                      beat['visualTemplate']=template
                      beat['templateVariant']=variant
                      if not isinstance(beat.get('templateConfig'),dict):
                          raise SystemExit(f'{bid} missing templateConfig')
                      beat['templateConfig']['variant']=variant
                      beat['visualMode']=mode
                      beat['contentType']=content_type
                      if 'visualGrammarId' in beat:
                          beat['visualGrammarId']=grammar
                      if isinstance(beat.get('visualGrammar'),dict):
                          beat['visualGrammar']['grammarId']=grammar
              if found!=set(target):
                  raise SystemExit(f'target beat mismatch: {sorted(found)}')

          patch_render(render, strict_expected=True)

          # Fail closed on any editorial, narration, captions, numbers, sources or object mutation.
          for key in ('editorial','publishing','review','pronunciations','voiceProfileId','sources','corrections'):
              if old_render.get(key)!=render.get(key):
                  raise SystemExit(f'forbidden root mutation: {key}')
          for old_scene,new_scene in zip(old_render['scenes'],render['scenes']):
              for key in ('headline','narrationChunks','cards','numbers','nodes','arrows','supportingTexts','uncertainty','evidenceSourceIds','assetPlacements','visualEvents'):
                  if old_scene.get(key)!=new_scene.get(key):
                      raise SystemExit(f'forbidden scene mutation: {old_scene["sceneId"]}.{key}')

          def tts_identity(value):
              blocks=[]
              for block_id,first,last in (('scenes-01-04',1,4),('scenes-05-09',5,9)):
                  speech=[]
                  for scene in value['scenes']:
                      n=scene.get('sceneNumber')
                      if isinstance(n,int) and first<=n<=last:
                          speech.extend(chunk['speechText'] for chunk in scene['narrationChunks'])
                  blocks.append({'id':block_id,'speechText':speech})
              payload={
                  'synthesisVersion':'gemini-two-block-v1',
                  'model':'gemini-3.1-flash-tts-preview',
                  'voice':'Charon',
                  'voiceProfileId':value.get('voiceProfileId'),
                  'pronunciations':value.get('pronunciations'),
                  'blocks':blocks,
              }
              encoded=json.dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
              return hashlib.sha256(encoded).hexdigest()

          old_tts=tts_identity(old_render)
          new_tts=tts_identity(render)
          if old_tts!=new_tts:
              raise SystemExit('TTS identity changed; refusing visual-only patch')

          new_render_text=json.dumps(render,ensure_ascii=False,indent=2,sort_keys=True)+'\n'
          render_path.write_text(new_render_text,encoding='utf-8')
          new_render_sha=sha_bytes(new_render_text.encode('utf-8'))

          md=old_package_bytes.decode('utf-8')
          summary_replacements=(
              ('- Scene 1｜寝ている間に何が起きた？｜opening-contradiction → hero-number','- Scene 1｜寝ている間に何が起きた？｜opening-contradiction → source-receipt'),
              ('- Scene 4｜採点表が変わった｜expected-actual-gap-flow → evidence-boundary','- Scene 4｜採点表が変わった｜expected-actual-gap-flow → source-receipt'),
              ('- Scene 8｜どこまで言える？｜verification-matrix → verification-checklist','- Scene 8｜どこまで言える？｜verification-matrix → evidence-boundary'),
          )
          for old,new in summary_replacements:
              if old not in md:
                  raise SystemExit(f'missing package summary marker: {old}')
              md=md.replace(old,new,1)

          def patch_human_block(text,marker,replacements):
              start=text.index(marker)
              next_idx=text.find('<!--VISUAL_BEAT:',start+len(marker))
              if next_idx<0:
                  next_idx=text.find('### 完成ナレーション',start)
              block=text[start:next_idx]
              for old,new in replacements:
                  if old not in block:
                      raise SystemExit(f'{marker}: missing {old}')
                  block=block.replace(old,new,1)
              return text[:start]+block+text[next_idx:]

          md=patch_human_block(md,'<!--VISUAL_BEAT:scene-01:vb-01-02-->',(
              ('  - Visual Template ID：hero-number','  - Visual Template ID：source-receipt'),
              ('  - Template Variant：default','  - Template Variant：receipt'),
          ))
          md=patch_human_block(md,'<!--VISUAL_BEAT:scene-04:vb-04-02-->',(
              ('  - Visual Grammar：bridge-text / continuation','  - Visual Grammar：evidence / continuation'),
              ('  - Visual Template ID：text-focus','  - Visual Template ID：source-receipt'),
              ('  - Template Variant：default','  - Template Variant：receipt'),
          ))
          md=patch_human_block(md,'<!--VISUAL_BEAT:scene-08:vb-08-02-->',(
              ('  - Visual Grammar：verification / continuation','  - Visual Grammar：evidence / continuation'),
              ('  - Visual Template ID：verification-checklist','  - Visual Template ID：evidence-boundary'),
              ('  - Template Variant：default','  - Template Variant：confirmed-vs-unconfirmed'),
          ))

          # Keep the Visual Grammar annex consistent with the changed grammar IDs.
          final_marker='<!--BEGIN_FINAL_PRODUCTION_SOURCE-->'
          marker_index=md.index(final_marker)
          pre=md[:marker_index]
          post=md[marker_index:]
          annex_pairs=(
              ('"visualBeatId": "vb-04-02",\n          "visualGrammar": {\n            "contractVersion": "1.0.0",\n            "grammarId": "bridge-text",',
               '"visualBeatId": "vb-04-02",\n          "visualGrammar": {\n            "contractVersion": "1.0.0",\n            "grammarId": "evidence",'),
              ('"visualBeatId": "vb-08-02",\n          "visualGrammar": {\n            "contractVersion": "1.0.0",\n            "grammarId": "verification",',
               '"visualBeatId": "vb-08-02",\n          "visualGrammar": {\n            "contractVersion": "1.0.0",\n            "grammarId": "evidence",'),
          )
          for old,new in annex_pairs:
              if pre.count(old)!=1:
                  raise SystemExit(f'visual grammar annex marker count drift: {pre.count(old)}')
              pre=pre.replace(old,new,1)
          md=pre+post

          # Patch only the nested render_spec in FINAL_PRODUCTION_SOURCE.
          start=md.index(final_marker)
          json_start=md.index('```json',start)+len('```json')
          json_end=md.index('```',json_start)
          production_source=json.loads(md[json_start:json_end].strip())
          nested=production_source.get('render_spec')
          if not isinstance(nested,dict):
              raise SystemExit('FINAL_PRODUCTION_SOURCE.render_spec missing')
          patch_render(nested, strict_expected=False)
          replacement='\n'+json.dumps(production_source,ensure_ascii=False,indent=2)+'\n'
          md=md[:json_start]+replacement+md[json_end:]

          # Cross-check modified visual contract fields in human package, nested source and canonical render.
          expected_human={
              'vb-01-02':('source-receipt','receipt','evidence'),
              'vb-04-02':('source-receipt','receipt','evidence'),
              'vb-08-02':('evidence-boundary','confirmed-vs-unconfirmed','evidence'),
          }
          for bid,(template,variant,grammar) in expected_human.items():
              marker=f'<!--VISUAL_BEAT:scene-{bid[3:5]}:{bid}-->'
              if marker not in md:
                  raise SystemExit(f'human beat marker missing: {bid}')
              block=md[md.index(marker):]
              nxt=block.find('<!--VISUAL_BEAT:',len(marker))
              if nxt>=0: block=block[:nxt]
              if f'Visual Template ID：{template}' not in block or f'Template Variant：{variant}' not in block or f'Visual Grammar：{grammar} /' not in block:
                  raise SystemExit(f'human visual contract mismatch: {bid}')

          package_path.write_text(md,encoding='utf-8')
          new_package_sha=sha_bytes(md.encode('utf-8'))

          receipt={
              'contractVersion':'1.0.0',
              'status':'patched-awaiting-validator',
              'episodeDate':date,
              'failedPreviewRunId':int(os.environ['FAILED_RUN_ID']),
              'reasonCodes':[
                  'VG_SAME_APPEARANCE_RUN_TOO_LONG',
                  'VG_NON_ANALYSIS_DURATION_TOO_LOW',
                  'VG_BRIDGE_TEXT_OVERUSED',
              ],
              'changedBeatIds':['vb-01-02','vb-04-02','vb-08-02'],
              'narrationChanged':False,
              'captionChanged':False,
              'editorialChanged':False,
              'numbersChanged':False,
              'sourcesChanged':False,
              'ttsIdentityUnchanged':True,
              'ttsInputSha256':new_tts,
              'oldRenderSpecSha256':os.environ['EXPECTED_RENDER_SHA'],
              'newRenderSpecSha256':new_render_sha,
              'oldEpisodePackageSha256':os.environ['EXPECTED_PACKAGE_SHA'],
              'newEpisodePackageSha256':new_package_sha,
          }
          receipt_path.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if ready_path.exists():
              ready_path.unlink()
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'new_render_sha={new_render_sha}\n')
              out.write(f'new_package_sha={new_package_sha}\n')
              out.write(f'tts_sha={new_tts}\n')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Run formal render-spec validator
        run: npm run episode:spec:validate -- "render-specs/${{ steps.request.outputs.episode_date }}/render_spec.json"

      - name: Run visual contract regressions
        run: |
          npm run test:visual-variety
          npm run test:visual-templates
          npm run test:visual-validator

      - name: Recreate production readiness from validated bytes
        run: npm run episode:spec:ready -- "${{ steps.request.outputs.episode_date }}" --consistency-pass

      - name: Verify readiness hashes and finalize patch receipt
        shell: bash
        env:
          EPISODE_DATE: ${{ steps.request.outputs.episode_date }}
          EXPECTED_NEW_RENDER_SHA: ${{ steps.patch.outputs.new_render_sha }}
          EXPECTED_NEW_PACKAGE_SHA: ${{ steps.patch.outputs.new_package_sha }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          from pathlib import Path
          date=os.environ['EPISODE_DATE']
          ready_path=Path(f'render-specs/{date}/production_ready.json')
          receipt_path=Path(f'preview-status/{date}/post_tts_visual_diversity_patch.json')
          ready=json.loads(ready_path.read_text(encoding='utf-8'))
          if ready.get('validatorStatus')!='pass' or ready.get('consistencyStatus')!='pass' or ready.get('unresolvedStateCount')!=0:
              raise SystemExit('production_ready contract did not pass')
          if ready.get('renderSpecSha256')!=os.environ['EXPECTED_NEW_RENDER_SHA']:
              raise SystemExit('production_ready render SHA mismatch')
          if ready.get('episodePackageSha256')!=os.environ['EXPECTED_NEW_PACKAGE_SHA']:
              raise SystemExit('production_ready package SHA mismatch')
          receipt=json.loads(receipt_path.read_text(encoding='utf-8'))
          receipt['status']='validated-ready'
          receipt['validatorStatus']='pass'
          receipt['consistencyStatus']='pass'
          receipt['unresolvedStateCount']=0
          receipt_path.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit only patched production inputs, readiness and audit receipt
        shell: bash
        env:
          EPISODE_DATE: ${{ steps.request.outputs.episode_date }}
        run: |
          set -euo pipefail
          PACKAGE="episode-packages/${EPISODE_DATE}/episode_package_${EPISODE_DATE}.md"
          RENDER="render-specs/${EPISODE_DATE}/render_spec.json"
          READY="render-specs/${EPISODE_DATE}/production_ready.json"
          RECEIPT="preview-status/${EPISODE_DATE}/post_tts_visual_diversity_patch.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PACKAGE" "$RENDER" "$READY" "$RECEIPT"
          git diff --cached --quiet && { echo "::error::No patch changes staged"; exit 1; }
          git commit -m "fix: measured visual diversity for ${EPISODE_DATE} preview"
          git push origin HEAD:main
