name: ChatGPT Issue Preview Dispatch

on:
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: github.event.issue.title == 'RUN NASDAQ CAFE PREVIEW 2026-07-31 f94a1657'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch scheduled gate
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          BODY='{"ref":"main","inputs":{"episode_date_override":"2026-07-31"}}'
          RESPONSE="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nasdaq-cafe-scheduled-preview.yml/dispatches" \
            --input - <<<"$BODY")"
          RUN_ID="$(jq -r '.workflow_run_id // empty' <<<"$RESPONSE")"
          RUN_URL="$(jq -r '.html_url // empty' <<<"$RESPONSE")"
          test "$RUN_ID" != ""
          gh issue comment "$ISSUE_NUMBER" --body "Scheduled gate dispatched.\n\n- Gate run ID: \`${RUN_ID}\`\n- Gate URL: ${RUN_URL}\n- Render spec SHA-256: \`f94a16574d44611efb23e0596274db1cb5f7b2c6b2d5f663dd76042026a2524c\`"
