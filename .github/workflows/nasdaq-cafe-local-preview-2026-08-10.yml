name: Nasdaq Cafe Local Pinned Preview 2026-08-10

on:
  push:
    branches:
      - preview-local-2026-08-10-63f18c1b
    paths:
      - ".github/workflows/nasdaq-cafe-local-preview-2026-08-10.yml"
      - "local-preview-input/2026-08-10/render_spec.json.gz.b64"

permissions:
  contents: read

concurrency:
  group: nasdaq-cafe-local-preview-2026-08-10
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CI: "true"
      EPISODE_DATE: "2026-08-10"
      PINNED_RENDERER_COMMIT: "36440cbe84331d020d4fe808d5c2fcbcac20833c"
      EXPECTED_RENDER_SPEC_SHA256: "63f18c1ba5c0c0118b6f8ff68345a1b1c21f06f0d87844869248e64b9768cceb"
      EXPECTED_GZIP_SHA256: "4a3b1bdbefae32eb8cb566556053fedf8735b1498424e378286a241caa7f907b"
      EXPECTED_BUNDLE_ID: "769381030ae490370d9660a0f645057706d267ea4ac7dfca349c5a2cbedeead2"
      EXPECTED_MANIFEST_SHA256: "f35af8dd4320f8f7713ccc6012a0b51ce862727b78e93bad7063dd1e8afe7098"
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"

    steps:
      - name: Checkout local pinned Preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned Renderer ancestry and Preview-only diff
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${PINNED_RENDERER_COMMIT}^{commit}"
          git merge-base --is-ancestor "$PINNED_RENDERER_COMMIT" HEAD || {
            echo "::error::Preview branch is not based on the pinned Renderer commit"
            exit 1
          }
          mapfile -t CHANGED < <(git diff --name-only "${PINNED_RENDERER_COMMIT}..HEAD")
          printf 'Preview branch changed files:\n%s\n' "${CHANGED[*]}"
          for path in "${CHANGED[@]}"; do
            case "$path" in
              local-preview-input/2026-08-10/render_spec.json.gz.b64|.github/workflows/nasdaq-cafe-local-preview-2026-08-10.yml)
                ;;
              *)
                echo "::error::Unexpected non-Preview change relative to pinned Renderer: $path"
                exit 1
                ;;
            esac
          done
          test "${#CHANGED[@]}" -eq 2 || {
            echo "::error::Expected exactly the Preview input and workflow to differ from pinned Renderer"
            exit 1
          }

      - name: Restore exact handoff render spec and verify SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "render-specs/$EPISODE_DATE" build/local-preview
          base64 --decode "local-preview-input/$EPISODE_DATE/render_spec.json.gz.b64" > build/local-preview/render_spec.json.gz
          ACTUAL_GZIP_SHA="$(sha256sum build/local-preview/render_spec.json.gz | awk '{print $1}')"
          [[ "$ACTUAL_GZIP_SHA" == "$EXPECTED_GZIP_SHA256" ]] || {
            echo "::error::Compressed handoff payload SHA mismatch"
            echo "::error::expected=$EXPECTED_GZIP_SHA256 actual=$ACTUAL_GZIP_SHA"
            exit 1
          }
          gzip --decompress --stdout build/local-preview/render_spec.json.gz > "render-specs/$EPISODE_DATE/render_spec.json"
          ACTUAL_SPEC_SHA="$(sha256sum "render-specs/$EPISODE_DATE/render_spec.json" | awk '{print $1}')"
          [[ "$ACTUAL_SPEC_SHA" == "$EXPECTED_RENDER_SPEC_SHA256" ]] || {
            echo "::error::Restored render spec SHA mismatch"
            echo "::error::expected=$EXPECTED_RENDER_SPEC_SHA256 actual=$ACTUAL_SPEC_SHA"
            exit 1
          }
          jq -e --arg d "$EPISODE_DATE" '.episode.targetDate == $d' "render-specs/$EPISODE_DATE/render_spec.json" >/dev/null
          jq -e '.schemaVersion == "2.4.0"' "render-specs/$EPISODE_DATE/render_spec.json" >/dev/null
          cat > build/local-preview/transport_receipt.json <<JSON
          {
            "status": "pass",
            "mode": "preview",
            "episodeDate": "$EPISODE_DATE",
            "pinnedRendererCommit": "$PINNED_RENDERER_COMMIT",
            "renderSpecSha256": "$ACTUAL_SPEC_SHA",
            "bundleId": "$EXPECTED_BUNDLE_ID",
            "handoffManifestSha256": "$EXPECTED_MANIFEST_SHA256",
            "finalAuthorized": false
          }
          JSON

      - name: Require Gemini Preview keys
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY_1" || { echo "::error::GEMINI_API_KEY_1 is required"; exit 1; }
          test -n "$GEMINI_API_KEY_2" || { echo "::error::GEMINI_API_KEY_2 is required"; exit 1; }
          test -n "$GEMINI_API_KEY_3" || { echo "::error::GEMINI_API_KEY_3 is required"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate exact render spec
        run: npm run episode:spec:validate -- "render-specs/$EPISODE_DATE/render_spec.json"

      - name: Run deterministic runtime stability tests
        run: npm run test:runtime-stability

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Prepare TTS cache directory
        run: mkdir -p .cache/spec-tts-blocks

      - name: Generate Preview only
        run: npm run episode:spec:preview -- "render-specs/$EPISODE_DATE/render_spec.json"

      - name: Inspect rendered Preview
        run: npm run episode:spec:inspect:preview -- "render-specs/$EPISODE_DATE/render_spec.json"

      - name: Verify Preview deliverable
        id: delivery
        shell: bash
        run: |
          set -euo pipefail
          MP4="renders/preview/${EPISODE_DATE}_nasdaq-cafe-spec-preview.mp4"
          REPORT="build/${EPISODE_DATE}/technical_report.json"
          RENDER_DATA="build/${EPISODE_DATE}/render_data.production.json"
          TIMING="build/${EPISODE_DATE}/visual_grammar_timing_report.json"
          test -s "$MP4"
          test -s "$REPORT"
          test -s "$RENDER_DATA"
          test -s "$TIMING"
          jq -e '.status == "pass"' "$REPORT" >/dev/null
          SPEC_SHA="$(sha256sum "render-specs/$EPISODE_DATE/render_spec.json" | awk '{print $1}')"
          [[ "$SPEC_SHA" == "$EXPECTED_RENDER_SPEC_SHA256" ]]
          MP4_SHA="$(sha256sum "$MP4" | awk '{print $1}')"
          MP4_BYTES="$(stat -c '%s' "$MP4")"
          mkdir -p build/local-preview
          cat > build/local-preview/delivery_manifest.json <<JSON
          {
            "status": "pass",
            "mode": "preview",
            "episodeDate": "$EPISODE_DATE",
            "renderSpecSha256": "$SPEC_SHA",
            "previewMp4": "$MP4",
            "previewMp4Sha256": "$MP4_SHA",
            "previewMp4Bytes": $MP4_BYTES,
            "pinnedRendererCommit": "$PINNED_RENDERER_COMMIT",
            "bundleId": "$EXPECTED_BUNDLE_ID",
            "handoffManifestSha256": "$EXPECTED_MANIFEST_SHA256",
            "finalAuthorized": false
          }
          JSON
          cat build/local-preview/delivery_manifest.json

      - name: Upload verified Preview Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasdaq-cafe-local-preview-2026-08-10-${{ github.run_id }}
          path: |
            renders/preview/
            build/2026-08-10/technical_report.json
            build/2026-08-10/render_data.production.json
            build/2026-08-10/visual_grammar_timing_report.json
            build/local-preview/transport_receipt.json
            build/local-preview/delivery_manifest.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
