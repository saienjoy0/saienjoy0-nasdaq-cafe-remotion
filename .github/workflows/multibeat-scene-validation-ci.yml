name: Multi-Beat Scene Validation

on:
  pull_request:
    paths:
      - "src/spec/validate-render-spec-multibeat.ts"
      - "scripts/load-render-spec.ts"
      - "scripts/test-multibeat-scene-validation.ts"
      - ".github/workflows/multibeat-scene-validation-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Multi-Beat E/A/G ownership regression
        run: node --import tsx scripts/test-multibeat-scene-validation.ts
      - name: Typecheck
        run: npm run typecheck
