name: Nasdaq Cafe Post-TTS Authoring Repair With Events V2

on:
  push:
    branches: [main]
    paths:
      - "post-tts-authoring-repair-with-events-v2-requests/*.json"

permissions:
  contents: write

concurrency:
  group: nasdaq-cafe-post-tts-authoring-repair-with-events-v2
  cancel-in-progress: false

jobs:
  repair:
    name: Apply and validate explicit post-TTS authoring repair with events
    if: github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Resolve exactly one repair request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only "$BEFORE_SHA" "$TRIGGER_SHA" -- 'post-tts-authoring-repair-with-events-v2-requests/*.json')
          test "${#CHANGED[@]}" = 1 || { echo "::error::Exactly one repair request must change"; exit 1; }
          REQUEST_PATH="${CHANGED[0]}"
          EPISODE_DATE="$(python3 - "$REQUEST_PATH" <<'PY'
          import json,re,sys
          from pathlib import Path
          v=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if v.get('contractVersion')!='1.0.0': raise SystemExit('bad contractVersion')
          if v.get('confirmation')!='APPLY_POST_TTS_AUTHORING_REPAIR_WITH_EVENT_COPIES': raise SystemExit('bad confirmation')
          d=v.get('episodeDate')
          if not isinstance(d,str) or not re.fullmatch(r'\d{4}-\d{2}-\d{2}',d): raise SystemExit('bad episodeDate')
          print(d)
          PY
          )"
          echo "request_path=$REQUEST_PATH" >> "$GITHUB_OUTPUT"
          echo "episode_date=$EPISODE_DATE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply exact authored chunk and beat repair
        shell: bash
        run: |
          set -euo pipefail
          DATE='${{ steps.request.outputs.episode_date }}'
          REQUEST='${{ steps.request.outputs.request_path }}'
          mkdir -p "preview-status/$DATE"
          python3 - "$REQUEST" /tmp/base-authoring-request.json <<'PY'
          import json,sys
          from pathlib import Path
          v=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          v['confirmation']='APPLY_POST_TTS_AUTHORING_REPAIR'
          Path(sys.argv[2]).write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 scripts/apply-post-tts-authoring-repair.py \
            --repo-root . \
            --request /tmp/base-authoring-request.json \
            --output "preview-status/$DATE/post_tts_authoring_repair.json"

      - name: Apply exact authored show-event copies
        shell: bash
        run: |
          set -euo pipefail
          DATE='${{ steps.request.outputs.episode_date }}'
          python3 scripts/apply-post-tts-event-copies.py \
            --repo-root . \
            --request '${{ steps.request.outputs.request_path }}' \
            --output "preview-status/$DATE/post_tts_event_copies.json"

      - name: Run formal render-spec validator
        env:
          NASDAQ_CAFE_RUNTIME_ASSET_REGISTRY: runtime-assets/${{ steps.request.outputs.episode_date }}/runtime_asset_registry.json
          EPISODE_ID: ${{ steps.request.outputs.episode_date }}
        run: npm run episode:spec:validate -- "render-specs/${{ steps.request.outputs.episode_date }}/render_spec.json"

      - name: Run static Visual Story regressions
        env:
          NASDAQ_CAFE_RUNTIME_ASSET_REGISTRY: runtime-assets/${{ steps.request.outputs.episode_date }}/runtime_asset_registry.json
          EPISODE_ID: ${{ steps.request.outputs.episode_date }}
        run: |
          npm run test:visual-variety
          npm run test:visual-templates
          npm run test:visual-validator

      - name: Mark audit receipts validated
        shell: bash
        run: |
          set -euo pipefail
          DATE='${{ steps.request.outputs.episode_date }}'
          python3 - "$DATE" <<'PY'
          import json,sys
          from pathlib import Path
          date=sys.argv[1]
          for name in ('post_tts_authoring_repair.json','post_tts_event_copies.json'):
              p=Path(f'preview-status/{date}/{name}')
              v=json.loads(p.read_text(encoding='utf-8'))
              v['status']='validated-awaiting-owner-readiness'
              v['formalValidator']='pass'
              v['staticVisualRegressions']='pass'
              v['productionReadyCreated']=False
              p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit only validated authoring repair
        shell: bash
        run: |
          set -euo pipefail
          DATE='${{ steps.request.outputs.episode_date }}'
          PACKAGE="episode-packages/${DATE}/episode_package_${DATE}.md"
          SPEC="render-specs/${DATE}/render_spec.json"
          READY="render-specs/${DATE}/production_ready.json"
          R1="preview-status/${DATE}/post_tts_authoring_repair.json"
          R2="preview-status/${DATE}/post_tts_event_copies.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PACKAGE" "$SPEC" "$R1" "$R2"
          if [[ ! -e "$READY" ]]; then git add -u -- "$READY" 2>/dev/null || true; fi
          git diff --cached --quiet && { echo "::error::No validated repair changes staged"; exit 1; }
          git commit -m "fix: post-TTS visual rhythm for ${DATE} preview"
          git pull --rebase origin main
          git push origin HEAD:main
