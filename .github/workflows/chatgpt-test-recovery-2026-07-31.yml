name: ChatGPT Test Recovery 2026-07-31

on:
  push:
    branches:
      - test-ingest-2026-07-31
    paths:
      - ".chatgpt-ingest/2026-07-31/recovery-trigger.txt"

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: chatgpt-test-recovery-2026-07-31
  cancel-in-progress: true

jobs:
  redispatch-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch scheduled gate for current revised input
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY='{"ref":"main","inputs":{"episode_date_override":"2026-07-31"}}'
          RESPONSE="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nasdaq-cafe-scheduled-preview.yml/dispatches" \
            --input - <<<"$BODY")"
          RUN_ID="$(jq -r '.workflow_run_id // empty' <<<"$RESPONSE")"
          RUN_URL="$(jq -r '.html_url // empty' <<<"$RESPONSE")"
          test "$RUN_ID" != ""
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Report gate redispatch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          GATE_RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          gh issue create \
            --title "TEST RECOVERY GATE REDISPATCH 2026-07-31 run ${GATE_RUN_ID}" \
            --body "Gate redispatch for duplicate/active-run inspection: ${GATE_RUN_URL}"

      - name: Report gate redispatch failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "TEST RECOVERY GATE REDISPATCH 2026-07-31 FAILED ${GITHUB_RUN_ID}" \
            --body "Gate redispatch failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
