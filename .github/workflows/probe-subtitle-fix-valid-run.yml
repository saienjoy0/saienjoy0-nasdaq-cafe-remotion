name: Probe Running Subtitle Layout Fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-subtitle-fix-valid-run.yml"]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Record workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-status/2026-08-06
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow apply-subtitle-layout-fix-and-preview.yml --limit 1 --json databaseId | jq -r '.[0].databaseId // empty')"
          test -n "$RUN_ID"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs > preview-status/2026-08-06/subtitle_fix_valid_run.json
      - name: Commit and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-status/2026-08-06/subtitle_fix_valid_run.json
          git rm .github/workflows/probe-subtitle-fix-valid-run.yml
          git commit -m "Record running subtitle layout fix status"
          git pull --rebase origin main
          git push origin HEAD:main
