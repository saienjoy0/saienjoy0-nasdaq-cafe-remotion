name: Run Complete Template Contract Validation 2026-08-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-renderer-compat-2026-08-06-v7.yml"

permissions:
  contents: write

concurrency:
  group: apply-renderer-compat-2026-08-06-v7
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      READY_PATH: "render-specs/2026-08-06/production_ready.json"
      PACKAGE_PATH: "episode-packages/2026-08-06/episode_package_2026-08-06.md"
      REPORT_PATH: "preview-status/2026-08-06/normalization_report.json"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply all deterministic Renderer adapters
        run: |
          python3 scripts/normalize_nasdaq_cafe_2026_08_06.py \
            --spec "$SPEC_PATH" --package "$PACKAGE_PATH" \
            --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/adapt_nasdaq_cafe_2026_08_06_renderer.py \
            --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_template_contracts_2026_08_06.py \
            --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_reaction_timeline_2026_08_06.py \
            --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_sequence_policy_2026_08_06.py \
            --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
      - name: Run formal Renderer validator
        run: npm run episode:spec:validate -- "$SPEC_PATH"
      - name: Commit validated input
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_PATH" "$READY_PATH" "$REPORT_PATH"
          git rm --ignore-unmatch scripts/normalize_nasdaq_cafe_2026_08_06.py
          git rm --ignore-unmatch scripts/adapt_nasdaq_cafe_2026_08_06_renderer.py
          git rm --ignore-unmatch scripts/patch_template_contracts_2026_08_06.py
          git rm --ignore-unmatch scripts/patch_reaction_timeline_2026_08_06.py
          git rm --ignore-unmatch scripts/patch_sequence_policy_2026_08_06.py
          git rm --ignore-unmatch .github/workflows/apply-renderer-compat-2026-08-06-v2.yml
          git rm --ignore-unmatch .github/workflows/apply-renderer-compat-2026-08-06-v3.yml
          git rm --ignore-unmatch .github/workflows/apply-renderer-compat-2026-08-06-v4.yml
          git rm --ignore-unmatch .github/workflows/apply-renderer-compat-2026-08-06-v5.yml
          git rm --ignore-unmatch .github/workflows/apply-renderer-compat-2026-08-06-v6.yml
          git rm --ignore-unmatch .github/workflows/apply-renderer-compat-2026-08-06-v7.yml
          git rm --ignore-unmatch .github/workflows/apply-normalized-preview-2026-08-06.yml
          git rm --ignore-unmatch .github/workflows/normalize-and-render-preview-2026-08-06.yml
          git rm --ignore-unmatch .github/workflows/normalize-financial-and-render-preview-2026-08-06.yml
          git commit -m "Store formally validated Renderer input for 2026-08-06"
          git pull --rebase origin main
          git push origin HEAD:main
