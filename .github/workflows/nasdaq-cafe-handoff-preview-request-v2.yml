name: Nasdaq Cafe Handoff Preview Request V2

on:
  push:
    branches:
      - main
    paths:
      - "handoff-preview-requests-v2/*.json"

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: nasdaq-cafe-handoff-preview-request-v2
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout owner request
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Resolve exactly one request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only "$BEFORE_SHA" "$TRIGGER_SHA" -- 'handoff-preview-requests-v2/*.json')
          if [[ "${#CHANGED[@]}" -ne 1 ]]; then
            echo "::error::Exactly one V2 handoff preview request JSON must change"
            exit 1
          fi
          python3 - "${CHANGED[0]}" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          from urllib.parse import urlparse
          v=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          required={'contractVersion','episodeDate','plotRunId','handoffArtifactName','expectedBundleId','expectedManifestSha256','expectedRendererCommit','rendererRef','signedArtifactUrl','signedArtifactDigestSha256','confirmation'}
          if set(v)!=required: raise SystemExit(f'request fields mismatch: {sorted(v)}')
          if v['contractVersion']!='1.0.0': raise SystemExit('bad contractVersion')
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}',str(v['episodeDate'])): raise SystemExit('bad episodeDate')
          if not isinstance(v['plotRunId'],int) or isinstance(v['plotRunId'],bool) or v['plotRunId']<=0: raise SystemExit('bad plotRunId')
          if not re.fullmatch(r'[A-Za-z0-9._-]+',str(v['handoffArtifactName'])): raise SystemExit('unsafe handoffArtifactName')
          for key in ('expectedBundleId','expectedManifestSha256','signedArtifactDigestSha256'):
              if not re.fullmatch(r'[0-9a-f]{64}',str(v[key])): raise SystemExit(f'bad {key}')
          if not re.fullmatch(r'[0-9a-f]{40}',str(v['expectedRendererCommit'])): raise SystemExit('bad expectedRendererCommit')
          if not re.fullmatch(r'[A-Za-z0-9._/-]+',str(v['rendererRef'])): raise SystemExit('unsafe rendererRef')
          p=urlparse(str(v['signedArtifactUrl']))
          if p.scheme!='https' or not p.hostname or not p.hostname.endswith('.oaiusercontent.com'): raise SystemExit('unsafe signedArtifactUrl')
          if v['confirmation']!='PREVIEW': raise SystemExit('confirmation must be PREVIEW')
          mapping={'episode_date':'episodeDate','plot_run_id':'plotRunId','artifact_name':'handoffArtifactName','bundle_id':'expectedBundleId','manifest_sha':'expectedManifestSha256','renderer_commit':'expectedRendererCommit','renderer_ref':'rendererRef','signed_url':'signedArtifactUrl','signed_digest':'signedArtifactDigestSha256'}
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              for out_key,in_key in mapping.items(): out.write(f"{out_key}={v[in_key]}\n")
          PY

      - name: Dispatch official signed handoff Preview
        id: child
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_DATE: ${{ steps.request.outputs.episode_date }}
          PLOT_RUN_ID: ${{ steps.request.outputs.plot_run_id }}
          ARTIFACT_NAME: ${{ steps.request.outputs.artifact_name }}
          BUNDLE_ID: ${{ steps.request.outputs.bundle_id }}
          MANIFEST_SHA: ${{ steps.request.outputs.manifest_sha }}
          RENDERER_COMMIT: ${{ steps.request.outputs.renderer_commit }}
          RENDERER_REF: ${{ steps.request.outputs.renderer_ref }}
          SIGNED_URL: ${{ steps.request.outputs.signed_url }}
          SIGNED_DIGEST: ${{ steps.request.outputs.signed_digest }}
        run: |
          set -euo pipefail
          WORKFLOW=nasdaq-cafe-preview-handoff.yml
          PREVIOUS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$RENDERER_REF" \
            -f episode_date="$EPISODE_DATE" \
            -f plot_run_id="$PLOT_RUN_ID" \
            -f handoff_artifact_name="$ARTIFACT_NAME" \
            -f expected_bundle_id="$BUNDLE_ID" \
            -f expected_manifest_sha256="$MANIFEST_SHA" \
            -f expected_renderer_commit="$RENDERER_COMMIT" \
            -f signed_artifact_url="$SIGNED_URL" \
            -f signed_artifact_digest_sha256="$SIGNED_DIGEST" \
            -f confirmation=PREVIEW
          RUN_ID=""
          RUN_URL=""
          for _ in $(seq 1 60); do
            JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --limit 20 --json databaseId,url,headBranch --jq ". | map(select(.databaseId > $PREVIOUS and .headBranch == \"$RENDERER_REF\")) | sort_by(.databaseId) | first // {}")"
            RUN_ID="$(printf '%s' "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("databaseId", ""))')"
            RUN_URL="$(printf '%s' "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("url", ""))')"
            [[ -n "$RUN_ID" ]] && break
            sleep 2
          done
          [[ -n "$RUN_ID" ]] || { echo '::error::child handoff Preview run not found'; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          TITLE="NASDAQ CAFE HANDOFF PREVIEW REQUEST V2 $EPISODE_DATE"
          BODY="- Run ID: \`$RUN_ID\`
- Status: \`in_progress\`
- Conclusion: \`pending\`
- URL: $RUN_URL"
          N="$(gh issue list --state all --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"
          if [[ -n "$N" ]]; then gh issue edit "$N" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi

      - name: Wait for Preview
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.child.outputs.run_id }}
        run: |
          set +e
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          RC=$?
          set -e
          C="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // "unknown"')"
          echo "conclusion=$C" >> "$GITHUB_OUTPUT"
          echo "watch_rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Publish final Preview receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_DATE: ${{ steps.request.outputs.episode_date }}
          RUN_ID: ${{ steps.child.outputs.run_id }}
          RUN_URL: ${{ steps.child.outputs.run_url }}
          CONCLUSION: ${{ steps.wait.outputs.conclusion }}
        run: |
          set -euo pipefail
          C="${CONCLUSION:-failure}"
          TITLE="NASDAQ CAFE HANDOFF PREVIEW REQUEST V2 ${EPISODE_DATE:-unknown}"
          ARTIFACTS=""
          if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            ARTIFACTS="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" --jq '.artifacts[]?.name')"
          fi
          LINES="$(printf '%s\n' "$ARTIFACTS" | sed '/^$/d;s/^/- `/;s/$/`/')"
          [[ -n "$LINES" ]] || LINES="- none"
          BODY="- Run ID: \`${RUN_ID:-unknown}\`
- Status: \`completed\`
- Conclusion: \`$C\`
- URL: ${RUN_URL:-unknown}

Artifacts:
$LINES"
          N="$(gh issue list --state all --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"
          if [[ -n "$N" ]]; then gh issue edit "$N" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
          [[ "$C" == success ]] || exit 1
