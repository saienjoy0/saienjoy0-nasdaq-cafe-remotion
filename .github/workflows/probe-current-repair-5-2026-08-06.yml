name: Probe Current Repair 5 2026-08-06
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-current-repair-5-2026-08-06.yml"]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Record latest repair run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow apply-tailwind-headwind-fix-2026-08-06.yml --limit 1 --json databaseId | jq -r '.[0].databaseId // empty')"
          test "$RUN_ID" != ""
          mkdir -p preview-status/2026-08-06
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs > preview-status/2026-08-06/current_repair_probe_5.json
      - name: Commit probe and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-status/2026-08-06/current_repair_probe_5.json
          git rm .github/workflows/probe-current-repair-5-2026-08-06.yml
          git commit -m "Record fifth 2026-08-06 repair run"
          git pull --rebase origin main
          git push origin HEAD:main
