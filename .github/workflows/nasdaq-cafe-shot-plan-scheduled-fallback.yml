name: Nasdaq Cafe Shot Plan Scheduled Fallback

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nasdaq-cafe-shot-plan-apply
  cancel-in-progress: false

jobs:
  apply-pending-shot-plan:
    name: Apply one pending approved measured Shot plan
    if: github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Resolve newest pending approved request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path.cwd()
          output_path = pathlib.Path(os.environ["GITHUB_OUTPUT"])

          def sha256(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          selected = None
          for request_path in sorted((root / "shot-timing-requests").glob("*.json"), reverse=True):
              try:
                  value = json.loads(request_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"warning: skipping unreadable request {request_path}: {exc}")
                  continue
              episode_date = value.get("episodeDate")
              expected_sha = value.get("expectedSpecSha256")
              if not isinstance(episode_date, str) or not isinstance(expected_sha, str):
                  print(f"warning: skipping request with invalid identity: {request_path}")
                  continue
              spec_path = root / "render-specs" / episode_date / "render_spec.json"
              if spec_path.is_file() and sha256(spec_path) == expected_sha:
                  selected = request_path.relative_to(root).as_posix()
                  break

          with output_path.open("a", encoding="utf-8") as handle:
              if selected is None:
                  handle.write("should_apply=false\n")
                  handle.write("request_path=\n")
                  print("No pending measured Shot plan matches the current render_spec SHA")
              else:
                  handle.write("should_apply=true\n")
                  handle.write(f"request_path={selected}\n")
                  print(f"Selected pending measured Shot plan: {selected}")
          PY

      - name: Set up Node.js
        if: steps.request.outputs.should_apply == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        if: steps.request.outputs.should_apply == 'true'
        run: npm ci

      - name: Apply the approved Shot plan mechanically
        if: steps.request.outputs.should_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_measured_shot_plan.py
          python3 scripts/apply_measured_shot_plan.py "${{ steps.request.outputs.request_path }}"

      - name: Validate generated render input
        if: steps.request.outputs.should_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "${{ steps.request.outputs.request_path }}")"
          npm run episode:spec:validate -- "render-specs/${EPISODE_DATE}/render_spec.json"
          npm run test:shot-story
          git diff --check

      - name: Restrict generated changes
        if: steps.request.outputs.should_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "${{ steps.request.outputs.request_path }}")"
          mapfile -t CHANGED < <(git diff --name-only)
          EXPECTED=(
            "episode-packages/${EPISODE_DATE}/episode_package_${EPISODE_DATE}.md"
            "render-specs/${EPISODE_DATE}/render_spec.json"
            "shot-timing-reports/${EPISODE_DATE}.json"
          )
          if [[ "${#CHANGED[@]}" -ne 3 ]]; then
            printf '::error::Unexpected generated change: %s\n' "${CHANGED[@]}"
            exit 1
          fi
          for expected in "${EXPECTED[@]}"; do
            printf '%s\n' "${CHANGED[@]}" | grep -Fx -- "$expected" >/dev/null || {
              echo "::error::Missing expected generated file: $expected"
              exit 1
            }
          done

      - name: Confirm main did not advance
        if: steps.request.outputs.should_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced during Shot plan application; the next scheduled run will retry safely"
            exit 1
          fi

      - name: Commit generated Shot plan outputs
        if: steps.request.outputs.should_apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "${{ steps.request.outputs.request_path }}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "render-specs/${EPISODE_DATE}/render_spec.json" \
            "episode-packages/${EPISODE_DATE}/episode_package_${EPISODE_DATE}.md" \
            "shot-timing-reports/${EPISODE_DATE}.json"
          git commit -m "Apply measured Shot plan for ${EPISODE_DATE}"
          git push origin HEAD:main
