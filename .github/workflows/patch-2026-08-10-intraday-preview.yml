name: Patch 2026-08-10 intraday preview data

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-2026-08-10-intraday-preview.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Attach verified QQQ minute window to Scene 6
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          spec_path = Path("render-specs/2026-08-10/render_spec.json")
          series_path = Path("render-data/2026-08-10/qqq_1m_0820_0845.json")
          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          series = json.loads(series_path.read_text(encoding="utf-8"))
          scene = next(s for s in spec["scenes"] if s["sceneNumber"] == 6)
          beat = next(b for b in scene["visualBeats"] if b["beatId"] == "vb-06-01")
          reaction = beat["templateConfig"]["reactionTimeline"]
          if reaction["precision"] != "verified-intraday-series":
              raise SystemExit("Scene 6 Beat 1 is not verified-intraday-series")
          reaction["intradaySeries"] = series
          reaction["eventMarker"] = {
              "timestamp": "2026-08-07T12:30:00Z",
              "label": "BLS発表",
              "sourceLabel": "BLS 08:30 ET",
          }
          reaction["displayTimezone"] = "America/New_York"
          spec_path.write_text(json.dumps(spec, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"attached {len(series['points'])} verified bars to {beat['beatId']}")
          PY
      - name: Validate patched render spec with promoted runtime assets
        shell: bash
        env:
          EPISODE_ID: "2026-08-10"
        run: |
          set -euo pipefail
          node --import tsx --input-type=module <<'JS'
          import {loadRuntimeAssetContext} from './src/config/runtime-assets.ts';
          import {loadRenderSpec} from './scripts/load-render-spec.ts';
          const runtimeAssets = await loadRuntimeAssetContext();
          const loaded = await loadRenderSpec('render-specs/2026-08-10/render_spec.json', runtimeAssets.manifest);
          if (runtimeAssets.episodeDate !== '2026-08-10') throw new Error('runtime registry was not loaded');
          console.log(`PASS render_spec ${loaded.sha256} runtime bundle ${runtimeAssets.bundleId}`);
          JS
      - name: Record exact validated spec SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-status/2026-08-10
          sha256sum render-specs/2026-08-10/render_spec.json | awk '{print $1}' > preview-status/2026-08-10/intraday-preview-spec-sha.txt
      - name: Commit validated preview data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- render-specs/2026-08-10/render_spec.json preview-status/2026-08-10/intraday-preview-spec-sha.txt; then
            echo "already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- render-specs/2026-08-10/render_spec.json preview-status/2026-08-10/intraday-preview-spec-sha.txt
          git commit -m "Attach verified QQQ minute window to 2026-08-10 preview"
          git push origin HEAD:${{ github.head_ref }}
