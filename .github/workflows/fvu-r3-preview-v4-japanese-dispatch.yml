name: FVU R3 Preview V4 Japanese Dispatch

on:
  push:
    branches:
      - tech/fvu-r3-preview-v4-japanese-2099-02-02
    paths:
      - .github/workflows/fvu-r3-preview-v4-japanese-dispatch.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tech/fvu-r3-preview-v4-japanese-2099-02-02
          fetch-depth: 0

      - name: Materialize immutable Japanese input and remove dispatcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p render-specs/2099-02-02
          cp shared-fixtures/financial-visual-2.3/render_spec.json render-specs/2099-02-02/render_spec.json
          actual="$(sha256sum render-specs/2099-02-02/render_spec.json | awk '{print $1}')"
          expected="60b1c610a0ae2d57f9dc0d426104a1429efc83a1fcc7195e8d837f9242bc7ee5"
          test "$actual" = "$expected"
          python3 <<'PY'
          from pathlib import Path
          text = Path("render-specs/2099-02-02/render_spec.json").read_text(encoding="utf-8")
          for required in ["市場予想", "実績", "上振れ幅", "億ドル", "AWS売上高の上振れ幅"]:
              if required not in text:
                  raise SystemExit(f"missing Japanese preview text: {required}")
          for forbidden in ["EXPECTED", "ACTUAL", "billion USD", "AWS revenue gap"]:
              if forbidden in text:
                  raise SystemExit(f"legacy English preview text remains: {forbidden}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fvu-r3-preview-v4-japanese-dispatch.yml
          git add -- render-specs/2099-02-02/render_spec.json
          git commit -m "Prepare Japanese FVU-R3 technical preview input"
          git push origin HEAD:tech/fvu-r3-preview-v4-japanese-2099-02-02

      - name: Dispatch standard Preview and record run ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: tech/fvu-r3-preview-v4-japanese-2099-02-02
        run: |
          set -euo pipefail
          gh workflow run nasdaq-cafe-preview.yml \
            --ref "$BRANCH" \
            -f episode_date=2099-02-02 \
            -f expected_spec_sha256=60b1c610a0ae2d57f9dc0d426104a1429efc83a1fcc7195e8d837f9242bc7ee5 \
            -f confirmation=PREVIEW

          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow nasdaq-cafe-preview.yml \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headBranch,createdAt \
              --jq '.[0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::standard Preview run ID was not found"
            exit 1
          fi
          printf '%s\n' "$run_id" > technical-preview-run-id.txt
          git add -- technical-preview-run-id.txt
          git commit -m "Record Japanese technical preview run ID"
          git push origin HEAD:tech/fvu-r3-preview-v4-japanese-2099-02-02
          echo "run_id=$run_id" >> "$GITHUB_STEP_SUMMARY"
