name: Story Engine Handoff Preview

on:
  pull_request:
    paths:
      - "handoff-inbox/2026-08-06/render_spec.json.gz.b64"
      - ".github/workflows/handoff-story-engine-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-engine-handoff-preview-2026-08-06
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "true"
      EPISODE_ID: "2026-08-06"
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      INBOX_PATH: "handoff-inbox/2026-08-06/render_spec.json.gz.b64"
      EXPECTED_SPEC_SHA256: "0b104b5964285842062e032144858c7f38beeecaabad584524789342886e8d82"
      TTS_PROVIDER: gemini
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Restore exact immutable handoff spec
        shell: bash
        run: |
          set -euo pipefail
          test -s "$INBOX_PATH"
          mkdir -p "$(dirname "$SPEC_PATH")"
          base64 --decode "$INBOX_PATH" | gzip -dc > "$SPEC_PATH.story-engine.tmp"
          ACTUAL_SHA="$(sha256sum "$SPEC_PATH.story-engine.tmp" | awk '{print $1}')"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SPEC_SHA256" ]]; then
            echo "::error::immutable handoff SHA mismatch"
            echo "::error::expected=$EXPECTED_SPEC_SHA256"
            echo "::error::actual=$ACTUAL_SHA"
            exit 1
          fi
          mv "$SPEC_PATH.story-engine.tmp" "$SPEC_PATH"
          echo "Exact Story Engine handoff restored: $ACTUAL_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate exact handoff render spec
        run: npm run episode:spec:validate -- "$SPEC_PATH"

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Run runtime stability tests
        run: npm run test:runtime-stability

      - name: Generate preview only
        run: npm run episode:spec:preview -- "$SPEC_PATH"

      - name: Verify preview outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "renders/preview/${EPISODE_ID}_nasdaq-cafe-spec-preview.mp4"
          test -s "build/${EPISODE_ID}/technical_report.json"
          test -s "build/${EPISODE_ID}/render_data.production.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          episode = "2026-08-06"
          report = json.loads(Path(f"build/{episode}/technical_report.json").read_text(encoding="utf-8"))
          if report.get("status") not in {"pass", "passed", "success", "ok"}:
              # Older reports may not have a top-level status; presence + valid JSON is still required.
              print("technical report top-level status:", report.get("status"))
          print("technical report verified")
          PY

      - name: Upload Story Engine preview
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-story-engine-preview-${{ env.EPISODE_ID }}-${{ github.run_id }}
          path: |
            renders/preview/${{ env.EPISODE_ID }}_nasdaq-cafe-spec-preview.mp4
            build/${{ env.EPISODE_ID }}/technical_report.json
            build/${{ env.EPISODE_ID }}/render_data.production.json
            public/spec-audio/${{ env.EPISODE_ID }}/tts-block-state.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
