name: Story Engine Handoff Metadata Check

on:
  pull_request:
    paths:
      - "handoff-inbox/2026-08-06/render_spec.json.gz.b64"
      - ".github/workflows/handoff-story-engine-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-handoff-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact immutable handoff payload only
        shell: bash
        env:
          INBOX_PATH: handoff-inbox/2026-08-06/render_spec.json.gz.b64
          EXPECTED_SPEC_SHA256: 0b104b5964285842062e032144858c7f38beeecaabad584524789342886e8d82
        run: |
          set -euo pipefail
          test -s "$INBOX_PATH"
          base64 --decode "$INBOX_PATH" | gzip -dc > /tmp/story-engine-render-spec.json
          ACTUAL_SHA="$(sha256sum /tmp/story-engine-render-spec.json | awk '{print $1}')"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SPEC_SHA256" ]]; then
            echo "::error::immutable handoff SHA mismatch"
            exit 1
          fi
          echo "Immutable handoff bytes verified: $ACTUAL_SHA"
