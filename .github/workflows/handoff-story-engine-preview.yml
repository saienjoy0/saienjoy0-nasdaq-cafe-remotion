name: Story Engine Handoff Metadata Check

on:
  pull_request:
    paths:
      - "handoff-inbox/2026-08-06/parts-v2/*.b64"
      - "scripts/restore-story-engine-handoff-spec.sh"
      - ".github/workflows/handoff-story-engine-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-handoff-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact immutable handoff payload only
        shell: bash
        env:
          PARTS_DIR: handoff-inbox/2026-08-06/parts-v2
          EXPECTED_SPEC_SHA256: a6a7f45031c703250ee71510b4ed1d7f20bd1ae6ad6f80c932305994097af711
        run: |
          set -euo pipefail
          shopt -s nullglob
          PARTS=("$PARTS_DIR"/[0-9][0-9].b64)
          shopt -u nullglob
          if [[ "${#PARTS[@]}" -ne 9 ]]; then
            echo "::error::expected exactly 9 immutable handoff payload parts"
            exit 1
          fi
          cat > /tmp/expected-parts.sha256 <<'EOF'
          bdd1628e5f7549140be014bada76d428dfffe8dd9d7e8a858d690d70f5bcf74e  handoff-inbox/2026-08-06/parts-v2/00.b64
          08933b8242742b583428d1d6e6dc64bac767e29da96d5572a694e51d2d09d170  handoff-inbox/2026-08-06/parts-v2/01.b64
          fe0bb32e09fb1aeffad027ffffcd95ec1d6cc95707342680b1b5e9e1d90d9c9a  handoff-inbox/2026-08-06/parts-v2/02.b64
          ef08c074b3aba2cae7e9c41e1d23a05e199295edfa0dcdcfc8901b3319eba077  handoff-inbox/2026-08-06/parts-v2/03.b64
          be379e0c6b462447ea4262db77b3c37a5639654c8d92ea445663a468426e3d82  handoff-inbox/2026-08-06/parts-v2/04.b64
          2bac9a9b89a7e9bca0bc15f86a92a388eb9ceb4b32165451c0f4c76933b459dd  handoff-inbox/2026-08-06/parts-v2/05.b64
          183bd9c7cfe7afd438103228e77b2a64d4a46f444051e17ba1dcf06102cc2a41  handoff-inbox/2026-08-06/parts-v2/06.b64
          96441adf3a6636e82381f95bcfcbf4a6eadfe92aab29107fc00ba58272aadc85  handoff-inbox/2026-08-06/parts-v2/07.b64
          0e0a7e75d7d92ea141b9247435a7369d25adbd5dc852e9f862274c4e0648a5c2  handoff-inbox/2026-08-06/parts-v2/08.b64
          EOF
          echo "Actual part sizes and SHA-256:"
          wc -c "${PARTS[@]}"
          sha256sum "${PARTS[@]}"
          sha256sum -c /tmp/expected-parts.sha256
          cat "${PARTS[@]}" | base64 --decode | gzip -dc > /tmp/story-engine-render-spec.json
          ACTUAL_SHA="$(sha256sum /tmp/story-engine-render-spec.json | awk '{print $1}')"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SPEC_SHA256" ]]; then
            echo "::error::immutable handoff SHA mismatch"
            echo "::error::expected=$EXPECTED_SPEC_SHA256"
            echo "::error::actual=$ACTUAL_SHA"
            exit 1
          fi
          echo "Immutable handoff bytes verified: $ACTUAL_SHA"
      - name: Upload checked payload parts for byte diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-engine-handoff-v2-parts-${{ github.run_id }}
          path: handoff-inbox/2026-08-06/parts-v2/
          if-no-files-found: error
          retention-days: 1
