name: One-time 2026-07-31 Visual Story Assignment

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - ".github/workflows/visual-story-apply-2026-07-31.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[apply-2026-07-31-visual-story]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/visual-story-engine-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assign final templates
        run: node --import tsx scripts/migrations/assign-2026-07-31-visual-story-templates.ts render-specs/2026-07-31/render_spec.json

      - name: Regenerate schema
        run: npm run episode:spec:schema

      - name: Sync episode package
        run: node --import tsx scripts/sync-episode-visual-story.ts --write render-specs/2026-07-31/render_spec.json episode-packages/2026-07-31/episode_package_2026-07-31.md

      - name: Commit deterministic outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render-specs/2026-07-31/render_spec.json schemas/render_spec.schema.json episode-packages/2026-07-31/episode_package_2026-07-31.md
          git commit -m "[apply-2026-07-31-visual-story] Assign hero, split, matrix, and final templates"
          git push origin HEAD:feature/visual-story-engine-v2
