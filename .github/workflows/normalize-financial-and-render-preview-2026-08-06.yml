name: Complete Nasdaq Cafe Renderer 2.4 Preview 2026-08-06

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-financial-and-render-preview-2026-08-06.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: complete-renderer-preview-2026-08-06
  cancel-in-progress: false

jobs:
  normalize-validate-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      EPISODE_DATE: "2026-08-06"
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      READY_PATH: "render-specs/2026-08-06/production_ready.json"
      PACKAGE_PATH: "episode-packages/2026-08-06/episode_package_2026-08-06.md"
      RENDERER_COMPATIBILITY_SHA256: "563bc71c58120552c3f601cab662a4f4287e44c149e46268ef5678d279b1adb6"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize Plot payload and bind Financial Visual traces
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SPEC_PATH"
          test -s "$READY_PATH"
          test -s "$PACKAGE_PATH"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          spec_path = Path(os.environ["SPEC_PATH"])
          ready_path = Path(os.environ["READY_PATH"])
          package_path = Path(os.environ["PACKAGE_PATH"])
          compatibility_sha = os.environ["RENDERER_COMPATIBILITY_SHA256"]
          original_raw = spec_path.read_bytes()
          spec = json.loads(original_raw.decode("utf-8"))
          if spec.get("schemaVersion") != "2.4.0":
              raise SystemExit("expected Plot render_spec schemaVersion 2.4.0")

          def canonical_sha(value):
              return hashlib.sha256(json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")).hexdigest()

          def tts_identity(value):
              blocks = []
              for block_id, first_scene, last_scene in (
                  ("scenes-01-04", 1, 4),
                  ("scenes-05-09", 5, 9),
              ):
                  speech = [
                      chunk["speechText"]
                      for scene in value["scenes"]
                      if first_scene <= scene["sceneNumber"] <= last_scene
                      for chunk in scene["narrationChunks"]
                  ]
                  if not speech:
                      raise SystemExit(f"TTS block {block_id} has no speechText")
                  blocks.append({"id": block_id, "speechText": speech})
              return canonical_sha({
                  "synthesisVersion": "gemini-two-block-v1",
                  "model": "gemini-3.1-flash-tts-preview",
                  "voice": "Charon",
                  "voiceProfileId": value.get("voiceProfileId"),
                  "pronunciations": value.get("pronunciations"),
                  "blocks": blocks,
              })

          before_tts_sha = tts_identity(spec)
          original_spec_sha = hashlib.sha256(original_raw).hexdigest()
          package_sha = hashlib.sha256(package_path.read_bytes()).hexdigest()

          source_type_map = {
              "company-ir": "company",
              "historical-memory": "other",
          }
          source_id_map = {"memory-001": "source-009"}
          for source in spec.get("sources", []):
              source["sourceId"] = source_id_map.get(source.get("sourceId"), source.get("sourceId"))
              source["sourceType"] = source_type_map.get(source.get("sourceType"), source.get("sourceType"))
              attribution = source.get("narrationAttribution")
              if not isinstance(attribution, str) or not attribution.strip():
                  source["narrationAttribution"] = "過去回の編集記憶（現在証拠として不使用）"

          def replace_exact(value):
              if isinstance(value, str):
                  return source_id_map.get(value, value)
              if isinstance(value, list):
                  return [replace_exact(item) for item in value]
              if isinstance(value, dict):
                  return {key: replace_exact(item) for key, item in value.items()}
              return value

          spec = replace_exact(spec)
          mapping_entries = []
          financial_beats = []
          financial_recipe_by_template = {
              "market-pulse-grid": "market-pulse-grid",
              "earnings-surprise": "earnings-surprise",
              "dual-asset-split": "dual-asset-split",
              "macro-pressure": "macro-pressure",
              "source-receipt": "source-receipt",
          }

          for scene in spec["scenes"]:
              if scene.get("expectedBasisType") == "not-applicable":
                  scene["expectedBasisType"] = None
              scene["visualMode"] = {
                  "verification": "verification-points",
                  "closing-recap": "conclusion-card",
              }.get(scene.get("visualMode"), scene.get("visualMode"))
              if scene.get("sceneRole") == "fixed-ending":
                  scene["sceneRole"] = "closing-recap-sendoff-goodnight"

              for beat in scene["visualBeats"]:
                  duplicate_id = beat.pop("visualBeatId", None)
                  if duplicate_id is not None and duplicate_id != beat.get("beatId"):
                      raise SystemExit(f"Visual Beat ID conflict: {beat.get('beatId')}")
                  visual_grammar = beat.pop("visualGrammar", None)
                  if not isinstance(visual_grammar, dict):
                      raise SystemExit(f"missing visualGrammar: {beat.get('beatId')}")
                  if visual_grammar.get("contractVersion") != "1.0.0":
                      raise SystemExit(f"unsupported Visual Grammar contract: {beat.get('beatId')}")
                  if visual_grammar.get("returnTargetBeatId") is not None:
                      raise SystemExit(f"unresolved return target: {beat.get('beatId')}")
                  beat["visualGrammarId"] = visual_grammar.get("grammarId")
                  beat["transitionRole"] = visual_grammar.get("transitionRole")
                  beat["visualMode"] = {
                      "verification": "verification-points",
                      "closing-recap": "conclusion-card",
                  }.get(beat.get("visualMode"), beat.get("visualMode"))
                  mapping_entries.append({
                      "beatId": beat.get("beatId"),
                      "visualTemplate": beat.get("visualTemplate"),
                      "visualGrammarId": beat.get("visualGrammarId"),
                      "transitionRole": beat.get("transitionRole"),
                  })
                  if beat.get("visualTemplate") in financial_recipe_by_template:
                      financial_beats.append(beat)

          removed_root = {}
          for key in ("expectedConfirmed", "imageSelection", "tts", "visualGrammarContractVersion"):
              if key in spec:
                  removed_root[key] = spec.pop(key)

          mapping_contract = {
              "contractVersion": "1.0.0",
              "episodeId": spec["episode"]["id"],
              "sourceSpecSha256": original_spec_sha,
              "normalizations": {
                  "sourceType": source_type_map,
                  "sourceId": source_id_map,
                  "expectedBasisType": {"not-applicable": None},
                  "visualMode": {"verification": "verification-points", "closing-recap": "conclusion-card"},
                  "sceneRole": {"fixed-ending": "closing-recap-sendoff-goodnight"},
                  "removedRootKeys": sorted(removed_root),
                  "beatFieldMigration": "visualBeatId/visualGrammar -> beatId/visualGrammarId/transitionRole",
              },
              "beats": mapping_entries,
          }
          spec["visualGrammarContract"] = {
              "contractVersion": "1.0.0",
              "semanticsSha256": canonical_sha(mapping_contract),
              "rendererCompatibilitySha256": compatibility_sha,
              "finalEpisodeContractSha256": package_sha,
              "beatCount": len(mapping_entries),
          }

          selected_plans = []
          for beat in financial_beats:
              template_config = beat["templateConfig"]
              display_order = list(beat.get("objectIds", []))
              source_ids = list(beat.get("evidenceSourceIds", []))
              metric_ids = list(template_config.get("metricIds", []))
              causal_step_ids = list(template_config.get("causalStepIds", []))
              comparison_basis = template_config.get("comparisonBasis")
              if not isinstance(comparison_basis, str) or not comparison_basis.strip():
                  comparison_basis = template_config.get("dataBasis")
              if not isinstance(comparison_basis, str) or not comparison_basis.strip():
                  raise SystemExit(f"financial Beat has no comparison basis: {beat['beatId']}")
              template_config["comparisonBasis"] = comparison_basis
              template_config["displayOrder"] = display_order
              template_config["metricIds"] = metric_ids
              template_config["causalStepIds"] = causal_step_ids
              beat["templateVariant"] = template_config["variant"]
              beat["financialReturnTarget"] = beat.get("changeCue") or beat.get("screenQuestion")

              plan = {
                  "intentId": f"fvi-{beat['beatId']}",
                  "selectedPlanId": f"fvp-{beat['beatId']}",
                  "selectedPath": "preferred",
                  "recipeId": financial_recipe_by_template[beat["visualTemplate"]],
                  "visualTemplate": beat["visualTemplate"],
                  "sourceIds": source_ids,
                  "metricIds": metric_ids,
                  "causalStepIds": causal_step_ids,
                  "displayOrder": display_order,
                  "comparisonBasis": comparison_basis,
              }
              plan["selectedPlanSha256"] = canonical_sha(plan)
              selected_plans.append((beat, plan))

          recipe_plan = {
              "contractVersion": "1.0.0",
              "episodeId": spec["episode"]["id"],
              "selections": [plan for _, plan in selected_plans],
          }
          recipe_plan_sha = canonical_sha(recipe_plan)
          for beat, plan in selected_plans:
              beat["financialVisualTrace"] = {
                  "contractVersion": "1.0.0",
                  "intentId": plan["intentId"],
                  "selectedPlanId": plan["selectedPlanId"],
                  "selectedPlanSha256": plan["selectedPlanSha256"],
                  "selectedPath": plan["selectedPath"],
                  "recipeId": plan["recipeId"],
                  "recipePlanSha256": recipe_plan_sha,
                  "finalEpisodeContractSha256": package_sha,
                  "sourceIds": plan["sourceIds"],
                  "metricIds": plan["metricIds"],
                  "causalStepIds": plan["causalStepIds"],
                  "displayOrder": plan["displayOrder"],
                  "comparisonBasis": plan["comparisonBasis"],
                  "reasonCodes": [],
              }

          if selected_plans:
              spec["financialVisualContract"] = {
                  "contractVersion": "1.0.0",
                  "intentVersion": "1.1.0",
                  "recipePlanVersion": "1.0.0",
                  "recipeRegistryVersion": "1.0.0",
                  "finalEpisodeContractVersion": "1.0.0",
                  "recipePlanSha256": recipe_plan_sha,
                  "selectionCount": len(selected_plans),
              }

          after_tts_sha = tts_identity(spec)
          if before_tts_sha != after_tts_sha:
              raise SystemExit(f"normalization changed TTS identity: {before_tts_sha} != {after_tts_sha}")

          normalized_text = json.dumps(spec, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          spec_path.write_text(normalized_text, encoding="utf-8")
          normalized_sha = hashlib.sha256(normalized_text.encode("utf-8")).hexdigest()
          ready = json.loads(ready_path.read_text(encoding="utf-8"))
          ready["renderSpecSha256"] = normalized_sha
          ready["rendererNormalization"] = {
              "status": "pass",
              "sourceRenderSpecSha256": original_spec_sha,
              "normalizedRenderSpecSha256": normalized_sha,
              "ttsInputSha256Before": before_tts_sha,
              "ttsInputSha256After": after_tts_sha,
              "ttsIdentityChanged": False,
              "narrationChanged": False,
              "numbersChanged": False,
              "sceneOrderChanged": False,
              "marketMeaningChanged": False,
              "financialSelectionCount": len(selected_plans),
          }
          ready_path.write_text(json.dumps(ready, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          report_path = Path(f"preview-status/{os.environ['EPISODE_DATE']}/normalization_report.json")
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(json.dumps({
              "version": 1,
              "status": "normalized-for-renderer-2.4",
              "episodeDate": os.environ["EPISODE_DATE"],
              "sourceRenderSpecSha256": original_spec_sha,
              "normalizedRenderSpecSha256": normalized_sha,
              "episodePackageSha256": package_sha,
              "visualBeatCount": len(mapping_entries),
              "financialSelectionCount": len(selected_plans),
              "recipePlanSha256": recipe_plan_sha if selected_plans else None,
              "ttsInputSha256Before": before_tts_sha,
              "ttsInputSha256After": after_tts_sha,
              "ttsIdentityChanged": False,
              "narrationChanged": False,
              "numbersChanged": False,
              "sceneOrderChanged": False,
              "marketMeaningChanged": False,
              "mappingContractSha256": canonical_sha(mapping_contract),
          }, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(normalized_sha)
          PY

      - name: Run formal Renderer validator
        shell: bash
        run: |
          set -euo pipefail
          npm run episode:spec:validate -- "$SPEC_PATH" 2>&1 | tee /tmp/renderer-validator.log

      - name: Commit normalized immutable input
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_PATH" "$READY_PATH" "preview-status/$EPISODE_DATE/normalization_report.json"
          git rm --ignore-unmatch ".github/workflows/normalize-and-render-preview-2026-08-06.yml"
          git rm --ignore-unmatch ".github/workflows/normalize-financial-and-render-preview-2026-08-06.yml"
          git commit -m "Normalize Nasdaq Cafe 2026-08-06 for Renderer 2.4"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "spec_sha=$SPEC_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch formal Preview
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_SHA: ${{ steps.commit.outputs.spec_sha }}
          NORMALIZED_HEAD: ${{ steps.commit.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run nasdaq-cafe-preview.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f episode_date="$EPISODE_DATE" \
            -f expected_spec_sha256="$SPEC_SHA" \
            -f confirmation=PREVIEW

          for attempt in $(seq 1 30); do
            RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nasdaq-cafe-preview.yml --event workflow_dispatch --limit 10 --json databaseId,status,conclusion,createdAt,url,headSha)"
            RUN_ID="$(jq -r --arg head "$NORMALIZED_HEAD" '[.[] | select(.headSha == $head)][0].databaseId // empty' <<<"$RUNS")"
            if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Unable to identify dispatched Preview run"
          exit 1

      - name: Wait for Preview completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          RUN_ID="${{ steps.dispatch.outputs.run_id }}"
          set +e
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          echo "$?" > /tmp/preview-watch-exit.txt
          set -e

      - name: Record final Preview status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.dispatch.outputs.run_id }}"
          RUN_JSON="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs)"
          ARTIFACT_JSON="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"
          jq -n \
            --arg episode_date "$EPISODE_DATE" \
            --arg expected_spec_sha256 "${{ steps.commit.outputs.spec_sha }}" \
            --argjson workflow_run "$RUN_JSON" \
            --argjson artifacts "$ARTIFACT_JSON" \
            --arg watch_exit "$(cat /tmp/preview-watch-exit.txt)" \
            '{version:1,episodeDate:$episode_date,expectedSpecSha256:$expected_spec_sha256,watchExitCode:($watch_exit|tonumber),workflowRun:$workflow_run,artifacts:$artifacts.artifacts}' \
            > "preview-status/$EPISODE_DATE/preview_run.json"
          git pull --rebase origin main
          git add "preview-status/$EPISODE_DATE/preview_run.json"
          git commit -m "Record rendered Nasdaq Cafe preview for 2026-08-06"
          git push origin HEAD:main
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "success"
