name: Visual Story Engine CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "schemas/**"
      - "render-specs/**"
      - "episode-packages/**"
      - "shot-timing-requests/**"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-story-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Typecheck
        run: npm run typecheck

      - name: Parse production workflow YAML
        run: |
          npx prettier --check \
            .github/workflows/nasdaq-cafe-motion-preview.yml \
            .github/workflows/nasdaq-cafe-motion-preview-request.yml \
            .github/workflows/nasdaq-cafe-tts-cache-export.yml \
            .github/workflows/nasdaq-cafe-shot-plan-apply.yml \
            motion-preview-requests/README.md

      - name: Workflow contract
        run: npm run test:workflow-contract

      - name: Motion Preview request queue tests
        run: |
          python3 -m py_compile \
            scripts/motion_preview_request_queue.py \
            scripts/test_motion_preview_request_queue.py \
            scripts/restore_exported_tts_cache.py \
            scripts/test_restore_exported_tts_cache.py \
            scripts/apply_measured_shot_plan.py
          python3 scripts/test_motion_preview_request_queue.py

      - name: Dry-run committed measured Shot plan request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t REQUESTS < <(find shot-timing-requests -maxdepth 1 -type f -name '*.json' -print | sort)
          if [[ "${#REQUESTS[@]}" -gt 1 ]]; then
            echo "::error::CI fixture expects at most one measured Shot plan request"
            exit 1
          fi
          if [[ "${#REQUESTS[@]}" -eq 1 ]]; then
            python3 scripts/apply_measured_shot_plan.py "${REQUESTS[0]}"
            EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "${REQUESTS[0]}")"
            npm run episode:spec:validate -- "render-specs/${EPISODE_DATE}/render_spec.json"
            npm run test:shot-story
            git diff --check
          fi

      - name: Generate JSON Schema
        run: npm run episode:spec:schema

      - name: Generate migrated Visual Story inputs
        run: |
          node --import tsx scripts/migrate-visual-story-v2.ts \
            --output-dir build/visual-story-migrated \
            render-specs/2026-07-31/render_spec.json \
            render-specs/fixtures/minimal/render_spec.json \
            render-specs/fixtures/complete-9scene/render_spec.json \
            render-specs/fixtures/renderable-9scene/render_spec.json \
            render-specs/fixtures/schema-all-expressions/render_spec.json

      - name: Collect generated contract files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/visual-story-generated/schemas
          cp schemas/render_spec.schema.json build/visual-story-generated/schemas/render_spec.schema.json
          cp -R build/visual-story-migrated/render-specs build/visual-story-generated/render-specs

      - name: Upload generated contracts
        uses: actions/upload-artifact@v6
        with:
          name: visual-story-generated-${{ github.run_id }}
          path: build/visual-story-generated
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed JSON Schema is current
        run: git diff --exit-code -- schemas/render_spec.schema.json

      - name: Render spec contract tests
        run: npm run test:spec

      - name: Public screen boundary
        run: npm run test:public-screen

      - name: Clean generated contract workspace
        run: rm -rf build

      - name: Bundle Remotion
        run: npm run build
