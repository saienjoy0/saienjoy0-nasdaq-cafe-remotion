name: Visual Story Engine CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "schemas/**"
      - "render-specs/**"
      - "episode-packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/visual-story-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-story-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Render spec contract tests
        run: npm run test:spec

      - name: Public screen boundary
        run: npm run test:public-screen

      - name: Bundle Remotion
        run: npm run build
