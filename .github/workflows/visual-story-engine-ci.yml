name: Visual Story Engine CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "schemas/**"
      - "render-specs/**"
      - "episode-packages/**"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - "docs/**"
      - ".github/workflows/visual-story-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-story-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Typecheck
        run: npm run typecheck

      - name: Generate JSON Schema
        run: npm run episode:spec:schema

      - name: Generate migrated Visual Story inputs
        run: |
          node --import tsx scripts/migrate-visual-story-v2.ts \
            --output-dir build/visual-story-migrated \
            render-specs/2026-07-31/render_spec.json \
            render-specs/fixtures/minimal/render_spec.json \
            render-specs/fixtures/complete-9scene/render_spec.json \
            render-specs/fixtures/renderable-9scene/render_spec.json \
            render-specs/fixtures/schema-all-expressions/render_spec.json

      - name: Collect generated contract files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/visual-story-generated/schemas
          cp schemas/render_spec.schema.json build/visual-story-generated/schemas/render_spec.schema.json
          cp -R build/visual-story-migrated/render-specs build/visual-story-generated/render-specs

      - name: Upload generated contracts
        uses: actions/upload-artifact@v6
        with:
          name: visual-story-generated-${{ github.run_id }}
          path: build/visual-story-generated
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed JSON Schema is current
        run: git diff --exit-code -- schemas/render_spec.schema.json

      - name: Render spec contract tests
        run: npm run test:spec

      - name: Public screen boundary
        run: npm run test:public-screen

      - name: Bundle Remotion
        run: npm run build
