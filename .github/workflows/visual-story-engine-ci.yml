name: Visual Story Engine CI

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "schemas/**"
      - "render-specs/**"
      - "episode-packages/**"
      - "package.json"
      - "package-lock.json"
      - "AGENTS.md"
      - "docs/**"
      - ".github/workflows/visual-story-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-story-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Typecheck
        run: npm run typecheck

      - name: Render spec contract tests
        run: npm run test:spec

      - name: Public screen boundary
        run: npm run test:public-screen

      - name: Bundle Remotion
        run: npm run build
