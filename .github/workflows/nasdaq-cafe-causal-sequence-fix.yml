name: Nasdaq Cafe Causal Sequence Fix

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "causal-motion-fix-requests/*.json"

permissions:
  contents: write

concurrency:
  group: nasdaq-cafe-causal-sequence-fix
  cancel-in-progress: false

jobs:
  apply-sequence-fix:
    name: Apply one approved causal sequence correction
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout audited PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Resolve one append-only correction request
        id: request
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(
            git diff --name-status "$PR_BASE_SHA" "$PR_HEAD_SHA" -- 'causal-motion-fix-requests/*.json'
          )
          if [[ "${#CHANGED[@]}" -ne 1 ]]; then
            echo "::error::A correction PR must add exactly one request"
            exit 1
          fi
          IFS=$'\t' read -r STATUS REQUEST_PATH <<< "${CHANGED[0]}"
          if [[ "$STATUS" != "A" || ! "$REQUEST_PATH" =~ ^causal-motion-fix-requests/[A-Za-z0-9._-]+\.json$ ]]; then
            echo "::error::Correction requests are append-only JSON files"
            exit 1
          fi
          test -s "$REQUEST_PATH"
          echo "request_path=$REQUEST_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply the approved correction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_causal_sequence_fix.py
          python3 scripts/apply_causal_sequence_fix.py "${{ steps.request.outputs.request_path }}"

      - name: Validate corrected render input
        shell: bash
        run: |
          set -euo pipefail
          EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "${{ steps.request.outputs.request_path }}")"
          SPEC_PATH="render-specs/${EPISODE_DATE}/render_spec.json"
          npm run episode:spec:validate -- "$SPEC_PATH"
          npm run test:visual-story
          npm run test:public-screen
          node --import tsx - "$SPEC_PATH" <<'NODE'
          import {readFile} from "node:fs/promises";
          import {assertProductionTextSafe} from "./src/spec/validate-render-spec.ts";
          const path = process.argv[2];
          const value = JSON.parse(await readFile(path, "utf8"));
          assertProductionTextSafe(value);
          console.log("production text safety: pass");
          NODE
          git diff --check

      - name: Restrict generated changes
        shell: bash
        run: |
          set -euo pipefail
          EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "${{ steps.request.outputs.request_path }}")"
          mapfile -t CHANGED < <(git diff --name-only)
          EXPECTED=(
            "render-specs/${EPISODE_DATE}/render_spec.json"
            "causal-motion-reports/${EPISODE_DATE}.json"
          )
          if [[ "${#CHANGED[@]}" -ne 2 ]]; then
            printf '::error::Unexpected generated change: %s\n' "${CHANGED[@]}"
            exit 1
          fi
          for expected in "${EXPECTED[@]}"; do
            printf '%s\n' "${CHANGED[@]}" | grep -Fx -- "$expected" >/dev/null || {
              echo "::error::Missing expected generated file: $expected"
              exit 1
            }
          done

      - name: Commit corrected production inputs
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          EPISODE_DATE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["episodeDate"])' "${{ steps.request.outputs.request_path }}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "render-specs/${EPISODE_DATE}/render_spec.json" \
            "causal-motion-reports/${EPISODE_DATE}.json"
          git commit -m "Correct causal sequence policy for ${EPISODE_DATE}"
          git push origin HEAD:"$PR_HEAD_REF"
