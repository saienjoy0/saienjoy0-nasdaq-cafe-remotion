name: FVU R3 Technical Preview Dispatch

on:
  pull_request:
    paths:
      - ".github/workflows/fvu-r3-technical-preview-dispatch.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'tech/fvu-r3-preview-2099-02-02'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Materialize immutable technical preview input
        env:
          HEAD_REF: ${{ github.head_ref }}
          EXPECTED_SHA: 98e7e7c84a803dda0b5b677d3c7155f49fc63ab739f1277f61b5475c6e505298
        run: |
          set -euo pipefail
          mkdir -p render-specs/2099-02-02
          cp shared-fixtures/financial-visual-2.3/render_spec.json render-specs/2099-02-02/render_spec.json
          actual="$(sha256sum render-specs/2099-02-02/render_spec.json | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA"
          git add -- render-specs/2099-02-02/render_spec.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Materialize FVU R3 technical preview input"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - name: Dispatch standard Nasdaq Cafe Preview
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: 98e7e7c84a803dda0b5b677d3c7155f49fc63ab739f1277f61b5475c6e505298
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/workflows/nasdaq-cafe-preview.yml/dispatches" \
            -d "{\"ref\":\"${HEAD_REF}\",\"inputs\":{\"episode_date\":\"2099-02-02\",\"expected_spec_sha256\":\"${EXPECTED_SHA}\",\"confirmation\":\"PREVIEW\"}}"

          run_id=""
          for attempt in $(seq 1 30); do
            payload="$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/workflows/nasdaq-cafe-preview.yml/runs?branch=${HEAD_REF}&event=workflow_dispatch&per_page=5")"
            run_id="$(python3 -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs", []); print(runs[0]["id"] if runs else "")' <<< "$payload")"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Preview workflow run did not appear"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Preview run ID: $run_id"
          echo "### Standard technical preview dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run ID: \`$run_id\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Episode: \`2099-02-02\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Spec SHA: \`${EXPECTED_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
