name: Probe Rescue Preview 2026-08-06 V3
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-rescue-preview-2026-08-06-v3.yml"]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Record latest rescue run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-status/2026-08-06
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rescue-preview-2026-08-06.yml --limit 1 --json databaseId | jq -r '.[0].databaseId // empty')"
          test "$RUN_ID" != ""
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs > preview-status/2026-08-06/rescue_run_live_v3.json
      - name: Commit result and remove probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-status/2026-08-06/rescue_run_live_v3.json
          git rm .github/workflows/probe-rescue-preview-2026-08-06-v3.yml
          git commit -m "Record rescue preview live status v3"
          git pull --rebase origin main
          git push origin HEAD:main
