name: One-time Visual Story Ledger Resync

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - ".github/workflows/visual-story-resync-ledger.yml"

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[visual-story-ledger]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/visual-story-engine-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resync episode package ledger
        run: node --import tsx scripts/sync-episode-visual-story.ts --write render-specs/2026-07-31/render_spec.json episode-packages/2026-07-31/episode_package_2026-07-31.md

      - name: Commit deterministic ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episode-packages/2026-07-31/episode_package_2026-07-31.md
          if git diff --cached --quiet; then
            echo "Ledger already current"
            exit 0
          fi
          git commit -m "[visual-story-ledger] Scope episode package events to each Beat"
          git push origin HEAD:feature/visual-story-engine-v2
