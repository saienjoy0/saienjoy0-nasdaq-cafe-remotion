name: FVU R3 Shot Plan Repair and Preview Redispatch

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/fvu-r3-shot-plan-repair.yml"

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'tech/fvu-r3-preview-v2-2099-02-02'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HEAD_REF: tech/fvu-r3-preview-v2-2099-02-02
      EPISODE_DATE: 2099-02-02
      SPEC_PATH: render-specs/2099-02-02/render_spec.json
      PREVIOUS_RUN_ID: "31057914208"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add explicit four-Shot financial plan
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import copy
          import json
          import re
          from pathlib import Path

          path = Path("render-specs/2099-02-02/render_spec.json")
          spec = json.loads(path.read_text(encoding="utf-8"))
          original = copy.deepcopy(spec)

          scene = next(item for item in spec["scenes"] if item["sceneId"] == "scene-04")
          beat = next(item for item in scene["visualBeats"] if item["beatId"] == "vb-04-02")
          if beat.get("visualTemplate") != "earnings-surprise":
              raise SystemExit("target beat is no longer the approved earnings-surprise Template")
          if beat.get("shots"):
              raise SystemExit("target beat already has Shots; refusing to overwrite")
          chunk = next(item for item in scene["narrationChunks"] if item["chunkId"] == "scene-04-chunk-001")

          def normalize(value: str) -> str:
              return re.sub(r"\s+", "", value).strip()

          speech = normalize(chunk["speechText"])

          def progress(cue: str, edge: str) -> float:
              needle = normalize(cue)
              locations = [match.start() for match in re.finditer(re.escape(needle), speech)]
              if len(locations) != 1:
                  raise SystemExit(f"cue must occur exactly once: {cue!r} count={len(locations)}")
              value = locations[0] + (len(needle) if edge == "end" else 0)
              return round(value / len(speech), 6)

          plans = [
              {
                  "shotRecipe": "expected-anchor",
                  "startCue": "市場が事前に見ていた論点は、",
                  "endCue": "AI設備投資の大きさでした。",
                  "primaryTargetId": "fvu-aws-expected",
                  "referenceTargetId": None,
                  "outcomeTargetId": None,
                  "secondaryTargetIds": [],
                  "cameraTargetId": "fvu-aws-expected",
                  "stageLayout": "full-stage",
                  "cameraPreset": "static",
                  "transitionIn": "soft-reveal",
                  "transitionOut": "carry-forward",
                  "typographyTreatment": "underline-draw",
                  "typographyText": "Expected $42.3B",
                  "soundCue": None,
                  "foxExpression": "分析",
              },
              {
                  "shotRecipe": "actual-crosses-expected",
                  "startCue": "大手クラウド各社は",
                  "endCue": "巨額の資金を使っています。",
                  "primaryTargetId": "fvu-aws-actual",
                  "referenceTargetId": "fvu-aws-expected",
                  "outcomeTargetId": None,
                  "secondaryTargetIds": [],
                  "cameraTargetId": "fvu-aws-actual",
                  "stageLayout": "split-vertical",
                  "cameraPreset": "push-in",
                  "transitionIn": "reframe-shared-element",
                  "transitionOut": "carry-forward",
                  "typographyTreatment": "gap-highlight",
                  "typographyText": "Actual $43.0B",
                  "soundCue": "soft-impact",
                  "foxExpression": "分析",
              },
              {
                  "shotRecipe": "gap-macro",
                  "startCue": "支出した瞬間に利益が出るわけではなく、",
                  "endCue": "利用者と料金収入は後からついてきます。",
                  "primaryTargetId": "fvu-aws-gap",
                  "referenceTargetId": "fvu-aws-actual",
                  "outcomeTargetId": "fvu-aws-gap",
                  "secondaryTargetIds": [],
                  "cameraTargetId": "fvu-aws-gap",
                  "stageLayout": "macro-detail",
                  "cameraPreset": "macro-detail",
                  "transitionIn": "reframe-shared-element",
                  "transitionOut": "carry-forward",
                  "typographyTreatment": "gap-highlight",
                  "typographyText": "Gap +$0.7B",
                  "soundCue": None,
                  "foxExpression": "軽い驚き",
              },
              {
                  "shotRecipe": "hero-metric-impact",
                  "startCue": "主要報道では、",
                  "endCue": "繰り返し注目されていました。",
                  "primaryTargetId": "fvu-aws-gap",
                  "referenceTargetId": "fvu-aws-expected",
                  "outcomeTargetId": "fvu-aws-gap",
                  "secondaryTargetIds": ["fvu-aws-actual"],
                  "cameraTargetId": "fvu-aws-gap",
                  "stageLayout": "hero-center",
                  "cameraPreset": "reframe-outcome",
                  "transitionIn": "reframe-shared-element",
                  "transitionOut": "hold-outcome",
                  "typographyTreatment": "word-build",
                  "typographyText": "回収できるか",
                  "soundCue": "soft-impact",
                  "foxExpression": "分析",
              },
          ]

          shots = []
          previous_end = 0.0
          for index, plan in enumerate(plans, start=1):
              start = progress(plan["startCue"], "start")
              end = progress(plan["endCue"], "end")
              if index == 1 and start != 0.0:
                  raise SystemExit("first Shot does not start at progress zero")
              if start < previous_end or start - previous_end > 0.02:
                  raise SystemExit(f"Shot {index} has an invalid semantic gap or overlap")
              if end <= start:
                  raise SystemExit(f"Shot {index} has invalid progress")
              shots.append({
                  "shotId": f"vb-04-02-shot-{index:03d}",
                  "shotRecipe": plan["shotRecipe"],
                  "startChunkId": "scene-04-chunk-001",
                  "startProgress": start,
                  "startOffsetMs": 0,
                  "endChunkId": "scene-04-chunk-001",
                  "endProgress": end,
                  "endOffsetMs": 0,
                  "startCue": plan["startCue"],
                  "endCue": plan["endCue"],
                  "primaryTargetId": plan["primaryTargetId"],
                  "referenceTargetId": plan["referenceTargetId"],
                  "outcomeTargetId": plan["outcomeTargetId"],
                  "secondaryTargetIds": plan["secondaryTargetIds"],
                  "cameraTargetId": plan["cameraTargetId"],
                  "stageLayout": plan["stageLayout"],
                  "cameraPreset": plan["cameraPreset"],
                  "transitionIn": plan["transitionIn"],
                  "transitionOut": plan["transitionOut"],
                  "continuityKey": "vb-04-02-financial-flow",
                  "typographyTreatment": plan["typographyTreatment"],
                  "typographyText": plan["typographyText"],
                  "soundCue": plan["soundCue"],
                  "foxExpression": plan["foxExpression"],
              })
              previous_end = end
          if previous_end != 1.0:
              raise SystemExit(f"final Shot must end at progress 1.0, got {previous_end}")

          beat["shots"] = shots

          original_without_shots = copy.deepcopy(original)
          updated_without_shots = copy.deepcopy(spec)
          for value in (original_without_shots, updated_without_shots):
              for item_scene in value["scenes"]:
                  for item_beat in item_scene["visualBeats"]:
                      item_beat.pop("shots", None)
          if original_without_shots != updated_without_shots:
              raise SystemExit("repair changed non-Shot render_spec content")

          total_shots = sum(
              len(item_beat.get("shots", []))
              for item_scene in spec["scenes"]
              for item_beat in item_scene["visualBeats"]
          )
          if not 24 <= total_shots <= 50:
              raise SystemExit(f"episode Shot count is outside production contract: {total_shots}")

          path.write_text(json.dumps(spec, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "targetBeat": beat["beatId"],
              "addedShots": len(shots),
              "totalShots": total_shots,
              "progress": [[item["startProgress"], item["endProgress"]] for item in shots],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate repaired render spec
        run: |
          npm run episode:spec:validate -- "$SPEC_PATH"
          npm run test:runtime-stability

      - name: Commit repaired immutable input
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          rm -f technical-preview-run-id.txt
          git rm .github/workflows/fvu-r3-shot-plan-repair.yml
          git add "$SPEC_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add explicit Scene 4 financial Shot plan"
          git push origin "HEAD:${HEAD_REF}"
          echo "spec_sha=$SPEC_SHA" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch corrected standard Preview
        shell: bash
        env:
          SPEC_SHA: ${{ steps.commit.outputs.spec_sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "ref": os.environ["HEAD_REF"],
              "inputs": {
                  "episode_date": os.environ["EPISODE_DATE"],
                  "expected_spec_sha256": os.environ["SPEC_SHA"],
                  "confirmation": "PREVIEW",
              },
          }))
          PY
          )"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/workflows/nasdaq-cafe-preview.yml/dispatches" \
            -d "$payload"

      - name: Record corrected Preview run ID
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          run_id=""
          for attempt in $(seq 1 30); do
            payload="$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/workflows/nasdaq-cafe-preview.yml/runs?branch=${HEAD_REF}&event=workflow_dispatch&per_page=20")"
            run_id="$(PREVIOUS_RUN_ID="$PREVIOUS_RUN_ID" python3 -c 'import json,os,sys; old=int(os.environ["PREVIOUS_RUN_ID"]); runs=json.load(sys.stdin).get("workflow_runs", []); candidates=[r for r in runs if int(r["id"]) != old]; print(candidates[0]["id"] if candidates else "")' <<< "$payload")"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Corrected Preview run was not found"
            exit 1
          fi
          printf '%s\n' "$run_id" > technical-preview-run-id.txt
          git add technical-preview-run-id.txt
          git commit -m "Record Shot-repaired Preview run"
          git push origin "HEAD:${HEAD_REF}"
          echo "Corrected Preview run ID: $run_id"
