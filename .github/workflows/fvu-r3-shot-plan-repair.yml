name: Sync Official FVU R3 Fixture and Redispatch Preview

# Retriggered after the technical PR was reopened.
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/fvu-r3-shot-plan-repair.yml"

permissions:
  contents: write
  actions: write

jobs:
  sync-and-dispatch:
    if: github.event.pull_request.head.ref == 'tech/fvu-r3-preview-v2-2099-02-02'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HEAD_REF: tech/fvu-r3-preview-v2-2099-02-02
      EPISODE_DATE: 2099-02-02
      SOURCE_SPEC: shared-fixtures/financial-visual-2.3/render_spec.json
      TARGET_SPEC: render-specs/2099-02-02/render_spec.json
      PREVIOUS_RUN_ID: "31057914208"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify official fixture changes Shots only and preserves TTS input
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import copy, json
          from pathlib import Path

          source_path = Path("shared-fixtures/financial-visual-2.3/render_spec.json")
          target_path = Path("render-specs/2099-02-02/render_spec.json")
          source = json.loads(source_path.read_text(encoding="utf-8"))
          target = json.loads(target_path.read_text(encoding="utf-8"))

          def without_shots(value):
              result = copy.deepcopy(value)
              for scene in result["scenes"]:
                  for beat in scene["visualBeats"]:
                      beat.pop("shots", None)
              return result

          if without_shots(source) != without_shots(target):
              raise SystemExit("official shared fixture differs from technical input outside Shot arrays")

          def tts_identity(value):
              return {
                  "voiceProfileId": value.get("voiceProfileId"),
                  "pronunciations": value.get("pronunciations"),
                  "speech": [[chunk["speechText"] for chunk in scene["narrationChunks"]] for scene in value["scenes"]],
              }

          if tts_identity(source) != tts_identity(target):
              raise SystemExit("official Shot fixture changed TTS input")

          scene = next(item for item in source["scenes"] if item["sceneId"] == "scene-04")
          beat = next(item for item in scene["visualBeats"] if item["beatId"] == "vb-04-02")
          shots = beat.get("shots", [])
          expected_ids = ["scene-04-beat-001-shot-001", "scene-04-beat-001-shot-002", "scene-04-beat-001-shot-003"]
          if [item.get("shotId") for item in shots] != expected_ids:
              raise SystemExit("official financial Shot IDs do not match the production contract")
          total = sum(len(b.get("shots", [])) for s in source["scenes"] for b in s["visualBeats"])
          if total != 50:
              raise SystemExit(f"official fixture must contain exactly 50 Shots, got {total}")

          target_path.write_bytes(source_path.read_bytes())
          print(json.dumps({"status": "official-fixture-copied", "financialShots": len(shots), "totalShots": total}, indent=2))
          PY

      - name: Validate official fixture and runtime contracts
        run: |
          npm run episode:spec:validate -- "$TARGET_SPEC"
          npm run test:runtime-stability
          npm run test:visual-story
          node --import tsx scripts/test-financial-handoff-fixture.ts

      - name: Commit immutable official Preview input
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          spec_sha="$(sha256sum "$TARGET_SPEC" | awk '{print $1}')"
          rm -f technical-preview-run-id.txt
          git rm .github/workflows/fvu-r3-shot-plan-repair.yml
          git add "$TARGET_SPEC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync official financial Shot fixture for Preview"
          git push origin "HEAD:${HEAD_REF}"
          echo "spec_sha=$spec_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch corrected standard Preview
        shell: bash
        env:
          SPEC_SHA: ${{ steps.commit.outputs.spec_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/dispatch.json
          import json, os
          print(json.dumps({"ref": os.environ["HEAD_REF"], "inputs": {"episode_date": os.environ["EPISODE_DATE"], "expected_spec_sha256": os.environ["SPEC_SHA"], "confirmation": "PREVIEW"}}))
          PY
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/nasdaq-cafe-preview.yml/dispatches" \
            --data-binary @/tmp/dispatch.json

      - name: Record corrected Preview run ID
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          run_id=""
          for attempt in $(seq 1 40); do
            payload="$(curl -fsS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "${api}/actions/workflows/nasdaq-cafe-preview.yml/runs?branch=${HEAD_REF}&event=workflow_dispatch&per_page=20")"
            run_id="$(PREVIOUS_RUN_ID="$PREVIOUS_RUN_ID" python3 -c 'import json,os,sys; old=int(os.environ["PREVIOUS_RUN_ID"]); runs=json.load(sys.stdin).get("workflow_runs", []); candidates=[r for r in runs if int(r["id"]) != old]; print(candidates[0]["id"] if candidates else "")' <<< "$payload")"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]] || { echo "::error::corrected Preview run not found"; exit 1; }
          printf '%s\n' "$run_id" > technical-preview-run-id.txt
          git add technical-preview-run-id.txt
          git commit -m "Record official Shot-fixture Preview run"
          git push origin "HEAD:${HEAD_REF}"
          echo "Corrected Preview run ID: $run_id"
