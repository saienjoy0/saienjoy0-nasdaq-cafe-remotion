name: FVU R3 Technical Preview V2 Dispatch

on:
  pull_request:
    paths:
      - ".github/workflows/fvu-r3-technical-preview-v2-dispatch.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'tech/fvu-r3-preview-v2-2099-02-02'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify input and remove one-time dispatcher
        env:
          HEAD_REF: ${{ github.head_ref }}
          EXPECTED_SHA: 6833aec3c6606c0a23b5b20a0bdb0bc9845a36234842d55e8178d71e75b19315
        run: |
          set -euo pipefail
          test -s render-specs/2099-02-02/render_spec.json
          actual="$(sha256sum render-specs/2099-02-02/render_spec.json | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA"
          git rm .github/workflows/fvu-r3-technical-preview-v2-dispatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time FVU R3 preview dispatcher"
          git push origin "HEAD:${HEAD_REF}"
      - name: Dispatch standard Nasdaq Cafe Preview from clean branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: 6833aec3c6606c0a23b5b20a0bdb0bc9845a36234842d55e8178d71e75b19315
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/actions/workflows/nasdaq-cafe-preview.yml/dispatches" \
            -d "{\"ref\":\"${HEAD_REF}\",\"inputs\":{\"episode_date\":\"2099-02-02\",\"expected_spec_sha256\":\"${EXPECTED_SHA}\",\"confirmation\":\"PREVIEW\"}}"
          for attempt in $(seq 1 30); do
            payload="$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/actions/workflows/nasdaq-cafe-preview.yml/runs?branch=${HEAD_REF}&event=workflow_dispatch&per_page=5")"
            run_id="$(python3 -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs", []); print(runs[0]["id"] if runs else "")' <<< "$payload")"
            if [[ -n "$run_id" ]]; then
              echo "Preview run ID: $run_id"
              echo "### Standard technical preview dispatched from clean branch" >> "$GITHUB_STEP_SUMMARY"
              echo "- Run ID: \`$run_id\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- Spec SHA: \`${EXPECTED_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Preview workflow run did not appear"
          exit 1
