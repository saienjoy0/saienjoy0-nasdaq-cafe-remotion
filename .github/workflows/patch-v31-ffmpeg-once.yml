name: Patch v3.1 ffmpeg Once

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - .github/workflows/patch-v31-ffmpeg-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/visual-story-engine-v2
          fetch-depth: 0

      - name: Insert ffmpeg setup and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-v31-stabilization-once.yml')
          source = path.read_text(encoding='utf-8')
          marker = '''      - name: Run full runtime and visual contracts
          id: contracts
          run: |
          '''
          step = '''      - name: Ensure ffmpeg is available
          id: ffmpeg
          timeout-minutes: 10
          shell: bash
          run: |
            set -euo pipefail
            if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
              for attempt in 1 2 3; do
                if sudo apt-get update && sudo apt-get install -y ffmpeg; then
                  break
                fi
                if [[ "$attempt" = "3" ]]; then
                  echo "::error::ffmpeg installation failed after 3 attempts"
                  exit 1
                fi
                sleep $((attempt * 10))
              done
            fi
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1

          '''
          if 'name: Ensure ffmpeg is available' not in source:
              if marker not in source:
                  raise SystemExit('runtime contract marker not found')
              source = source.replace(marker, step + marker, 1)
          path.write_text(source, encoding='utf-8')
          PY
          rm .github/workflows/patch-v31-ffmpeg-once.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/apply-v31-stabilization-once.yml .github/workflows/patch-v31-ffmpeg-once.yml
          git diff --cached --check
          git commit -m "Prepare ffmpeg for v3.1 verification"
          git push origin HEAD:feature/visual-story-engine-v2
