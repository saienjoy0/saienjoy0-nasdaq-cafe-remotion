name: Apply Measured Diversity Repair V3 2026-08-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-measured-diversity-fix-v3-2026-08-06.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: measured-diversity-repair-v3-2026-08-06
  cancel-in-progress: false

jobs:
  repair-validate-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EPISODE_DATE: "2026-08-06"
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      READY_PATH: "render-specs/2026-08-06/production_ready.json"
      PACKAGE_PATH: "episode-packages/2026-08-06/episode_package_2026-08-06.md"
      REPORT_PATH: "preview-status/2026-08-06/normalization_report.json"
      EXPECTED_TTS_INPUT_SHA256: "b4743df29c22902365d06a7a7a548a41131fe806a2a67ac75431198dc9c59509"
      TTS_CACHE_COMPATIBILITY_SHA256: "d35fe5c048bfcf6c07652c434e6773e4bde7d59dc2b875689709d5b6819ce9c4"
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      SPEC_TTS_CACHE_ONLY: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Apply three contract-valid Stage changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path

          spec_path = Path("render-specs/2026-08-06/render_spec.json")
          ready_path = Path("render-specs/2026-08-06/production_ready.json")
          package_path = Path("episode-packages/2026-08-06/episode_package_2026-08-06.md")
          report_path = Path("preview-status/2026-08-06/normalization_report.json")
          expected_tts = "b4743df29c22902365d06a7a7a548a41131fe806a2a67ac75431198dc9c59509"

          plans = {
            "scene-01-beat-002": ("evidence", "evidence-boundary", "confirmed-vs-unconfirmed", "split AI demand existence from demand winner"),
            "scene-03-beat-002": ("contradiction", "opening-contradiction", "default", "contrast strong revenue outlook with margin caution"),
            "scene-08-beat-002": ("evidence", "evidence-boundary", "confirmed-vs-unconfirmed", "present strengthen/weaken conditions as evidence boundaries"),
          }

          ready = json.loads(ready_path.read_text(encoding="utf-8"))
          actual_tts = ready.get("rendererNormalization", {}).get("ttsInputSha256After")
          if actual_tts != expected_tts:
            raise SystemExit(f"TTS identity mismatch before repair: {actual_tts}")

          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          changes = []
          for scene in spec["scenes"]:
            for beat in scene["visualBeats"]:
              plan = plans.get(beat["beatId"])
              if plan is None:
                continue
              grammar, template, variant, reason = plan
              before = {
                "visualGrammarId": beat["visualGrammarId"],
                "visualTemplate": beat["visualTemplate"],
                "variant": beat["templateConfig"]["variant"],
                "viewerTexts": beat.get("viewerTexts", []),
                "objectIds": beat.get("objectIds", []),
              }
              beat["visualGrammarId"] = grammar
              beat["visualTemplate"] = template
              beat["templateConfig"]["variant"] = variant
              after = {
                "visualGrammarId": beat["visualGrammarId"],
                "visualTemplate": beat["visualTemplate"],
                "variant": beat["templateConfig"]["variant"],
                "viewerTexts": beat.get("viewerTexts", []),
                "objectIds": beat.get("objectIds", []),
              }
              if before["viewerTexts"] != after["viewerTexts"] or before["objectIds"] != after["objectIds"]:
                raise SystemExit(f"viewer content changed: {beat['beatId']}")
              changes.append({"beatId": beat["beatId"], "before": before, "after": after, "reason": reason})
          if len(changes) != 3:
            raise SystemExit(f"expected three changes, got {len(changes)}")

          encoded = json.dumps(spec, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          spec_path.write_text(encoded, encoding="utf-8")
          spec_sha = hashlib.sha256(encoded.encode("utf-8")).hexdigest()
          repair = {
            "status": "pending-post-tts-measurement",
            "changes": changes,
            "narrationChanged": False,
            "captionsChanged": False,
            "numbersChanged": False,
            "sourcesChanged": False,
            "sceneOrderChanged": False,
            "ttsIdentityChanged": False,
          }
          ready["renderSpecSha256"] = spec_sha
          ready.setdefault("rendererNormalization", {})["measuredDiversityRepair"] = repair
          ready_path.write_text(json.dumps(ready, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          report["normalizedRenderSpecSha256"] = spec_sha
          report["measuredDiversityRepair"] = repair
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          text = package_path.read_text(encoding="utf-8")
          def replace_in_beat(text, beat_id, pairs):
            marker = f"- **{beat_id}**"
            start = text.index(marker)
            bounds = [p for p in [text.find("\n- **", start + len(marker)), text.find("\n### 完成ナレーション", start)] if p >= 0]
            if not bounds:
              raise SystemExit(f"package block end missing: {beat_id}")
            end = min(bounds)
            block = text[start:end]
            for old, new in pairs:
              if old not in block:
                raise SystemExit(f"package field missing in {beat_id}: {old}")
              block = block.replace(old, new, 1)
            return text[:start] + block + text[end:]

          text = replace_in_beat(text, "scene-01-beat-002", [
            ("  - Visual Template ID：hero-number", "  - Visual Template ID：evidence-boundary"),
            ("  - Template Variant：default", "  - Template Variant：confirmed-vs-unconfirmed"),
          ])
          text = replace_in_beat(text, "scene-03-beat-002", [
            ("  - Visual Grammar：evidence / continuation", "  - Visual Grammar：contradiction / continuation"),
            ("  - Visual Template ID：metric-comparison-board", "  - Visual Template ID：opening-contradiction"),
          ])
          text = replace_in_beat(text, "scene-08-beat-002", [
            ("  - Visual Grammar：verification / continuation", "  - Visual Grammar：evidence / continuation"),
            ("  - Visual Template ID：verification-checklist", "  - Visual Template ID：evidence-boundary"),
            ("  - Template Variant：default", "  - Template Variant：confirmed-vs-unconfirmed"),
          ])
          package_path.write_text(text, encoding="utf-8")
          print(json.dumps({"renderSpecSha256": spec_sha, "changes": changes}, ensure_ascii=False))
          PY

      - name: Run formal validator
        run: npm run episode:spec:validate -- "$SPEC_PATH"

      - name: Restore exact two-block TTS cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: Linux-spec-tts-block-v2-${{ env.TTS_CACHE_COMPATIBILITY_SHA256 }}-${{ env.EXPECTED_TTS_INPUT_SHA256 }}
          restore-keys: |
            Linux-spec-tts-block-v2-${{ env.TTS_CACHE_COMPATIBILITY_SHA256 }}-${{ env.EXPECTED_TTS_INPUT_SHA256 }}-partial-

      - name: Compile cache-only and require measured diversity PASS
        shell: bash
        run: |
          set -euo pipefail
          npm run episode:spec:compile -- "$SPEC_PATH"
          TECH="build/${EPISODE_DATE}/technical_report.json"
          test "$(jq -r '.visualGrammarTiming.status' "$TECH")" = "PASS"
          test "$(jq -r '.visualGrammarTiming.unresolvedStateCount' "$TECH")" = "0"
          TIMING="$(jq -r '.visualGrammarTiming.path' "$TECH")"
          test -s "$TIMING"
          jq '{status,metrics,failures,warnings,beats}' "$TIMING" > "preview-status/${EPISODE_DATE}/measured_diversity_repair_report.json"

      - name: Confirm editorial and TTS identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.rendererNormalization.ttsInputSha256After' "$READY_PATH")" = "$EXPECTED_TTS_INPUT_SHA256"
          jq -e '.rendererNormalization.measuredDiversityRepair | .narrationChanged == false and .captionsChanged == false and .numbersChanged == false and .sourcesChanged == false and .sceneOrderChanged == false and .ttsIdentityChanged == false' "$READY_PATH"

      - name: Mark PASS and commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          for raw in ["render-specs/2026-08-06/production_ready.json", "preview-status/2026-08-06/normalization_report.json"]:
            path = Path(raw)
            value = json.loads(path.read_text(encoding="utf-8"))
            repair = value["rendererNormalization"]["measuredDiversityRepair"] if "rendererNormalization" in value else value["measuredDiversityRepair"]
            repair.update({"status": "PASS", "timingBasis": "post-tts-production-data", "unresolvedStateCount": 0})
            path.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_PATH" "$READY_PATH" "$PACKAGE_PATH" "$REPORT_PATH" "preview-status/${EPISODE_DATE}/measured_diversity_repair_report.json"
          git rm --ignore-unmatch .github/workflows/apply-measured-diversity-fix-2026-08-06.yml
          git rm --ignore-unmatch .github/workflows/apply-measured-diversity-fix-v2-2026-08-06.yml
          git rm .github/workflows/apply-measured-diversity-fix-v3-2026-08-06.yml
          git commit -m "Repair measured Visual Grammar diversity for 2026-08-06"
          git pull --rebase origin main
          git push origin HEAD:main
