name: Apply Tailwind Headwind Repair 2026-08-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-tailwind-headwind-fix-2026-08-06.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-tailwind-headwind-fix-2026-08-06
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      EPISODE_DATE: "2026-08-06"
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      READY_PATH: "render-specs/2026-08-06/production_ready.json"
      PACKAGE_PATH: "episode-packages/2026-08-06/episode_package_2026-08-06.md"
      EXPECTED_TTS_INPUT_SHA256: "b4743df29c22902365d06a7a7a548a41131fe806a2a67ac75431198dc9c59509"
      TTS_CACHE_COMPATIBILITY_SHA256: "d35fe5c048bfcf6c07652c434e6773e4bde7d59dc2b875689709d5b6819ce9c4"
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      SPEC_TTS_CACHE_ONLY: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Apply lane, renderer, and Scene 3 layout repairs
        run: |
          python3 scripts/apply_tailwind_headwind_lane_fix.py
          python3 scripts/apply_tailwind_renderer_fix.py
          python3 scripts/apply_scene3_split_comparison_fix.py

      - name: Run formal validator and complete contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run episode:spec:validate -- "$SPEC_PATH"
          npm run test:visual-templates
          npm run typecheck
          npm run test:spec
          npm run build

      - name: Restore exact two-block TTS cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: Linux-spec-tts-block-v2-${{ env.TTS_CACHE_COMPATIBILITY_SHA256 }}-${{ env.EXPECTED_TTS_INPUT_SHA256 }}
          restore-keys: |
            Linux-spec-tts-block-v2-${{ env.TTS_CACHE_COMPATIBILITY_SHA256 }}-${{ env.EXPECTED_TTS_INPUT_SHA256 }}-partial-

      - name: Compile cached production data and inspect exact public layout
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.rendererNormalization.ttsInputSha256After' "$READY_PATH")" = "$EXPECTED_TTS_INPUT_SHA256"
          npm run episode:spec:compile -- "$SPEC_PATH"
          TECH="build/${EPISODE_DATE}/technical_report.json"
          DATA="build/${EPISODE_DATE}/render_data.production.json"
          test "$(jq -r '.visualGrammarTiming.status' "$TECH")" = "PASS"
          test "$(jq -r '.visualGrammarTiming.unresolvedStateCount' "$TECH")" = "0"
          test -s "$DATA"
          node --import tsx --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {assertSpecLayoutFits} from "./src/spec/validate-render-layout.ts";
            const data = JSON.parse(readFileSync("build/2026-08-06/render_data.production.json", "utf8"));
            assertSpecLayoutFits(data);
            console.log("PASS: exact production data layout fits");
          '

      - name: Mark repairs PASS and confirm immutable editorial identity
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          repair_keys = ["tailwindHeadwindLaneRepair", "scene3LayoutCompatibilityRepair"]
          for raw in [
              "render-specs/2026-08-06/production_ready.json",
              "preview-status/2026-08-06/normalization_report.json",
          ]:
              path = Path(raw)
              value = json.loads(path.read_text(encoding="utf-8"))
              container = value["rendererNormalization"] if "rendererNormalization" in value else value
              for key in repair_keys:
                  repair = container[key]
                  repair.update({
                      "status": "PASS",
                      "validationBasis": "formal-validator-cached-tts-production-layout",
                      "unresolvedStateCount": 0,
                  })
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          test "$(jq -r '.rendererNormalization.ttsInputSha256After' "$READY_PATH")" = "$EXPECTED_TTS_INPUT_SHA256"
          jq -e '.rendererNormalization.tailwindHeadwindLaneRepair | .narrationChanged == false and .captionsChanged == false and .numbersChanged == false and .sourcesChanged == false and .sceneOrderChanged == false and .ttsIdentityChanged == false' "$READY_PATH"
          jq -e '.rendererNormalization.scene3LayoutCompatibilityRepair | .narrationChanged == false and .captionsChanged == false and .numbersChanged == false and .sourcesChanged == false and .sceneOrderChanged == false and .ttsIdentityChanged == false' "$READY_PATH"
          test "$(jq -r '.renderSpecSha256' "$READY_PATH")" = "$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          test "$(jq -r '.episodePackageSha256' "$READY_PATH")" = "$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')"

      - name: Commit tested repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$SPEC_PATH" \
            "$READY_PATH" \
            "$PACKAGE_PATH" \
            preview-status/2026-08-06/normalization_report.json \
            src/components/spec/VisualTemplateRenderer.tsx \
            scripts/test-visual-templates.ts
          git rm scripts/apply_tailwind_headwind_lane_fix.py
          git rm scripts/apply_tailwind_renderer_fix.py
          git rm scripts/apply_scene3_split_comparison_fix.py
          git rm .github/workflows/apply-tailwind-headwind-fix-2026-08-06.yml
          git commit -m "Repair Scene 2 lanes and Scene 3 comparison layout"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dispatch formal Preview from repaired main
        id: dispatch_preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NEW_SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          HEAD_SHA="$(git rev-parse HEAD)"
          test "$(jq -r '.renderSpecSha256' "$READY_PATH")" = "$NEW_SPEC_SHA"
          gh workflow run nasdaq-cafe-preview.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f episode_date="$EPISODE_DATE" \
            -f expected_spec_sha256="$NEW_SPEC_SHA" \
            -f confirmation=PREVIEW
          for attempt in $(seq 1 40); do
            RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nasdaq-cafe-preview.yml --event workflow_dispatch --limit 20 --json databaseId,headSha)"
            RUN_ID="$(jq -r --arg head "$HEAD_SHA" '[.[] | select(.headSha == $head)][0].databaseId // empty' <<<"$RUNS")"
            if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "spec_sha=$NEW_SPEC_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Unable to identify dispatched formal Preview"
          exit 1

      - name: Record Preview dispatch receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.dispatch_preview.outputs.run_id }}"
          SPEC_SHA="${{ steps.dispatch_preview.outputs.spec_sha }}"
          mkdir -p "preview-status/$EPISODE_DATE"
          jq -n \
            --arg episodeDate "$EPISODE_DATE" \
            --arg specSha256 "$SPEC_SHA" \
            --arg runId "$RUN_ID" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            '{version:1,episodeDate:$episodeDate,specSha256:$specSha256,runId:($runId|tonumber),url:$url,status:"dispatched",finalAuthorized:false}' \
            > "preview-status/$EPISODE_DATE/post_repair_preview_dispatch.json"
          git add "preview-status/$EPISODE_DATE/post_repair_preview_dispatch.json"
          git commit -m "Record repaired Preview dispatch"
          git pull --rebase origin main
          git push origin HEAD:main
