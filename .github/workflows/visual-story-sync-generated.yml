name: One-time Visual Story Contract Sync

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - "src/spec/render-spec.ts"
      - "src/spec/motion-preset-contract.ts"
      - "src/spec/visual-template-contract.ts"
      - "scripts/migrate-visual-story-v2.ts"
      - ".github/workflows/visual-story-sync-generated.yml"

permissions:
  contents: write

concurrency:
  group: visual-story-contract-sync
  cancel-in-progress: false

jobs:
  sync-generated-contracts:
    if: ${{ !contains(github.event.head_commit.message, '[visual-story-generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/visual-story-engine-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate JSON Schema
        run: npm run episode:spec:schema

      - name: Generate explicit Visual Story inputs
        run: |
          node --import tsx scripts/migrate-visual-story-v2.ts \
            --output-dir build/visual-story-sync \
            render-specs/2026-07-31/render_spec.json \
            render-specs/fixtures/minimal/render_spec.json \
            render-specs/fixtures/complete-9scene/render_spec.json \
            render-specs/fixtures/renderable-9scene/render_spec.json \
            render-specs/fixtures/schema-all-expressions/render_spec.json

      - name: Replace committed render specs
        shell: bash
        run: |
          set -euo pipefail
          cp build/visual-story-sync/render-specs/2026-07-31/render_spec.json render-specs/2026-07-31/render_spec.json
          cp build/visual-story-sync/render-specs/fixtures/minimal/render_spec.json render-specs/fixtures/minimal/render_spec.json
          cp build/visual-story-sync/render-specs/fixtures/complete-9scene/render_spec.json render-specs/fixtures/complete-9scene/render_spec.json
          cp build/visual-story-sync/render-specs/fixtures/renderable-9scene/render_spec.json render-specs/fixtures/renderable-9scene/render_spec.json
          cp build/visual-story-sync/render-specs/fixtures/schema-all-expressions/render_spec.json render-specs/fixtures/schema-all-expressions/render_spec.json

      - name: Commit deterministic generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/render_spec.schema.json render-specs/2026-07-31/render_spec.json render-specs/fixtures/*/render_spec.json
          if git diff --cached --quiet; then
            echo "Generated files already current"
            exit 0
          fi
          git commit -m "[visual-story-generated] Sync schema and explicit motion specs"
          git push origin HEAD:feature/visual-story-engine-v2
