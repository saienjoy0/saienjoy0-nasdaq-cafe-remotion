name: Verify Visual Rhythm Scene 8 2026-08-06

on:
  push:
    branches:
      - fix/visual-rhythm-2026-08-06
    paths:
      - .github/workflows/verify-visual-rhythm-scene8-2026-08-06.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: verify-visual-rhythm-scene8-2026-08-06
  cancel-in-progress: true

jobs:
  verify-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "true"
      EPISODE_DATE: "2026-08-06"
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      TTS_INPUT_SHA: "b4743df29c22902365d06a7a7a548a41131fe806a2a67ac75431198dc9c59509"
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      SPEC_TTS_CACHE_ONLY: "1"

    steps:
      - name: Checkout repaired branch
        uses: actions/checkout@v6
        with:
          ref: fix/visual-rhythm-2026-08-06
          fetch-depth: 0

      - name: Record run receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-status/2026-08-06
          jq -n --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" --arg headSha "$GITHUB_SHA" \
            '{runId:($runId|tonumber),runAttempt:($runAttempt|tonumber),headSha:$headSha,status:"scene8-verification-started"}' \
            > preview-status/2026-08-06/visual_rhythm_scene8_run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-status/2026-08-06/visual_rhythm_scene8_run.json
          git commit -m "Record Scene 8 visual verification run" || true
          git push origin HEAD:fix/visual-rhythm-2026-08-06

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Validate all visual contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:stage-legibility
          npm run test:visual-story
          npm run episode:spec:validate -- "$SPEC_PATH"
          npm run build

      - name: Restore exact two-block TTS cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ env.TTS_INPUT_SHA }}
          fail-on-cache-miss: true

      - name: Compile exact production timing
        shell: bash
        run: |
          set -euo pipefail
          npm run episode:spec:compile -- "$SPEC_PATH"
          test "$(jq -r '.visualGrammarTiming.status' "build/${EPISODE_DATE}/technical_report.json")" = "PASS"
          test "$(jq -r '.visualGrammarTiming.unresolvedStateCount' "build/${EPISODE_DATE}/technical_report.json")" = "0"

      - name: Remove one-time verification workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-visual-rhythm-scene8-2026-08-06.yml
          git commit -m "Remove Scene 8 visual verification workflow"
          git push origin HEAD:fix/visual-rhythm-2026-08-06

      - name: Render repaired Preview from cached TTS
        timeout-minutes: 50
        run: npm run episode:spec:preview -- "$SPEC_PATH"

      - name: Inspect repaired MP4
        shell: bash
        run: |
          set -euo pipefail
          MP4="renders/preview/${EPISODE_DATE}_nasdaq-cafe-spec-preview.mp4"
          test -s "$MP4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json "$MP4" > "build/${EPISODE_DATE}/visual_rhythm_scene8_ffprobe.json"
          ffmpeg -v error -i "$MP4" -f null -

      - name: Upload final repaired Preview
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-visual-rhythm-scene8-preview-${{ env.EPISODE_DATE }}-${{ github.run_id }}
          path: |
            renders/preview/${{ env.EPISODE_DATE }}_nasdaq-cafe-spec-preview.mp4
            build/${{ env.EPISODE_DATE }}/technical_report.json
            build/${{ env.EPISODE_DATE }}/render_data.production.json
            build/${{ env.EPISODE_DATE }}/visual_rhythm_scene8_ffprobe.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
