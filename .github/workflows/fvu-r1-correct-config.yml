name: FVU R1 Correct Config

on:
  pull_request:
    paths:
      - "scripts/fvu-r1-correct-config.py"
      - ".github/workflows/fvu-r1-correct-config.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/fvu-r1-financial-render-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Correct input/output type compatibility
        run: python3 scripts/fvu-r1-correct-config.py
      - name: Regenerate JSON schema
        run: npm run episode:spec:schema
      - name: Commit correction
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git add -- \
            src/spec/render-spec.ts \
            scripts/apply-financial-render-contract.py \
            scripts/test-financial-visual-contract.ts \
            schemas/render_spec.schema.json
          if git diff --cached --quiet; then
            echo "No correction required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve legacy template config input compatibility"
          git push origin "HEAD:${HEAD_REF}"
