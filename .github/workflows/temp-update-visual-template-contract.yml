name: TEMP Update Visual Template Contract

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  carrier:
    runs-on: ubuntu-24.04
    steps:
      - name: Embedded updater carrier
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # 1. Make the concrete Visual Template ID and its data contract mandatory.
          path = Path('src/spec/render-spec.ts')
          text = path.read_text(encoding='utf-8')
          old = '''export const specVisualModeSchema = z.enum([
            "conclusion-card", "number-comparison", "expected-actual-gap", "timeline",
            "chart", "causal-diagram", "stock-comparison", "news-media",
            "verification-points", "text-focus",
          ]);
          export const visualBeatFunctionSchema = z.enum(['''
          new = '''export const specVisualModeSchema = z.enum([
            "conclusion-card", "number-comparison", "expected-actual-gap", "timeline",
            "chart", "causal-diagram", "stock-comparison", "news-media",
            "verification-points", "text-focus",
          ]);
          export const visualTemplateSchema = z.enum([
            "opening-contradiction", "closing-recap", "conclusion-card",
            "expected-actual-bullet", "expected-actual-gap-flow", "metric-comparison-board",
            "index-return-bars", "diverging-stock-bars", "causal-lane",
            "tailwind-headwind", "evidence-boundary", "verification-checklist",
            "verification-matrix", "analogy-steps", "entity-card-full",
            "news-media", "text-focus",
          ]);
          export const visualTemplateVariantSchema = z.enum([
            "default", "left-to-right", "zero-baseline", "center-zero", "two-lane",
            "confirmed-vs-unconfirmed", "strengthen-vs-weaken", "prebuilt-card",
          ]);
          const visualTemplateConfigSchema = z.object({
            variant: visualTemplateVariantSchema,
            comparisonBasis: nullableText,
            dataBasis: nonEmptyText,
            nodeOrder: z.array(safeId).max(4),
            laneLabels: z.array(nonEmptyText).max(2),
            outcomeNodeId: safeId.nullable(),
          }).strict();
          export const visualBeatFunctionSchema = z.enum(['''
          text = replace_once(text, old, new, 'render-spec template schemas')
          text = replace_once(
              text,
              '''  screenState: screenStateSchema,
            visualMode: specVisualModeSchema,
            contentType: nonEmptyText,''',
              '''  screenState: screenStateSchema,
            visualMode: specVisualModeSchema,
            visualTemplate: visualTemplateSchema,
            templateConfig: visualTemplateConfigSchema,
            contentType: nonEmptyText,''',
              'render-spec visual beat fields',
          )
          text = replace_once(text, 'schemaVersion: z.literal("2.1.0")', 'schemaVersion: z.literal("2.2.0")', 'render-spec version')
          path.write_text(text, encoding='utf-8')

          # 2. Carry the explicit template unchanged into the public render view model.
          path = Path('src/spec/public-view-model.ts')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''  primaryFunction: ProductionScene["visualBeats"][number]["primaryFunction"];
            beatProgress: number;''',
              '''  primaryFunction: ProductionScene["visualBeats"][number]["primaryFunction"];
            visualTemplate: ProductionScene["visualBeats"][number]["visualTemplate"];
            templateConfig: ProductionScene["visualBeats"][number]["templateConfig"];
            beatProgress: number;''',
              'public view model type',
          )
          text = replace_once(
              text,
              '''          primaryFunction: beat.primaryFunction,
                    beatProgress,''',
              '''          primaryFunction: beat.primaryFunction,
                    visualTemplate: beat.visualTemplate,
                    templateConfig: beat.templateConfig,
                    beatProgress,''',
              'public view model construction',
          )
          path.write_text(text, encoding='utf-8')

          # 3. Render only from visualTemplate. Scene numbers and prose are not selectors.
          path = Path('src/components/spec/SpecVisualModes.tsx')
          text = path.read_text(encoding='utf-8')

          opening = re.compile(r'const OpeningContradiction: React\.FC<\{content: PublicMainContent\}> = \(\{content\}\) => \{.*?\n\};\n\nconst ClosingRecap:', re.S)
          opening_replacement = '''const OpeningContradiction: React.FC<{content: PublicMainContent}> = ({content}) => {
            const card = content.cards[0];
            const market = card?.lines.find((line) => line.label.includes("NASDAQ"));
            const center = card?.lines.find((line) => line.label.includes("中心"));
            const items = content.texts.filter((item) => !item.includes("NASDAQ")).slice(0, 3);
            return <Surface style={{padding: "34px 44px", display: "grid", gridTemplateRows: "auto 1fr auto", gap: 22}} accent={colors.emphasis}>
              <div style={{display: "flex", alignItems: "center", justifyContent: "space-between", ...stagedStyle(content.beatProgress, 0, 5)}}>
                <div><Label tone="positive">昨夜の方向</Label><div style={{marginTop: 12, fontSize: 36, color: colors.mutedInk, fontWeight: 850}}>NASDAQ</div></div>
                <div style={{fontSize: 88, lineHeight: 1, fontWeight: 950, color: colors.positive}}>{market?.value ?? content.texts.find((item) => item.includes("NASDAQ")) ?? "+1.00%"}</div>
              </div>
              <div style={{display: "grid", gridTemplateColumns: `repeat(${Math.max(1, items.length)},minmax(0,1fr))`, gap: 18, alignItems: "stretch"}}>
                {items.map((item, index) => <div key={item} style={{...stagedStyle(content.beatProgress, index + 1, 5), borderRadius: 22, padding: "24px 22px", background: index === 0 ? "rgba(12,138,102,.10)" : index === 1 ? "rgba(184,107,0,.10)" : "rgba(199,62,77,.10)", border: `3px solid ${index === 0 ? colors.positive : index === 1 ? colors.warning : colors.negative}`, display: "flex", alignItems: "center", justifyContent: "center", textAlign: "center", fontSize: 38, lineHeight: 1.28, fontWeight: 950}}>{item}</div>)}
              </div>
              <div style={{...stagedStyle(content.beatProgress, 4, 5), display: "flex", alignItems: "center", justifyContent: "space-between", gap: 24}}>
                <div style={{fontSize: 31, color: colors.mutedInk, fontWeight: 850}}>全部のテックが同じ理由で上がった夜ではない</div>
                <div style={{fontSize: 36, color: colors.emphasis, fontWeight: 950}}>{center?.value ?? "市場は何を評価した？"}</div>
              </div>
            </Surface>;
          };

          const ClosingRecap:'''
          text, count = opening.subn(opening_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'opening replacement count={count}')

          closing = re.compile(r'const ClosingRecap: React\.FC<\{content: PublicMainContent\}> = \(\{content\}\) => \{.*?\n\};\n\nconst ConclusionCard:', re.S)
          closing_replacement = '''const ClosingRecap: React.FC<{content: PublicMainContent}> = ({content}) => {
            const line = content.cards[0]?.lines[0];
            const conclusion = line?.value ?? content.texts.at(-1) ?? content.headline;
            const chips = content.texts.filter((item) => item !== conclusion).slice(0, 3);
            return <Surface style={{padding: "42px 54px", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center"}} accent={colors.emphasis}>
              <div style={{...stagedStyle(content.beatProgress, 0, 5)}}><Label tone="emphasis">今朝の結論</Label></div>
              <div style={{display: "flex", gap: 16, marginTop: 28, width: "100%", justifyContent: "center"}}>{chips.map((chip, index) => <div key={chip} style={{...stagedStyle(content.beatProgress, index + 1, 5), flex: 1, maxWidth: 350, padding: "16px 18px", borderRadius: 18, background: "rgba(83,118,146,.10)", border: "2px solid rgba(83,118,146,.35)", fontSize: 28, fontWeight: 900}}>{chip}</div>)}</div>
              <div style={{...stagedStyle(content.beatProgress, 4, 5), marginTop: 34, fontSize: 82, lineHeight: 1.15, color: colors.emphasis, fontWeight: 950}}>{conclusion}</div>
              <div style={{marginTop: 34, width: "62%", height: 6, borderRadius: 999, background: `linear-gradient(90deg,transparent,${colors.cyan},transparent)`}}/>
            </Surface>;
          };

          const ConclusionCard:'''
          text, count = closing.subn(closing_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'closing replacement count={count}')

          text = replace_once(
              text,
              '''const ConclusionCard: React.FC<{content: PublicMainContent}> = ({content}) => {
            if (content.sceneNumber === 1) return <OpeningContradiction content={content}/>;
            if (content.sceneNumber === 9) return <ClosingRecap content={content}/>;
            const card = content.cards[0];''',
              '''const ConclusionCard: React.FC<{content: PublicMainContent}> = ({content}) => {
            const card = content.cards[0];''',
              'remove conclusion scene inference',
          )
          text = replace_once(
              text,
              '''const TextFocus: React.FC<{content: PublicMainContent}> = ({content}) => {
            if (content.primaryElement.includes("たとえ")) return <AnalogySteps content={content}/>;
            return <Surface''',
              '''const TextFocus: React.FC<{content: PublicMainContent}> = ({content}) => {
            return <Surface''',
              'remove text inference',
          )

          matrix = re.compile(r'const VerificationMatrix: React\.FC<\{content: PublicMainContent\}> = \(\{content\}\) => \{.*?\n\};\n\nconst CausalDiagram:', re.S)
          matrix_replacement = '''const splitLaneTexts = (content: PublicMainContent, label: string): string[] => content.texts
            .filter((item) => item.startsWith(`${label}｜`))
            .map((item) => item.slice(label.length + 1));

          const VerificationMatrix: React.FC<{content: PublicMainContent}> = ({content}) => {
            const [strengthenLabel = "強まる", weakenLabel = "弱まる"] = content.templateConfig.laneLabels;
            const lanes = [
              {label: strengthenLabel, items: splitLaneTexts(content, strengthenLabel), tone: "positive" as const},
              {label: weakenLabel, items: splitLaneTexts(content, weakenLabel), tone: "warning" as const},
            ];
            return <Surface style={{padding: "34px 40px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 26}} accent={colors.emphasis}>
              {lanes.map((lane, laneIndex) => <div key={lane.label} style={{...stagedStyle(content.beatProgress, laneIndex, 2), borderRadius: 24, padding: "30px", background: `${toneColor(lane.tone)}12`, border: `3px solid ${toneColor(lane.tone)}`}}>
                <Label tone={lane.tone}>仮説が{lane.label}</Label>
                <div style={{marginTop: 24, display: "grid", gap: 18}}>{lane.items.map((item) => <div key={item} style={{padding: "18px 20px", borderRadius: 18, background: "rgba(255,255,255,.55)", fontSize: 32, lineHeight: 1.35, fontWeight: 900}}>{item}</div>)}</div>
              </div>)}
            </Surface>;
          };

          const TailwindHeadwind: React.FC<{content: PublicMainContent}> = ({content}) => {
            const [tailwindLabel = "追い風", headwindLabel = "向かい風"] = content.templateConfig.laneLabels;
            const lanes = [
              {label: tailwindLabel, items: splitLaneTexts(content, tailwindLabel), tone: "positive" as const},
              {label: headwindLabel, items: splitLaneTexts(content, headwindLabel), tone: "warning" as const},
            ];
            return <Surface style={{padding: "34px 40px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 26}} accent={colors.emphasis}>
              {lanes.map((lane, laneIndex) => <div key={lane.label} style={{...stagedStyle(content.beatProgress, laneIndex, 2), borderRadius: 24, padding: "30px", background: `${toneColor(lane.tone)}12`, border: `3px solid ${toneColor(lane.tone)}`, display: "flex", flexDirection: "column"}}>
                <Label tone={lane.tone}>{lane.label}</Label>
                <div style={{marginTop: 26, display: "grid", gap: 18}}>{lane.items.map((item, index) => <div key={item} style={{display: "grid", gridTemplateColumns: "42px 1fr", gap: 14, alignItems: "start", fontSize: 34, lineHeight: 1.35, fontWeight: 900}}><span style={{color: toneColor(lane.tone)}}>{index + 1}</span><span>{item}</span></div>)}</div>
              </div>)}
            </Surface>;
          };

          const CausalDiagram:'''
          text, count = matrix.subn(matrix_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'matrix replacement count={count}')

          switch = re.compile(r'export const SpecVisualMode: React\.FC<\{content: PublicMainContent\}> = \(\{content\}\) => \{.*?\n\};\s*$', re.S)
          switch_replacement = '''void NumberComparison;
          void Timeline;
          void Chart;
          void CausalDiagram;
          void StockComparison;

          export const SpecVisualMode: React.FC<{content: PublicMainContent}> = ({content}) => {
            switch (content.visualTemplate) {
              case "opening-contradiction": return <OpeningContradiction content={content}/>;
              case "closing-recap": return <ClosingRecap content={content}/>;
              case "conclusion-card": return <ConclusionCard content={content}/>;
              case "expected-actual-bullet": return <ExpectedActualBullet content={content}/>;
              case "expected-actual-gap-flow": return <ExpectedActualGap content={content}/>;
              case "metric-comparison-board": return <EvidenceMetricBoard content={content}/>;
              case "index-return-bars": return <ReturnBars content={content}/>;
              case "diverging-stock-bars": return <ReturnBars content={content} diverging/>;
              case "causal-lane": return <CausalLane content={content}/>;
              case "tailwind-headwind": return <TailwindHeadwind content={content}/>;
              case "evidence-boundary": return <EvidenceBoundary content={content}/>;
              case "verification-checklist": return <VerificationPoints content={content}/>;
              case "verification-matrix": return <VerificationMatrix content={content}/>;
              case "analogy-steps": return <AnalogySteps content={content}/>;
              case "entity-card-full": return <EntityFocus content={content}/>;
              case "news-media": return <NewsMedia content={content}/>;
              case "text-focus": return <TextFocus content={content}/>;
            }
          };
          '''
          text, count = switch.subn(switch_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'switch replacement count={count}')
          path.write_text(text, encoding='utf-8')

          # 4. Template-specific machine validation.
          path = Path('src/spec/validate-render-layout.ts')
          text = path.read_text(encoding='utf-8')
          needle = 'unused-placeholder'
          addition = '''      const template = beat.visualTemplate;
              const values = visibleNumbers
                .map((number) => Number(number.value.replace(/[^0-9+\\-.]/g, "")))
                .filter((value) => Number.isFinite(value));
              const requiresNumbers = ["expected-actual-bullet", "metric-comparison-board", "index-return-bars", "diverging-stock-bars"].includes(template);
              if (requiresNumbers && (visibleNumbers.length < 2 || visibleNumbers.length > 4)) throw new Error(`${path}.objectIds: ${template} requires two to four visible numbers`);
              if (template === "diverging-stock-bars" && !(values.some((value) => value < 0) && values.some((value) => value >= 0))) throw new Error(`${path}.objectIds: diverging-stock-bars requires both negative and non-negative values`);
              if (template === "expected-actual-gap-flow") {
                const roles = new Set(visibleCards.map((card) => card.role));
                for (const role of ["expected", "actual", "gap"] as const) if (!roles.has(role)) throw new Error(`${path}.objectIds: expected-actual-gap-flow missing ${role} card`);
              }
              if (template === "causal-lane") {
                assertCausalShape(visibleNodes.map((node) => node.nodeId), visibleArrows, `${path}.objectIds`);
                if (beat.templateConfig.nodeOrder.length !== visibleNodes.length || beat.templateConfig.nodeOrder.length < 2) throw new Error(`${path}.templateConfig.nodeOrder: causal-lane requires the complete two-to-four node order`);
                const order = beat.templateConfig.nodeOrder;
                for (let index = 0; index < order.length - 1; index += 1) if (!visibleArrows.some((arrow) => arrow.fromNodeId === order[index] && arrow.toNodeId === order[index + 1])) throw new Error(`${path}.templateConfig.nodeOrder: missing sequential arrow ${order[index]} -> ${order[index + 1]}`);
              }
              if (["tailwind-headwind", "verification-matrix"].includes(template)) {
                if (beat.templateConfig.laneLabels.length !== 2) throw new Error(`${path}.templateConfig.laneLabels: ${template} requires exactly two lanes`);
                for (const label of beat.templateConfig.laneLabels) if (!beat.viewerTexts.some((item) => item.startsWith(`${label}｜`))) throw new Error(`${path}.viewerTexts: ${template} requires an item prefixed ${label}｜`);
              }
              if (template === "evidence-boundary" && (!scene.uncertainty || beat.viewerTexts.length < 1)) throw new Error(`${path}: evidence-boundary requires confirmed viewer text and uncertainty`);
              if (template === "verification-checklist") {
                const itemCount = visibleCards.reduce((total, card) => total + card.lines.length, 0) || beat.viewerTexts.length;
                if (itemCount < 2 || itemCount > 4) throw new Error(`${path}: verification-checklist requires two to four items`);
              }
              if (template === "entity-card-full" && (beat.screenState !== "EntityFocus" || !beat.entity)) throw new Error(`${path}: entity-card-full requires EntityFocus and entity metadata`);
              if (template === "opening-contradiction" && scene.sceneNumber !== 1) throw new Error(`${path}: opening-contradiction is reserved for Scene 1`);
              if (template === "closing-recap" && scene.sceneNumber !== 9) throw new Error(`${path}: closing-recap is reserved for Scene 9`);
          '''
          text = replace_once(text, needle, addition, 'template validation insertion')
          path.write_text(text, encoding='utf-8')

          # 5. Teach generated fixtures the new required fields.
          path = Path('scripts/generate-render-spec-fixtures.ts')
          text = path.read_text(encoding='utf-8')
          marker = '''const modes = [
            "conclusion-card", "number-comparison", "expected-actual-gap", "timeline",
            "chart", "causal-diagram", "stock-comparison", "verification-points", "text-focus",
          ] as const;
          '''
          text = replace_once(
              text,
              marker,
              marker + '''const templateForMode = {
            "conclusion-card": "conclusion-card",
            "number-comparison": "metric-comparison-board",
            "expected-actual-gap": "expected-actual-gap-flow",
            timeline: "evidence-boundary",
            chart: "metric-comparison-board",
            "causal-diagram": "causal-lane",
            "stock-comparison": "diverging-stock-bars",
            "verification-points": "verification-checklist",
            "text-focus": "text-focus",
          } as const;
          ''',
              'fixture template map',
          )
          text = text.replace('{numberId: `${sceneId}-number-002`, label: "TEST NUMBER B", value: "20",', '{numberId: `${sceneId}-number-002`, label: "TEST NUMBER B", value: "-20",', 1)
          text = replace_once(
              text,
              '''    : mode === "chart"
                ? [{numberId: `${sceneId}-number-001`, label: "TEST CHART VALUE", value: "30", unit: "pt", comparison: null, tone: "emphasis"}]
                : [];''',
              '''    : mode === "chart"
                ? [
                    {numberId: `${sceneId}-number-001`, label: "TEST CHART VALUE A", value: "30", unit: "pt", comparison: "TEST BASE", tone: "emphasis"},
                    {numberId: `${sceneId}-number-002`, label: "TEST CHART VALUE B", value: "20", unit: "pt", comparison: "TEST BASE", tone: "neutral"},
                  ]
                : [];''',
              'fixture chart numbers',
          )
          old = 'unused-placeholder'
          new = 'unused-placeholder'
          text = replace_once(text, old, new, 'fixture beat fields')
          old = 'unused-placeholder'
          new = 'unused-placeholder'
          text = replace_once(text, old, new, 'fixture entity override')
          text = text.replace('schemaVersion: "2.1.0"', 'schemaVersion: "2.2.0"')
          path.write_text(text, encoding='utf-8')

          # 6. Migrate all retained render specs. 7/31 receives the editorially selected templates.
          comparison_templates = {"expected-actual-bullet", "metric-comparison-board", "index-return-bars", "diverging-stock-bars"}
          variants = {
              "opening-contradiction": "default", "closing-recap": "default", "conclusion-card": "default",
              "expected-actual-bullet": "zero-baseline", "expected-actual-gap-flow": "left-to-right",
              "metric-comparison-board": "default", "index-return-bars": "zero-baseline",
              "diverging-stock-bars": "center-zero", "causal-lane": "left-to-right",
              "tailwind-headwind": "two-lane", "evidence-boundary": "confirmed-vs-unconfirmed",
              "verification-checklist": "default", "verification-matrix": "strengthen-vs-weaken",
              "analogy-steps": "left-to-right", "entity-card-full": "prebuilt-card",
              "news-media": "default", "text-focus": "default",
          }

          def selected(scene, beat, key, id_key):
              ids = set(beat.get('objectIds', []))
              return [item for item in scene.get(key, []) if item.get(id_key) in ids]

          def graph_order(scene, beat):
              nodes = selected(scene, beat, 'nodes', 'nodeId')
              arrows = selected(scene, beat, 'arrows', 'arrowId')
              ids = [item['nodeId'] for item in nodes]
              if not ids:
                  return [], None, False
              incoming = {item: 0 for item in ids}
              outgoing = {item: [] for item in ids}
              for arrow in arrows:
                  source, target = arrow['fromNodeId'], arrow['toNodeId']
                  if source in outgoing and target in incoming:
                      outgoing[source].append(target)
                      incoming[target] += 1
              roots = [item for item in ids if incoming[item] == 0]
              sinks = [item for item in ids if not outgoing[item]]
              converging = len(sinks) == 1 and all(
                  item == sinks[0] or any(arrow['fromNodeId'] == item and arrow['toNodeId'] == sinks[0] for arrow in arrows)
                  for item in ids
              )
              if converging:
                  return [item for item in ids if item != sinks[0]] + [sinks[0]], sinks[0], True
              if len(roots) == 1:
                  order, current, seen = [], roots[0], set()
                  while current not in seen:
                      order.append(current)
                      seen.add(current)
                      if len(outgoing[current]) != 1:
                          break
                      current = outgoing[current][0]
                  if len(order) == len(ids):
                      return order, sinks[0] if len(sinks) == 1 else None, False
              return ids, sinks[0] if len(sinks) == 1 else None, False

          def numeric_values(scene, beat):
              values = []
              for item in selected(scene, beat, 'numbers', 'numberId'):
                  try:
                      values.append(float(re.sub(r'[^0-9+\-.]', '', item.get('value', ''))))
                  except ValueError:
                      pass
              return values

          def generic_template(scene, beat):
              if beat.get('screenState') == 'EntityFocus':
                  return 'entity-card-full'
              mode = beat.get('visualMode')
              numbers = selected(scene, beat, 'numbers', 'numberId')
              if mode == 'conclusion-card': return 'conclusion-card'
              if mode == 'expected-actual-gap': return 'expected-actual-gap-flow'
              if mode in {'number-comparison', 'chart'}: return 'metric-comparison-board' if len(numbers) >= 2 else 'text-focus'
              if mode == 'timeline': return 'evidence-boundary' if scene.get('uncertainty') else 'text-focus'
              if mode == 'stock-comparison':
                  values = numeric_values(scene, beat)
                  return 'diverging-stock-bars' if any(value < 0 for value in values) and any(value >= 0 for value in values) else ('metric-comparison-board' if len(numbers) >= 2 else 'text-focus')
              if mode == 'causal-diagram': return 'verification-matrix' if graph_order(scene, beat)[2] else 'causal-lane'
              if mode == 'verification-points': return 'verification-checklist'
              if mode == 'news-media': return 'news-media'
              return 'text-focus'

          for spec_path in Path('render-specs').rglob('render_spec.json'):
              spec = json.loads(spec_path.read_text(encoding='utf-8'))
              spec['schemaVersion'] = '2.2.0'
              for scene in spec.get('scenes', []):
                  for beat in scene.get('visualBeats', []):
                      template = generic_template(scene, beat)
                      order, outcome, converging = graph_order(scene, beat)
                      lane_labels = []
                      if template == 'verification-matrix':
                          lane_labels = ['強まる', '弱まる']
                          original = beat.get('viewerTexts', [])
                          beat['viewerTexts'] = ([f'強まる｜{item}' for item in original[:3]] or ['強まる｜確認条件がそろう']) + [f"弱まる｜{scene.get('uncertainty') or '反対材料が残る'}"]
                          beat['viewerTexts'] = beat['viewerTexts'][:4]
                      beat['visualTemplate'] = template
                      beat['templateConfig'] = {
                          'variant': variants[template],
                          'comparisonBasis': beat.get('screenQuestion') if template in comparison_templates else None,
                          'dataBasis': scene.get('timelineBasis') or scene.get('sourceLabel') or '確認済み制作入力',
                          'nodeOrder': order if template in {'causal-lane', 'verification-matrix'} else [],
                          'laneLabels': lane_labels,
                          'outcomeNodeId': outcome if template == 'verification-matrix' else None,
                      }

              if spec.get('episode', {}).get('id') == '2026-07-31':
                  overrides = {
                      'scene-01-beat-001': ('opening-contradiction', 'default', ['NASDAQ +1.00%', 'Amazon +15.32%', 'SOXX +0.07%', 'Apple -7.35%'], [], [], None),
                      'scene-01-beat-002': ('text-focus', 'default', None, [], [], None),
