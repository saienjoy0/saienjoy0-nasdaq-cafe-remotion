name: TEMP Finalize Visual Template Contract V2

on:
  push:
    branches: [main]
    paths:
      - .github/visual-template-final-v2-trigger

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: fix/spec-video-legibility
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse migration and remove internal public identifiers
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/temp-finalize-visual-template-contract.yml > /tmp/finalizer.yml
          python3 <<'PY'
          from pathlib import Path
          text = Path('/tmp/finalizer.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Reuse deterministic migration and align subtitle tests\n'
          end_marker = '      - name: Set up Node.js\n'
          section = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          block = section.split('        run: |\n', 1)[1]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          Path('/tmp/apply-contract.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-contract.sh
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/spec/public-view-model.ts')
          text = path.read_text(encoding='utf-8')
          for line in [
              '  sceneId: ProductionScene["sceneId"];\n',
              '  sceneNumber: number;\n',
              '  sceneRole: ProductionScene["sceneRole"];\n',
              '          sceneId: scene.sceneId,\n',
              '          sceneNumber: scene.sceneNumber,\n',
              '          sceneRole: scene.sceneRole,\n',
          ]:
              if text.count(line) != 1:
                  raise SystemExit(f'public identifier target count={text.count(line)}: {line.strip()}')
              text = text.replace(line, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install and regenerate schema
        id: install
        run: |
          set -euo pipefail
          npm ci
          npm run episode:spec:schema

      - name: Validate contract
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          {
            npm run typecheck
            npm run test:spec
            npm run build
            npm run episode:spec:validate -- render-specs/2026-07-31/render_spec.json
            grep -R '"visualTemplate"' render-specs/2026-07-31/render_spec.json >/dev/null
            grep -R 'switch (content.visualTemplate)' src/components/spec/SpecVisualModes.tsx >/dev/null
            ! grep -R 'switch (content.renderKind)' src/components/spec/SpecVisualModes.tsx
          } 2>&1 | tee /tmp/validate.log

      - name: Commit target branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/spec/render-spec.ts src/spec/public-view-model.ts src/components/spec/SpecVisualModes.tsx src/spec/validate-render-layout.ts scripts/generate-render-spec-fixtures.ts scripts/test-render-spec.ts scripts/test-spec-presentation.ts schemas/render_spec.schema.json render-specs episode-packages/2026-07-31/episode_package_2026-07-31.md docs/12_visual_template_contract.md
          git commit -m "feat: make visual templates explicit in script contract"
          git push origin HEAD:fix/spec-video-legibility
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        uses: actions/github-script@v8
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          RESULT_SHA: ${{ steps.commit.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/validate.log') ? fs.readFileSync('/tmp/validate.log', 'utf8').slice(-6000) : 'no validation log';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 25, body: [
              `RUN_ID=${process.env.RUN_ID}`,
              `VISUAL_TEMPLATE_CONTRACT_COMMIT=${process.env.RESULT_SHA || 'none'}`,
              `APPLY=${process.env.APPLY_OUTCOME}`,
              `INSTALL=${process.env.INSTALL_OUTCOME}`,
              `VALIDATE=${process.env.VALIDATE_OUTCOME}`,
              `COMMIT=${process.env.COMMIT_OUTCOME}`,
              'PREVIEW_NOT_RUN=true',
              'FINAL_NOT_RUN=true',
              '',
              '```text', log, '```'
            ].join('\n')});
