name: Apply Visual Story Engine v3 Once

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - .github/workflows/apply-visual-story-v3-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-story-engine-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch v3 contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/spec/render-spec.ts',
              '''import {
            VISUAL_TEMPLATE_IDS,
            VISUAL_TEMPLATE_VARIANT_IDS,
          } from "./visual-template-contract";
          ''',
              '''import {
            VISUAL_TEMPLATE_IDS,
            VISUAL_TEMPLATE_VARIANT_IDS,
          } from "./visual-template-contract";
          import {
            CAMERA_PRESET_IDS,
            SHOT_RECIPE_IDS,
            SHOT_TRANSITION_IDS,
            SOUND_CUE_IDS,
            STAGE_LAYOUT_IDS,
            TYPOGRAPHY_TREATMENT_IDS,
          } from "./shot-contract";
          ''',
          )
          replace_once(
              'src/spec/render-spec.ts',
              'export const easingPresetSchema = z.enum(EASING_PRESET_IDS);\n',
              '''export const easingPresetSchema = z.enum(EASING_PRESET_IDS);
          export const shotRecipeSchema = z.enum(SHOT_RECIPE_IDS);
          export const stageLayoutSchema = z.enum(STAGE_LAYOUT_IDS);
          export const cameraPresetSchema = z.enum(CAMERA_PRESET_IDS);
          export const shotTransitionSchema = z.enum(SHOT_TRANSITION_IDS);
          export const typographyTreatmentSchema = z.enum(TYPOGRAPHY_TREATMENT_IDS);
          export const soundCueSchema = z.enum(SOUND_CUE_IDS);
          ''',
          )
          shot_schema = '''const shotSchema = z.object({
            shotId: z.string().regex(/^scene-0[1-9]-beat-[0-9]{3}-shot-[0-9]{3}$/),
            shotRecipe: shotRecipeSchema,
            startChunkId: z.string().regex(/^scene-0[1-9]-chunk-[0-9]{3}$/),
            startOffsetMs: z.number().int().min(0).max(10_000),
            endChunkId: z.string().regex(/^scene-0[1-9]-chunk-[0-9]{3}$/),
            endOffsetMs: z.number().int().min(0).max(10_000),
            endCue: nonEmptyText,
            primaryTargetId: safeId.nullable(),
            stageLayout: stageLayoutSchema,
            cameraPreset: cameraPresetSchema,
            transitionIn: shotTransitionSchema,
            transitionOut: shotTransitionSchema,
            continuityKey: safeId.nullable(),
            typographyTreatment: typographyTreatmentSchema.nullable(),
            typographyText: nullableText,
            soundCue: soundCueSchema.nullable(),
            foxExpression: expressionSchema,
          }).strict().superRefine((shot, context) => {
            if (shot.typographyTreatment !== null && shot.typographyText === null) {
              context.addIssue({code: "custom", path: ["typographyText"], message: "typographyTreatment requires typographyText"});
            }
            if (shot.typographyTreatment === null && shot.typographyText !== null) {
              context.addIssue({code: "custom", path: ["typographyTreatment"], message: "typographyText requires typographyTreatment"});
            }
          });

          '''
          replace_once('src/spec/render-spec.ts', 'const visualBeatSchema = z.object({\n', shot_schema + 'const visualBeatSchema = z.object({\n')
          replace_once(
              'src/spec/render-spec.ts',
              '''  entity: entityBeatSchema.nullable(),
            pictureBook: pictureBookBeatSchema.nullable(),
          }).strict();''',
              '''  entity: entityBeatSchema.nullable(),
            pictureBook: pictureBookBeatSchema.nullable(),
            shots: z.array(shotSchema).max(4).optional(),
          }).strict();''',
          )
          replace_once(
              'src/spec/render-spec.ts',
              '  uniqueAt(spec.scenes.flatMap((scene) => scene.visualEvents.map((event) => event.eventId)), ["scenes"]);\n',
              '  uniqueAt(spec.scenes.flatMap((scene) => scene.visualEvents.map((event) => event.eventId)), ["scenes"]);\n  uniqueAt(spec.scenes.flatMap((scene) => scene.visualBeats.flatMap((beat) => (beat.shots ?? []).map((shot) => shot.shotId))), ["scenes"]);\n',
          )

          replace_once(
              'scripts/load-render-spec.ts',
              'import {validateVisualStoryContract} from "../src/spec/validate-visual-story";\n',
              'import {validateVisualStoryContract} from "../src/spec/validate-visual-story";\nimport {validateShotStoryContract} from "../src/spec/validate-shot-story";\n',
          )
          replace_once(
              'scripts/load-render-spec.ts',
              '''  validateVisualStoryContract(parsed.data, {
              enforceVariety: !resolved.includes(`${path.sep}fixtures${path.sep}`),
            });
          ''',
              '''  const enforceVariety = !resolved.includes(`${path.sep}fixtures${path.sep}`);
            validateVisualStoryContract(parsed.data, {enforceVariety});
            validateShotStoryContract(parsed.data, {enforceVariety});
          ''',
          )
          PY
      - name: Migrate July 31 Shot Plan
        run: npm run migrate:visual-story:v3 -- render-specs/2026-07-31/render_spec.json
      - name: Generate JSON Schema
        run: npm run episode:spec:schema
      - name: Synchronize episode package Shot Plan
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          spec = json.loads(Path('render-specs/2026-07-31/render_spec.json').read_text(encoding='utf-8'))
          lines = ['## Visual Story Engine v3 Shot Plan', '', '固定背景・狐左位置・字幕領域を維持し、メイン表示領域内だけでShot、内部カメラ、前後要素の引継ぎを行う。', '']
          for scene in spec['scenes']:
              lines.append(f"### {scene['sceneId']}")
              for beat in scene['visualBeats']:
                  shots = beat.get('shots', [])
                  if not shots:
                      continue
                  lines.append(f"- `{beat['beatId']}` / `{beat['visualTemplate']}`")
                  for shot in shots:
                      lines.append(f"  - `{shot['shotId']}`: `{shot['shotRecipe']}` / `{shot['stageLayout']}` / camera `{shot['cameraPreset']}` / fox `{shot['foxExpression']}` / continuity `{shot['continuityKey'] or 'none'}`")
              lines.append('')
          path = Path('episode-packages/2026-07-31/episode_package_2026-07-31.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Visual Story Engine v3 Shot Plan'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n\n'
          path.write_text(text + '\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-visual-story-v3-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/spec/render-spec.ts scripts/load-render-spec.ts schemas/render_spec.schema.json render-specs/2026-07-31/render_spec.json episode-packages/2026-07-31/episode_package_2026-07-31.md .github/workflows/apply-visual-story-v3-once.yml
          git commit -m "Apply Visual Story Engine v3 Shot Plan"
          git push origin HEAD:feature/visual-story-engine-v2
      - name: Validate implementation
        run: |
          npm run typecheck
          npm run test:shot-story
          npm run test:visual-story
          npm run test:public-screen
          npm run build
