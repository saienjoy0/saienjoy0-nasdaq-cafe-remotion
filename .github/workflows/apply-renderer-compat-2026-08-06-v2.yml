name: Apply Complete Renderer Compatibility 2026-08-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-renderer-compat-2026-08-06-v2.yml"

permissions:
  contents: write

concurrency:
  group: apply-renderer-compat-2026-08-06-v2
  cancel-in-progress: false

jobs:
  normalize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EPISODE_DATE: "2026-08-06"
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      READY_PATH: "render-specs/2026-08-06/production_ready.json"
      PACKAGE_PATH: "episode-packages/2026-08-06/episode_package_2026-08-06.md"
      REPORT_PATH: "preview-status/2026-08-06/normalization_report.json"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize Plot payload without changing TTS identity
        run: |
          python3 scripts/normalize_nasdaq_cafe_2026_08_06.py \
            --spec "$SPEC_PATH" \
            --package "$PACKAGE_PATH" \
            --ready "$READY_PATH" \
            --report "$REPORT_PATH"

      - name: Promote existing comparison card lines to Number objects
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          spec_path = Path(os.environ["SPEC_PATH"])
          ready_path = Path(os.environ["READY_PATH"])
          report_path = Path(os.environ["REPORT_PATH"])
          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          created = []

          for scene in spec["scenes"]:
              cards = {card["cardId"]: card for card in scene.get("cards", [])}
              numbers = scene.setdefault("numbers", [])
              existing_ids = {item["numberId"] for item in numbers}
              for beat in scene["visualBeats"]:
                  if beat.get("visualMode") != "number-comparison":
                      continue
                  referenced_cards = [cards[item] for item in beat.get("objectIds", []) if item in cards]
                  promoted_ids = []
                  for card_index, card in enumerate(referenced_cards, start=1):
                      for line_index, line in enumerate(card["lines"], start=1):
                          number_id = f"{beat['beatId']}-number-{card_index:02d}-{line_index:02d}"
                          if number_id not in existing_ids:
                              text = line["value"].strip()
                              if " " in text:
                                  label, value = text.rsplit(" ", 1)
                              else:
                                  label, value = card["title"], text
                              numbers.append({
                                  "numberId": number_id,
                                  "label": label,
                                  "value": value,
                                  "unit": "",
                                  "comparison": None,
                                  "tone": line["tone"],
                              })
                              existing_ids.add(number_id)
                              created.append({
                                  "sceneId": scene["sceneId"],
                                  "beatId": beat["beatId"],
                                  "sourceCardId": card["cardId"],
                                  "sourceLine": line["value"],
                                  "numberId": number_id,
                              })
                          promoted_ids.append(number_id)
                  if len(promoted_ids) < 2:
                      raise SystemExit(f"number-comparison Beat still has fewer than two numbers: {beat['beatId']}")
                  beat["objectIds"] = list(dict.fromkeys([*beat["objectIds"], *promoted_ids]))

          normalized_text = json.dumps(spec, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          spec_path.write_text(normalized_text, encoding="utf-8")
          spec_sha = hashlib.sha256(normalized_text.encode("utf-8")).hexdigest()

          ready = json.loads(ready_path.read_text(encoding="utf-8"))
          ready["renderSpecSha256"] = spec_sha
          normalization = dict(ready.get("rendererNormalization", {}))
          normalization["promotedNumberObjectCount"] = len(created)
          normalization["numberTextChanged"] = False
          ready["rendererNormalization"] = normalization
          ready_path.write_text(json.dumps(ready, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          report["promotedNumberObjectCount"] = len(created)
          report["promotedNumbers"] = created
          report["numberTextChanged"] = False
          report["normalizedRenderSpecSha256"] = spec_sha
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps({"created": len(created), "renderSpecSha256": spec_sha}, ensure_ascii=False))
          PY

      - name: Run formal Renderer validator
        run: npm run episode:spec:validate -- "$SPEC_PATH"

      - name: Commit validated Renderer input
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_PATH" "$READY_PATH" "$REPORT_PATH"
          git rm --ignore-unmatch scripts/normalize_nasdaq_cafe_2026_08_06.py
          git rm --ignore-unmatch .github/workflows/apply-renderer-compat-2026-08-06-v2.yml
          git rm --ignore-unmatch .github/workflows/apply-normalized-preview-2026-08-06.yml
          git rm --ignore-unmatch .github/workflows/normalize-and-render-preview-2026-08-06.yml
          git rm --ignore-unmatch .github/workflows/normalize-financial-and-render-preview-2026-08-06.yml
          git commit -m "Apply formally validated Renderer input for 2026-08-06"
          git pull --rebase origin main
          git push origin HEAD:main
