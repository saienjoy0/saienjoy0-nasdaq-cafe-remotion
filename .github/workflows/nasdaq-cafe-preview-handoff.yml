name: Nasdaq Cafe Preview From Handoff

on:
  workflow_dispatch:
    inputs:
      episode_date:
        description: "対象日（YYYY-MM-DD）"
        required: true
        type: string
      plot_run_id:
        description: "nasdaq-plot-creator- の正式handoffを生成したActions run ID"
        required: true
        type: string
      handoff_artifact_name:
        description: "Plot側のimmutable handoff Artifact名"
        required: true
        type: string
      expected_bundle_id:
        description: "handoff_manifest.json のbundle_id（SHA-256）"
        required: true
        type: string
      expected_manifest_sha256:
        description: "handoff_manifest.json 自体のSHA-256"
        required: true
        type: string
      expected_renderer_commit:
        description: "handoffがpinしたRenderer commit（40-hex）"
        required: true
        type: string
      signed_artifact_url:
        description: "cross-repo token不在時だけ使う短寿命の署名済みH4 Artifact URL"
        required: false
        type: string
      signed_artifact_digest_sha256:
        description: "署名済みH4 Artifact ZIP自体のSHA-256"
        required: false
        type: string
      confirmation:
        description: "台本・画像採用・validator・整合確認済みなら PREVIEW"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nasdaq-cafe-handoff-preview-${{ inputs.episode_date }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CI: "true"
      EPISODE_DATE: ${{ inputs.episode_date }}
      PLOT_RUN_ID: ${{ inputs.plot_run_id }}
      PLOT_ARTIFACT_NAME: ${{ inputs.handoff_artifact_name }}
      PLOT_ARTIFACT_TOKEN: ${{ secrets.NASDAQ_CAFE_PLOT_ARTIFACT_TOKEN }}
      SIGNED_ARTIFACT_URL: ${{ inputs.signed_artifact_url }}
      SIGNED_ARTIFACT_DIGEST: ${{ inputs.signed_artifact_digest_sha256 }}
      EXPECTED_BUNDLE_ID: ${{ inputs.expected_bundle_id }}
      EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
      EXPECTED_RENDERER_COMMIT: ${{ inputs.expected_renderer_commit }}
      RENDERER_CONTRACT_VERSION: 2.4.0
      HANDOFF_DOWNLOAD_ROOT: ${{ github.workspace }}/.handoff-download
      RUNTIME_ASSET_REGISTRY: ${{ github.workspace }}/build/handoff/runtime_asset_registry.json
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"

    steps:
      - name: Require explicit preview confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "PREVIEW" || {
            echo "::error::confirmation must be exactly PREVIEW"
            exit 1
          }
          [[ "$EPISODE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || {
            echo "::error::episode_date must be YYYY-MM-DD"
            exit 1
          }
          [[ "$PLOT_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::plot_run_id must be numeric"
            exit 1
          }
          [[ -n "$PLOT_ARTIFACT_NAME" ]] || {
            echo "::error::handoff_artifact_name is required"
            exit 1
          }
          [[ "$EXPECTED_BUNDLE_ID" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::expected_bundle_id must be SHA-256"
            exit 1
          }
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::expected_manifest_sha256 must be SHA-256"
            exit 1
          }
          [[ "$EXPECTED_RENDERER_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_renderer_commit must be 40-hex"
            exit 1
          }
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse
          url=os.environ.get('SIGNED_ARTIFACT_URL','')
          digest=os.environ.get('SIGNED_ARTIFACT_DIGEST','')
          if bool(url) != bool(digest):
              raise SystemExit('signed_artifact_url and signed_artifact_digest_sha256 must be supplied together')
          if url:
              parsed=urlparse(url)
              if parsed.scheme != 'https' or not parsed.hostname or not parsed.hostname.endswith('.oaiusercontent.com'):
                  raise SystemExit('signed_artifact_url must be an HTTPS oaiusercontent.com URL')
              if not re.fullmatch(r'[0-9a-f]{64}', digest):
                  raise SystemExit('signed_artifact_digest_sha256 must be SHA-256')
          PY

      - name: Resolve signed Artifact transport from verified promotion request
        if: ${{ env.PLOT_ARTIFACT_TOKEN == '' && inputs.signed_artifact_url == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREFIX="${EXPECTED_BUNDLE_ID:0:12}"
          REQUEST_PATH="handoff-promote-requests/${EPISODE_DATE}-${PREFIX}.json"
          CONTENT="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/contents/${REQUEST_PATH}?ref=main" \
            --jq '.content' | tr -d '\n' | base64 --decode)"
          CONTRACT="$(jq -r '.contractVersion // empty' <<<"$CONTENT")"
          DATE_VALUE="$(jq -r '.episodeDate // empty' <<<"$CONTENT")"
          BUNDLE="$(jq -r '.expectedBundleId // empty' <<<"$CONTENT")"
          MANIFEST="$(jq -r '.expectedManifestSha256 // empty' <<<"$CONTENT")"
          URL="$(jq -r '.artifactDownloadUrl // empty' <<<"$CONTENT")"
          DIGEST="$(jq -r '.artifactDigestSha256 // empty' <<<"$CONTENT")"
          [[ "$CONTRACT" == "1.0.0" ]] || { echo "::error::promotion request contractVersion mismatch"; exit 1; }
          [[ "$DATE_VALUE" == "$EPISODE_DATE" ]] || { echo "::error::promotion request episodeDate mismatch"; exit 1; }
          [[ "$BUNDLE" == "$EXPECTED_BUNDLE_ID" ]] || { echo "::error::promotion request bundle mismatch"; exit 1; }
          [[ "$MANIFEST" == "$EXPECTED_MANIFEST_SHA256" ]] || { echo "::error::promotion request manifest mismatch"; exit 1; }
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::promotion request Artifact digest is invalid"; exit 1; }
          python3 - "$URL" <<'PY'
          import sys
          from urllib.parse import urlparse
          p=urlparse(sys.argv[1])
          if p.scheme!='https' or not p.hostname or not p.hostname.endswith('.oaiusercontent.com'):
              raise SystemExit('promotion request signed URL is unsafe')
          PY
          echo "SIGNED_ARTIFACT_URL=$URL" >> "$GITHUB_ENV"
          echo "SIGNED_ARTIFACT_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Require an authenticated or digest-pinned Artifact transport
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PLOT_ARTIFACT_TOKEN" && -z "$SIGNED_ARTIFACT_URL" ]]; then
            echo "::error::No usable Plot Artifact transport is available"
            exit 1
          fi
          if [[ -z "$PLOT_ARTIFACT_TOKEN" && ! "$SIGNED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Signed Artifact transport is missing its SHA-256 digest"
            exit 1
          fi

      - name: Checkout pinned renderer
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_renderer_commit }}
          persist-credentials: false
          clean: true

      - name: Verify renderer commit pin
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [[ "$ACTUAL" != "$EXPECTED_RENDERER_COMMIT" ]]; then
            echo "::error::Renderer checkout does not match handoff pin"
            echo "::error::expected=$EXPECTED_RENDERER_COMMIT"
            echo "::error::actual=$ACTUAL"
            exit 1
          fi

      - name: Download immutable Plot handoff Artifact with configured token
        if: ${{ env.PLOT_ARTIFACT_TOKEN != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.handoff_artifact_name }}
          path: .handoff-download
          repository: saienjoy0/nasdaq-plot-creator-
          run-id: ${{ inputs.plot_run_id }}
          github-token: ${{ env.PLOT_ARTIFACT_TOKEN }}

      - name: Download digest-pinned signed Plot handoff Artifact
        if: ${{ env.PLOT_ARTIFACT_TOKEN == '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HANDOFF_DOWNLOAD_ROOT"
          ZIP="$RUNNER_TEMP/plot-handoff.zip"
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors \
            "$SIGNED_ARTIFACT_URL" --output "$ZIP"
          test -s "$ZIP"
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          if [[ "$ACTUAL" != "$SIGNED_ARTIFACT_DIGEST" ]]; then
            echo "::error::signed H4 Artifact digest mismatch"
            echo "::error::expected=$SIGNED_ARTIFACT_DIGEST"
            echo "::error::actual=$ACTUAL"
            exit 1
          fi
          unzip -q "$ZIP" -d "$HANDOFF_DOWNLOAD_ROOT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify handoff bytes and stage daily assets
        id: intake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/handoff
          npm run handoff:intake -- \
            --download-root="$HANDOFF_DOWNLOAD_ROOT" \
            --expected-bundle-id="$EXPECTED_BUNDLE_ID" \
            --expected-manifest-sha256="$EXPECTED_MANIFEST_SHA256" \
            --episode-date="$EPISODE_DATE" \
            --renderer-commit="$EXPECTED_RENDERER_COMMIT" \
            --renderer-contract-version="$RENDERER_CONTRACT_VERSION" \
            --registry-output="$RUNTIME_ASSET_REGISTRY" \
            | tee build/handoff/intake-output.log
          JSON_LINE="$(tail -n 1 build/handoff/intake-output.log)"
          SPEC_PATH="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.specPath)' "$JSON_LINE")"
          REGISTRY_PATH="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.runtimeRegistryPath)' "$JSON_LINE")"
          test -s "$SPEC_PATH"
          test -s "$REGISTRY_PATH"
          echo "spec_path=$SPEC_PATH" >> "$GITHUB_OUTPUT"
          echo "registry_path=$REGISTRY_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate handoff-driven render spec
        env:
          NASDAQ_CAFE_RUNTIME_ASSET_REGISTRY: ${{ steps.intake.outputs.registry_path }}
        run: npm run episode:spec:validate -- "${{ steps.intake.outputs.spec_path }}"

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Run deterministic runtime stability tests
        run: npm run test:runtime-stability

      - name: Prepare TTS cache directory
        run: mkdir -p .cache/spec-tts-blocks

      - name: Generate handoff-driven preview
        env:
          NASDAQ_CAFE_RUNTIME_ASSET_REGISTRY: ${{ steps.intake.outputs.registry_path }}
        run: npm run episode:spec:preview -- "${{ steps.intake.outputs.spec_path }}"

      - name: Upload preview and technical evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-handoff-preview-${{ inputs.episode_date }}-${{ github.run_id }}
          path: |
            renders/preview/
            build/${{ inputs.episode_date }}/technical_report.json
            build/${{ inputs.episode_date }}/render_data.production.json
            build/${{ inputs.episode_date }}/visual_grammar_timing_report.json
            build/handoff/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
