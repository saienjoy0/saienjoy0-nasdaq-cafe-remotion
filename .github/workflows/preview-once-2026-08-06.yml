name: Preview Once 2026-08-06 Understanding Progression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/preview-once-2026-08-06.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: nasdaq-cafe-preview-once-2026-08-06
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CI: "true"
      EPISODE_DATE: "2026-08-06"
      EXPECTED_BUNDLE_ID: "c8f3be30aad368680e7369ea435686c0702d856f29e8ed4810f1dcb7ccf5f1c2"
      EXPECTED_MANIFEST_SHA256: "745fb75ca6a163b74927ed663fedaee49bbd71afe2e5a0b00b3aa2c15fe24883"
      EXPECTED_RENDERER_COMMIT: "36440cbe84331d020d4fe808d5c2fcbcac20833c"
      RENDERER_CONTRACT_VERSION: "2.4.0"
      HANDOFF_DOWNLOAD_ROOT: ${{ github.workspace }}/.handoff-download
      RUNTIME_ASSET_REGISTRY: ${{ github.workspace }}/build/handoff/runtime_asset_registry.json
      HANDOFF_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-ce9c-8207-9ae4-de0822aa55ef/raw?se=2026-08-10T00%3A47%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=cf6643e7-741d-59d9-b9b7-739c306f9497&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-09T23%3A45%3A59Z&ske=2026-08-10T23%3A45%3A59Z&sks=b&skv=2026-02-06&sig=MrzsDWS4bfl2TwbS2HVSIjJRD25XwtnGk7oxIggarQA%3D"
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"

    steps:
      - name: Checkout pinned renderer
        uses: actions/checkout@v6
        with:
          ref: 36440cbe84331d020d4fe808d5c2fcbcac20833c

      - name: Verify renderer commit pin
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED_RENDERER_COMMIT"

      - name: Download immutable Plot handoff Artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HANDOFF_DOWNLOAD_ROOT"
          curl -fL --retry 3 --retry-delay 2 "$HANDOFF_URL" -o /tmp/handoff.zip
          unzip -q /tmp/handoff.zip -d "$HANDOFF_DOWNLOAD_ROOT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify handoff bytes and stage daily assets
        id: intake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/handoff
          npm run handoff:intake -- \
            --download-root="$HANDOFF_DOWNLOAD_ROOT" \
            --expected-bundle-id="$EXPECTED_BUNDLE_ID" \
            --expected-manifest-sha256="$EXPECTED_MANIFEST_SHA256" \
            --episode-date="$EPISODE_DATE" \
            --renderer-commit="$EXPECTED_RENDERER_COMMIT" \
            --renderer-contract-version="$RENDERER_CONTRACT_VERSION" \
            --registry-output="$RUNTIME_ASSET_REGISTRY" \
            | tee build/handoff/intake-output.log
          JSON_LINE="$(tail -n 1 build/handoff/intake-output.log)"
          SPEC_PATH="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.specPath)' "$JSON_LINE")"
          REGISTRY_PATH="$(node -e 'const x=JSON.parse(process.argv[1]); console.log(x.runtimeRegistryPath)' "$JSON_LINE")"
          test -s "$SPEC_PATH"
          test -s "$REGISTRY_PATH"
          echo "spec_path=$SPEC_PATH" >> "$GITHUB_OUTPUT"
          echo "registry_path=$REGISTRY_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate handoff-driven render spec
        env:
          NASDAQ_CAFE_RUNTIME_ASSET_REGISTRY: ${{ steps.intake.outputs.registry_path }}
        run: npm run episode:spec:validate -- "${{ steps.intake.outputs.spec_path }}"

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Run deterministic runtime stability tests
        run: npm run test:runtime-stability

      - name: Prepare TTS cache directory
        run: mkdir -p .cache/spec-tts-blocks

      - name: Generate handoff-driven preview
        env:
          NASDAQ_CAFE_RUNTIME_ASSET_REGISTRY: ${{ steps.intake.outputs.registry_path }}
        run: npm run episode:spec:preview -- "${{ steps.intake.outputs.spec_path }}"

      - name: Upload preview and technical evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-preview-2026-08-06-${{ github.run_id }}
          path: |
            renders/preview/
            build/2026-08-06/technical_report.json
            build/2026-08-06/render_data.production.json
            build/2026-08-06/visual_grammar_timing_report.json
            build/handoff/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
