name: Visual Story Subtitle Preview Dispatcher Once

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - .github/workflows/visual-story-subtitle-preview-once.yml

permissions:
  contents: read
  actions: write
  pull-requests: write
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout subtitle-fixed branch
        uses: actions/checkout@v6

      - name: Dispatch canonical preview workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_DATE: "2026-07-31"
          PREVIEW_REF: feature/visual-story-engine-v2
        shell: bash
        run: |
          set -euo pipefail
          SPEC_PATH="render-specs/${EPISODE_DATE}/render_spec.json"
          test -s "$SPEC_PATH"
          SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          gh workflow run nasdaq-cafe-preview.yml \
            --ref "$PREVIEW_REF" \
            -f episode_date="$EPISODE_DATE" \
            -f expected_spec_sha256="$SPEC_SHA" \
            -f confirmation=PREVIEW
          sleep 5
          RUN_ID="$(gh run list --workflow nasdaq-cafe-preview.yml --branch "$PREVIEW_REF" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh pr comment 26 --body "Corrected full-narration subtitle preview dispatched. Run ID: ${RUN_ID}. Ref: ${PREVIEW_REF}. Spec SHA-256: ${SPEC_SHA}. Preview only; final is disabled."
