name: Temporary Candidate Variant Repair

on:
  push:
    branches:
      - fix/candidate-variant-registry-guard-20260825

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/candidate-variant-registry-guard-20260825
          fetch-depth: 0
      - name: Apply exact owning-layer repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          candidate = Path('src/spec/visual-candidate-builder.ts')
          text = candidate.read_text(encoding='utf-8')
          old = '''const templateConfigFor = (template: VisualTemplateId, scene: Scene, beat: Beat) => {
            if (template === beat.visualTemplate) return structuredClone(beat.templateConfig);
            const variant = getVisualComponentDescriptor(template).defaultVariant;
            const inventory = objectInventory(scene, beat);
          '''
          new = '''const templateConfigFor = (template: VisualTemplateId, scene: Scene, beat: Beat) => {
            const descriptor = getVisualComponentDescriptor(template);
            if (template === beat.visualTemplate) {
              const config = structuredClone(beat.templateConfig);
              if (!descriptor.variants.includes(config.variant)) {
                config.variant = descriptor.defaultVariant;
              }
              return config;
            }
            const variant = descriptor.defaultVariant;
            const inventory = objectInventory(scene, beat);
          '''
          if old not in text:
              raise SystemExit('candidate-builder exact target not found')
          candidate.write_text(text.replace(old, new, 1), encoding='utf-8')

          cli = Path('scripts/visual-director-cli.ts')
          text = cli.read_text(encoding='utf-8')
          old_import = 'import {compileVisualDirection} from "../src/spec/visual-direction-compiler";\n'
          new_import = old_import + 'import {validateVisualStoryContract} from "../src/spec/validate-visual-story";\n'
          if old_import not in text:
              raise SystemExit('visual-director-cli import target not found')
          text = text.replace(old_import, new_import, 1)
          old_compile = '    const result = compileVisualDirection({spec, sourceRenderSpecSha256, catalog, plan});\n'
          new_compile = '''    const result = compileVisualDirection({
              spec,
              sourceRenderSpecSha256,
              catalog,
              plan,
              validateOutput: validateVisualStoryContract,
            });
          '''
          if old_compile not in text:
              raise SystemExit('visual-director-cli compile target not found')
          cli.write_text(text.replace(old_compile, new_compile, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- src/spec/visual-candidate-builder.ts scripts/visual-director-cli.ts
      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/spec/visual-candidate-builder.ts scripts/visual-director-cli.ts
          git commit -m 'Enforce Renderer candidate variant contract'
          git push origin HEAD:fix/candidate-variant-registry-guard-20260825
