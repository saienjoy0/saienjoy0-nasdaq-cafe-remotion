name: Nasdaq Cafe Scheduled Preview Gate

on:
  push:
    branches:
      - main
    paths:
      - "render-specs/*/production_ready.json"
  schedule:
    - cron: "17 7 * * *"
      timezone: "Asia/Tokyo"
    - cron: "37 7 * * *"
      timezone: "Asia/Tokyo"
    - cron: "57 7 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      episode_date_override:
        description: "定刻ゲートの検査日をYYYY-MM-DDで上書き（通常は空欄）"
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: nasdaq-cafe-scheduled-preview-gate
  cancel-in-progress: false

jobs:
  gate-and-dispatch:
    name: Verify daily package and dispatch preview
    if: >-
      github.event_name != 'push' ||
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      TARGET_WORKFLOW: nasdaq-cafe-preview.yml
      TARGET_REF: main

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Resolve episode date and verify production-ready package
        id: ready
        shell: bash
        env:
          EPISODE_DATE_OVERRIDE: ${{ inputs.episode_date_override }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            mapfile -t READY_FILES < <(
              git diff --name-only "$BEFORE_SHA" "$TRIGGER_SHA" -- 'render-specs/*/production_ready.json'
            )
            if [[ "${#READY_FILES[@]}" -ne 1 ]]; then
              echo "::error::Exactly one production_ready.json must change per push"
              exit 1
            fi
            EPISODE_DATE="$(sed -E 's#^render-specs/([0-9]{4}-[0-9]{2}-[0-9]{2})/production_ready\.json$#\1#' <<<"${READY_FILES[0]}")"
          elif [[ -n "${EPISODE_DATE_OVERRIDE:-}" ]]; then
            EPISODE_DATE="$EPISODE_DATE_OVERRIDE"
          else
            EPISODE_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi

          if [[ ! "$EPISODE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::episode date must match YYYY-MM-DD"
            exit 1
          fi

          READY_PATH="render-specs/${EPISODE_DATE}/production_ready.json"
          if [[ ! -s "$READY_PATH" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "episode_date=$EPISODE_DATE" >> "$GITHUB_OUTPUT"
            echo "Missing $READY_PATH; no Preview dispatched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mapfile -t VERIFIED < <(
            python3 - "$READY_PATH" "$EPISODE_DATE" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          ready_path = Path(sys.argv[1])
          episode_date = sys.argv[2]
          spec_path = Path(f"render-specs/{episode_date}/render_spec.json")
          package_path = Path(f"episode-packages/{episode_date}/episode_package_{episode_date}.md")

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          ready = json.loads(ready_path.read_text(encoding="utf-8"))
          required = {
              "version": 1,
              "status": "ready",
              "episodeDate": episode_date,
              "renderSpecPath": spec_path.as_posix(),
              "episodePackagePath": package_path.as_posix(),
              "validatorStatus": "pass",
              "consistencyStatus": "pass",
              "unresolvedStateCount": 0,
          }
          for key, expected in required.items():
              if ready.get(key) != expected:
                  raise SystemExit(f"production_ready.{key} mismatch")

          if not spec_path.is_file() or spec_path.stat().st_size == 0:
              raise SystemExit(f"Missing or empty render spec: {spec_path}")
          if not package_path.is_file() or package_path.stat().st_size == 0:
              raise SystemExit(f"Missing or empty episode package: {package_path}")

          spec_sha = sha256(spec_path)
          package_sha = sha256(package_path)
          sha_pattern = re.compile(r"[0-9a-f]{64}")
          for key, actual in (
              ("renderSpecSha256", spec_sha),
              ("episodePackageSha256", package_sha),
          ):
              declared = ready.get(key)
              if not isinstance(declared, str) or not sha_pattern.fullmatch(declared):
                  raise SystemExit(f"production_ready.{key} is invalid")
              if declared != actual:
                  raise SystemExit(f"production_ready.{key} hash mismatch")

          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          episode = spec.get("episode")
          if not isinstance(episode, dict):
              raise SystemExit("render_spec is missing episode object")
          if episode.get("id") != episode_date or episode.get("targetDate") != episode_date:
              raise SystemExit("render_spec episode date mismatch")

          print(spec_path.as_posix())
          print(package_path.as_posix())
          print(spec_sha)
          print(package_sha)
          PY
          )

          SPEC_PATH="${VERIFIED[0]:-}"
          PACKAGE_PATH="${VERIFIED[1]:-}"
          SPEC_SHA="${VERIFIED[2]:-}"
          PACKAGE_SHA="${VERIFIED[3]:-}"
          if [[ ! "$SPEC_SHA" =~ ^[0-9a-f]{64}$ || ! "$PACKAGE_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::verification did not return valid SHA-256 values"
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "episode_date=$EPISODE_DATE" >> "$GITHUB_OUTPUT"
          echo "spec_path=$SPEC_PATH" >> "$GITHUB_OUTPUT"
          echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "spec_sha=$SPEC_SHA" >> "$GITHUB_OUTPUT"
          echo "package_sha=$PACKAGE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Scheduled preview gate"
            echo "- Episode: \`$EPISODE_DATE\`"
            echo "- Render spec SHA-256: \`$SPEC_SHA\`"
            echo "- Episode package SHA-256: \`$PACKAGE_SHA\`"
            echo "- Ready contract: pass"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch verified Preview workflow
        if: steps.ready.outputs.ready == 'true'
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_DATE: ${{ steps.ready.outputs.episode_date }}
          SPEC_SHA: ${{ steps.ready.outputs.spec_sha }}
        run: |
          set -euo pipefail
          REQUEST_BODY="$(jq -n \
            --arg ref "$TARGET_REF" \
            --arg episode_date "$EPISODE_DATE" \
            --arg spec_sha "$SPEC_SHA" \
            '{ref:$ref,inputs:{episode_date:$episode_date,expected_spec_sha256:$spec_sha,confirmation:"PREVIEW"}}')"
          RESPONSE="$(gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            --input - <<<"$REQUEST_BODY")"
          WORKFLOW_RUN_ID="$(jq -r '.workflow_run_id // empty' <<<"$RESPONSE")"
          RUN_URL="$(jq -r '.html_url // empty' <<<"$RESPONSE")"
          if [[ ! "$WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::workflow dispatch did not return workflow_run_id"
            echo "$RESPONSE"
            exit 1
          fi
          {
            echo "### Preview dispatched"
            echo "- Workflow run ID: \`$WORKFLOW_RUN_ID\`"
            echo "- Run URL: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
