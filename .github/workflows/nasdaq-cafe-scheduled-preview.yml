name: Nasdaq Cafe Scheduled Preview Gate

on:
  push:
    branches:
      - fix/visual-rhythm-2026-08-06
    paths:
      - preview-requests/formal-scene4-japanese-preview.json

permissions:
  contents: write

jobs:
  restore-preview-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/visual-rhythm-2026-08-06
          fetch-depth: 0

      - name: Restore normal scheduled gate and remove one-off request state
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.action // empty' preview-requests/formal-scene4-japanese-preview.json)" = "cleanup"
          git fetch origin main
          git checkout origin/main -- .github/workflows/nasdaq-cafe-scheduled-preview.yml
          git rm -f \
            preview-requests/formal-scene4-japanese-preview.json \
            preview-requests/scene4-japanese-new-tts.json \
            preview-status/2026-08-06/scene4_japanese_new_tts_formal_run.json \
            preview-status/2026-08-06/scene4_japanese_new_tts_run.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/nasdaq-cafe-scheduled-preview.yml
          git diff --cached --check
          git commit -m "Clean up Scene 4 Preview trigger"
          git push origin HEAD:fix/visual-rhythm-2026-08-06
