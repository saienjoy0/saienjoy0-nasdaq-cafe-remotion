name: Nasdaq Cafe Scene4 Layout Diagnostic

on:
  push:
    branches: [main]
    paths:
      - "scene4-layout-diagnostic-requests/*.json"

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          clean: true
      - name: Locate exact runtime error source and Scene 4 shaping code
        id: diag
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/diag
          {
            echo '=== exact error matches ==='
            grep -R -n -F 'requires exactly three cards' src scripts 2>/dev/null || true
            echo '=== expected-actual-gap-flow code refs ==='
            grep -R -n -F 'expected-actual-gap-flow' src scripts 2>/dev/null || true
            echo '=== card shaping refs ==='
            grep -R -n -E 'cards.*concat|concat.*cards|viewerTexts.*card|cards.*viewerTexts|supportingTexts.*card|cards.*supportingTexts' src scripts 2>/dev/null || true
          } > /tmp/diag/report.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('render-specs/2026-08-10/render_spec.json').read_text(encoding='utf-8'))
          scene=next(s for s in spec['scenes'] if s['sceneId']=='scene-04')
          with Path('/tmp/diag/scene4.json').open('w',encoding='utf-8') as f:
              json.dump({
                  'cards':scene.get('cards'),
                  'supportingTexts':scene.get('supportingTexts'),
                  'visualBeats':scene.get('visualBeats'),
                  'visualEvents':scene.get('visualEvents'),
              },f,ensure_ascii=False,indent=2)
          PY
      - name: Upsert diagnostic issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE='NASDAQ CAFE SCENE4 LAYOUT DIAGNOSTIC 2026-08-10'
          REPORT="$(cat /tmp/diag/report.txt)"
          SCENE="$(cat /tmp/diag/scene4.json)"
          BODY="$(printf '```text\n%s\n```\n\n```json\n%s\n```\n' "$REPORT" "$SCENE")"
          N="$(gh issue list --state all --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"
          if [[ -n "$N" ]]; then gh issue edit "$N" --body "$BODY"; gh issue reopen "$N" >/dev/null 2>&1 || true; else gh issue create --title "$TITLE" --body "$BODY"; fi
