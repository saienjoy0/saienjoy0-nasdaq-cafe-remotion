name: Track Visual Grammar Technical A/B

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/track-visual-grammar-technical-ab.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: track-visual-grammar-technical-ab
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      TARGET_HEAD_SHA: "a19a7169783394fe02a1bebdc99bbf16ed7430bf"
      TARGET_WORKFLOW: "visual-grammar-ab-technical-preview.yml"
      REQUEST_ID: "vg6t-2099-02-02-20260806-a"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve technical A/B run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            RUN_JSON="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$TARGET_WORKFLOW" \
              --event push \
              --limit 30 \
              --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,displayTitle)"
            RUN_ID="$(jq -r --arg sha "$TARGET_HEAD_SHA" '[.[] | select(.headSha == $sha)][0].databaseId // empty' <<<"$RUN_JSON")"
            if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "$RUN_ID" > /tmp/technical-ab-run-id.txt
              jq --arg sha "$TARGET_HEAD_SHA" '[.[] | select(.headSha == $sha)][0]' <<<"$RUN_JSON" > /tmp/technical-ab-run-initial.json
              exit 0
            fi
            sleep 5
          done
          echo "::error::Unable to resolve technical A/B run for $TARGET_HEAD_SHA"
          exit 1

      - name: Wait for technical A/B completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          RUN_ID="$(cat /tmp/technical-ab-run-id.txt)"
          set +e
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          WATCH_EXIT=$?
          set -e
          echo "$WATCH_EXIT" > /tmp/technical-ab-watch-exit.txt

      - name: Record run and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(cat /tmp/technical-ab-run-id.txt)"
          RUN_JSON="$(gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs)"
          ARTIFACT_JSON="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"
          OUTPUT="visual-grammar-ab-technical-state/tracking/${REQUEST_ID}.json"
          mkdir -p "$(dirname "$OUTPUT")"
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg target_head_sha "$TARGET_HEAD_SHA" \
            --arg watch_exit "$(cat /tmp/technical-ab-watch-exit.txt)" \
            --argjson workflow_run "$RUN_JSON" \
            --argjson artifacts "$ARTIFACT_JSON" \
            '{
              contractVersion: "1.0.0",
              requestId: $request_id,
              targetHeadSha: $target_head_sha,
              watchExitCode: ($watch_exit | tonumber),
              workflowRun: $workflow_run,
              artifacts: $artifacts.artifacts,
              finalAuthorized: false
            }' > "$OUTPUT"

      - name: Commit tracking record and remove tracker
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          OUTPUT="visual-grammar-ab-technical-state/tracking/${REQUEST_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          git rm --ignore-unmatch ".github/workflows/track-visual-grammar-technical-ab.yml"
          git commit -m "Track Visual Grammar technical A/B result: ${REQUEST_ID}"
          git push origin HEAD:main
