name: TEMP Run Visual Template Contract Update

on:
  push:
    branches: [main]
    paths:
      - .github/visual-template-trigger

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: fix/spec-video-legibility
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply deterministic contract migration
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/temp-update-visual-template-contract.yml > /tmp/carrier.yml
          python3 <<'PY'
          from pathlib import Path

          carrier = Path('/tmp/carrier.yml').read_text(encoding='utf-8')
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n"
          if start not in carrier or end not in carrier:
              raise SystemExit('embedded updater block not found')
          block = carrier.split(start, 1)[1].split(end, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'

          patches = {
              "text = replace_once(text, needle, addition, 'template validation insertion')": """marker = \"    });\\n  });\\n  return data;\"\nif marker not in text:\n    raise SystemExit('template validation end marker missing')\ntext = text.replace(marker, addition + marker, 1)""",
              "text = replace_once(text, old, new, 'fixture beat fields')": """target = \"    visualMode: mode,\\n\"\nif text.count(target) < 1:\n    raise SystemExit(f'fixture visualMode target count={text.count(target)}')\nfields = '''    visualTemplate: templateForMode[mode],\n    templateConfig: {\n      variant: mode === \"causal-diagram\" ? \"left-to-right\" : mode === \"stock-comparison\" ? \"center-zero\" : \"default\",\n      comparisonBasis: [\"number-comparison\", \"chart\", \"stock-comparison\"].includes(mode) ? `TEST BASIS ${number}-${beatNumber}` : null,\n      dataBasis: \"TEST TIMELINE BASIS\",\n      nodeOrder: mode === \"causal-diagram\" ? nodes.map((node) => node.nodeId) : [],\n      laneLabels: [],\n      outcomeNodeId: null,\n    },\n'''\ntext = text.replace(target, target + fields, 1)""",
              "text = replace_once(text, old, new, 'fixture entity override')": """target = '          visualMode: \"text-focus\",\\n'\nif text.count(target) != 1:\n    raise SystemExit(f'fixture entity visualMode target count={text.count(target)}')\nfields = '''          visualTemplate: \"entity-card-full\",\n          templateConfig: {variant: \"prebuilt-card\", comparisonBasis: null, dataBasis: \"TEST TIMELINE BASIS\", nodeOrder: [], laneLabels: [], outcomeNodeId: null},\n'''\ntext = text.replace(target, target + fields, 1)""",
          }
          for old, new in patches.items():
              if script.count(old) != 1:
                  raise SystemExit(f'patch target count={script.count(old)} for {old}')
              script = script.replace(old, new, 1)
          Path('/tmp/update_visual_contract.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/update_visual_contract.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/generate-render-spec-fixtures.ts')
          text = path.read_text(encoding='utf-8')
          start_old = '    narrationStartCue: narrationChunks[startIndex].captionText,'
          end_old = '    narrationEndCue: narrationChunks[endIndex].captionText,'
          if text.count(start_old) != 1 or text.count(end_old) != 1:
              raise SystemExit('fixture narration cue targets changed')
          text = text.replace(start_old, '    narrationStartCue: narrationChunks[startIndex].speechText,', 1)
          text = text.replace(end_old, '    narrationEndCue: narrationChunks[endIndex].speechText,', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install and regenerate schema
        id: install
        run: |
          set -euo pipefail
          npm ci
          npm run episode:spec:schema

      - name: Validate explicit contract
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          {
            npm run typecheck
            npm run test:spec
            npm run build
            npm run episode:spec:validate -- render-specs/2026-07-31/render_spec.json
            grep -R '"visualTemplate"' render-specs/2026-07-31/render_spec.json >/dev/null
            grep -R 'switch (content.visualTemplate)' src/components/spec/SpecVisualModes.tsx >/dev/null
            ! grep -R 'switch (content.renderKind)' src/components/spec/SpecVisualModes.tsx
          } 2>&1 | tee /tmp/validate.log

      - name: Commit target branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/spec/render-spec.ts src/spec/public-view-model.ts src/components/spec/SpecVisualModes.tsx src/spec/validate-render-layout.ts scripts/generate-render-spec-fixtures.ts scripts/test-spec-presentation.ts schemas/render_spec.schema.json render-specs episode-packages/2026-07-31/episode_package_2026-07-31.md docs/12_visual_template_contract.md
          git commit -m "feat: make visual templates explicit in script contract"
          git push origin HEAD:fix/spec-video-legibility
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        uses: actions/github-script@v8
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          RESULT_SHA: ${{ steps.commit.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/validate.log') ? fs.readFileSync('/tmp/validate.log', 'utf8').slice(-5000) : 'no validation log';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 25, body: [
              `RUN_ID=${process.env.RUN_ID}`,
              `VISUAL_TEMPLATE_CONTRACT_COMMIT=${process.env.RESULT_SHA || 'none'}`,
              `APPLY=${process.env.APPLY_OUTCOME}`,
              `INSTALL=${process.env.INSTALL_OUTCOME}`,
              `VALIDATE=${process.env.VALIDATE_OUTCOME}`,
              `COMMIT=${process.env.COMMIT_OUTCOME}`,
              'PREVIEW_NOT_RUN=true',
              'FINAL_NOT_RUN=true',
              '',
              '```text', log, '```'
            ].join('\n')});
