name: Visual Grammar A/B Preview

on:
  workflow_dispatch:
    inputs:
      episode_date:
        description: "対象日（render-specs/YYYY-MM-DD/render_spec.json）"
        required: true
        type: string
      expected_spec_sha256:
        description: "比較へ使うrender_spec.jsonのSHA-256"
        required: true
        type: string
      confirmation:
        description: "同一台本・同一TTSのPreview比較を実行するなら AB_PREVIEW"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-grammar-ab-preview-${{ inputs.episode_date }}
  cancel-in-progress: true

env:
  CI: "true"
  GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
  GEMINI_TTS_VOICE: Charon

jobs:
  preflight:
    name: Freeze exact A/B input and renderer commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      episode_id: ${{ steps.verify.outputs.episode_id }}
      spec_path: ${{ steps.verify.outputs.spec_path }}
      spec_sha: ${{ steps.verify.outputs.spec_sha }}
      tts_input_sha: ${{ steps.verify.outputs.tts_input_sha }}
      renderer_commit: ${{ steps.freeze.outputs.renderer_commit }}
      input_artifact: ${{ steps.verify.outputs.input_artifact }}

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Freeze renderer commit
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          RENDERER_COMMIT="$(git rev-parse HEAD)"
          [[ "$RENDERER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          echo "renderer_commit=$RENDERER_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Verify immutable render_spec 2.4.0 and calculate identities
        id: verify
        shell: bash
        env:
          EPISODE_DATE: ${{ inputs.episode_date }}
          EXPECTED_SPEC_SHA256: ${{ inputs.expected_spec_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || { echo "::error::A/B Preview is repository-owner only"; exit 1; }
          [[ "$CONFIRMATION" == "AB_PREVIEW" ]] || { echo "::error::confirmation must be exactly AB_PREVIEW"; exit 1; }
          [[ "$EPISODE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::episode_date must match YYYY-MM-DD"; exit 1; }

          SPEC_PATH="render-specs/${EPISODE_DATE}/render_spec.json"
          test -s "$SPEC_PATH"

          EXPECTED="$(printf '%s' "$EXPECTED_SPEC_SHA256" | tr '[:upper:]' '[:lower:]')"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::expected_spec_sha256 must be SHA-256"; exit 1; }
          ACTUAL="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "::error::render_spec SHA mismatch expected=$EXPECTED actual=$ACTUAL"; exit 1; }

          mapfile -t VALUES < <(
            python3 - "$SPEC_PATH" "$EPISODE_DATE" <<'PY'
          import hashlib
          import json
          import os
          import sys

          spec_path, episode_date = sys.argv[1:]
          with open(spec_path, encoding="utf-8") as handle:
              value = json.load(handle)
          if value.get("schemaVersion") != "2.4.0":
              raise SystemExit("Visual Grammar A/B requires render_spec 2.4.0")
          episode = value.get("episode")
          if not isinstance(episode, dict):
              raise SystemExit("episode object missing")
          if episode.get("id") != episode_date or episode.get("targetDate") != episode_date:
              raise SystemExit("episode.id/targetDate must match episode_date")
          root_contract = value.get("visualGrammarContract")
          if not isinstance(root_contract, dict):
              raise SystemExit("visualGrammarContract root missing")
          scenes = value.get("scenes")
          if not isinstance(scenes, list) or len(scenes) != 9:
              raise SystemExit("exactly 9 scenes required")
          for scene in scenes:
              beats = scene.get("visualBeats")
              if not isinstance(beats, list) or not beats:
                  raise SystemExit(f"{scene.get('sceneId')} visualBeats missing")
              for beat in beats:
                  for key in ("visualGrammarId", "transitionRole"):
                      if not isinstance(beat.get(key), str) or not beat[key]:
                          raise SystemExit(f"{scene.get('sceneId')}/{beat.get('beatId')} missing {key}")
                  if beat.get("transitionRole") == "return" and not beat.get("returnTargetBeatId"):
                      raise SystemExit(f"{scene.get('sceneId')}/{beat.get('beatId')} return target missing")

          blocks = []
          for block_id, first_scene, last_scene in (
              ("scenes-01-04", 1, 4),
              ("scenes-05-09", 5, 9),
          ):
              speech = [
                  chunk["speechText"]
                  for scene in scenes
                  if first_scene <= scene["sceneNumber"] <= last_scene
                  for chunk in scene["narrationChunks"]
              ]
              if not speech:
                  raise SystemExit(f"TTS block {block_id} has no speechText")
              blocks.append({"id": block_id, "speechText": speech})
          payload = {
              "synthesisVersion": "gemini-two-block-v1",
              "model": os.environ["GEMINI_TTS_MODEL"],
              "voice": os.environ["GEMINI_TTS_VOICE"],
              "voiceProfileId": value.get("voiceProfileId"),
              "pronunciations": value.get("pronunciations"),
              "blocks": blocks,
          }
          encoded = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          print(episode["id"])
          print(hashlib.sha256(encoded).hexdigest())
          PY
          )

          EPISODE_ID="${VALUES[0]}"
          TTS_INPUT_SHA="${VALUES[1]}"
          [[ "$TTS_INPUT_SHA" =~ ^[0-9a-f]{64}$ ]]

          INPUT_ROOT="ab-input"
          mkdir -p "$INPUT_ROOT/$(dirname "$SPEC_PATH")"
          cp "$SPEC_PATH" "$INPUT_ROOT/$SPEC_PATH"
          cat > "$INPUT_ROOT/input_identity.json" <<JSON
          {
            "episodeId": "$EPISODE_ID",
            "specPath": "$SPEC_PATH",
            "specSha256": "$ACTUAL",
            "ttsInputSha256": "$TTS_INPUT_SHA",
            "rendererRef": "main",
            "rendererCommitSha": "${{ steps.freeze.outputs.renderer_commit }}",
            "baselineStageMode": "legacy",
            "candidateStageMode": "candidate",
            "sameRendererCommit": true,
            "finalAuthorized": false
          }
          JSON

          INPUT_ARTIFACT="visual-grammar-ab-input-${EPISODE_ID}-${GITHUB_RUN_ID}"
          echo "episode_id=$EPISODE_ID" >> "$GITHUB_OUTPUT"
          echo "spec_path=$SPEC_PATH" >> "$GITHUB_OUTPUT"
          echo "spec_sha=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "tts_input_sha=$TTS_INPUT_SHA" >> "$GITHUB_OUTPUT"
          echo "input_artifact=$INPUT_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload exact A/B input
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.verify.outputs.input_artifact }}
          path: ab-input
          if-no-files-found: error
          retention-days: 14

  prepare-shared-audio:
    name: Prepare narration once
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    outputs:
      tts_artifact: ${{ steps.package.outputs.tts_artifact }}

    env:
      SPEC_PATH: ${{ needs.preflight.outputs.spec_path }}
      EPISODE_ID: ${{ needs.preflight.outputs.episode_id }}
      SPEC_SHA: ${{ needs.preflight.outputs.spec_sha }}
      TTS_INPUT_SHA: ${{ needs.preflight.outputs.tts_input_sha }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TTS_PROVIDER: gemini
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"

    steps:
      - name: Checkout frozen renderer
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.renderer_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact A/B input
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.preflight.outputs.input_artifact }}
          path: /tmp/vg-ab-input

      - name: Install exact input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SPEC_PATH")"
          cp "/tmp/vg-ab-input/$SPEC_PATH" "$SPEC_PATH"
          [[ "$(sha256sum "$SPEC_PATH" | awk '{print $1}')" == "$SPEC_SHA" ]]

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Validate exact input
        run: npm run episode:spec:validate -- "$SPEC_PATH"

      - name: Prepare TTS cache directory
        run: mkdir -p .cache/spec-tts-blocks

      - name: Restore exact two-block TTS cache
        id: restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ env.TTS_INPUT_SHA }}
          restore-keys: |
            ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ env.TTS_INPUT_SHA }}-partial-

      - name: Compile once and prepare narration
        timeout-minutes: 30
        run: npm run episode:spec:compile -- "$SPEC_PATH"

      - name: Require exactly two validated cache blocks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t AUDIO < <(find .cache/spec-tts-blocks -type f -name audio.wav -print | sort)
          [[ "${#AUDIO[@]}" -eq 2 ]] || { echo "::error::A/B requires exactly two audio.wav cache blocks; found=${#AUDIO[@]}"; exit 1; }
          for file in "${AUDIO[@]}"; do
            ffmpeg -nostdin -v error -i "$file" -f null -
          done

      - name: Save complete narration cache
        if: steps.restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ env.TTS_INPUT_SHA }}

      - name: Package one shared narration payload
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vg-ab-tts
          tar -czf /tmp/vg-ab-tts/shared_tts_cache.tar.gz -C .cache spec-tts-blocks
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(".cache/spec-tts-blocks")
          files = sorted(root.rglob("audio.wav"))
          payload = []
          for file in files:
              data = file.read_bytes()
              payload.append({
                  "path": file.relative_to(root).as_posix(),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "bytes": len(data),
              })
          identity = {
              "ttsInputSha256": os.environ["TTS_INPUT_SHA"],
              "audioFiles": payload,
              "samePayloadForBothRenders": True,
              "finalAuthorized": False,
          }
          pathlib.Path("/tmp/vg-ab-tts/shared_tts_identity.json").write_text(
              json.dumps(identity, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          TTS_ARTIFACT="visual-grammar-ab-tts-${EPISODE_ID}-${GITHUB_RUN_ID}"
          echo "tts_artifact=$TTS_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Upload shared narration payload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.tts_artifact }}
          path: /tmp/vg-ab-tts
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  render-pair:
    name: Render ${{ matrix.label }} Preview
    needs: [preflight, prepare-shared-audio]
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            stage_mode: legacy
          - label: candidate
            stage_mode: candidate

    env:
      LABEL: ${{ matrix.label }}
      STAGE_MODE: ${{ matrix.stage_mode }}
      RENDERER_REF: main
      RENDERER_COMMIT: ${{ needs.preflight.outputs.renderer_commit }}
      SPEC_PATH: ${{ needs.preflight.outputs.spec_path }}
      EPISODE_ID: ${{ needs.preflight.outputs.episode_id }}
      SPEC_SHA: ${{ needs.preflight.outputs.spec_sha }}
      TTS_INPUT_SHA: ${{ needs.preflight.outputs.tts_input_sha }}
      SPEC_TTS_CACHE_ONLY: "1"
      VISUAL_GRAMMAR_AB_PREVIEW: "1"

    steps:
      - name: Checkout frozen renderer
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.renderer_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact input
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.preflight.outputs.input_artifact }}
          path: /tmp/vg-ab-input

      - name: Download shared narration
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.prepare-shared-audio.outputs.tts_artifact }}
          path: /tmp/vg-ab-tts

      - name: Install immutable input and narration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SPEC_PATH")" .cache
          cp "/tmp/vg-ab-input/$SPEC_PATH" "$SPEC_PATH"
          tar -xzf /tmp/vg-ab-tts/shared_tts_cache.tar.gz -C .cache
          [[ "$(sha256sum "$SPEC_PATH" | awk '{print $1}')" == "$SPEC_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$RENDERER_COMMIT" ]]

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Validate and compile from shared narration only
        shell: bash
        run: |
          set -euo pipefail
          npm run episode:spec:validate -- "$SPEC_PATH"
          COUNT="$(find .cache/spec-tts-blocks -type f -name audio.wav | wc -l | tr -d ' ')"
          [[ "$COUNT" -eq 2 ]]
          npm run episode:spec:compile -- "$SPEC_PATH"

      - name: Render and inspect A/B Preview
        timeout-minutes: 50
        run: npx tsx scripts/render-visual-grammar-ab-preview.ts "$SPEC_PATH" "$STAGE_MODE"

      - name: Package renderer identity
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="build/${EPISODE_ID}/visual-grammar-ab/${STAGE_MODE}"
          PREVIEW="renders/visual-grammar-ab/${EPISODE_ID}/${STAGE_MODE}.mp4"
          OUTPUT="ab-output/${LABEL}"
          mkdir -p "$OUTPUT"
          cp "$PREVIEW" "$OUTPUT/preview.mp4"
          cp "$SOURCE/technical_report.json" "$OUTPUT/technical_report.json"
          cp "$SOURCE/render_data.production.json" "$OUTPUT/render_data.production.json"
          cp "$SOURCE/preview_inspection.json" "$OUTPUT/preview_inspection.json"
          npx tsx scripts/create-visual-grammar-ab-manifest.ts identity \
            --label "$LABEL" \
            --ref "$RENDERER_REF" \
            --stage-mode "$STAGE_MODE" \
            --commit-sha "$RENDERER_COMMIT" \
            --spec-file "$SPEC_PATH" \
            --spec-path "$SPEC_PATH" \
            --tts-input-sha "$TTS_INPUT_SHA" \
            --audio-root .cache/spec-tts-blocks \
            --preview "$OUTPUT/preview.mp4" \
            --technical-report "$OUTPUT/technical_report.json" \
            --inspection "$OUTPUT/preview_inspection.json" \
            --production-data "$OUTPUT/render_data.production.json" \
            --output "$OUTPUT/render_identity.json"

      - name: Upload renderer Preview
        uses: actions/upload-artifact@v6
        with:
          name: visual-grammar-ab-${{ matrix.label }}-${{ needs.preflight.outputs.episode_id }}-${{ github.run_id }}
          path: ab-output/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package-comparison:
    name: Verify invariants and package A/B pair
    needs: [preflight, render-pair]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout frozen renderer contract
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.renderer_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download baseline Preview
        uses: actions/download-artifact@v6
        with:
          name: visual-grammar-ab-baseline-${{ needs.preflight.outputs.episode_id }}-${{ github.run_id }}
          path: /tmp/vg-ab-baseline

      - name: Download candidate Preview
        uses: actions/download-artifact@v6
        with:
          name: visual-grammar-ab-candidate-${{ needs.preflight.outputs.episode_id }}-${{ github.run_id }}
          path: /tmp/vg-ab-candidate

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Create immutable A/B manifest
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="ab-delivery"
          mkdir -p "$OUTPUT/baseline" "$OUTPUT/candidate"
          cp -R /tmp/vg-ab-baseline/. "$OUTPUT/baseline/"
          cp -R /tmp/vg-ab-candidate/. "$OUTPUT/candidate/"
          npx tsx scripts/create-visual-grammar-ab-manifest.ts manifest \
            --baseline "$OUTPUT/baseline/render_identity.json" \
            --candidate "$OUTPUT/candidate/render_identity.json" \
            --output "$OUTPUT/visual_grammar_ab_manifest.json"
          cp contracts/visual_grammar_ab_manifest.schema.json "$OUTPUT/"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (value.finalAuthorized !== false || value.userReviewRequired !== true) {
              throw new Error("A/B delivery must require user review and forbid final");
            }
            if (value.invariants?.allEqual !== true) {
              throw new Error("A/B invariants are not all equal");
            }
            if (value.baseline?.commitSha !== value.candidate?.commitSha) {
              throw new Error("A/B pair must use the same renderer commit");
            }
            if (value.baseline?.stageMode !== "legacy" || value.candidate?.stageMode !== "candidate") {
              throw new Error("A/B pair stage modes are invalid");
            }
          ' "$OUTPUT/visual_grammar_ab_manifest.json"

      - name: Upload A/B review package
        uses: actions/upload-artifact@v6
        with:
          name: visual-grammar-ab-review-${{ needs.preflight.outputs.episode_id }}-${{ github.run_id }}
          path: ab-delivery
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
