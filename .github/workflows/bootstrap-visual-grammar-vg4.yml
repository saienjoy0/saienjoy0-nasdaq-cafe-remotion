name: Bootstrap Visual Grammar VG-4

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/bootstrap-visual-grammar-vg4.mjs"
      - ".github/workflows/bootstrap-visual-grammar-vg4.yml"
      - "src/spec/reaction-timeline-contract.ts"
      - "src/spec/validate-reaction-timeline.ts"
      - "src/components/spec/EventReactionTimelineTemplate.tsx"
      - "scripts/test-event-reaction-timeline.tsx"
      - "scripts/test-reaction-timeline-contract.ts"
      - "scripts/test-visual-grammar-motion-language.ts"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-grammar-vg4-motion-timeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic VG-4 integration
        run: node scripts/bootstrap-visual-grammar-vg4.mjs
      - name: Generate render_spec schema
        run: npm run episode:spec:schema
      - name: Run Visual Grammar contract tests
        run: npm run test:visual-grammar
      - name: Run Stage Shell contract tests
        run: npm run test:visual-grammar-stage-shells
      - name: Run reaction timeline renderer tests
        run: npm run test:event-reaction-timeline
      - name: Run reaction timeline validator tests
        run: npx tsx scripts/test-reaction-timeline-contract.ts
      - name: Run motion language and TTS identity tests
        run: npm run test:visual-grammar-motion
      - name: Typecheck
        run: npm run typecheck
      - name: Run Visual Template regression tests
        run: npm run test:visual-templates
      - name: Run Visual Validator regression tests
        run: npm run test:visual-validator
      - name: Run public screen boundary tests
        run: npm run test:public-screen
      - name: Commit integrated VG-4 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            package.json \
            contracts/visual_grammar_renderer_compatibility.json \
            contracts/visual_grammar_renderer_compatibility.schema.json \
            schemas/render_spec.schema.json \
            src/spec/visual-template-contract.ts \
            src/spec/render-spec.ts \
            src/spec/visual-grammar-contract.ts \
            src/spec/motion-preset-contract.ts \
            src/spec/public-view-model.ts \
            src/components/spec/VisualTemplateRenderer.tsx \
            scripts/test-visual-grammar-stage-shells.tsx
          git commit -m "VG-4: integrate motion language and event reaction timeline"
          git push origin HEAD:feat/visual-grammar-vg4-motion-timeline
