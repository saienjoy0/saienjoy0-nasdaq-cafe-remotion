name: Nasdaq Cafe Layout Text Repair

on:
  push:
    branches: [main]
    paths:
      - "layout-text-repair-requests/*.json"

permissions:
  contents: write

concurrency:
  group: nasdaq-cafe-layout-text-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Apply exact display-only text repair
    if: github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Resolve exactly one repair request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only "$BEFORE_SHA" "$TRIGGER_SHA" -- 'layout-text-repair-requests/*.json')
          test "${#CHANGED[@]}" = 1 || { echo "::error::Exactly one layout text repair request must change"; exit 1; }
          echo "request_path=${CHANGED[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply exact display-only repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - '${{ steps.request.outputs.request_path }}' <<'PY'
          import copy, hashlib, json, os, sys
          from pathlib import Path

          request=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          required={'contractVersion','episodeDate','expectedRenderSpecSha256','expectedEpisodePackageSha256','sceneId','supportingTextIndex','oldText','newText','confirmation'}
          if set(request)!=required: raise SystemExit(f'request fields mismatch: {sorted(request)}')
          if request['contractVersion']!='1.0.0' or request['confirmation']!='PATCH_DISPLAY_TEXT_ONLY': raise SystemExit('invalid request contract')
          date=request['episodeDate']; scene_id=request['sceneId']; index=request['supportingTextIndex']; old_text=request['oldText']; new_text=request['newText']
          if not isinstance(index,int) or index<0: raise SystemExit('bad supportingTextIndex')
          if len(new_text)>28: raise SystemExit(f'new display text still exceeds 28 chars: {len(new_text)}')

          spec_path=Path(f'render-specs/{date}/render_spec.json')
          package_path=Path(f'episode-packages/{date}/episode_package_{date}.md')
          ready_path=Path(f'render-specs/{date}/production_ready.json')
          old_spec_bytes=spec_path.read_bytes(); old_package_bytes=package_path.read_bytes()
          sha=lambda b: hashlib.sha256(b).hexdigest()
          if sha(old_spec_bytes)!=request['expectedRenderSpecSha256']: raise SystemExit('render_spec SHA drift')
          if sha(old_package_bytes)!=request['expectedEpisodePackageSha256']: raise SystemExit('episode_package SHA drift')
          old_spec=json.loads(old_spec_bytes.decode('utf-8')); spec=copy.deepcopy(old_spec)
          scene=next((s for s in spec['scenes'] if s.get('sceneId')==scene_id),None)
          if scene is None: raise SystemExit(f'scene missing: {scene_id}')
          texts=scene.get('supportingTexts')
          if not isinstance(texts,list) or index>=len(texts) or texts[index]!=old_text:
              raise SystemExit(f'supporting text precondition failed: {texts!r}')
          texts[index]=new_text

          # Fail closed: canonical render_spec may differ only at this one supportingTexts slot.
          expected=copy.deepcopy(old_spec)
          expected_scene=next(s for s in expected['scenes'] if s.get('sceneId')==scene_id)
          expected_scene['supportingTexts'][index]=new_text
          if spec!=expected: raise SystemExit('unexpected render_spec mutation')
          for s_old,s_new in zip(old_spec['scenes'],spec['scenes']):
              if s_old.get('narrationChunks')!=s_new.get('narrationChunks'): raise SystemExit('narration/caption mutation forbidden')
          for key in ('editorial','publishing','review','sources','corrections','pronunciations','voiceProfileId'):
              if old_spec.get(key)!=spec.get(key): raise SystemExit(f'forbidden root mutation: {key}')

          spec_text=json.dumps(spec,ensure_ascii=False,indent=2,sort_keys=True)+'\n'
          spec_path.write_text(spec_text,encoding='utf-8')
          new_spec_sha=sha(spec_text.encode())

          md=old_package_bytes.decode('utf-8')
          occurrences=md.count(old_text)
          if occurrences<1: raise SystemExit('display text not found in episode_package')
          md=md.replace(old_text,new_text)
          marker='<!--BEGIN_FINAL_PRODUCTION_SOURCE-->'
          m=md.index(marker); js=md.index('```json',m)+len('```json'); je=md.index('```',js)
          source=json.loads(md[js:je].strip())
          nested=source.get('render_spec')
          if nested!=spec: raise SystemExit('episode_package FINAL_PRODUCTION_SOURCE does not match repaired render_spec')
          package_path.write_text(md,encoding='utf-8')
          new_package_sha=sha(md.encode())
          if ready_path.exists(): ready_path.unlink()

          out=Path(f'preview-status/{date}/layout_text_repair.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          receipt={'contractVersion':'1.0.0','status':'patched-awaiting-validator','episodeDate':date,'sceneId':scene_id,'supportingTextIndex':index,'oldText':old_text,'newText':new_text,'oldLength':len(old_text),'newLength':len(new_text),'narrationChanged':False,'captionChanged':False,'editorialChanged':False,'numbersChanged':False,'newRenderSpecSha256':new_spec_sha,'newEpisodePackageSha256':new_package_sha}
          out.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'episode_date={date}\nnew_render_sha={new_spec_sha}\nnew_package_sha={new_package_sha}\n')
          print(json.dumps(receipt,ensure_ascii=False,indent=2))
          PY

      - name: Run formal render-spec validator
        run: npm run episode:spec:validate -- "render-specs/${{ steps.repair.outputs.episode_date }}/render_spec.json"

      - name: Run layout and visual regressions
        run: |
          npm run test:public-screen
          npm run test:visual-validator
          npm run test:visual-variety

      - name: Recreate production readiness
        run: npm run episode:spec:ready -- "${{ steps.repair.outputs.episode_date }}" --consistency-pass

      - name: Mark receipt validated
        shell: bash
        run: |
          set -euo pipefail
          DATE='${{ steps.repair.outputs.episode_date }}'
          python3 - "$DATE" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(f'preview-status/{sys.argv[1]}/layout_text_repair.json')
          v=json.loads(p.read_text(encoding='utf-8'))
          v.update({'status':'validated-ready','formalValidator':'pass','layoutVisualRegressions':'pass','productionReady':'pass'})
          p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit only validated display repair
        shell: bash
        run: |
          set -euo pipefail
          DATE='${{ steps.repair.outputs.episode_date }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "render-specs/${DATE}/render_spec.json" \
            "render-specs/${DATE}/production_ready.json" \
            "episode-packages/${DATE}/episode_package_${DATE}.md" \
            "preview-status/${DATE}/layout_text_repair.json"
          git diff --cached --quiet && { echo "::error::No validated layout repair changes"; exit 1; }
          git commit -m "fix: fit ${DATE} Scene 7 supporting text"
          git pull --rebase origin main
          git push origin HEAD:main
