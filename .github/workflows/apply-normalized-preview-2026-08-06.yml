name: Apply Normalized Nasdaq Cafe Preview 2026-08-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-normalized-preview-2026-08-06.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-normalized-preview-2026-08-06
  cancel-in-progress: false

jobs:
  apply-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      EPISODE_DATE: "2026-08-06"
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      READY_PATH: "render-specs/2026-08-06/production_ready.json"
      PACKAGE_PATH: "episode-packages/2026-08-06/episode_package_2026-08-06.md"
      REPORT_PATH: "preview-status/2026-08-06/normalization_report.json"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize input without changing TTS identity
        run: |
          python3 scripts/normalize_nasdaq_cafe_2026_08_06.py \
            --spec "$SPEC_PATH" \
            --package "$PACKAGE_PATH" \
            --ready "$READY_PATH" \
            --report "$REPORT_PATH"

      - name: Run formal Renderer validator
        run: npm run episode:spec:validate -- "$SPEC_PATH"

      - name: Commit validated normalized input
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_PATH" "$READY_PATH" "$REPORT_PATH"
          git rm --ignore-unmatch scripts/normalize_nasdaq_cafe_2026_08_06.py
          git rm --ignore-unmatch .github/workflows/apply-normalized-preview-2026-08-06.yml
          git rm --ignore-unmatch .github/workflows/normalize-and-render-preview-2026-08-06.yml
          git rm --ignore-unmatch .github/workflows/normalize-financial-and-render-preview-2026-08-06.yml
          git commit -m "Apply validated Renderer 2.4 input for Nasdaq Cafe 2026-08-06"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "spec_sha=$SPEC_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch formal Preview
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run nasdaq-cafe-preview.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f episode_date="$EPISODE_DATE" \
            -f expected_spec_sha256="${{ steps.commit.outputs.spec_sha }}" \
            -f confirmation=PREVIEW
          for attempt in $(seq 1 30); do
            RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nasdaq-cafe-preview.yml --event workflow_dispatch --limit 10 --json databaseId,status,conclusion,createdAt,url,headSha)"
            RUN_ID="$(jq -r --arg head "${{ steps.commit.outputs.head_sha }}" '[.[] | select(.headSha == $head)][0].databaseId // empty' <<<"$RUNS")"
            if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Unable to identify formal Preview run"
          exit 1

      - name: Wait for Preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh run watch "${{ steps.dispatch.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          echo "$?" > /tmp/watch-exit.txt
          exit 0

      - name: Record Preview result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.dispatch.outputs.run_id }}"
          RUN_JSON="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs)"
          ARTIFACT_JSON="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"
          jq -n \
            --arg episode_date "$EPISODE_DATE" \
            --arg expected_spec_sha256 "${{ steps.commit.outputs.spec_sha }}" \
            --argjson workflow_run "$RUN_JSON" \
            --argjson artifacts "$ARTIFACT_JSON" \
            --arg watch_exit "$(cat /tmp/watch-exit.txt)" \
            '{version:1,episodeDate:$episode_date,expectedSpecSha256:$expected_spec_sha256,watchExitCode:($watch_exit|tonumber),workflowRun:$workflow_run,artifacts:$artifacts.artifacts}' \
            > "preview-status/$EPISODE_DATE/preview_run.json"
          git pull --rebase origin main
          git add "preview-status/$EPISODE_DATE/preview_run.json"
          git commit -m "Record Nasdaq Cafe Preview for 2026-08-06"
          git push origin HEAD:main
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "success"

# Retriggered after VG-6R merge to produce a user-review Preview only.
