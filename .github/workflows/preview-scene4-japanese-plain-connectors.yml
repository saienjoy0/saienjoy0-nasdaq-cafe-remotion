name: One-time Scene 4 Japanese Copy Preview

on:
  push:
    branches:
      - fix/visual-rhythm-2026-08-06
    paths:
      - .github/workflows/preview-scene4-japanese-plain-connectors.yml

permissions:
  contents: write
  actions: read

jobs:
  verify-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "true"
      EPISODE_DATE: "2026-08-06"
      SPEC_PATH: render-specs/2026-08-06/render_spec.json
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}

    steps:
      - name: Checkout repaired branch
        uses: actions/checkout@v6
        with:
          ref: fix/visual-rhythm-2026-08-06
          fetch-depth: 0

      - name: Apply approved viewer-copy and connector patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_scene4_japanese_and_plain_connectors.py
          git diff --cached --check

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Validate all contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:runtime-stability
          npm run episode:spec:validate -- "$SPEC_PATH"

      - name: Calculate new TTS identity
        shell: bash
        run: |
          set -euo pipefail
          TTS_INPUT_SHA="$(python3 - "$SPEC_PATH" <<'PY'
          import hashlib
          import json
          import os
          import sys

          spec_path = sys.argv[1]
          with open(spec_path, "r", encoding="utf-8") as handle:
              value = json.load(handle)
          scenes = value["scenes"]
          blocks = []
          for block_id, first_scene, last_scene in (("scenes-01-04", 1, 4), ("scenes-05-09", 5, 9)):
              speech = []
              for scene in scenes:
                  number = scene.get("sceneNumber")
                  if isinstance(number, int) and first_scene <= number <= last_scene:
                      speech.extend(chunk["speechText"] for chunk in scene["narrationChunks"])
              blocks.append({"id": block_id, "speechText": speech})
          payload = {
              "synthesisVersion": "gemini-two-block-v1",
              "model": os.environ["GEMINI_TTS_MODEL"],
              "voice": os.environ["GEMINI_TTS_VOICE"],
              "voiceProfileId": value.get("voiceProfileId"),
              "pronunciations": value.get("pronunciations"),
              "blocks": blocks,
          }
          encoded = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
          print(hashlib.sha256(encoded).hexdigest())
          PY
          )"
          echo "TTS_INPUT_SHA=$TTS_INPUT_SHA" >> "$GITHUB_ENV"
          echo "New TTS input SHA: $TTS_INPUT_SHA"
          mkdir -p .cache/spec-tts-blocks

      - name: Restore exact TTS cache if already available
        id: tts-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ env.TTS_INPUT_SHA }}

      - name: Render Preview with updated Scene 4 speech
        shell: bash
        run: |
          set -euo pipefail
          npm run episode:spec:preview -- "$SPEC_PATH"
          test "$(jq -r '.visualGrammarTiming.status' "build/${EPISODE_DATE}/technical_report.json")" = "PASS"
          test "$(jq -r '.visualGrammarTiming.unresolvedStateCount' "build/${EPISODE_DATE}/technical_report.json")" = "0"

      - name: Inspect Preview MP4
        shell: bash
        run: |
          set -euo pipefail
          MP4="renders/preview/${EPISODE_DATE}_nasdaq-cafe-spec-preview.mp4"
          test -s "$MP4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json "$MP4" > "build/${EPISODE_DATE}/scene4_japanese_ffprobe.json"
          ffmpeg -v error -i "$MP4" -f null -

      - name: Save exact new TTS cache
        if: steps.tts-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ env.TTS_INPUT_SHA }}

      - name: Commit approved permanent changes and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/preview-scene4-japanese-plain-connectors.yml
          git diff --cached --check
          git commit -m "Use Japanese comparison copy and plain causal connectors"
          git push origin HEAD:fix/visual-rhythm-2026-08-06

      - name: Upload repaired Preview
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-scene4-japanese-plain-connectors-${{ github.run_id }}
          path: |
            renders/preview/2026-08-06_nasdaq-cafe-spec-preview.mp4
            build/2026-08-06/technical_report.json
            build/2026-08-06/render_data.production.json
            build/2026-08-06/scene4_japanese_ffprobe.json
            public/spec-audio/2026-08-06/tts-block-state.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
