name: Apply Subtitle Layout Validation Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-subtitle-layout-fix-and-preview.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Apply subtitle layout fix
        run: python3 scripts/apply_subtitle_layout_fix.py

      - name: Verify complete renderer contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:subtitles
          npm run typecheck
          npm run test:spec
          npm run build
          test "$(sha256sum render-specs/2026-08-06/render_spec.json | awk '{print $1}')" = "56362777f841e5594e01a3f19a1c7051e1950fe8b6e67a679d839893e4693362"
          test "$(jq -r '.rendererNormalization.ttsInputSha256After' render-specs/2026-08-06/production_ready.json)" = "b4743df29c22902365d06a7a7a548a41131fe806a2a67ac75431198dc9c59509"

      - name: Commit tested renderer-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spec/validate-render-layout.ts scripts/test-subtitles.ts
          git rm scripts/apply_subtitle_layout_fix.py
          git rm --ignore-unmatch .github/workflows/dispatch-vg6r-preview-final-retry.yml
          git rm .github/workflows/apply-subtitle-layout-fix-and-preview.yml
          git commit -m "Validate rendered subtitle cues instead of metadata captions"
          git pull --rebase origin main
          git push origin HEAD:main
