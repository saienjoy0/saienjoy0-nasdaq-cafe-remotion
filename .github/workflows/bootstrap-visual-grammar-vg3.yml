name: Bootstrap Visual Grammar VG-3

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/bootstrap-visual-grammar-vg3.mjs"
      - ".github/workflows/bootstrap-visual-grammar-vg3.yml"
      - "src/components/spec/stages/**"
      - "src/components/spec/VisualGrammarStageHost.tsx"
      - "scripts/test-visual-grammar-stage-shells.tsx"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-grammar-vg3-stage-shells
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic VG-3 patch
        run: node scripts/bootstrap-visual-grammar-vg3.mjs
      - name: Run Stage Shell contract tests
        run: npm run test:visual-grammar-stage-shells
      - name: Run Visual Grammar contract tests
        run: npm run test:visual-grammar
      - name: Typecheck
        run: npm run typecheck
      - name: Run Visual Template regression tests
        run: npm run test:visual-templates
      - name: Run Visual Validator regression tests
        run: npm run test:visual-validator
      - name: Run public screen boundary tests
        run: npm run test:public-screen
      - name: Commit integrated Stage Shells
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            package.json \
            src/components/spec/VisualTemplateRenderer.tsx \
            src/components/spec/AdditionalVisualTemplates.tsx \
            src/components/spec/FinancialVisualTemplates.tsx \
            src/components/spec/SpecVisualModes.tsx
          git commit -m "VG-3: route templates through distinct Stage Shells"
          git push origin HEAD:feat/visual-grammar-vg3-stage-shells
