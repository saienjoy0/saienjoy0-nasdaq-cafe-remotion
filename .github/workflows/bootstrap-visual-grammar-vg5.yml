name: Bootstrap Visual Grammar VG-5

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/bootstrap-visual-grammar-vg5.mjs"
      - ".github/workflows/bootstrap-visual-grammar-vg5.yml"
      - "src/spec/measure-visual-grammar.ts"
      - "contracts/visual_grammar_timing_report.schema.json"
      - "scripts/test-visual-grammar-timing.ts"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-grammar-vg5-measured-diversity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic VG-5 integration
        run: node scripts/bootstrap-visual-grammar-vg5.mjs
      - name: Run measured diversity tests
        run: npm run test:visual-grammar-timing
      - name: Run Visual Grammar contract tests
        run: npm run test:visual-grammar
      - name: Typecheck
        run: npm run typecheck
      - name: Run render spec regression tests
        run: npm run test:spec
      - name: Run public screen boundary tests
        run: npm run test:public-screen
      - name: Commit integrated VG-5 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json scripts/spec-cli.ts
          git commit -m "VG-5: gate compile on measured Visual Grammar diversity"
          git push origin HEAD:feat/visual-grammar-vg5-measured-diversity
