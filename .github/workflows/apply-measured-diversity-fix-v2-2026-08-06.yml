name: Apply Measured Diversity Repair V2 2026-08-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-measured-diversity-fix-v2-2026-08-06.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-measured-diversity-fix-v2-2026-08-06
  cancel-in-progress: false

jobs:
  repair-validate-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EPISODE_DATE: "2026-08-06"
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      READY_PATH: "render-specs/2026-08-06/production_ready.json"
      PACKAGE_PATH: "episode-packages/2026-08-06/episode_package_2026-08-06.md"
      REPORT_PATH: "preview-status/2026-08-06/normalization_report.json"
      EXPECTED_TTS_INPUT_SHA256: "b4743df29c22902365d06a7a7a548a41131fe806a2a67ac75431198dc9c59509"
      TTS_CACHE_COMPATIBILITY_SHA256: "d35fe5c048bfcf6c07652c434e6773e4bde7d59dc2b875689709d5b6819ce9c4"
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      SPEC_TTS_CACHE_ONLY: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Repair only the three overlong Appearance runs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          spec_path = Path("render-specs/2026-08-06/render_spec.json")
          ready_path = Path("render-specs/2026-08-06/production_ready.json")
          package_path = Path("episode-packages/2026-08-06/episode_package_2026-08-06.md")
          report_path = Path("preview-status/2026-08-06/normalization_report.json")
          expected_tts = "b4743df29c22902365d06a7a7a548a41131fe806a2a67ac75431198dc9c59509"

          changes = {
              "scene-01-beat-002": {
                  "visualGrammarId": "evidence",
                  "visualTemplate": "evidence-boundary",
                  "variant": "confirmed-vs-unconfirmed",
                  "reason": "break 39.6s open-hero run with a non-financial evidence boundary",
              },
              "scene-03-beat-002": {
                  "visualGrammarId": "evidence",
                  "visualTemplate": "focus-matrix",
                  "variant": "default",
                  "reason": "break 29.1s metric-board run while preserving the same three metrics",
              },
              "scene-08-beat-002": {
                  "visualGrammarId": "evidence",
                  "visualTemplate": "evidence-boundary",
                  "variant": "confirmed-vs-unconfirmed",
                  "reason": "keep Scene 8 verification role while presenting its second half as evidence boundaries",
              },
          }

          ready = json.loads(ready_path.read_text(encoding="utf-8"))
          stored_tts = ready.get("rendererNormalization", {}).get("ttsInputSha256After")
          if stored_tts != expected_tts:
              raise SystemExit(f"stored TTS identity mismatch: {stored_tts}")

          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          applied = []
          for scene in spec["scenes"]:
              for beat in scene["visualBeats"]:
                  target = changes.get(beat["beatId"])
                  if not target:
                      continue
                  before = {
                      "visualGrammarId": beat["visualGrammarId"],
                      "visualTemplate": beat["visualTemplate"],
                      "variant": beat["templateConfig"]["variant"],
                      "viewerTexts": beat.get("viewerTexts", []),
                      "objectIds": beat.get("objectIds", []),
                  }
                  beat["visualGrammarId"] = target["visualGrammarId"]
                  beat["visualTemplate"] = target["visualTemplate"]
                  beat["templateConfig"]["variant"] = target["variant"]
                  after = {
                      "visualGrammarId": beat["visualGrammarId"],
                      "visualTemplate": beat["visualTemplate"],
                      "variant": beat["templateConfig"]["variant"],
                      "viewerTexts": beat.get("viewerTexts", []),
                      "objectIds": beat.get("objectIds", []),
                  }
                  if before["viewerTexts"] != after["viewerTexts"] or before["objectIds"] != after["objectIds"]:
                      raise SystemExit(f"viewer content changed for {beat['beatId']}")
                  applied.append({"beatId": beat["beatId"], "before": before, "after": after, "reason": target["reason"]})
          if len(applied) != 3:
              raise SystemExit(f"expected 3 repairs, applied {len(applied)}")

          encoded = json.dumps(spec, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          spec_path.write_text(encoded, encoding="utf-8")
          spec_sha = hashlib.sha256(encoded.encode("utf-8")).hexdigest()

          ready["renderSpecSha256"] = spec_sha
          normalization = dict(ready.get("rendererNormalization", {}))
          normalization["measuredDiversityRepair"] = {
              "status": "pending-post-tts-measurement",
              "changes": applied,
              "narrationChanged": False,
              "captionsChanged": False,
              "numbersChanged": False,
              "sourcesChanged": False,
              "sceneOrderChanged": False,
              "ttsIdentityChanged": False,
          }
          ready["rendererNormalization"] = normalization
          ready_path.write_text(json.dumps(ready, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          report["normalizedRenderSpecSha256"] = spec_sha
          report["measuredDiversityRepair"] = normalization["measuredDiversityRepair"]
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          package = package_path.read_text(encoding="utf-8")

          def update_beat_block(text: str, beat_id: str, fields: list[tuple[str, str]]) -> str:
              marker = f"- **{beat_id}**"
              start = text.index(marker)
              next_beat = text.find("\n- **", start + len(marker))
              narration = text.find("\n### 完成ナレーション", start + len(marker))
              candidates = [value for value in [next_beat, narration] if value >= 0]
              if not candidates:
                  raise SystemExit(f"unable to find package block end for {beat_id}")
              end = min(candidates)
              block = text[start:end]
              for old, new in fields:
                  if old not in block:
                      raise SystemExit(f"{beat_id} package field not found: {old}")
                  block = block.replace(old, new, 1)
              return text[:start] + block + text[end:]

          package = update_beat_block(package, "scene-01-beat-002", [
              ("  - Visual Template ID：hero-number", "  - Visual Template ID：evidence-boundary"),
              ("  - Template Variant：default", "  - Template Variant：confirmed-vs-unconfirmed"),
          ])
          package = update_beat_block(package, "scene-03-beat-002", [
              ("  - Visual Template ID：metric-comparison-board", "  - Visual Template ID：focus-matrix"),
          ])
          package = update_beat_block(package, "scene-08-beat-002", [
              ("  - Visual Grammar：verification / continuation", "  - Visual Grammar：evidence / continuation"),
              ("  - Visual Template ID：verification-checklist", "  - Visual Template ID：evidence-boundary"),
              ("  - Template Variant：default", "  - Template Variant：confirmed-vs-unconfirmed"),
          ])
          package_path.write_text(package, encoding="utf-8")

          print(json.dumps({"status": "patched", "renderSpecSha256": spec_sha, "changes": applied}, ensure_ascii=False))
          PY

      - name: Run formal validator
        run: npm run episode:spec:validate -- "$SPEC_PATH"

      - name: Restore exact two-block TTS cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: Linux-spec-tts-block-v2-${{ env.TTS_CACHE_COMPATIBILITY_SHA256 }}-${{ env.EXPECTED_TTS_INPUT_SHA256 }}
          restore-keys: |
            Linux-spec-tts-block-v2-${{ env.TTS_CACHE_COMPATIBILITY_SHA256 }}-${{ env.EXPECTED_TTS_INPUT_SHA256 }}-partial-

      - name: Compile cache-only and require measured diversity PASS
        shell: bash
        run: |
          set -euo pipefail
          npm run episode:spec:compile -- "$SPEC_PATH"
          test "$(jq -r '.visualGrammarTiming.status' "build/${EPISODE_DATE}/technical_report.json")" = "PASS"
          test "$(jq -r '.visualGrammarTiming.unresolvedStateCount' "build/${EPISODE_DATE}/technical_report.json")" = "0"
          REPORT_FILE="$(jq -r '.visualGrammarTiming.path' "build/${EPISODE_DATE}/technical_report.json")"
          test -s "$REPORT_FILE"
          jq '{status,metrics,failures,warnings,beats}' "$REPORT_FILE" > "preview-status/${EPISODE_DATE}/measured_diversity_repair_report.json"

      - name: Confirm TTS and editorial identity stayed fixed
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.rendererNormalization.ttsInputSha256After' "$READY_PATH")" = "$EXPECTED_TTS_INPUT_SHA256"
          jq -e '.rendererNormalization.measuredDiversityRepair.narrationChanged == false' "$READY_PATH"
          jq -e '.rendererNormalization.measuredDiversityRepair.captionsChanged == false' "$READY_PATH"
          jq -e '.rendererNormalization.measuredDiversityRepair.numbersChanged == false' "$READY_PATH"
          jq -e '.rendererNormalization.measuredDiversityRepair.sourcesChanged == false' "$READY_PATH"

      - name: Mark measured repair complete and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path
          for raw in [
              "render-specs/2026-08-06/production_ready.json",
              "preview-status/2026-08-06/normalization_report.json",
          ]:
              path = Path(raw)
              value = json.loads(path.read_text(encoding="utf-8"))
              target = value["rendererNormalization"]["measuredDiversityRepair"] if "rendererNormalization" in value else value["measuredDiversityRepair"]
              target["status"] = "PASS"
              target["timingBasis"] = "post-tts-production-data"
              target["unresolvedStateCount"] = 0
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_PATH" "$READY_PATH" "$PACKAGE_PATH" "$REPORT_PATH" "preview-status/${EPISODE_DATE}/measured_diversity_repair_report.json"
          git rm --ignore-unmatch .github/workflows/apply-measured-diversity-fix-2026-08-06.yml
          git rm .github/workflows/apply-measured-diversity-fix-v2-2026-08-06.yml
          git commit -m "Repair measured Visual Grammar diversity for 2026-08-06"
          git pull --rebase origin main
          git push origin HEAD:main
