name: Visual Grammar A/B Contract

on:
  pull_request:
    paths:
      - "contracts/visual_grammar_ab_manifest.schema.json"
      - "src/spec/visual-grammar-stage-mode.ts"
      - "src/components/spec/VisualGrammarStageMode.tsx"
      - "src/components/spec/VisualGrammarStageHost.tsx"
      - "src/compositions/NasdaqCafeSpecEpisode.tsx"
      - "scripts/create-visual-grammar-ab-manifest.ts"
      - "scripts/render-visual-grammar-ab-preview.ts"
      - "scripts/test-visual-grammar-ab-contract.tsx"
      - "docs/15_visual_grammar_ab_preview.md"
      - ".github/workflows/visual-grammar-ab-preview.yml"
      - ".github/workflows/visual-grammar-ab-contract.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/visual_grammar_ab_manifest.schema.json"
      - "src/spec/visual-grammar-stage-mode.ts"
      - "src/components/spec/VisualGrammarStageMode.tsx"
      - "src/components/spec/VisualGrammarStageHost.tsx"
      - "src/compositions/NasdaqCafeSpecEpisode.tsx"
      - "scripts/create-visual-grammar-ab-manifest.ts"
      - "scripts/render-visual-grammar-ab-preview.ts"
      - "scripts/test-visual-grammar-ab-contract.tsx"
      - "docs/15_visual_grammar_ab_preview.md"
      - ".github/workflows/visual-grammar-ab-preview.yml"
      - ".github/workflows/visual-grammar-ab-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON and workflow YAML syntax
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('contracts/visual_grammar_ab_manifest.schema.json','utf8'))"
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file); puts "PASS #{file}" }' \
            .github/workflows/visual-grammar-ab-preview.yml \
            .github/workflows/visual-grammar-ab-contract.yml

      - name: Run A/B contract and Stage mode tests
        run: npx tsx scripts/test-visual-grammar-ab-contract.tsx

      - name: Typecheck
        run: npm run typecheck

      - name: Run Stage Shell regression
        run: npm run test:visual-grammar-stage-shells

      - name: Run public screen boundary regression
        run: npm run test:public-screen
