name: Probe Nasdaq Cafe Normalize Preview 2026-08-06

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-normalize-preview-2026-08-06.yml"

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch normalization workflow status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p preview-status/2026-08-06
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow normalize-and-render-preview-2026-08-06.yml \
            --limit 5 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName \
            > /tmp/runs.json
          RUN_ID="$(jq -r '.[0].databaseId // empty' /tmp/runs.json)"
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::No normalization workflow run found"
            exit 1
          fi
          gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs \
            > /tmp/run.json
          jq -n \
            --argjson recent_runs "$(cat /tmp/runs.json)" \
            --argjson latest_run "$(cat /tmp/run.json)" \
            '{version:1,recentRuns:$recent_runs,latestRun:$latest_run}' \
            > preview-status/2026-08-06/normalization_workflow_run.json

      - name: Commit probe result and remove probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-status/2026-08-06/normalization_workflow_run.json
          git rm .github/workflows/probe-normalize-preview-2026-08-06.yml
          git commit -m "Record Nasdaq Cafe normalization workflow status"
          git push origin HEAD:main
