name: Nasdaq Cafe Handoff Preview Request V3

on:
  push:
    branches:
      - main
    paths:
      - "handoff-preview-requests-v3/*.json"

permissions:
  actions: read
  contents: read

concurrency:
  group: nasdaq-cafe-handoff-preview-request-v3
  cancel-in-progress: false

jobs:
  resolve-request:
    if: github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      episode_date: ${{ steps.request.outputs.episode_date }}
      plot_run_id: ${{ steps.request.outputs.plot_run_id }}
      artifact_name: ${{ steps.request.outputs.artifact_name }}
      bundle_id: ${{ steps.request.outputs.bundle_id }}
      manifest_sha: ${{ steps.request.outputs.manifest_sha }}
      renderer_commit: ${{ steps.request.outputs.renderer_commit }}
      renderer_contract_version: ${{ steps.request.outputs.renderer_contract_version }}
      registry_snapshot_sha: ${{ steps.request.outputs.registry_snapshot_sha }}
      signed_url: ${{ steps.request.outputs.signed_url }}
      signed_digest: ${{ steps.request.outputs.signed_digest }}
    steps:
      - name: Checkout owner request
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Resolve and validate exactly one request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only "$BEFORE_SHA" "$TRIGGER_SHA" -- 'handoff-preview-requests-v3/*.json')
          if [[ "${#CHANGED[@]}" -ne 1 ]]; then
            echo "::error::Exactly one V3 handoff preview request JSON must change"
            exit 1
          fi
          python3 - "${CHANGED[0]}" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlparse

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = {
              "contractVersion", "episodeDate", "plotRunId", "handoffArtifactName",
              "expectedBundleId", "expectedManifestSha256", "expectedRendererCommit",
              "expectedRendererContractVersion", "expectedRegistrySnapshotSha256",
              "signedArtifactUrl", "signedArtifactDigestSha256", "confirmation",
          }
          if set(value) != required:
              raise SystemExit(f"request fields mismatch: {sorted(value)}")
          if value["contractVersion"] != "1.1.0":
              raise SystemExit("contractVersion must be 1.1.0")
          if value["confirmation"] != "PREVIEW":
              raise SystemExit("confirmation must be PREVIEW")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", str(value["episodeDate"])):
              raise SystemExit("bad episodeDate")
          if not isinstance(value["plotRunId"], int) or isinstance(value["plotRunId"], bool) or value["plotRunId"] <= 0:
              raise SystemExit("bad plotRunId")
          if not re.fullmatch(r"[A-Za-z0-9._-]+", str(value["handoffArtifactName"])):
              raise SystemExit("unsafe handoffArtifactName")
          for key in ("expectedBundleId", "expectedManifestSha256", "expectedRegistrySnapshotSha256", "signedArtifactDigestSha256"):
              if value[key] and not re.fullmatch(r"[0-9a-f]{64}", str(value[key])):
                  raise SystemExit(f"bad {key}")
          if not re.fullmatch(r"[0-9a-f]{40}", str(value["expectedRendererCommit"])):
              raise SystemExit("bad expectedRendererCommit")
          if not isinstance(value["expectedRendererContractVersion"], str) or not value["expectedRendererContractVersion"]:
              raise SystemExit("bad expectedRendererContractVersion")
          parsed = urlparse(str(value["signedArtifactUrl"]))
          if value["signedArtifactUrl"]:
              if parsed.scheme != "https" or not parsed.hostname or not parsed.hostname.endswith(".oaiusercontent.com"):
                  raise SystemExit("unsafe signedArtifactUrl")
          elif value["signedArtifactDigestSha256"]:
              raise SystemExit("signed Artifact digest requires URL")

          mapping = {
              "episode_date": "episodeDate",
              "plot_run_id": "plotRunId",
              "artifact_name": "handoffArtifactName",
              "bundle_id": "expectedBundleId",
              "manifest_sha": "expectedManifestSha256",
              "renderer_commit": "expectedRendererCommit",
              "renderer_contract_version": "expectedRendererContractVersion",
              "registry_snapshot_sha": "expectedRegistrySnapshotSha256",
              "signed_url": "signedArtifactUrl",
              "signed_digest": "signedArtifactDigestSha256",
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for output_key, input_key in mapping.items():
                  out.write(f"{output_key}={value[input_key]}\n")
          PY

  preview:
    needs: resolve-request
    uses: ./.github/workflows/nasdaq-cafe-preview-handoff.yml
    with:
      episode_date: ${{ needs.resolve-request.outputs.episode_date }}
      plot_run_id: ${{ needs.resolve-request.outputs.plot_run_id }}
      handoff_artifact_name: ${{ needs.resolve-request.outputs.artifact_name }}
      expected_bundle_id: ${{ needs.resolve-request.outputs.bundle_id }}
      expected_manifest_sha256: ${{ needs.resolve-request.outputs.manifest_sha }}
      expected_renderer_commit: ${{ needs.resolve-request.outputs.renderer_commit }}
      expected_renderer_contract_version: ${{ needs.resolve-request.outputs.renderer_contract_version }}
      expected_registry_snapshot_sha256: ${{ needs.resolve-request.outputs.registry_snapshot_sha }}
      signed_artifact_url: ${{ needs.resolve-request.outputs.signed_url }}
      signed_artifact_digest_sha256: ${{ needs.resolve-request.outputs.signed_digest }}
      confirmation: PREVIEW
    secrets: inherit
