name: Repair generated intraday schema

on:
  pull_request:
    branches: [main]
    paths:
      - "src/spec/reaction-timeline-contract.ts"
      - "schemas/render_spec.schema.json"
      - ".github/workflows/repair-intraday-schema.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run episode:spec:schema
      - name: Commit generated schema if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- schemas/render_spec.schema.json; then
            echo "schema already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- schemas/render_spec.schema.json
          git commit -m "Regenerate render spec schema"
          git push origin HEAD:${{ github.head_ref }}
