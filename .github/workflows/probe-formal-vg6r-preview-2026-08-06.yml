name: Probe Formal VG-6R Preview 2026-08-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-formal-vg6r-preview-2026-08-06.yml"

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Record latest formal Preview run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-status/2026-08-06
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nasdaq-cafe-preview.yml --event workflow_dispatch --limit 1 --json databaseId | jq -r '.[0].databaseId // empty')"
          test "$RUN_ID" != ""
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs > preview-status/2026-08-06/vg6r_formal_preview_run.json
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" > preview-status/2026-08-06/vg6r_formal_preview_artifacts.json
      - name: Commit status and remove probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-status/2026-08-06/vg6r_formal_preview_run.json preview-status/2026-08-06/vg6r_formal_preview_artifacts.json
          git rm .github/workflows/probe-formal-vg6r-preview-2026-08-06.yml
          git commit -m "Record formal VG-6R Preview status"
          git pull --rebase origin main
          git push origin HEAD:main
