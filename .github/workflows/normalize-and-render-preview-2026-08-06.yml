name: Normalize and Render Nasdaq Cafe Preview 2026-08-06

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normalize-and-render-preview-2026-08-06.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: normalize-and-render-preview-2026-08-06
  cancel-in-progress: false

jobs:
  normalize-validate-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      EPISODE_DATE: "2026-08-06"
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      READY_PATH: "render-specs/2026-08-06/production_ready.json"
      PACKAGE_PATH: "episode-packages/2026-08-06/episode_package_2026-08-06.md"
      RENDERER_COMPATIBILITY_SHA256: "563bc71c58120552c3f601cab662a4f4287e44c149e46268ef5678d279b1adb6"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize Plot 2.4 payload to Renderer 2.4 schema
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SPEC_PATH"
          test -s "$READY_PATH"
          test -s "$PACKAGE_PATH"

          python3 - <<'PY'
          import copy
          import hashlib
          import json
          import os
          from pathlib import Path

          spec_path = Path(os.environ["SPEC_PATH"])
          ready_path = Path(os.environ["READY_PATH"])
          package_path = Path(os.environ["PACKAGE_PATH"])
          compatibility_sha = os.environ["RENDERER_COMPATIBILITY_SHA256"]

          original_raw = spec_path.read_bytes()
          spec = json.loads(original_raw.decode("utf-8"))
          if spec.get("schemaVersion") != "2.4.0":
              raise SystemExit("expected Plot render_spec schemaVersion 2.4.0")

          def canonical_sha(value):
              raw = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def tts_identity(value):
              blocks = []
              for block_id, first_scene, last_scene in (
                  ("scenes-01-04", 1, 4),
                  ("scenes-05-09", 5, 9),
              ):
                  speech = []
                  for scene in value["scenes"]:
                      number = scene.get("sceneNumber")
                      if isinstance(number, int) and first_scene <= number <= last_scene:
                          speech.extend(chunk["speechText"] for chunk in scene["narrationChunks"])
                  if not speech:
                      raise SystemExit(f"TTS block {block_id} has no speechText")
                  blocks.append({"id": block_id, "speechText": speech})
              return canonical_sha({
                  "synthesisVersion": "gemini-two-block-v1",
                  "model": "gemini-3.1-flash-tts-preview",
                  "voice": "Charon",
                  "voiceProfileId": value.get("voiceProfileId"),
                  "pronunciations": value.get("pronunciations"),
                  "blocks": blocks,
              })

          before_tts_sha = tts_identity(spec)
          original_spec_sha = hashlib.sha256(original_raw).hexdigest()
          package_sha = hashlib.sha256(package_path.read_bytes()).hexdigest()

          source_type_map = {
              "company-ir": "company",
              "historical-memory": "other",
          }
          source_id_map = {"memory-001": "source-009"}
          for source in spec.get("sources", []):
              old_id = source.get("sourceId")
              if old_id in source_id_map:
                  source["sourceId"] = source_id_map[old_id]
              old_type = source.get("sourceType")
              if old_type in source_type_map:
                  source["sourceType"] = source_type_map[old_type]
              if not isinstance(source.get("narrationAttribution"), str) or not source["narrationAttribution"].strip():
                  source["narrationAttribution"] = "過去回の編集記憶（現在証拠として不使用）"

          def replace_exact(value):
              if isinstance(value, str):
                  return source_id_map.get(value, value)
              if isinstance(value, list):
                  return [replace_exact(item) for item in value]
              if isinstance(value, dict):
                  return {key: replace_exact(item) for key, item in value.items()}
              return value

          spec = replace_exact(spec)

          mapping_entries = []
          beat_count = 0
          for scene in spec["scenes"]:
              if scene.get("expectedBasisType") == "not-applicable":
                  scene["expectedBasisType"] = None
              if scene.get("visualMode") == "verification":
                  scene["visualMode"] = "verification-points"
              if scene.get("visualMode") == "closing-recap":
                  scene["visualMode"] = "conclusion-card"
              if scene.get("sceneRole") == "fixed-ending":
                  scene["sceneRole"] = "closing-recap-sendoff-goodnight"

              for beat in scene["visualBeats"]:
                  beat_count += 1
                  duplicate_id = beat.pop("visualBeatId", None)
                  if duplicate_id is not None and duplicate_id != beat.get("beatId"):
                      raise SystemExit(
                          f"Visual Beat ID conflict: beatId={beat.get('beatId')} visualBeatId={duplicate_id}"
                      )
                  visual_grammar = beat.pop("visualGrammar", None)
                  if not isinstance(visual_grammar, dict):
                      raise SystemExit(f"missing visualGrammar: {beat.get('beatId')}")
                  if visual_grammar.get("contractVersion") != "1.0.0":
                      raise SystemExit(f"unsupported Visual Grammar contract: {beat.get('beatId')}")
                  grammar_id = visual_grammar.get("grammarId")
                  transition_role = visual_grammar.get("transitionRole")
                  if visual_grammar.get("returnTargetBeatId") is not None:
                      raise SystemExit(
                          f"Renderer schema has no resolved return target field: {beat.get('beatId')}"
                      )
                  beat["visualGrammarId"] = grammar_id
                  beat["transitionRole"] = transition_role
                  if beat.get("visualMode") == "verification":
                      beat["visualMode"] = "verification-points"
                  if beat.get("visualMode") == "closing-recap":
                      beat["visualMode"] = "conclusion-card"
                  mapping_entries.append({
                      "beatId": beat.get("beatId"),
                      "visualTemplate": beat.get("visualTemplate"),
                      "visualGrammarId": grammar_id,
                      "transitionRole": transition_role,
                  })

          removed_root = {}
          for key in (
              "expectedConfirmed",
              "imageSelection",
              "tts",
              "visualGrammarContractVersion",
          ):
              if key in spec:
                  removed_root[key] = spec.pop(key)

          mapping_contract = {
              "contractVersion": "1.0.0",
              "episodeId": spec["episode"]["id"],
              "sourceSpecSha256": original_spec_sha,
              "normalizations": {
                  "sourceType": source_type_map,
                  "sourceId": source_id_map,
                  "expectedBasisType": {"not-applicable": None},
                  "visualMode": {
                      "verification": "verification-points",
                      "closing-recap": "conclusion-card",
                  },
                  "sceneRole": {
                      "fixed-ending": "closing-recap-sendoff-goodnight",
                  },
                  "removedRootKeys": sorted(removed_root),
                  "beatFieldMigration": "visualBeatId/visualGrammar -> beatId/visualGrammarId/transitionRole",
              },
              "beats": mapping_entries,
          }

          spec["visualGrammarContract"] = {
              "contractVersion": "1.0.0",
              "semanticsSha256": canonical_sha(mapping_contract),
              "rendererCompatibilitySha256": compatibility_sha,
              "finalEpisodeContractSha256": package_sha,
              "beatCount": beat_count,
          }

          after_tts_sha = tts_identity(spec)
          if before_tts_sha != after_tts_sha:
              raise SystemExit(
                  f"normalization changed TTS identity: before={before_tts_sha} after={after_tts_sha}"
              )

          normalized_text = json.dumps(spec, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          spec_path.write_text(normalized_text, encoding="utf-8")
          normalized_sha = hashlib.sha256(normalized_text.encode("utf-8")).hexdigest()

          ready = json.loads(ready_path.read_text(encoding="utf-8"))
          ready["renderSpecSha256"] = normalized_sha
          ready["rendererNormalization"] = {
              "status": "pass",
              "sourceRenderSpecSha256": original_spec_sha,
              "normalizedRenderSpecSha256": normalized_sha,
              "ttsInputSha256Before": before_tts_sha,
              "ttsInputSha256After": after_tts_sha,
              "ttsIdentityChanged": False,
              "narrationChanged": False,
              "numbersChanged": False,
              "sceneOrderChanged": False,
              "marketMeaningChanged": False,
          }
          ready_path.write_text(
              json.dumps(ready, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          report_path = Path(f"preview-status/{os.environ['EPISODE_DATE']}/normalization_report.json")
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(
              json.dumps({
                  "version": 1,
                  "status": "normalized-for-renderer-2.4",
                  "episodeDate": os.environ["EPISODE_DATE"],
                  "sourceRenderSpecSha256": original_spec_sha,
                  "normalizedRenderSpecSha256": normalized_sha,
                  "episodePackageSha256": package_sha,
                  "beatCount": beat_count,
                  "ttsInputSha256Before": before_tts_sha,
                  "ttsInputSha256After": after_tts_sha,
                  "ttsIdentityChanged": False,
                  "narrationChanged": False,
                  "numbersChanged": False,
                  "sceneOrderChanged": False,
                  "marketMeaningChanged": False,
                  "mappingContractSha256": canonical_sha(mapping_contract),
              }, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(normalized_sha)
          PY

      - name: Run formal Renderer validator
        shell: bash
        run: |
          set -euo pipefail
          npm run episode:spec:validate -- "$SPEC_PATH" 2>&1 | tee /tmp/renderer-validator.log

      - name: Commit normalized immutable input
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SPEC_PATH" "$READY_PATH" "preview-status/$EPISODE_DATE/normalization_report.json"
          git rm --ignore-unmatch ".github/workflows/normalize-and-render-preview-2026-08-06.yml"
          git commit -m "Normalize Nasdaq Cafe 2026-08-06 input for Renderer 2.4"
          git push origin HEAD:main
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "spec_sha=$SPEC_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch formal Preview
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_SHA: ${{ steps.commit.outputs.spec_sha }}
          NORMALIZED_HEAD: ${{ steps.commit.outputs.head_sha }}
        run: |
          set -euo pipefail
          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run nasdaq-cafe-preview.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f episode_date="$EPISODE_DATE" \
            -f expected_spec_sha256="$SPEC_SHA" \
            -f confirmation=PREVIEW

          for attempt in $(seq 1 30); do
            RUNS="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow nasdaq-cafe-preview.yml \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,status,conclusion,createdAt,url,headSha)"
            RUN_ID="$(python3 - "$DISPATCHED_AT" "$NORMALIZED_HEAD" <<<"$RUNS" <<'PY'
          import json
          import sys
          dispatched_at, head_sha = sys.argv[1:]
          runs = json.load(sys.stdin)
          for run in runs:
              if run.get("headSha") == head_sha and run.get("createdAt", "") >= dispatched_at:
                  print(run.get("databaseId", ""))
                  break
          PY
            )"
            if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "$RUN_ID" > /tmp/preview-run-id.txt
              exit 0
            fi
            sleep 3
          done
          echo "::error::Unable to identify dispatched Preview run"
          exit 1

      - name: Wait for Preview completion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          RUN_ID="${{ steps.dispatch.outputs.run_id }}"
          set +e
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          WATCH_EXIT=$?
          set -e
          echo "$WATCH_EXIT" > /tmp/preview-watch-exit.txt

      - name: Record final Preview status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.dispatch.outputs.run_id }}"
          RUN_JSON="$(gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs)"
          ARTIFACT_JSON="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"
          SPEC_SHA="${{ steps.commit.outputs.spec_sha }}"

          jq -n \
            --arg episode_date "$EPISODE_DATE" \
            --arg expected_spec_sha256 "$SPEC_SHA" \
            --argjson workflow_run "$RUN_JSON" \
            --argjson artifacts "$ARTIFACT_JSON" \
            --arg watch_exit "$(cat /tmp/preview-watch-exit.txt)" \
            '{
              version: 1,
              episodeDate: $episode_date,
              expectedSpecSha256: $expected_spec_sha256,
              watchExitCode: ($watch_exit | tonumber),
              workflowRun: $workflow_run,
              artifacts: $artifacts.artifacts
            }' > "preview-status/$EPISODE_DATE/preview_run.json"

          git pull --rebase origin main
          git add "preview-status/$EPISODE_DATE/preview_run.json"
          git commit -m "Record rendered Nasdaq Cafe preview for 2026-08-06"
          git push origin HEAD:main

          CONCLUSION="$(jq -r '.conclusion' <<<"$RUN_JSON")"
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::Formal Preview failed with conclusion=$CONCLUSION"
            exit 1
          fi
