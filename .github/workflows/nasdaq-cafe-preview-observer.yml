name: Nasdaq Cafe Standard Preview Observer

on:
  push:
    branches:
      - main
    paths:
      - "preview-observer-probes/*.json"

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  observe:
    name: Observe standard Preview run
    if: github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout probe
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Resolve exactly one probe
        id: probe
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only "$BEFORE_SHA" "$TRIGGER_SHA" -- 'preview-observer-probes/*.json')
          if [[ "${#CHANGED[@]}" -ne 1 ]]; then
            echo "::error::Exactly one preview observer probe must change"
            exit 1
          fi
          python3 - "${CHANGED[0]}" <<'PY'
          import json, os, re, sys
          from pathlib import Path
          value=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          required={'contractVersion','episodeDate','notBefore'}
          if set(value)!=required: raise SystemExit(f'probe fields mismatch: {sorted(value)}')
          if value['contractVersion']!='1.0.0': raise SystemExit('contractVersion must be 1.0.0')
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', str(value['episodeDate'])): raise SystemExit('bad episodeDate')
          if not isinstance(value['notBefore'], str) or not value['notBefore'].endswith('Z'): raise SystemExit('bad notBefore')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"episode_date={value['episodeDate']}\n")
              out.write(f"not_before={value['notBefore']}\n")
          PY

      - name: Query latest standard Preview run
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_DATE: ${{ steps.probe.outputs.episode_date }}
          NOT_BEFORE: ${{ steps.probe.outputs.not_before }}
        run: |
          set -euo pipefail
          RESPONSE="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nasdaq-cafe-preview.yml/runs?event=workflow_dispatch&branch=main&per_page=30")"
          RUN="$(jq -c --arg t "$NOT_BEFORE" '.workflow_runs | map(select(.created_at >= $t)) | sort_by(.created_at) | reverse | .[0] // empty' <<<"$RESPONSE")"
          if [[ -z "$RUN" ]]; then
            echo "run_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN_ID="$(jq -r '.id' <<<"$RUN")"
          STATUS="$(jq -r '.status' <<<"$RUN")"
          CONCLUSION="$(jq -r '.conclusion // "pending"' <<<"$RUN")"
          URL="$(jq -r '.html_url' <<<"$RUN")"
          HEAD_SHA="$(jq -r '.head_sha' <<<"$RUN")"
          ARTIFACTS=""
          FAILED_JOB=""
          FAILED_STEP=""
          LOG_TAIL=""
          if [[ "$STATUS" == "completed" ]]; then
            A="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
            ARTIFACTS="$(jq -r '.artifacts[]?.name' <<<"$A")"
            if [[ "$CONCLUSION" != "success" ]]; then
              J="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
              FAILED_JOB="$(jq -r '.jobs[] | select(.conclusion=="failure") | .id' <<<"$J" | head -n1)"
              FAILED_STEP="$(jq -r '.jobs[] | select(.conclusion=="failure") | .steps[]? | select(.conclusion=="failure") | .name' <<<"$J" | head -n1)"
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed >/tmp/preview-failed.log 2>&1 || true
              LOG_TAIL="$(tail -n 100 /tmp/preview-failed.log)"
            fi
          fi
          {
            echo "run_found=true"
            echo "run_id=$RUN_ID"
            echo "status=$STATUS"
            echo "conclusion=$CONCLUSION"
            echo "url=$URL"
            echo "head_sha=$HEAD_SHA"
            echo "failed_job=$FAILED_JOB"
            echo "failed_step=$FAILED_STEP"
            echo "artifacts<<EOF"
            printf '%s\n' "$ARTIFACTS"
            echo "EOF"
            echo "log_tail<<EOF"
            printf '%s\n' "$LOG_TAIL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert observer receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_DATE: ${{ steps.probe.outputs.episode_date }}
          RUN_FOUND: ${{ steps.run.outputs.run_found }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          STATUS: ${{ steps.run.outputs.status }}
          CONCLUSION: ${{ steps.run.outputs.conclusion }}
          RUN_URL: ${{ steps.run.outputs.url }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          FAILED_JOB: ${{ steps.run.outputs.failed_job }}
          FAILED_STEP: ${{ steps.run.outputs.failed_step }}
          LOG_TAIL: ${{ steps.run.outputs.log_tail }}
          ARTIFACTS: ${{ steps.run.outputs.artifacts }}
        run: |
          set -euo pipefail
          TITLE="NASDAQ CAFE STANDARD PREVIEW OBSERVER ${EPISODE_DATE}"
          if [[ "$RUN_FOUND" != "true" ]]; then
            BODY="No standard Preview workflow_dispatch run found after the pinned readiness time yet."
          else
            LINES="$(printf '%s\n' "$ARTIFACTS" | sed '/^$/d;s/^/- `/;s/$/`/')"
            [[ -n "$LINES" ]] || LINES="- none yet"
            BODY="$(cat <<EOF
          Standard Preview observer receipt.

          - Episode date: \`${EPISODE_DATE}\`
          - Workflow run ID: \`${RUN_ID}\`
          - Status: \`${STATUS}\`
          - Conclusion: \`${CONCLUSION}\`
          - Head SHA: \`${HEAD_SHA}\`
          - Failed job: \`${FAILED_JOB:-none}\`
          - Failed step: \`${FAILED_STEP:-none}\`
          - Run URL: ${RUN_URL}

          Artifacts:
          ${LINES}

          Failed log tail:
          \`\`\`text
          ${LOG_TAIL:-none}
          \`\`\`
          EOF
          )"
          fi
          N="$(gh issue list --state all --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"
          if [[ -n "$N" ]]; then
            gh issue edit "$N" --title "$TITLE" --body "$BODY"
            gh issue reopen "$N" >/dev/null 2>&1 || true
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
