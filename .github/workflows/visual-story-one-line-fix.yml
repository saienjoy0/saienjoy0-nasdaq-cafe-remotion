name: One-time Visual Story Validator Message Fix

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - ".github/workflows/visual-story-one-line-fix.yml"

permissions:
  contents: write

jobs:
  patch-message:
    if: ${{ !contains(github.event.head_commit.message, '[visual-story-message]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/visual-story-engine-v2
          fetch-depth: 0

      - name: Replace validator message
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/spec/validate-render-spec.ts')
          source = path.read_text(encoding='utf-8')
          old = '`invalid ${event.action} targetId: ${event.targetId}`'
          new = '`unknown object ID for ${event.action}: ${event.targetId}`'
          if old not in source:
              raise SystemExit('target validator message not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/spec/validate-render-spec.ts
          git commit -m "[visual-story-message] Align unknown object error wording"
          git push origin HEAD:feature/visual-story-engine-v2
