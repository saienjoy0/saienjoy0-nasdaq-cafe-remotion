name: Visual Story v3 Preview Dispatcher Once

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - .github/workflows/visual-story-v3-preview-once.yml

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact v3 branch
        uses: actions/checkout@v6

      - name: Dispatch canonical preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          EPISODE_DATE: "2026-07-31"
        shell: bash
        run: |
          set -euo pipefail
          SPEC="render-specs/${EPISODE_DATE}/render_spec.json"
          test -s "$SPEC"
          SHA="$(sha256sum "$SPEC" | awk '{print $1}')"

          gh workflow run nasdaq-cafe-preview.yml \
            --repo "$REPO" \
            --ref "$REF" \
            -f episode_date="$EPISODE_DATE" \
            -f expected_spec_sha256="$SHA" \
            -f confirmation=PREVIEW

          RUN_ID=""
          for attempt in $(seq 1 20); do
            RUN_ID="$(gh run list \
              --repo "$REPO" \
              --workflow nasdaq-cafe-preview.yml \
              --branch "$REF" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq '.[] | select(.headSha == env.HEAD_SHA) | .databaseId' \
              | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 3
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Canonical preview was dispatched but Run ID could not be resolved"
            exit 1
          fi

          gh pr comment 26 \
            --repo "$REPO" \
            --body "Visual Story Engine v3 canonical preview dispatched. Run ID: ${RUN_ID}. Ref: ${REF}. Spec SHA-256: ${SHA}. 39-shot preview only; final is disabled."

          echo "RUN_ID=$RUN_ID"
          echo "SPEC_SHA=$SHA"
