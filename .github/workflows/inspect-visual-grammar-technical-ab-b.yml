name: Inspect Visual Grammar Technical A/B Rerun

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-visual-grammar-technical-ab-b.yml"

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_HEAD_SHA: "3d08257839e01d1e2bc6e200daf1bae8d2d27195"
      TARGET_WORKFLOW: "visual-grammar-ab-technical-preview.yml"
      REQUEST_ID: "vg6t-2099-02-02-20260806-b"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve current rerun state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --event push --limit 30 --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,displayTitle)"
            MATCH="$(jq --arg sha "$TARGET_HEAD_SHA" '[.[] | select(.headSha == $sha)][0] // null' <<<"$RUNS")"
            if [[ "$MATCH" != "null" ]]; then
              OUTPUT="visual-grammar-ab-technical-state/tracking/${REQUEST_ID}.probe.json"
              mkdir -p "$(dirname "$OUTPUT")"
              jq -n --arg request_id "$REQUEST_ID" --arg target_head_sha "$TARGET_HEAD_SHA" --argjson workflow_run "$MATCH" '{contractVersion:"1.0.0",requestId:$request_id,targetHeadSha:$target_head_sha,found:true,workflowRun:$workflow_run,finalAuthorized:false}' > "$OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Unable to resolve rerun"
          exit 1

      - name: Commit probe and remove inspector
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          OUTPUT="visual-grammar-ab-technical-state/tracking/${REQUEST_ID}.probe.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          git rm --ignore-unmatch ".github/workflows/inspect-visual-grammar-technical-ab-b.yml"
          git commit -m "Inspect Visual Grammar technical A/B rerun: ${REQUEST_ID}"
          git push origin HEAD:main
