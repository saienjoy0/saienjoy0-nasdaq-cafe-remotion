name: Nasdaq Cafe Preview

on:
  workflow_dispatch:
    inputs:
      episode_date:
        description: "対象日（YYYY-MM-DD）。入力は render-specs/YYYY-MM-DD/render_spec.json に固定"
        required: true
        type: string
      expected_spec_sha256:
        description: "Action実行前に確認した render_spec.json のSHA-256"
        required: true
        type: string
      confirmation:
        description: "台本・画像・render_spec・validator・整合確認が完了済みなら PREVIEW と入力"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nasdaq-cafe-preview-${{ inputs.episode_date }}
  cancel-in-progress: true

jobs:
  input-preflight:
    name: Verify immutable render input
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      spec_path: ${{ steps.verify.outputs.spec_path }}
      episode_id: ${{ steps.verify.outputs.episode_id }}
      spec_sha: ${{ steps.verify.outputs.spec_sha }}
      tts_input_sha: ${{ steps.verify.outputs.tts_input_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify path, JSON, date, SHA, TTS identity, and secrets
        id: verify
        shell: bash
        env:
          EPISODE_DATE: ${{ inputs.episode_date }}
          EXPECTED_SPEC_SHA256: ${{ inputs.expected_spec_sha256 }}
          RUN_CONFIRMATION: ${{ inputs.confirmation }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
          GEMINI_TTS_VOICE: Charon
        run: |
          set -euo pipefail

          if [[ "$RUN_CONFIRMATION" != "PREVIEW" ]]; then
            echo "::error::confirmation must be exactly PREVIEW"
            exit 1
          fi

          if [[ ! "$EPISODE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::episode_date must match YYYY-MM-DD"
            exit 1
          fi

          SPEC_PATH="render-specs/${EPISODE_DATE}/render_spec.json"
          bash scripts/restore-story-engine-handoff-spec.sh "$EPISODE_DATE" "$SPEC_PATH" "$EXPECTED_SPEC_SHA256"
          if [[ ! -s "$SPEC_PATH" ]]; then
            echo "::error::Complete render_spec.json not found or empty: $SPEC_PATH"
            exit 1
          fi

          NORMALIZED_EXPECTED_SHA="$(printf '%s' "$EXPECTED_SPEC_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$NORMALIZED_EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::expected_spec_sha256 must be a 64-character SHA-256 value"
            exit 1
          fi

          ACTUAL_SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          if [[ "$ACTUAL_SPEC_SHA" != "$NORMALIZED_EXPECTED_SHA" ]]; then
            echo "::error::render_spec SHA-256 mismatch"
            echo "::error::expected=$NORMALIZED_EXPECTED_SHA"
            echo "::error::actual=$ACTUAL_SPEC_SHA"
            exit 1
          fi

          mapfile -t PREFLIGHT_VALUES < <(
            python3 - "$SPEC_PATH" "$EPISODE_DATE" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys

          spec_path, episode_date = sys.argv[1:]
          try:
              with open(spec_path, "r", encoding="utf-8") as handle:
                  value = json.load(handle)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Invalid render_spec JSON: {exc}")

          episode = value.get("episode")
          if not isinstance(episode, dict):
              raise SystemExit("render_spec is missing object episode")

          episode_id = episode.get("id")
          target_date = episode.get("targetDate")
          if episode_id != episode_date:
              raise SystemExit(
                  f"episode.id must match workflow episode_date: {episode_id!r} != {episode_date!r}"
              )
          if target_date != episode_date:
              raise SystemExit(
                  f"episode.targetDate must match workflow episode_date: {target_date!r} != {episode_date!r}"
              )
          if not isinstance(episode_id, str) or not re.fullmatch(r"\d{4}-\d{2}-\d{2}", episode_id):
              raise SystemExit("episode.id is missing or unsafe")

          scenes = value.get("scenes")
          if not isinstance(scenes, list):
              raise SystemExit("render_spec is missing scenes array")

          blocks = []
          for block_id, first_scene, last_scene in (
              ("scenes-01-04", 1, 4),
              ("scenes-05-09", 5, 9),
          ):
              speech = []
              for scene in scenes:
                  if not isinstance(scene, dict):
                      continue
                  scene_number = scene.get("sceneNumber")
                  if not isinstance(scene_number, int) or not (first_scene <= scene_number <= last_scene):
                      continue
                  chunks = scene.get("narrationChunks")
                  if not isinstance(chunks, list):
                      raise SystemExit(f"scene {scene_number} is missing narrationChunks")
                  for chunk in chunks:
                      if not isinstance(chunk, dict) or not isinstance(chunk.get("speechText"), str):
                          raise SystemExit(f"scene {scene_number} contains invalid speechText")
                      speech.append(chunk["speechText"])
              if not speech:
                  raise SystemExit(f"TTS block {block_id} has no speechText")
              blocks.append({"id": block_id, "speechText": speech})

          payload = {
              "synthesisVersion": "gemini-two-block-v1",
              "model": os.environ["GEMINI_TTS_MODEL"],
              "voice": os.environ["GEMINI_TTS_VOICE"],
              "voiceProfileId": value.get("voiceProfileId"),
              "pronunciations": value.get("pronunciations"),
              "blocks": blocks,
          }
          encoded = json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          print(episode_id)
          print(hashlib.sha256(encoded).hexdigest())
          PY
          )

          EPISODE_ID="${PREFLIGHT_VALUES[0]:-}"
          TTS_INPUT_SHA="${PREFLIGHT_VALUES[1]:-}"
          if [[ ! "$TTS_INPUT_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::failed to calculate TTS input SHA-256"
            exit 1
          fi

          if [[ -z "${GEMINI_API_KEY_1:-}" && -z "${GEMINI_API_KEY_2:-}" && -z "${GEMINI_API_KEY_3:-}" ]]; then
            echo "::error::At least one Gemini API key secret is required"
            exit 1
          fi

          echo "spec_path=$SPEC_PATH" >> "$GITHUB_OUTPUT"
          echo "episode_id=$EPISODE_ID" >> "$GITHUB_OUTPUT"
          echo "spec_sha=$ACTUAL_SPEC_SHA" >> "$GITHUB_OUTPUT"
          echo "tts_input_sha=$TTS_INPUT_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "### Immutable input preflight"
            echo "- Spec path: \`$SPEC_PATH\`"
            echo "- Episode ID: \`$EPISODE_ID\`"
            echo "- Spec SHA-256: \`$ACTUAL_SPEC_SHA\`"
            echo "- TTS input SHA-256: \`$TTS_INPUT_SHA\`"
            echo "- Result: pass"
          } >> "$GITHUB_STEP_SUMMARY"

  build-preview:
    name: Validate, TTS, and render preview
    needs: input-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 65

    env:
      CI: "true"
      SPEC_PATH: ${{ needs.input-preflight.outputs.spec_path }}
      EPISODE_ID: ${{ needs.input-preflight.outputs.episode_id }}
      SPEC_SHA: ${{ needs.input-preflight.outputs.spec_sha }}
      TTS_INPUT_SHA: ${{ needs.input-preflight.outputs.tts_input_sha }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Recheck immutable input after checkout
        id: recheck
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/restore-story-engine-handoff-spec.sh "$EPISODE_ID" "$SPEC_PATH" "$SPEC_SHA"
          test -s "$SPEC_PATH"
          ACTUAL_SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          if [[ "$ACTUAL_SPEC_SHA" != "$SPEC_SHA" ]]; then
            echo "::error::render_spec changed between preflight and render job"
            echo "::error::preflight=$SPEC_SHA"
            echo "::error::render-job=$ACTUAL_SPEC_SHA"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        id: install
        timeout-minutes: 10
        run: npm ci

      - name: Validate render spec
        id: validate
        timeout-minutes: 5
        run: npm run episode:spec:validate -- "$SPEC_PATH"

      - name: Ensure ffmpeg is available
        id: ffmpeg
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y ffmpeg; then
                break
              fi
              if [[ "$attempt" = "3" ]]; then
                echo "::error::ffmpeg installation failed after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 10))
            done
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Run runtime stability tests
        id: stability_tests
        timeout-minutes: 5
        run: npm run test:runtime-stability

      - name: Prepare TTS cache directory
        shell: bash
        run: mkdir -p .cache/spec-tts-blocks

      - name: Restore Gemini two-block TTS cache
        id: tts_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ env.TTS_INPUT_SHA }}
          restore-keys: |
            ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ env.TTS_INPUT_SHA }}-partial-

      - name: Generate preview
        id: generate
        timeout-minutes: 55
        run: npm run episode:spec:preview -- "$SPEC_PATH"

      - name: Detect generated TTS cache content
        id: tts_cache_content
        if: always()
        shell: bash
        run: |
          if find .cache/spec-tts-blocks -type f -name audio.wav -print -quit 2>/dev/null | grep -q .; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save complete Gemini two-block TTS cache
        if: steps.generate.outcome == 'success' && steps.tts_cache_restore.outputs.cache-hit != 'true' && steps.tts_cache_content.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ env.TTS_INPUT_SHA }}

      - name: Save recoverable partial Gemini TTS cache
        if: always() && steps.generate.outcome != 'success' && steps.tts_cache_restore.outputs.cache-hit != 'true' && steps.tts_cache_content.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ env.TTS_INPUT_SHA }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload raw preview payload
        if: steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-preview-raw-${{ needs.input-preflight.outputs.episode_id }}-${{ github.run_id }}
          path: |
            renders/preview/${{ env.EPISODE_ID }}_nasdaq-cafe-spec-preview.mp4
            build/${{ env.EPISODE_ID }}/technical_report.json
            build/${{ env.EPISODE_ID }}/render_data.production.json
            public/spec-audio/${{ env.EPISODE_ID }}/tts-block-state.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create build failure manifest
        if: failure()
        shell: bash
        env:
          RECHECK_OUTCOME: ${{ steps.recheck.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          FFMPEG_OUTCOME: ${{ steps.ffmpeg.outcome }}
          STABILITY_TESTS_OUTCOME: ${{ steps.stability_tests.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "build/${EPISODE_ID}"
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          steps = {
              "recheck": os.environ.get("RECHECK_OUTCOME", "unknown"),
              "install": os.environ.get("INSTALL_OUTCOME", "unknown"),
              "validate": os.environ.get("VALIDATE_OUTCOME", "unknown"),
              "ffmpeg": os.environ.get("FFMPEG_OUTCOME", "unknown"),
              "stabilityTests": os.environ.get("STABILITY_TESTS_OUTCOME", "unknown"),
              "generate": os.environ.get("GENERATE_OUTCOME", "unknown"),
          }
          failed_step = next(
              (name for name, outcome in steps.items() if outcome == "failure"),
              "unknown",
          )
          manifest = {
              "status": "preview-build-failed",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commitSha": os.environ["GITHUB_SHA"],
              "episodeId": os.environ["EPISODE_ID"],
              "specPath": os.environ["SPEC_PATH"],
              "specSha256": os.environ["SPEC_SHA"],
              "ttsInputSha256": os.environ["TTS_INPUT_SHA"],
              "failedStep": failed_step,
              "steps": steps,
              "createdAt": datetime.now(timezone.utc).isoformat(),
          }
          output = f"build/{os.environ['EPISODE_ID']}/build_failure_manifest.json"
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Upload build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-preview-build-failure-${{ needs.input-preflight.outputs.episode_id }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/${{ env.EPISODE_ID }}/build_failure_manifest.json
            build/${{ env.EPISODE_ID }}/technical_report.json
            build/${{ env.EPISODE_ID }}/render_data.production.json
            public/spec-audio/${{ env.EPISODE_ID }}/tts-block-state.json
            .cache/spec-tts-blocks/**/metadata.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  inspect-preview:
    name: Inspect and package preview
    needs: [input-preflight, build-preview]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      CI: "true"
      SPEC_PATH: ${{ needs.input-preflight.outputs.spec_path }}
      EPISODE_ID: ${{ needs.input-preflight.outputs.episode_id }}
      SPEC_SHA: ${{ needs.input-preflight.outputs.spec_sha }}
      TTS_INPUT_SHA: ${{ needs.input-preflight.outputs.tts_input_sha }}
      RAW_ARTIFACT_NAME: nasdaq-cafe-preview-raw-${{ needs.input-preflight.outputs.episode_id }}-${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Recheck immutable input before inspection
        id: recheck
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/restore-story-engine-handoff-spec.sh "$EPISODE_ID" "$SPEC_PATH" "$SPEC_SHA"
          test -s "$SPEC_PATH"
          ACTUAL_SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          if [[ "$ACTUAL_SPEC_SHA" != "$SPEC_SHA" ]]; then
            echo "::error::render_spec changed before inspection"
            echo "::error::expected=$SPEC_SHA"
            echo "::error::actual=$ACTUAL_SPEC_SHA"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        id: install
        timeout-minutes: 10
        run: npm ci

      - name: Ensure ffmpeg is available
        id: ffmpeg
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y ffmpeg; then
                break
              fi
              if [[ "$attempt" = "3" ]]; then
                echo "::error::ffmpeg installation failed after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 10))
            done
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Download raw preview payload
        id: download_raw
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.RAW_ARTIFACT_NAME }}
          path: .

      - name: Verify raw preview identity
        id: raw_identity
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          MP4="renders/preview/${EPISODE_ID}_nasdaq-cafe-spec-preview.mp4"
          REPORT="build/${EPISODE_ID}/technical_report.json"
          DATA="build/${EPISODE_ID}/render_data.production.json"
          test -s "$MP4"
          test -s "$REPORT"
          test -s "$DATA"
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.inputSpecSha256 !== process.env.SPEC_SHA) {
              throw new Error(`raw artifact spec SHA mismatch: ${report.inputSpecSha256}`);
            }
            if (report.episodeId !== process.env.EPISODE_ID) {
              throw new Error(`raw artifact episode mismatch: ${report.episodeId}`);
            }
            if (report.status !== "preview-generated" || !report.previewPath) {
              throw new Error(`raw artifact is not preview-generated: ${report.status}`);
            }
          ' "$REPORT"

      - name: Inspect preview MP4 video and audio
        id: inspect
        timeout-minutes: 10
        run: npm run episode:spec:inspect:preview -- "$SPEC_PATH"

      - name: Create delivery manifest
        id: delivery
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail

          MP4="renders/preview/${EPISODE_ID}_nasdaq-cafe-spec-preview.mp4"
          REPORT="build/${EPISODE_ID}/technical_report.json"
          DATA="build/${EPISODE_ID}/render_data.production.json"
          INSPECTION="build/${EPISODE_ID}/preview_inspection.json"
          DELIVERY_MANIFEST="build/${EPISODE_ID}/delivery_manifest.json"

          test -s "$MP4"
          test -s "$REPORT"
          test -s "$DATA"
          test -s "$INSPECTION"

          node -e '
            const fs = require("node:fs");
            const technical = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const inspection = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (technical.status !== "preview-generated" || !technical.previewPath) {
              throw new Error("technical report is not preview-generated");
            }
            if (inspection.status !== "valid" || inspection.inspection?.fullDecode !== true) {
              throw new Error(`preview A/V inspection is not valid: ${inspection.status}`);
            }
          ' "$REPORT" "$INSPECTION"

          MP4_SHA="$(sha256sum "$MP4" | awk '{print $1}')"
          MP4_BYTES="$(stat -c '%s' "$MP4")"

          export MP4 REPORT DATA INSPECTION DELIVERY_MANIFEST MP4_SHA MP4_BYTES
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          manifest = {
              "status": "preview-delivery-ready",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commitSha": os.environ["GITHUB_SHA"],
              "episodeId": os.environ["EPISODE_ID"],
              "specPath": os.environ["SPEC_PATH"],
              "specSha256": os.environ["SPEC_SHA"],
              "ttsInputSha256": os.environ["TTS_INPUT_SHA"],
              "rawArtifactName": os.environ["RAW_ARTIFACT_NAME"],
              "previewPath": os.environ["MP4"],
              "previewSha256": os.environ["MP4_SHA"],
              "previewBytes": int(os.environ["MP4_BYTES"]),
              "technicalReportPath": os.environ["REPORT"],
              "productionDataPath": os.environ["DATA"],
              "previewInspectionPath": os.environ["INSPECTION"],
              "fullVideoAndAudioDecode": True,
              "createdAt": datetime.now(timezone.utc).isoformat(),
          }

          with open(os.environ["DELIVERY_MANIFEST"], "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

          {
            echo "### Preview delivery"
            echo "- Raw Artifact: \`$RAW_ARTIFACT_NAME\`"
            echo "- MP4: \`$MP4\`"
            echo "- MP4 bytes: \`$MP4_BYTES\`"
            echo "- MP4 SHA-256: \`$MP4_SHA\`"
            echo "- Full video and audio decode: pass"
            echo "- Delivery manifest: \`$DELIVERY_MANIFEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create inspection failure manifest
        if: failure()
        shell: bash
        env:
          RECHECK_OUTCOME: ${{ steps.recheck.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          FFMPEG_OUTCOME: ${{ steps.ffmpeg.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download_raw.outcome }}
          RAW_IDENTITY_OUTCOME: ${{ steps.raw_identity.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "build/${EPISODE_ID}"
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          steps = {
              "recheck": os.environ.get("RECHECK_OUTCOME", "unknown"),
              "install": os.environ.get("INSTALL_OUTCOME", "unknown"),
              "ffmpeg": os.environ.get("FFMPEG_OUTCOME", "unknown"),
              "downloadRaw": os.environ.get("DOWNLOAD_OUTCOME", "unknown"),
              "rawIdentity": os.environ.get("RAW_IDENTITY_OUTCOME", "unknown"),
              "inspect": os.environ.get("INSPECT_OUTCOME", "unknown"),
              "delivery": os.environ.get("DELIVERY_OUTCOME", "unknown"),
          }
          failed_step = next(
              (name for name, outcome in steps.items() if outcome == "failure"),
              "unknown",
          )
          manifest = {
              "status": "preview-inspection-failed",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commitSha": os.environ["GITHUB_SHA"],
              "episodeId": os.environ["EPISODE_ID"],
              "specPath": os.environ["SPEC_PATH"],
              "specSha256": os.environ["SPEC_SHA"],
              "ttsInputSha256": os.environ["TTS_INPUT_SHA"],
              "rawArtifactName": os.environ["RAW_ARTIFACT_NAME"],
              "rawPreviewPreserved": True,
              "failedStep": failed_step,
              "steps": steps,
              "createdAt": datetime.now(timezone.utc).isoformat(),
          }
          output = f"build/{os.environ['EPISODE_ID']}/inspection_failure_manifest.json"
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Upload verified preview and reports
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-preview-${{ needs.input-preflight.outputs.episode_id }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            renders/preview/*.mp4
            build/*/technical_report.json
            build/*/render_data.production.json
            build/*/preview_inspection.json
            build/*/delivery_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload inspection failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-preview-inspection-failure-${{ needs.input-preflight.outputs.episode_id }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/${{ env.EPISODE_ID }}/inspection_failure_manifest.json
            build/${{ env.EPISODE_ID }}/technical_report.json
            build/${{ env.EPISODE_ID }}/render_data.production.json
            build/${{ env.EPISODE_ID }}/preview_inspection.json
          if-no-files-found: warn
          retention-days: 14
