name: Final Approval Lineage CI

on:
  pull_request:
    paths:
      - "scripts/final-approval-preflight.ts"
      - "scripts/load-render-spec.ts"
      - "scripts/validate-final-approval-lineage.py"
      - "scripts/create-final-approval-sidecar.py"
      - "scripts/test-final-approval-preflight.ts"
      - "scripts/test-final-approval-lineage.py"
      - ".github/workflows/nasdaq-cafe-final.yml"
      - ".github/workflows/nasdaq-cafe-final-request.yml"
      - ".github/workflows/final-approval-lineage-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Final authorization preflight regression
        run: node --import tsx scripts/test-final-approval-preflight.ts
      - name: Cross-repo approval document regression
        run: python3 scripts/test-final-approval-lineage.py
      - name: Python syntax
        run: python3 -m py_compile scripts/validate-final-approval-lineage.py scripts/create-final-approval-sidecar.py
      - name: Diff hygiene
        run: git diff --check
