name: Nasdaq Cafe Scene4 Runtime Error Source

on:
  push:
    branches: [main]
    paths:
      - "scene4-runtime-error-source-requests/*.json"

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.repository == 'saienjoy0/saienjoy0-nasdaq-cafe-remotion' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Locate assertion source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/diag
          {
            echo '=== exact wording ==='
            grep -R -n -F 'requires exactly three cards' src scripts node_modules 2>/dev/null | head -n 80 || true
            echo '=== expected-actual-gap-flow + found ==='
            grep -R -n -E 'expected-actual-gap-flow.*found|found.*expected-actual-gap-flow' src scripts node_modules 2>/dev/null | head -n 120 || true
            echo '=== contract card count assertions ==='
            grep -R -n -E 'cards.{0,120}(min|max|length|found)|found.{0,120}cards' src scripts node_modules 2>/dev/null | grep -E 'visual|template|expected|contract|cards' | head -n 200 || true
          } > /tmp/diag/report.txt
      - name: Upsert diagnostic issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE='NASDAQ CAFE SCENE4 RUNTIME ERROR SOURCE 2026-08-10'
          BODY="$(printf '```text\n%s\n```\n' "$(cat /tmp/diag/report.txt)")"
          N="$(gh issue list --state all --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n1)"
          if [[ -n "$N" ]]; then gh issue edit "$N" --body "$BODY"; gh issue reopen "$N" >/dev/null 2>&1 || true; else gh issue create --title "$TITLE" --body "$BODY"; fi
