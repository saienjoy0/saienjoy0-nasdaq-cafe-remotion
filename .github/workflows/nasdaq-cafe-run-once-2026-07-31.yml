name: Nasdaq Cafe Run Once 2026-07-31

on:
  push:
    branches:
      - run/preview-2026-07-31-20260803
    paths:
      - .github/run-once/preview-2026-07-31.trigger

permissions:
  contents: read
  statuses: write

concurrency:
  group: nasdaq-cafe-run-once-2026-07-31
  cancel-in-progress: true

jobs:
  preview:
    name: Validate, render, inspect, and package preview
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
      EPISODE_ID: "2026-07-31"
      SPEC_PATH: render-specs/2026-07-31/render_spec.json
      EXPECTED_SPEC_SHA256: f94a16574d44611efb23e0596274db1cb5f7b2c6b2d5f663dd76042026a2524c
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"

    steps:
      - name: Mark workflow pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg state pending \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "NASDAQ Cafe preview is running" \
            --arg context "nasdaq-cafe/preview-delivery" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify immutable production-ready input
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SPEC_PATH"
          actual="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          if [[ "$actual" != "$EXPECTED_SPEC_SHA256" ]]; then
            echo "::error::render_spec SHA mismatch"
            echo "::error::expected=$EXPECTED_SPEC_SHA256"
            echo "::error::actual=$actual"
            exit 1
          fi
          python3 - "$SPEC_PATH" "$EPISODE_ID" <<'PY'
          import json, sys
          path, episode_id = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              spec = json.load(handle)
          episode = spec.get("episode") or {}
          if episode.get("id") != episode_id or episode.get("targetDate") != episode_id:
              raise SystemExit("episode id/date mismatch")
          if spec.get("review", {}).get("approvedForCodex") is not True:
              raise SystemExit("render spec is not approved for execution")
          PY
          if [[ -z "${GEMINI_API_KEY_1:-}" && -z "${GEMINI_API_KEY_2:-}" && -z "${GEMINI_API_KEY_3:-}" ]]; then
            echo "::error::At least one Gemini API key secret is required"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Validate render spec
        timeout-minutes: 5
        run: npm run episode:spec:validate -- "$SPEC_PATH"

      - name: Ensure ffmpeg is available
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y ffmpeg; then
                break
              fi
              if [[ "$attempt" = "3" ]]; then
                echo "::error::ffmpeg installation failed after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 10))
            done
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Run runtime stability tests
        timeout-minutes: 5
        run: npm run test:runtime-stability

      - name: Generate preview
        timeout-minutes: 55
        run: npm run episode:spec:preview -- "$SPEC_PATH"

      - name: Inspect preview video and audio
        timeout-minutes: 10
        run: npm run episode:spec:inspect:preview -- "$SPEC_PATH"

      - name: Create delivery manifest
        shell: bash
        run: |
          set -euo pipefail
          mp4="renders/preview/${EPISODE_ID}_nasdaq-cafe-spec-preview.mp4"
          report="build/${EPISODE_ID}/technical_report.json"
          data="build/${EPISODE_ID}/render_data.production.json"
          inspection="build/${EPISODE_ID}/preview_inspection.json"
          manifest="build/${EPISODE_ID}/delivery_manifest.json"
          test -s "$mp4"
          test -s "$report"
          test -s "$data"
          test -s "$inspection"
          mp4_sha="$(sha256sum "$mp4" | awk '{print $1}')"
          mp4_bytes="$(stat -c '%s' "$mp4")"
          export mp4 report data inspection manifest mp4_sha mp4_bytes
          python3 <<'PY'
          import json, os
          from datetime import datetime, timezone
          value = {
              "status": "preview-delivery-ready",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commitSha": os.environ["GITHUB_SHA"],
              "episodeId": os.environ["EPISODE_ID"],
              "specPath": os.environ["SPEC_PATH"],
              "specSha256": os.environ["EXPECTED_SPEC_SHA256"],
              "previewPath": os.environ["mp4"],
              "previewSha256": os.environ["mp4_sha"],
              "previewBytes": int(os.environ["mp4_bytes"]),
              "technicalReportPath": os.environ["report"],
              "productionDataPath": os.environ["data"],
              "previewInspectionPath": os.environ["inspection"],
              "fullVideoAndAudioDecode": True,
              "createdAt": datetime.now(timezone.utc).isoformat(),
          }
          with open(os.environ["manifest"], "w", encoding="utf-8") as handle:
              json.dump(value, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Upload verified preview and reports
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-preview-2026-07-31-${{ github.run_id }}
          path: |
            renders/preview/2026-07-31_nasdaq-cafe-spec-preview.mp4
            build/2026-07-31/technical_report.json
            build/2026-07-31/render_data.production.json
            build/2026-07-31/preview_inspection.json
            build/2026-07-31/delivery_manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Mark workflow successful
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg state success \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "Preview ready; run ${GITHUB_RUN_ID}" \
            --arg context "nasdaq-cafe/preview-delivery" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null

      - name: Mark workflow failed
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg state failure \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg description "Preview failed; run ${GITHUB_RUN_ID}" \
            --arg context "nasdaq-cafe/preview-delivery" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
