name: Diagnose Renderer Visual Families 2026-08-06

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-renderer-family-2026-08-06.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPEC_PATH: "render-specs/2026-08-06/render_spec.json"
      READY_PATH: "render-specs/2026-08-06/production_ready.json"
      PACKAGE_PATH: "episode-packages/2026-08-06/episode_package_2026-08-06.md"
      REPORT_PATH: "preview-status/2026-08-06/normalization_report.json"
      COMPATIBILITY_PATH: "contracts/visual_grammar_renderer_compatibility.json"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply adapters
        run: |
          python3 scripts/normalize_nasdaq_cafe_2026_08_06.py --spec "$SPEC_PATH" --package "$PACKAGE_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/adapt_nasdaq_cafe_2026_08_06_renderer.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_template_contracts_2026_08_06.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_reaction_timeline_2026_08_06.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_metric_board_density_2026_08_06.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_numeric_value_selection_2026_08_06.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_sequence_policy_2026_08_06.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_template_variant_2026_08_06.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_registered_variants_2026_08_06.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_visual_modes_2026_08_06.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_visual_grammar_2026_08_06.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH"
          python3 scripts/patch_transition_roles_2026_08_06.py --spec "$SPEC_PATH" --ready "$READY_PATH" --report "$REPORT_PATH" --compatibility "$COMPATIBILITY_PATH"
      - name: Write family diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-status/2026-08-06
          cat > /tmp/family-diagnostic.ts <<'TS'
          import fs from "node:fs";
          import {VISUAL_TEMPLATE_CONTRACTS} from "./src/spec/visual-template-contract";
          const path = process.env.SPEC_PATH!;
          const spec = JSON.parse(fs.readFileSync(path, "utf8"));
          const beats = spec.scenes.flatMap((scene: any) => scene.visualBeats.map((beat: any) => ({
            sceneId: scene.sceneId,
            beatId: beat.beatId,
            visualTemplate: beat.visualTemplate,
            family: VISUAL_TEMPLATE_CONTRACTS[beat.visualTemplate].family,
            visualGrammarId: beat.visualGrammarId,
            screenState: beat.screenState,
            objectIds: beat.objectIds,
          })));
          const runs: any[] = [];
          let start = 0;
          while (start < beats.length) {
            let end = start + 1;
            while (end < beats.length && beats[end].family === beats[start].family) end++;
            if (end - start >= 2) runs.push({family: beats[start].family, count: end - start, beats: beats.slice(start, end)});
            start = end;
          }
          fs.writeFileSync("preview-status/2026-08-06/visual_family_diagnostic.json", JSON.stringify({version: 1, beats, consecutiveRuns: runs}, null, 2) + "\n");
          TS
          npx tsx /tmp/family-diagnostic.ts
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-status/2026-08-06/visual_family_diagnostic.json
          git rm .github/workflows/diagnose-renderer-family-2026-08-06.yml
          git commit -m "Record 2026-08-06 visual family diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
