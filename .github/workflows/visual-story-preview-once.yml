name: Visual Story Preview Dispatcher Once

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - .github/workflows/visual-story-preview-once.yml

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: visual-story-preview-dispatch-once-2026-07-31
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SPEC_PATH: render-specs/2026-07-31/render_spec.json
      EPISODE_DATE: 2026-07-31
      TARGET_REF: feature/visual-story-engine-v2

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Validate input and dispatch canonical preview workflow
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SPEC_PATH"
          SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          BEFORE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run nasdaq-cafe-preview.yml \
            --ref "$TARGET_REF" \
            -f episode_date="$EPISODE_DATE" \
            -f expected_spec_sha256="$SPEC_SHA" \
            -f confirmation=PREVIEW

          RUN_ID=""
          for _ in $(seq 1 20); do
            RUN_ID="$(gh run list \
              --workflow nasdaq-cafe-preview.yml \
              --branch "$TARGET_REF" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt \
              --jq '.[] | select(.createdAt >= "'"$BEFORE"'") | .databaseId' \
              | head -n 1)"
            if [[ -n "$RUN_ID" ]]; then
              break
            fi
            sleep 3
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Canonical preview workflow was dispatched but its Run ID could not be resolved"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh pr comment 26 --body "Canonical Nasdaq Cafe preview dispatched for Visual Story Engine v2. Run ID: $RUN_ID. Ref: $TARGET_REF. Spec SHA-256: $SPEC_SHA. Preview only; final is disabled."

      - name: Record dispatcher result
        if: always()
        shell: bash
        run: |
          if [[ "${{ job.status }}" != "success" ]]; then
            gh pr comment 26 --body "Visual Story preview dispatcher failed. Dispatcher Run ID: $GITHUB_RUN_ID. The canonical preview was not confirmed."
          fi
