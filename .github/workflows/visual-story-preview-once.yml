name: Visual Story Engine Preview Once

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - .github/workflows/visual-story-preview-once.yml

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: visual-story-preview-once-2026-07-31
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "true"
      SPEC_PATH: render-specs/2026-07-31/render_spec.json
      EPISODE_ID: 2026-07-31
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Announce preview run
        shell: bash
        run: |
          gh pr comment 26 --body "Visual Story Engine v2 preview started. Run ID: $GITHUB_RUN_ID. This run creates preview only; final is disabled."

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate immutable Visual Story input
        id: input
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SPEC_PATH"
          npm run episode:spec:validate -- "$SPEC_PATH"
          SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          TTS_INPUT_SHA="$(python3 - "$SPEC_PATH" <<'PY'
          import hashlib
          import json
          import os
          import sys

          spec_path = sys.argv[1]
          with open(spec_path, "r", encoding="utf-8") as handle:
              value = json.load(handle)

          scenes = value.get("scenes")
          if not isinstance(scenes, list):
              raise SystemExit("render_spec is missing scenes array")

          blocks = []
          for block_id, first_scene, last_scene in (
              ("scenes-01-04", 1, 4),
              ("scenes-05-09", 5, 9),
          ):
              speech = []
              for scene in scenes:
                  if not isinstance(scene, dict):
                      continue
                  scene_number = scene.get("sceneNumber")
                  if not isinstance(scene_number, int) or not (first_scene <= scene_number <= last_scene):
                      continue
                  for chunk in scene.get("narrationChunks", []):
                      text = chunk.get("speechText") if isinstance(chunk, dict) else None
                      if not isinstance(text, str):
                          raise SystemExit(f"scene {scene_number} contains invalid speechText")
                      speech.append(text)
              if not speech:
                  raise SystemExit(f"TTS block {block_id} has no speechText")
              blocks.append({"id": block_id, "speechText": speech})

          payload = {
              "synthesisVersion": "gemini-two-block-v1",
              "model": os.environ["GEMINI_TTS_MODEL"],
              "voice": os.environ["GEMINI_TTS_VOICE"],
              "voiceProfileId": value.get("voiceProfileId"),
              "pronunciations": value.get("pronunciations"),
              "blocks": blocks,
          }
          encoded = json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          print(hashlib.sha256(encoded).hexdigest())
          PY
          )"
          echo "spec_sha=$SPEC_SHA" >> "$GITHUB_OUTPUT"
          echo "tts_input_sha=$TTS_INPUT_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Visual Story preview input"
            echo "- Spec: \`$SPEC_PATH\`"
            echo "- Spec SHA-256: \`$SPEC_SHA\`"
            echo "- TTS input SHA-256: \`$TTS_INPUT_SHA\`"
            echo "- Mode: preview only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run runtime stability tests
        run: npm run test:runtime-stability

      - name: Prepare TTS cache directory
        run: mkdir -p .cache/spec-tts-blocks

      - name: Restore Gemini two-block TTS cache
        id: tts_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ steps.input.outputs.tts_input_sha }}
          restore-keys: |
            ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ steps.input.outputs.tts_input_sha }}-partial-

      - name: Generate Visual Story preview
        id: generate
        run: npm run episode:spec:preview -- "$SPEC_PATH"

      - name: Save complete TTS cache
        if: steps.generate.outcome == 'success' && steps.tts_cache_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ steps.input.outputs.tts_input_sha }}

      - name: Upload preview payload
        id: artifact
        uses: actions/upload-artifact@v6
        with:
          name: visual-story-preview-${{ env.EPISODE_ID }}-${{ github.run_id }}
          path: |
            renders/preview/${{ env.EPISODE_ID }}_nasdaq-cafe-spec-preview.mp4
            build/${{ env.EPISODE_ID }}/technical_report.json
            build/${{ env.EPISODE_ID }}/render_data.production.json
            public/spec-audio/${{ env.EPISODE_ID }}/tts-block-state.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Report preview result
        if: always()
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            gh pr comment 26 --body "Visual Story Engine v2 preview completed successfully. Run ID: $GITHUB_RUN_ID. Artifact: visual-story-preview-${EPISODE_ID}-${GITHUB_RUN_ID}."
          else
            gh pr comment 26 --body "Visual Story Engine v2 preview failed. Run ID: $GITHUB_RUN_ID. Failed step details are in the Actions log."
          fi
