name: Visual Story Engine Preview Once

on:
  push:
    branches:
      - feature/visual-story-engine-v2
    paths:
      - .github/workflows/visual-story-preview-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: visual-story-preview-once-2026-07-31
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "true"
      SPEC_PATH: render-specs/2026-07-31/render_spec.json
      EPISODE_ID: 2026-07-31
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Validate immutable Visual Story input
        id: input
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SPEC_PATH"
          npm run episode:spec:validate -- "$SPEC_PATH"
          SPEC_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          TTS_INPUT_SHA="$(node --import tsx scripts/print-spec-tts-input-sha.ts "$SPEC_PATH")"
          echo "spec_sha=$SPEC_SHA" >> "$GITHUB_OUTPUT"
          echo "tts_input_sha=$TTS_INPUT_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "### Visual Story preview input"
            echo "- Spec: \`$SPEC_PATH\`"
            echo "- Spec SHA-256: \`$SPEC_SHA\`"
            echo "- TTS input SHA-256: \`$TTS_INPUT_SHA\`"
            echo "- Mode: preview only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run runtime stability tests
        run: npm run test:runtime-stability

      - name: Prepare TTS cache directory
        run: mkdir -p .cache/spec-tts-blocks

      - name: Restore Gemini two-block TTS cache
        id: tts_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ steps.input.outputs.tts_input_sha }}
          restore-keys: |
            ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ steps.input.outputs.tts_input_sha }}-partial-

      - name: Generate Visual Story preview
        id: generate
        run: npm run episode:spec:preview -- "$SPEC_PATH"

      - name: Save complete TTS cache
        if: steps.generate.outcome == 'success' && steps.tts_cache_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/spec-tts-blocks
          key: ${{ runner.os }}-spec-tts-block-v2-${{ hashFiles('package-lock.json', 'config/voice-profiles.json', 'scripts/spec-audio.ts', 'src/tts/providers/gemini-tts-provider.ts') }}-${{ steps.input.outputs.tts_input_sha }}

      - name: Upload preview payload
        uses: actions/upload-artifact@v6
        with:
          name: visual-story-preview-${{ env.EPISODE_ID }}-${{ github.run_id }}
          path: |
            renders/preview/${{ env.EPISODE_ID }}_nasdaq-cafe-spec-preview.mp4
            build/${{ env.EPISODE_ID }}/technical_report.json
            build/${{ env.EPISODE_ID }}/render_data.production.json
            public/spec-audio/${{ env.EPISODE_ID }}/tts-block-state.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
