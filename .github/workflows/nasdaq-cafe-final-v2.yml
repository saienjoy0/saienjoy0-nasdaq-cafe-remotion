name: Nasdaq Cafe Final V2

on:
  workflow_call:
    inputs:
      episode_date: {required: true, type: string}
      preview_run_id: {required: true, type: string}
      approved_preview_sha256: {required: true, type: string}
      preview_identity_sha256: {required: true, type: string}
      renderer_commit: {required: true, type: string}
      renderer_contract_version: {required: true, type: string}
      registry_snapshot_sha256: {required: true, type: string}
      render_spec_sha256: {required: true, type: string}
      tts_input_sha256: {required: true, type: string}
      audio_01_04_sha256: {required: true, type: string}
      audio_05_09_sha256: {required: true, type: string}
      plot_authorization_run_id: {required: true, type: string}
      plot_authorization_artifact_name: {required: true, type: string}
      plot_authorization_manifest_sha256: {required: true, type: string}
      human_preview_review_sha256: {required: true, type: string}
      plot_final_authorization_sha256: {required: true, type: string}
      final_fingerprint: {required: true, type: string}
      confirmation: {required: true, type: string}

permissions:
  contents: read
  actions: read

concurrency:
  group: nasdaq-cafe-final-${{ inputs.final_fingerprint }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      already_completed: ${{ steps.state.outputs.already_completed }}
    env:
      PLOT_ARTIFACT_TOKEN: ${{ secrets.NASDAQ_CAFE_PLOT_ARTIFACT_TOKEN }}
      OUTCOME_NAME: nasdaq-cafe-final-outcome-${{ inputs.final_fingerprint }}
    steps:
      - name: Validate Final identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirmation }}" == "FINAL" ]]
          [[ "${{ inputs.episode_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "${{ inputs.preview_run_id }}" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.plot_authorization_run_id }}" =~ ^[0-9]+$ ]]
          [[ "${{ inputs.renderer_commit }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.final_fingerprint }}" =~ ^[0-9a-f]{64}$ ]]
      - name: Resolve exact successful Final outcome
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RESPONSE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${OUTCOME_NAME}&per_page=100")"
          COUNT="$(jq '[.artifacts[] | select(.expired == false)] | length' <<<"$RESPONSE")"
          [[ "$COUNT" -le 1 ]] || { echo "::error::Multiple unexpired Final outcomes exist for one fingerprint"; exit 1; }
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [[ "$COUNT" == "1" ]]; then
            RUN_ID="$(jq -r '.artifacts[] | select(.expired == false) | .workflow_run.id // empty' <<<"$RESPONSE")"
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Existing Final outcome is missing workflow run identity"; exit 1; }
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Download exact existing Final outcome
        if: steps.existing.outputs.count == '1'
        uses: actions/download-artifact@v6
        with:
          name: ${{ env.OUTCOME_NAME }}
          path: ${{ runner.temp }}/existing-final-outcome
          repository: ${{ github.repository }}
          run-id: ${{ steps.existing.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact existing Final outcome
        if: steps.existing.outputs.count == '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'existing-final-outcome'
          files=list(root.rglob('final_current_spine_receipt.json'))
          if len(files)!=1: raise SystemExit(f'exactly one Final receipt required; found {len(files)}')
          v=json.loads(files[0].read_text(encoding='utf-8'))
          expected={
            'status':'PASS',
            'finalFingerprint':'${{ inputs.final_fingerprint }}',
            'episodeDate':'${{ inputs.episode_date }}',
            'previewIdentitySha256':'${{ inputs.preview_identity_sha256 }}',
            'approvedPreviewSha256':'${{ inputs.approved_preview_sha256 }}',
            'plotFinalAuthorizationSha256':'${{ inputs.plot_final_authorization_sha256 }}',
            'rendererCommit':'${{ inputs.renderer_commit }}',
          }
          for k,x in expected.items():
              if v.get(k)!=x: raise SystemExit(f'existing Final receipt mismatch: {k}')
          if not re.fullmatch(r'[0-9a-f]{64}',str(v.get('finalMp4Sha256',''))): raise SystemExit('existing Final MP4 SHA invalid')
          print('ALREADY_COMPLETED')
          PY
      - name: Require configured Plot Artifact token for new Final
        if: steps.existing.outputs.count == '0'
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PLOT_ARTIFACT_TOKEN" ]] || { echo "::error::NASDAQ_CAFE_PLOT_ARTIFACT_TOKEN is required for Current Final authorization"; exit 1; }
      - name: Checkout exact approved Renderer for authorization verification
        if: steps.existing.outputs.count == '0'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.renderer_commit }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Download exact Plot Final authorization Artifact
        if: steps.existing.outputs.count == '0'
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.plot_authorization_artifact_name }}
          path: ${{ runner.temp }}/plot-final-authorization
          repository: saienjoy0/nasdaq-plot-creator-
          run-id: ${{ inputs.plot_authorization_run_id }}
          github-token: ${{ env.PLOT_ARTIFACT_TOKEN }}
      - name: Verify exact Plot Final authorization bundle
        if: steps.existing.outputs.count == '0'
        run: |
          python3 scripts/verify-final-authorization-bundle.py \
            --root "${RUNNER_TEMP}/plot-final-authorization" \
            --episode-date "${{ inputs.episode_date }}" \
            --preview-run-id "${{ inputs.preview_run_id }}" \
            --approved-preview-sha256 "${{ inputs.approved_preview_sha256 }}" \
            --preview-identity-sha256 "${{ inputs.preview_identity_sha256 }}" \
            --manifest-sha256 "${{ inputs.plot_authorization_manifest_sha256 }}" \
            --human-review-sha256 "${{ inputs.human_preview_review_sha256 }}" \
            --final-authorization-sha256 "${{ inputs.plot_final_authorization_sha256 }}"
      - id: state
        shell: bash
        run: |
          if [[ "${{ steps.existing.outputs.count }}" == "1" ]]; then
            echo "already_completed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_completed=false" >> "$GITHUB_OUTPUT"
          fi

  final:
    needs: preflight
    if: needs.preflight.outputs.already_completed != 'true'
    runs-on: [self-hosted, linux, x64, nasdaq-cafe-codespace]
    timeout-minutes: 120
    env:
      CI: "true"
      EPISODE_DATE: ${{ inputs.episode_date }}
      EXPECTED_SPEC_SHA256: ${{ inputs.render_spec_sha256 }}
      PLOT_ARTIFACT_TOKEN: ${{ secrets.NASDAQ_CAFE_PLOT_ARTIFACT_TOKEN }}
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
    steps:
      - name: Require configured Plot Artifact token
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PLOT_ARTIFACT_TOKEN" ]] || { echo "::error::NASDAQ_CAFE_PLOT_ARTIFACT_TOKEN is required"; exit 1; }
      - name: Download exact approved Preview Artifact before checkout
        uses: actions/download-artifact@v6
        with:
          name: nasdaq-cafe-current-preview-${{ inputs.episode_date }}-${{ inputs.preview_run_id }}
          path: ${{ runner.temp }}/approved-preview
          repository: ${{ github.repository }}
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ github.token }}
      - name: Download exact Plot Final authorization Artifact before checkout
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.plot_authorization_artifact_name }}
          path: ${{ runner.temp }}/plot-final-authorization
          repository: saienjoy0/nasdaq-plot-creator-
          run-id: ${{ inputs.plot_authorization_run_id }}
          github-token: ${{ env.PLOT_ARTIFACT_TOKEN }}
      - name: Verify approved Preview MP4 SHA
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t mp4s < <(find "${RUNNER_TEMP}/approved-preview" -type f -name '*.mp4' -print)
          [[ ${#mp4s[@]} -eq 1 ]]
          test "$(sha256sum "${mp4s[0]}" | awk '{print $1}')" = "${{ inputs.approved_preview_sha256 }}"
      - name: Checkout exact approved Renderer commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.renderer_commit }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Verify exact Renderer and Final authorization identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.renderer_commit }}"
          test "$(sha256sum contracts/visual_component_registry_snapshot.json | awk '{print $1}')" = "${{ inputs.registry_snapshot_sha256 }}"
          test -f scripts/restore-approved-preview-for-final.py
          test -f scripts/nasdaq-cafe-final-entry.sh
          python3 scripts/verify-final-authorization-bundle.py \
            --root "${RUNNER_TEMP}/plot-final-authorization" \
            --episode-date "$EPISODE_DATE" \
            --preview-run-id "${{ inputs.preview_run_id }}" \
            --approved-preview-sha256 "${{ inputs.approved_preview_sha256 }}" \
            --preview-identity-sha256 "${{ inputs.preview_identity_sha256 }}" \
            --manifest-sha256 "${{ inputs.plot_authorization_manifest_sha256 }}" \
            --human-review-sha256 "${{ inputs.human_preview_review_sha256 }}" \
            --final-authorization-sha256 "${{ inputs.plot_final_authorization_sha256 }}"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked Renderer dependencies
        run: npm ci
      - name: Restore exact approved production bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/restore-approved-preview-for-final.py \
            --preview-root "${RUNNER_TEMP}/approved-preview" \
            --episode-date "$EPISODE_DATE" \
            --renderer-commit "${{ inputs.renderer_commit }}" \
            --renderer-contract-version "${{ inputs.renderer_contract_version }}" \
            --registry-sha256 "${{ inputs.registry_snapshot_sha256 }}" \
            --spec-sha256 "${{ inputs.render_spec_sha256 }}" \
            --tts-input-sha256 "${{ inputs.tts_input_sha256 }}" \
            --audio-01-04-sha256 "${{ inputs.audio_01_04_sha256 }}" \
            --audio-05-09-sha256 "${{ inputs.audio_05_09_sha256 }}" \
            --preview-identity-sha256 "${{ inputs.preview_identity_sha256 }}" \
            --output-root build/final-approved-inputs
          rm -rf .cache/spec-tts-blocks .handoff-download
          cp -a build/final-approved-inputs/tts-cache .cache/spec-tts-blocks
          cp -a build/final-approved-inputs/handoff .handoff-download
      - name: Materialize runtime assets from exact approved handoff
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY="$(find "${RUNNER_TEMP}/approved-preview" -type f -name preview_identity.json -print -quit)"
          BUNDLE="$(jq -r '.expectedBundleId' "$IDENTITY")"
          MANIFEST="$(jq -r '.expectedManifestSha256' "$IDENTITY")"
          mkdir -p build/final-handoff
          npm run handoff:intake -- \
            --download-root=.handoff-download \
            --expected-bundle-id="$BUNDLE" \
            --expected-manifest-sha256="$MANIFEST" \
            --episode-date="$EPISODE_DATE" \
            --renderer-commit="${{ inputs.renderer_commit }}" \
            --renderer-contract-version="${{ inputs.renderer_contract_version }}" \
            --registry-output=build/final-handoff/generated_runtime_asset_registry.json >/tmp/final-intake.log
          test -s build/final-handoff/generated_runtime_asset_registry.json
          test "$(sha256sum build/final-approved-inputs/render_spec.json | awk '{print $1}')" = "$EXPECTED_SPEC_SHA256"
      - name: Verify exact cached TTS bytes again
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/restore-approved-preview-for-final.py \
            --preview-root "${RUNNER_TEMP}/approved-preview" --episode-date "$EPISODE_DATE" \
            --renderer-commit "${{ inputs.renderer_commit }}" --renderer-contract-version "${{ inputs.renderer_contract_version }}" \
            --registry-sha256 "${{ inputs.registry_snapshot_sha256 }}" --spec-sha256 "$EXPECTED_SPEC_SHA256" \
            --tts-input-sha256 "${{ inputs.tts_input_sha256 }}" --audio-01-04-sha256 "${{ inputs.audio_01_04_sha256 }}" \
            --audio-05-09-sha256 "${{ inputs.audio_05_09_sha256 }}" --preview-identity-sha256 "${{ inputs.preview_identity_sha256 }}" \
            --output-root "$RUNNER_TEMP/reverified-approved-inputs" >/tmp/final-byte-verify.json
      - name: Execute checked-out Renderer Final procedure
        env:
          SPEC_PATH: build/final-approved-inputs/render_spec.json
          RUNTIME_ASSET_REGISTRY: build/final-approved-inputs/runtime_asset_registry.json
        run: bash scripts/nasdaq-cafe-final-entry.sh
      - name: Inspect Final and write immutable receipt
        shell: bash
        env:
          FINAL_FINGERPRINT: ${{ inputs.final_fingerprint }}
          PREVIEW_IDENTITY_SHA: ${{ inputs.preview_identity_sha256 }}
          APPROVED_PREVIEW_SHA: ${{ inputs.approved_preview_sha256 }}
          FINAL_AUTH_SHA: ${{ inputs.plot_final_authorization_sha256 }}
          RENDERER_COMMIT: ${{ inputs.renderer_commit }}
        run: |
          set -euo pipefail
          MP4="renders/final/${EPISODE_DATE}_nasdaq-cafe-spec.mp4"
          test -s "$MP4"
          ffmpeg -nostdin -v error -i "$MP4" -f null -
          mkdir -p "build/${EPISODE_DATE}"
          python3 - "$MP4" "build/${EPISODE_DATE}/final_current_spine_receipt.json" <<'PY'
          import hashlib,json,os,pathlib,sys
          mp4,out=sys.argv[1:]
          value={
            'status':'PASS',
            'finalFingerprint':os.environ['FINAL_FINGERPRINT'],
            'episodeDate':os.environ['EPISODE_DATE'],
            'previewIdentitySha256':os.environ['PREVIEW_IDENTITY_SHA'],
            'approvedPreviewSha256':os.environ['APPROVED_PREVIEW_SHA'],
            'plotFinalAuthorizationSha256':os.environ['FINAL_AUTH_SHA'],
            'rendererCommit':os.environ['RENDERER_COMMIT'],
            'finalMp4Sha256':hashlib.sha256(pathlib.Path(mp4).read_bytes()).hexdigest(),
            'finalRunId':int(os.environ['GITHUB_RUN_ID']),
          }
          pathlib.Path(out).write_text(json.dumps(value,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Upload Final production result
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-current-final-${{ inputs.episode_date }}-${{ github.run_id }}
          path: |
            renders/final/${{ inputs.episode_date }}_nasdaq-cafe-spec.mp4
            build/${{ inputs.episode_date }}/technical_report.json
            build/${{ inputs.episode_date }}/render_data.production.json
            build/${{ inputs.episode_date }}/final_current_spine_receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish deterministic Final outcome
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-final-outcome-${{ inputs.final_fingerprint }}
          path: build/${{ inputs.episode_date }}/final_current_spine_receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
