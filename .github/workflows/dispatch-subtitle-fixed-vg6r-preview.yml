name: Dispatch Subtitle-Fixed VG-6R Preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-subtitle-fixed-vg6r-preview.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: dispatch-subtitle-fixed-vg6r-preview
  cancel-in-progress: false

jobs:
  dispatch-watch-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      EPISODE_DATE: "2026-08-06"
      EXPECTED_SPEC_SHA256: "56362777f841e5594e01a3f19a1c7051e1950fe8b6e67a679d839893e4693362"
      EXPECTED_TTS_INPUT_SHA256: "b4743df29c22902365d06a7a7a548a41131fe806a2a67ac75431198dc9c59509"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Verify immutable validated input
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "render-specs/${EPISODE_DATE}/render_spec.json" | awk '{print $1}')" = "$EXPECTED_SPEC_SHA256"
          test "$(jq -r '.validatorStatus' "render-specs/${EPISODE_DATE}/production_ready.json")" = "pass"
          test "$(jq -r '.rendererNormalization.measuredDiversityRepair.status' "render-specs/${EPISODE_DATE}/production_ready.json")" = "PASS"
          test "$(jq -r '.rendererNormalization.measuredDiversityRepair.unresolvedStateCount' "render-specs/${EPISODE_DATE}/production_ready.json")" = "0"
          test "$(jq -r '.rendererNormalization.ttsInputSha256After' "render-specs/${EPISODE_DATE}/production_ready.json")" = "$EXPECTED_TTS_INPUT_SHA256"

      - name: Dispatch formal Preview
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          gh workflow run nasdaq-cafe-preview.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f episode_date="$EPISODE_DATE" \
            -f expected_spec_sha256="$EXPECTED_SPEC_SHA256" \
            -f confirmation=PREVIEW
          for attempt in $(seq 1 40); do
            RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nasdaq-cafe-preview.yml --event workflow_dispatch --limit 20 --json databaseId,headSha)"
            RUN_ID="$(jq -r --arg head "$HEAD_SHA" '[.[] | select(.headSha == $head)][0].databaseId // empty' <<<"$RUNS")"
            if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Unable to identify formal Preview"
          exit 1

      - name: Wait for Preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh run watch "${{ steps.dispatch.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          echo "$?" > /tmp/watch-exit.txt
          exit 0

      - name: Record Preview result and self-remove
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.dispatch.outputs.run_id }}"
          RUN_JSON="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName,jobs)"
          ARTIFACT_JSON="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"
          mkdir -p "preview-status/$EPISODE_DATE"
          jq -n \
            --arg episode_date "$EPISODE_DATE" \
            --arg expected_spec_sha256 "$EXPECTED_SPEC_SHA256" \
            --arg expected_tts_input_sha256 "$EXPECTED_TTS_INPUT_SHA256" \
            --arg watch_exit "$(cat /tmp/watch-exit.txt)" \
            --argjson workflow_run "$RUN_JSON" \
            --argjson artifacts "$ARTIFACT_JSON" \
            '{version:1,episodeDate:$episode_date,expectedSpecSha256:$expected_spec_sha256,expectedTtsInputSha256:$expected_tts_input_sha256,watchExitCode:($watch_exit|tonumber),workflowRun:$workflow_run,artifacts:$artifacts.artifacts}' \
            > "preview-status/$EPISODE_DATE/subtitle_fixed_vg6r_preview_run.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "preview-status/$EPISODE_DATE/subtitle_fixed_vg6r_preview_run.json"
          git rm .github/workflows/dispatch-subtitle-fixed-vg6r-preview.yml
          git commit -m "Record subtitle-fixed VG-6R Preview result"
          git pull --rebase origin main
          git push origin HEAD:main
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "success"
