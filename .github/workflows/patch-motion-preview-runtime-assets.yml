name: Patch Motion Preview runtime assets

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-motion-preview-runtime-assets.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply runtime asset preview patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          helper = Path('scripts/validate-runtime-preview-spec.ts')
          helper.write_text('''import {loadRuntimeAssetContext} from "../src/config/runtime-assets";\nimport {loadRenderSpecForProduction} from "./load-render-spec";\n\nconst input = process.argv[2];\nif (!input) throw new Error("usage: validate-runtime-preview-spec <render_spec.json>");\nconst runtimeAssets = await loadRuntimeAssetContext();\nconst loaded = await loadRenderSpecForProduction(input, runtimeAssets.manifest);\nconsole.log(`runtime render_spec PASS: ${loaded.sha256} bundle=${runtimeAssets.bundleId ?? "static"}`);\n''', encoding='utf-8')

          script = Path('scripts/render-motion-preview.ts')
          text = script.read_text(encoding='utf-8')
          replacements = [
              ('import {productionAssetPaths} from "../src/config/production-assets";', 'import {loadRuntimeAssetContext} from "../src/config/runtime-assets";'),
              ('const loaded = await loadRenderSpecForProduction(input);', 'const runtimeAssets = await loadRuntimeAssetContext();\nconst loaded = await loadRenderSpecForProduction(input, runtimeAssets.manifest);'),
              ('  productionAssetPaths,\n  {inputSpecSha256: sha256},', '  runtimeAssets.paths,\n  {inputSpecSha256: sha256},'),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'render-motion-preview drift: {old}')
          script.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/nasdaq-cafe-motion-preview.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          if not any(line.strip().startswith('EPISODE_ID:') for line in lines):
              for index, line in enumerate(lines):
                  if line.strip().startswith('EPISODE_DATE:'):
                      prefix = line[:len(line) - len(line.lstrip())]
                      value = line.split(':', 1)[1]
                      lines.insert(index + 1, prefix + 'EPISODE_ID:' + value)
                      break
              else:
                  raise SystemExit('EPISODE_DATE env line not found')
          text = '\n'.join(lines) + '\n'
          old = 'npm run episode:spec:validate -- '
          new = 'node --import tsx scripts/validate-runtime-preview-spec.ts '
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Motion Preview validator command drift')
          workflow.write_text(text, encoding='utf-8')
          PY
      - run: npm run typecheck
      - name: Validate current 2026-08-10 preview spec
        env:
          EPISODE_ID: "2026-08-10"
        run: node --import tsx scripts/validate-runtime-preview-spec.ts render-specs/2026-08-10/render_spec.json
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/validate-runtime-preview-spec.ts scripts/render-motion-preview.ts .github/workflows/nasdaq-cafe-motion-preview.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use promoted runtime assets in Motion Preview"
          git push origin HEAD:${{ github.head_ref }}
