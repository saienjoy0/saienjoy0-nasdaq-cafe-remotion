name: Nasdaq Cafe Preview Status Receipt

on:
  push:
    branches:
      - main
    paths:
      - "handoff-preview-requests/*.json"
  workflow_run:
    workflows:
      - Nasdaq Cafe Preview
      - Nasdaq Cafe Preview From Handoff
    types:
      - completed

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch-handoff-preview:
    name: Dispatch one SHA-bound handoff preview request
    if: >-
      github.event_name == 'push' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout immutable owner request
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Resolve and validate exactly one request
        id: request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(
            git diff --name-only "$BEFORE_SHA" "$TRIGGER_SHA" -- 'handoff-preview-requests/*.json'
          )
          if [[ "${#CHANGED[@]}" -ne 1 ]]; then
            echo "::error::Exactly one handoff preview request JSON must be added or changed per push"
            printf 'changed=%s\n' "${CHANGED[*]:-none}"
            exit 1
          fi
          REQUEST_PATH="${CHANGED[0]}"
          test -s "$REQUEST_PATH" || {
            echo "::error::Request file is missing or empty: $REQUEST_PATH"
            exit 1
          }

          python3 - "$REQUEST_PATH" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          value = json.loads(path.read_text(encoding='utf-8'))
          required = {
              'contractVersion', 'episodeDate', 'plotRunId', 'handoffArtifactName',
              'expectedBundleId', 'expectedManifestSha256', 'expectedRendererCommit',
              'rendererRef', 'confirmation'
          }
          if set(value) != required:
              raise SystemExit(f'request fields mismatch: {sorted(value)}')
          if value['contractVersion'] != '1.0.0':
              raise SystemExit('contractVersion must be 1.0.0')
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', str(value['episodeDate'])):
              raise SystemExit('episodeDate must be YYYY-MM-DD')
          if not isinstance(value['plotRunId'], int) or isinstance(value['plotRunId'], bool) or value['plotRunId'] <= 0:
              raise SystemExit('plotRunId must be a positive integer')
          if not re.fullmatch(r'[A-Za-z0-9._-]+', str(value['handoffArtifactName'])):
              raise SystemExit('handoffArtifactName is unsafe')
          for key in ('expectedBundleId', 'expectedManifestSha256'):
              if not re.fullmatch(r'[0-9a-f]{64}', str(value[key])):
                  raise SystemExit(f'{key} must be lowercase SHA-256')
          if not re.fullmatch(r'[0-9a-f]{40}', str(value['expectedRendererCommit'])):
              raise SystemExit('expectedRendererCommit must be 40 lowercase hex characters')
          if not re.fullmatch(r'[A-Za-z0-9._/-]+', str(value['rendererRef'])):
              raise SystemExit('rendererRef is unsafe')
          if value['confirmation'] != 'PREVIEW':
              raise SystemExit('confirmation must be PREVIEW')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"request_path={path.as_posix()}\n")
              out.write(f"episode_date={value['episodeDate']}\n")
              out.write(f"plot_run_id={value['plotRunId']}\n")
              out.write(f"handoff_artifact_name={value['handoffArtifactName']}\n")
              out.write(f"expected_bundle_id={value['expectedBundleId']}\n")
              out.write(f"expected_manifest_sha256={value['expectedManifestSha256']}\n")
              out.write(f"expected_renderer_commit={value['expectedRendererCommit']}\n")
              out.write(f"renderer_ref={value['rendererRef']}\n")
          PY

      - name: Dispatch official manual-only handoff Preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_DATE: ${{ steps.request.outputs.episode_date }}
          PLOT_RUN_ID: ${{ steps.request.outputs.plot_run_id }}
          HANDOFF_ARTIFACT_NAME: ${{ steps.request.outputs.handoff_artifact_name }}
          EXPECTED_BUNDLE_ID: ${{ steps.request.outputs.expected_bundle_id }}
          EXPECTED_MANIFEST_SHA256: ${{ steps.request.outputs.expected_manifest_sha256 }}
          EXPECTED_RENDERER_COMMIT: ${{ steps.request.outputs.expected_renderer_commit }}
          RENDERER_REF: ${{ steps.request.outputs.renderer_ref }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nasdaq-cafe-preview-handoff.yml/dispatches" \
            -f ref="$RENDERER_REF" \
            -f inputs[episode_date]="$EPISODE_DATE" \
            -f inputs[plot_run_id]="$PLOT_RUN_ID" \
            -f inputs[handoff_artifact_name]="$HANDOFF_ARTIFACT_NAME" \
            -f inputs[expected_bundle_id]="$EXPECTED_BUNDLE_ID" \
            -f inputs[expected_manifest_sha256]="$EXPECTED_MANIFEST_SHA256" \
            -f inputs[expected_renderer_commit]="$EXPECTED_RENDERER_COMMIT" \
            -f inputs[confirmation]="PREVIEW"
          {
            echo "### Handoff Preview dispatched"
            echo "- Episode: \`$EPISODE_DATE\`"
            echo "- Renderer ref: \`$RENDERER_REF\`"
            echo "- Renderer commit: \`$EXPECTED_RENDERER_COMMIT\`"
            echo "- Plot run: \`$PLOT_RUN_ID\`"
            echo "- Bundle: \`$EXPECTED_BUNDLE_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-status:
    name: Publish preview run receipt
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Resolve episode date and artifacts
        id: receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          RESPONSE="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"

          mapfile -t ARTIFACT_NAMES < <(
            jq -r '.artifacts[]?.name' <<<"$RESPONSE" | \
              grep -E '^nasdaq-cafe-(preview(-(raw|failure|build-failure|inspection-failure))?|handoff-preview)-[0-9]{4}-[0-9]{2}-[0-9]{2}-' || true
          )

          ARTIFACT_LIST="$(printf '%s\n' "${ARTIFACT_NAMES[@]:-}" | sed '/^$/d')"
          EPISODE_DATE="$(grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<<"$ARTIFACT_LIST" | head -n 1 || true)"

          if [[ -z "$EPISODE_DATE" ]]; then
            JOBS="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
            EPISODE_DATE="$(jq -r '.jobs[]?.name' <<<"$JOBS" | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n 1 || true)"
          fi

          if [[ -z "$EPISODE_DATE" ]]; then
            EPISODE_DATE="unknown"
          fi

          {
            echo "episode_date=$EPISODE_DATE"
            echo "run_id=$RUN_ID"
            echo "run_url=$RUN_URL"
            echo "conclusion=$RUN_CONCLUSION"
            echo "head_sha=$HEAD_SHA"
            echo "artifact_names<<EOF"
            printf '%s\n' "${ARTIFACT_NAMES[@]:-}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert daily preview status issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_DATE: ${{ steps.receipt.outputs.episode_date }}
          RUN_ID: ${{ steps.receipt.outputs.run_id }}
          RUN_URL: ${{ steps.receipt.outputs.run_url }}
          RUN_CONCLUSION: ${{ steps.receipt.outputs.conclusion }}
          HEAD_SHA: ${{ steps.receipt.outputs.head_sha }}
          ARTIFACT_NAMES: ${{ steps.receipt.outputs.artifact_names }}
        run: |
          set -euo pipefail

          TITLE="NASDAQ CAFE PREVIEW STATUS ${EPISODE_DATE}"
          ARTIFACT_LINES="$(printf '%s\n' "$ARTIFACT_NAMES" | sed '/^$/d;s/^/- `/;s/$/`/')"
          if [[ -z "$ARTIFACT_LINES" ]]; then
            ARTIFACT_LINES="- none"
          fi

          BODY="$(cat <<EOF
          Preview workflow receipt for ChatGPT monitoring and artifact delivery.

          - Episode date: \`${EPISODE_DATE}\`
          - Workflow run ID: \`${RUN_ID}\`
          - Conclusion: \`${RUN_CONCLUSION}\`
          - Head SHA: \`${HEAD_SHA}\`
          - Run URL: ${RUN_URL}

          Artifacts:
          ${ARTIFACT_LINES}
          EOF
          )"

          ISSUE_NUMBER="$(gh issue list \
            --state all \
            --search "${TITLE} in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | \
            head -n 1)"

          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue edit "$ISSUE_NUMBER" --title "$TITLE" --body "$BODY"
            gh issue reopen "$ISSUE_NUMBER" >/dev/null 2>&1 || true
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
