name: Nasdaq Cafe Preview Status Receipt

on:
  workflow_run:
    workflows:
      - Nasdaq Cafe Preview
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  publish-status:
    name: Publish preview run receipt
    if: github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Resolve episode date and artifacts
        id: receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          RESPONSE="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"

          mapfile -t ARTIFACT_NAMES < <(
            jq -r '.artifacts[]?.name' <<<"$RESPONSE" | \
              grep -E '^nasdaq-cafe-preview(-failure)?-[0-9]{4}-[0-9]{2}-[0-9]{2}-' || true
          )

          ARTIFACT_LIST="$(printf '%s\n' "${ARTIFACT_NAMES[@]:-}" | sed '/^$/d')"
          EPISODE_DATE="$(grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<<"$ARTIFACT_LIST" | head -n 1 || true)"

          if [[ -z "$EPISODE_DATE" ]]; then
            JOBS="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
            EPISODE_DATE="$(jq -r '.jobs[]?.name' <<<"$JOBS" | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -n 1 || true)"
          fi

          if [[ -z "$EPISODE_DATE" ]]; then
            EPISODE_DATE="unknown"
          fi

          {
            echo "episode_date=$EPISODE_DATE"
            echo "run_id=$RUN_ID"
            echo "run_url=$RUN_URL"
            echo "conclusion=$RUN_CONCLUSION"
            echo "head_sha=$HEAD_SHA"
            echo "artifact_names<<EOF"
            printf '%s\n' "${ARTIFACT_NAMES[@]:-}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert daily preview status issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_DATE: ${{ steps.receipt.outputs.episode_date }}
          RUN_ID: ${{ steps.receipt.outputs.run_id }}
          RUN_URL: ${{ steps.receipt.outputs.run_url }}
          RUN_CONCLUSION: ${{ steps.receipt.outputs.conclusion }}
          HEAD_SHA: ${{ steps.receipt.outputs.head_sha }}
          ARTIFACT_NAMES: ${{ steps.receipt.outputs.artifact_names }}
        run: |
          set -euo pipefail

          TITLE="NASDAQ CAFE PREVIEW STATUS ${EPISODE_DATE}"
          ARTIFACT_LINES="$(printf '%s\n' "$ARTIFACT_NAMES" | sed '/^$/d;s/^/- `/;s/$/`/')"
          if [[ -z "$ARTIFACT_LINES" ]]; then
            ARTIFACT_LINES="- none"
          fi

          BODY="$(cat <<EOF
          Preview workflow receipt for ChatGPT monitoring and artifact delivery.

          - Episode date: \`${EPISODE_DATE}\`
          - Workflow run ID: \`${RUN_ID}\`
          - Conclusion: \`${RUN_CONCLUSION}\`
          - Head SHA: \`${HEAD_SHA}\`
          - Run URL: ${RUN_URL}

          Artifacts:
          ${ARTIFACT_LINES}
          EOF
          )"

          ISSUE_NUMBER="$(gh issue list \
            --state all \
            --search "${TITLE} in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | \
            head -n 1)"

          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue edit "$ISSUE_NUMBER" --title "$TITLE" --body "$BODY"
            gh issue reopen "$ISSUE_NUMBER" >/dev/null 2>&1 || true
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
