name: Bootstrap Visual Grammar VG-2

on:
  push:
    branches:
      - feat/visual-grammar-vg2
    paths:
      - "scripts/bootstrap-visual-grammar-vg2.mjs"
      - ".github/workflows/bootstrap-visual-grammar-vg2.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visual-grammar-vg2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply deterministic VG-2 patch
        run: node scripts/bootstrap-visual-grammar-vg2.mjs
      - name: Install dependencies
        run: npm ci
      - name: Generate render_spec schema
        run: npm run episode:spec:schema
      - name: Run Visual Grammar contract tests
        run: npm run test:visual-grammar
      - name: Typecheck
        run: npm run typecheck
      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            package.json \
            scripts/generate-render-spec-schema.ts \
            schemas/render_spec.schema.json \
            src/spec/render-spec.ts \
            src/spec/validate-visual-story.ts
          git commit -m "VG-2: integrate Visual Grammar with render_spec 2.4.0"
          git push origin HEAD:feat/visual-grammar-vg2
