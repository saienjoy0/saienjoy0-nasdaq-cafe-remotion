name: Rescue Preview 2026-08-06

on:
  push:
    branches: [main]
    paths: [".github/workflows/rescue-preview-2026-08-06.yml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: rescue-preview-2026-08-06
  cancel-in-progress: true

jobs:
  build-preview:
    if: contains(github.event.head_commit.message, '[run-rescue-preview-2026-08-06]')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CI: "true"
      SPEC_PATH: render-specs/2026-08-06/render_spec.json
      EPISODE_ID: 2026-08-06
      EXPECTED_RESCUE_SHA: 5a044577195c2fbf31ed714dd69439def181c4f27503fbb033161c3cc7f8953a
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TTS_PROVIDER: gemini
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Charon
      GEMINI_KEY_POOL_MAX_ATTEMPTS: "12"
      GEMINI_KEY_POOL_MAX_ELAPSED_MS: "720000"

    steps:
      - id: checkout
        uses: actions/checkout@v6
      - id: setup_node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - id: install
        run: npm ci

      - name: Materialize temporary rescue spec
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SPEC_PATH" <<'PY'
          import json, re, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          spec = json.loads(path.read_text(encoding="utf-8"))
          if spec.get("episode", {}).get("id") != "2026-08-06" or spec.get("schemaVersion") != "2.4.0":
              raise SystemExit("unexpected rescue source")
          for key in ("expectedConfirmed", "imageSelection", "tts", "visualGrammarContractVersion"):
              spec.pop(key, None)
          for scene in spec["scenes"]:
              for vb in scene["visualBeats"]:
                  vb.pop("visualBeatId", None)
                  vb.pop("visualGrammar", None)
          def beat(s, b): return spec["scenes"][s-1]["visualBeats"][b-1]
          def template(s, b, name, variant):
              vb = beat(s, b)
              vb["visualTemplate"] = name
              vb["templateConfig"]["variant"] = variant
          beat(2,1)["returnScreenState"] = "Chart"
          template(2,2,"evidence-boundary","confirmed-vs-unconfirmed")
          template(3,1,"tailwind-headwind","two-lane")
          template(3,2,"evidence-boundary","confirmed-vs-unconfirmed")
          template(4,1,"tailwind-headwind","two-lane")
          beat(4,2)["templateConfig"]["variant"] = "confirmed-vs-unconfirmed"
          beat(5,1)["returnScreenState"] = "Chart"
          template(5,2,"tailwind-headwind","two-lane")
          template(6,1,"evidence-boundary","confirmed-vs-unconfirmed")
          template(6,2,"tailwind-headwind","two-lane")
          template(7,1,"evidence-boundary","confirmed-vs-unconfirmed")
          template(7,2,"tailwind-headwind","two-lane")
          beat(8,1)["templateConfig"]["variant"] = "strengthen-vs-weaken"
          spec["scenes"][7]["visualMode"] = "verification-points"
          for vb in spec["scenes"][7]["visualBeats"]: vb["visualMode"] = "verification-points"
          spec["scenes"][8]["sceneRole"] = "closing-recap-sendoff-goodnight"
          spec["scenes"][8]["visualMode"] = "conclusion-card"
          spec["scenes"][8]["transition"] = {"type":"none","durationMs":0}
          beat(9,1)["visualMode"] = "conclusion-card"
          beat(9,1)["visualTemplate"] = "final-assembly"
          for scene_number in (3,4,7):
              scene = spec["scenes"][scene_number-1]
              scene["visualMode"] = "text-focus"
              for vb in scene["visualBeats"]: vb["visualMode"] = "text-focus"
          allowed = {"official-consensus","company-prior-guidance","major-reporting","analyst-view","price-inference","unconfirmed"}
          for scene in spec["scenes"]:
              if scene.get("expectedBasisType") not in allowed: scene["expectedBasisType"] = None
          spec["schemaVersion"] = "2.2.0"
          spec["sources"] = [s for s in spec["sources"] if re.fullmatch(r"source-[0-9]{3}", str(s.get("sourceId", "")))]
          for source in spec["sources"]:
              if source.get("sourceType") == "company-ir": source["sourceType"] = "company"
          path.write_text(json.dumps(spec, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          ACTUAL_SHA="$(sha256sum "$SPEC_PATH" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_RESCUE_SHA" || { echo "::error::rescue SHA mismatch expected=$EXPECTED_RESCUE_SHA actual=$ACTUAL_SHA"; exit 1; }

      - id: validate
        run: npm run episode:spec:validate -- "$SPEC_PATH"
      - id: ffmpeg
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - id: stability
        run: npm run test:runtime-stability
      - id: generate
        run: npm run episode:spec:preview -- "$SPEC_PATH"
      - id: upload
        uses: actions/upload-artifact@v6
        with:
          name: nasdaq-cafe-rescue-preview-2026-08-06-${{ github.run_id }}
          path: |
            renders/preview/2026-08-06_nasdaq-cafe-spec-preview.mp4
            build/2026-08-06/technical_report.json
            build/2026-08-06/render_data.production.json
            public/spec-audio/2026-08-06/tts-block-state.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish completion receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          FFMPEG_OUTCOME: ${{ steps.ffmpeg.outcome }}
          STABILITY_OUTCOME: ${{ steps.stability.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          RECEIPT_PATH="preview-status/2026-08-06-rescue.json"
          python3 - <<'PY' > /tmp/receipt.json
          import json, os
          steps={"checkout":os.getenv("CHECKOUT_OUTCOME","unknown"),"setupNode":os.getenv("SETUP_NODE_OUTCOME","unknown"),"install":os.getenv("INSTALL_OUTCOME","unknown"),"materialize":os.getenv("MATERIALIZE_OUTCOME","unknown"),"validate":os.getenv("VALIDATE_OUTCOME","unknown"),"ffmpeg":os.getenv("FFMPEG_OUTCOME","unknown"),"stability":os.getenv("STABILITY_OUTCOME","unknown"),"generate":os.getenv("GENERATE_OUTCOME","unknown"),"upload":os.getenv("UPLOAD_OUTCOME","unknown")}
          success=steps["generate"]=="success" and steps["upload"]=="success"
          print(json.dumps({"status":"success" if success else "failure","episodeDate":"2026-08-06","mode":"temporary-rescue-preview","runId":int(os.environ["GITHUB_RUN_ID"]),"runAttempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"runUrl":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}","commitSha":os.environ["GITHUB_SHA"],"rescueSpecSha256":os.environ["EXPECTED_RESCUE_SHA"],"artifactId":os.getenv("ARTIFACT_ID") or None,"artifactName":f"nasdaq-cafe-rescue-preview-2026-08-06-{os.environ['GITHUB_RUN_ID']}","steps":steps,"finalAuthorized":False},ensure_ascii=False,indent=2,sort_keys=True))
          PY
          CONTENT="$(base64 -w0 /tmp/receipt.json)"
          EXISTING_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${RECEIPT_PATH}?ref=main" --jq .sha 2>/dev/null || true)"
          if [[ -n "$EXISTING_SHA" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RECEIPT_PATH}" -f message="Record rescue preview run ${GITHUB_RUN_ID}" -f content="$CONTENT" -f sha="$EXISTING_SHA" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${RECEIPT_PATH}" -f message="Record rescue preview run ${GITHUB_RUN_ID}" -f content="$CONTENT" -f branch=main >/dev/null
          fi
