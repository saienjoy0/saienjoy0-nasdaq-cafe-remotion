name: Import and Dispatch Nasdaq Cafe Preview 2026-08-06

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-and-dispatch-preview-2026-08-06.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: import-and-dispatch-preview-2026-08-06
  cancel-in-progress: false

jobs:
  import-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EPISODE_DATE: "2026-08-06"
      BUNDLE_ID: "b72cd4c21cfba06e867e31e126eb67a3e30122235d45e94c9745263a3e38c774"
      EXPECTED_ZIP_SHA256: "f5a99dd4a0c5ce9360e3acbf82047756fbb9faba521ed1277810fd7c32fe71a2"
      EXPECTED_SPEC_SHA256: "0b4d094bfc5325602d42e955a281bd16d2e358a150afa04ad9e3d765ee75a515"
      EXPECTED_PACKAGE_SHA256: "706d12355ba7bf2cb02261257eb54278cb6ad5abd5d4e757f4d5418809667d59"
      PACKAGE_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-0dfc-8230-a3e8-653f560de73d/raw?se=2026-08-06T06%3A38%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=1921d7c7-4303-5d86-aff4-0b8540437fd5&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-06T05%3A52%3A39Z&ske=2026-08-07T05%3A52%3A39Z&sks=b&skv=2026-02-06&sig=m6pRwiMzTwoHGJ97yJGP%2BSLFEpwTrFZWd7q3BftJRuA%3D"

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Download and verify validated production artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$PACKAGE_URL" -o /tmp/nasdaq-cafe-production.zip
          ACTUAL_ZIP_SHA="$(sha256sum /tmp/nasdaq-cafe-production.zip | awk '{print $1}')"
          if [[ "$ACTUAL_ZIP_SHA" != "$EXPECTED_ZIP_SHA256" ]]; then
            echo "::error::production artifact SHA mismatch"
            echo "::error::expected=$EXPECTED_ZIP_SHA256 actual=$ACTUAL_ZIP_SHA"
            exit 1
          fi
          rm -rf /tmp/nasdaq-cafe-production
          mkdir -p /tmp/nasdaq-cafe-production
          unzip -q /tmp/nasdaq-cafe-production.zip -d /tmp/nasdaq-cafe-production

      - name: Install immutable production inputs
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="/tmp/nasdaq-cafe-production/production-bundles/$EPISODE_DATE/$BUNDLE_ID"
          SOURCE_SPEC="$BUNDLE_ROOT/render-specs/$EPISODE_DATE/render_spec.json"
          SOURCE_PACKAGE="$BUNDLE_ROOT/production/episode_package_$EPISODE_DATE.md"
          test -s "$SOURCE_SPEC"
          test -s "$SOURCE_PACKAGE"

          SPEC_SHA="$(sha256sum "$SOURCE_SPEC" | awk '{print $1}')"
          PACKAGE_SHA="$(sha256sum "$SOURCE_PACKAGE" | awk '{print $1}')"
          if [[ "$SPEC_SHA" != "$EXPECTED_SPEC_SHA256" ]]; then
            echo "::error::render spec SHA mismatch"
            exit 1
          fi
          if [[ "$PACKAGE_SHA" != "$EXPECTED_PACKAGE_SHA256" ]]; then
            echo "::error::episode package SHA mismatch"
            exit 1
          fi

          mkdir -p "render-specs/$EPISODE_DATE" "episode-packages/$EPISODE_DATE"
          cp "$SOURCE_SPEC" "render-specs/$EPISODE_DATE/render_spec.json"
          cp "$SOURCE_PACKAGE" "episode-packages/$EPISODE_DATE/episode_package_$EPISODE_DATE.md"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          date = os.environ["EPISODE_DATE"]
          value = {
              "version": 1,
              "status": "ready",
              "episodeDate": date,
              "renderSpecPath": f"render-specs/{date}/render_spec.json",
              "episodePackagePath": f"episode-packages/{date}/episode_package_{date}.md",
              "renderSpecSha256": os.environ["EXPECTED_SPEC_SHA256"],
              "episodePackageSha256": os.environ["EXPECTED_PACKAGE_SHA256"],
              "validatorStatus": "pass",
              "consistencyStatus": "pass",
              "unresolvedStateCount": 0,
              "previewOnly": True,
              "finalAuthorized": False,
              "sourceBundleId": os.environ["BUNDLE_ID"],
              "sourceArtifactSha256": os.environ["EXPECTED_ZIP_SHA256"],
          }
          path = Path(f"render-specs/{date}/production_ready.json")
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          python3 -m json.tool "render-specs/$EPISODE_DATE/render_spec.json" >/dev/null
          python3 -m json.tool "render-specs/$EPISODE_DATE/production_ready.json" >/dev/null

      - name: Commit production-ready inputs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "render-specs/$EPISODE_DATE/render_spec.json"
          git add "render-specs/$EPISODE_DATE/production_ready.json"
          git add "episode-packages/$EPISODE_DATE/episode_package_$EPISODE_DATE.md"
          git rm --ignore-unmatch ".github/workflows/import-and-dispatch-preview-2026-08-06.yml"
          git commit -m "Add validated Nasdaq Cafe preview inputs for 2026-08-06"
          git push origin HEAD:main

      - name: Dispatch formal preview workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run nasdaq-cafe-preview.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f episode_date="$EPISODE_DATE" \
            -f expected_spec_sha256="$EXPECTED_SPEC_SHA256" \
            -f confirmation=PREVIEW

          sleep 3
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow nasdaq-cafe-preview.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId,status,conclusion,createdAt,url,headSha \
            | tee /tmp/preview-run.json

          {
            echo "### Formal preview dispatched"
            echo "- Episode date: \`$EPISODE_DATE\`"
            echo "- Render spec SHA-256: \`$EXPECTED_SPEC_SHA256\`"
            echo "- Final authorized: \`false\`"
            echo
            echo '```json'
            cat /tmp/preview-run.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
